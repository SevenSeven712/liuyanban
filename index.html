<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <link rel="manifest" href="/liuyanban/manifest.json" />
    <meta name="theme-color" content="#2e7d32" />
    <link rel="apple-touch-icon" href="/liuyanban/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>通行证 · Seven戚社区</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        :root {
            --bg: #f5faf5;
            --bg-card: #ffffff;
            --bg-input: #eaf3ea;
            --border: #c8e0c8;
            --text: #1e3a2e;
            --text-muted: #5a7a6a;
            --text-light: #8aaa9a;
            --primary: #2e7d32;
            --primary-light: #4caf50;
            --primary-glow: rgba(46, 125, 50, 0.25);
            --primary-bg: #e8f5e9;
            --shadow: 0 8px 32px rgba(46, 125, 50, 0.12);
            --danger: #e57373;
            --danger-bg: #ffebee;
            --radius: 16px;
            --radius-sm: 10px;
            --font: "Space Grotesk", "PingFang SC", "Segoe UI", system-ui, sans-serif;
        }
        html, body {
            height: 100%;
            font-family: var(--font);
            background: var(--bg);
            background-image:
                radial-gradient(circle at 20% 10%, rgba(46, 125, 50, 0.06) 0%, transparent 45%),
                radial-gradient(circle at 80% 90%, rgba(76, 175, 80, 0.06) 0%, transparent 45%);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }
        .login-card {
            width: 23em;
            max-width: 92vw;
            max-height: 92vh;
            overflow-y: auto;
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 2.2em 2em;
            position: relative;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            -webkit-overflow-scrolling: touch;
        }
        .login-card::-webkit-scrollbar { width: 4px; }
        .login-card::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
        .login-card::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: var(--radius);
            background-image:
                linear-gradient(rgba(46, 125, 50, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(46, 125, 50, 0.04) 1px, transparent 1px);
            background-size: 2em 2em;
            opacity: 0.6;
            pointer-events: none;
            z-index: 0;
        }
        .login-card::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: var(--radius);
            background: linear-gradient(115deg,
                    transparent 0%, transparent 40%,
                    rgba(46, 125, 50, 0.03) 45%,
                    rgba(46, 125, 50, 0.10) 50%,
                    rgba(46, 125, 50, 0.03) 55%,
                    transparent 60%, transparent 100%);
            pointer-events: none;
            z-index: 1;
            animation: sweep 6s ease-in-out infinite;
        }
        @keyframes sweep {
            0%, 100% { background-position: 100% 100%; }
            50% { background-position: 0% 0%; }
        }
        .login-card > * { position: relative; z-index: 2; }

        .login-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5em;
        }
        .login-logo {
            font-weight: 900;
            font-size: 1.35em;
            color: var(--text);
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 0.35em;
        }
        .login-logo span { color: var(--primary); }
        .login-logo svg {
            width: 1.3em;
            height: 1.3em;
            stroke: var(--primary);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 4px var(--primary-glow));
        }
        .lang-switch { display: flex; gap: 0.3em; }
        .lang-btn {
            background: transparent;
            border: 1.5px solid var(--border);
            color: var(--text-muted);
            padding: 0.2em 0.7em;
            border-radius: 99px;
            font-size: 0.65em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .lang-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
            box-shadow: 0 0 20px var(--primary-glow);
        }
        .lang-btn:hover { filter: brightness(1.05); }

        .login-title {
            font-size: 1.4em;
            font-weight: 700;
            color: var(--text);
            text-align: center;
            margin-bottom: 1em;
        }
        .login-title span {
            display: block;
            font-weight: 400;
            color: var(--text-muted);
            font-size: 0.55em;
            margin-top: 0.2em;
        }
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 0.9em;
        }
        .field-group {
            display: flex;
            flex-direction: column;
            gap: 0.35em;
        }
        .field-group label {
            font-size: 0.7em;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }
        .field-group input {
            width: 100%;
            padding: 0.8em 1em;
            border-radius: var(--radius-sm);
            border: 2px solid var(--border);
            background: var(--bg-input);
            color: var(--text);
            font-size: 0.95em;
            font-weight: 600;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
            font-family: inherit;
        }
        .field-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-glow);
        }
        .field-group input::placeholder { color: var(--text-light); }

        .oauth-row { display: flex; gap: 0.6em; }
        .oauth-btn {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5em;
            padding: 0.7em;
            border-radius: var(--radius-sm);
            border: 2px solid var(--border);
            background: var(--bg-input);
            color: var(--text);
            font-size: 0.85em;
            font-weight: 600;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 250ms;
            font-family: inherit;
        }
        .oauth-btn::before {
            content: "";
            position: absolute;
            top: 0; left: 0;
            height: 100%; width: 0;
            background: var(--primary);
            z-index: 0;
            transition: width 250ms;
        }
        .oauth-btn:hover { color: #fff; border-color: var(--primary); }
        .oauth-btn:hover::before { width: 100%; }
        .oauth-btn > * { position: relative; z-index: 1; }
        .oauth-btn .icon { width: 1.2em; height: 1.2em; flex-shrink: 0; }

        .separator {
            display: flex;
            align-items: center;
            gap: 0.6em;
            color: var(--text-muted);
            font-size: 0.75em;
            margin: 0.2em 0;
        }
        .separator div {
            flex: 1;
            height: 1px;
            background: var(--border);
        }
        .login-continue {
            width: 100%;
            padding: 0.85em;
            border-radius: var(--radius-sm);
            border: 2px solid var(--primary);
            background: var(--primary);
            color: #fff;
            font-weight: 700;
            font-size: 0.95em;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5em;
            font-family: inherit;
            margin-top: 0.3em;
        }
        .login-continue:hover {
            background: var(--primary-light);
            border-color: var(--primary-light);
            box-shadow: 0 0 30px var(--primary-glow);
            transform: translateY(-1px);
        }
        .login-continue:disabled {
            opacity: 0.5;
            pointer-events: none;
        }
        .login-continue .icon {
            width: 1.2em;
            height: 1.2em;
            stroke: currentColor;
            stroke-width: 2.5;
            fill: none;
        }
        .login-footer {
            text-align: center;
            margin-top: 1.1em;
            font-size: 0.82em;
            color: var(--text-muted);
        }
        .login-footer .switch-link {
            color: var(--primary);
            font-weight: 700;
            cursor: pointer;
            border: none;
            background: none;
            font-family: inherit;
            font-size: inherit;
            padding: 0 4px;
            text-decoration: underline;
            text-underline-offset: 3px;
        }
        .login-footer .switch-link:hover { color: var(--primary-light); }

        .login-error {
            color: #c62828;
            font-size: 0.78em;
            text-align: center;
            min-height: 1.5em;
            margin-top: 0.2em;
        }

        /* 设备检测提示条 */
        .device-hint {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            background: var(--primary-bg);
            border: 1px solid var(--border);
            font-size: 0.75em;
            color: var(--text-muted);
            line-height: 1.5;
        }
        .device-hint svg {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            stroke: var(--primary);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            margin-top: 2px;
        }
        .device-hint.warn {
            background: var(--danger-bg);
            border-color: #ffcdd2;
            color: #c62828;
        }
        .device-hint.warn svg { stroke: #c62828; }

        .auth-card { display: none; }
        .auth-card.active { display: block; animation: fadeIn 0.35s ease; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--text);
            color: #fff;
            padding: 0.7em 1.6em;
            border-radius: 2em;
            font-weight: 600;
            font-size: 0.85em;
            opacity: 0;
            transition: all 0.4s ease;
            z-index: 300;
            pointer-events: none;
            white-space: nowrap;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #toast svg { width: 16px; height: 16px; flex-shrink: 0; }
        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(30, 58, 46, 0.35);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal-box {
            background: var(--bg-card);
            border-radius: var(--radius);
            max-width: 400px;
            width: 100%;
            padding: 2em;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            text-align: center;
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .modal-overlay.active .modal-box { transform: scale(1); }
        .modal-box .modal-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 0.4em;
            border-radius: 50%;
            background: var(--primary-bg);
            display: grid;
            place-items: center;
            color: var(--primary);
        }
        .modal-box .modal-icon.warn { background: var(--danger-bg); color: #c62828; }
        .modal-box .modal-icon svg {
            width: 32px;
            height: 32px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .modal-box .modal-title {
            font-size: 1.25em;
            font-weight: 900;
            color: var(--text);
            margin-bottom: 0.4em;
        }
        .modal-box .modal-body {
            font-size: 0.95em;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 1.4em;
            white-space: pre-line;
        }
        .modal-box .modal-actions {
            display: flex;
            justify-content: center;
        }
        .modal-box .modal-actions .btn-primary {
            padding: 0.6em 2em;
            border-radius: var(--radius-sm);
            border: none;
            background: var(--primary);
            color: #fff;
            font-weight: 700;
            font-size: 0.95em;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.2s, box-shadow 0.2s;
        }
        .modal-box .modal-actions .btn-primary:hover {
            background: var(--primary-light);
            box-shadow: 0 0 25px var(--primary-glow);
        }

        @media (max-width: 480px) {
            .login-card { padding: 1.6em 1.4em; }
            .oauth-row { flex-direction: column; }
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <div class="login-logo">
                <svg viewBox="0 0 24 24">
                    <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/>
                    <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
                </svg>
                <span>Seven</span>戚
            </div>
            <div class="lang-switch">
                <button class="lang-btn active" data-lang="zh">中文</button>
                <button class="lang-btn" data-lang="en">EN</button>
            </div>
        </div>

        <!-- ===== 登录卡片 ===== -->
        <div id="loginCard" class="auth-card active">
            <div class="login-title">
                <span id="loginMainTitle">欢迎回来</span>
                <span id="loginSubTitle">登录以继续</span>
            </div>
            <div class="login-form">
                <div class="oauth-row">
                    <button class="oauth-btn" id="googleBtn">
                        <svg class="icon" viewBox="0 0 24 24">
                            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                        </svg>
                        <span id="googleText">Google</span>
                    </button>
                    <button class="oauth-btn" id="githubBtn">
                        <svg class="icon" viewBox="0 0 24 24" fill="currentColor" stroke="none">
                            <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
                        </svg>
                        <span id="githubText">Github</span>
                    </button>
                </div>
                <div class="separator">
                    <div></div>
                    <span id="orText">或</span>
                    <div></div>
                </div>
                <div class="field-group">
                    <label id="phoneLabel">手机号</label>
                    <input type="tel" id="loginPhone" placeholder="请输入手机号" maxlength="11" />
                </div>
                <div class="field-group">
                    <label id="passwordLabel">密码</label>
                    <input type="password" id="loginPassword" placeholder="请输入密码" />
                </div>
                <button class="login-continue" id="loginBtn">
                    <span id="loginBtnText">登录</span>
                    <svg class="icon" viewBox="0 0 24 24">
                        <path d="m6 17 5-5-5-5"/>
                        <path d="m13 17 5-5-5-5"/>
                    </svg>
                </button>
                <div class="login-error" id="loginError"></div>
            </div>
            <div class="login-footer">
                <span id="noAccountText">没有账号？</span>
                <button class="switch-link" id="toRegisterBtn">去注册</button>
            </div>
        </div>

        <!-- ===== 注册卡片 ===== -->
        <div id="registerCard" class="auth-card">
            <div class="login-title">
                <span id="registerMainTitle">创建账户</span>
                <span id="registerSubTitle">加入 Seven戚 社区</span>
            </div>

            <!-- 设备检测提示 -->
            <div class="device-hint" id="deviceHint" style="margin-bottom:0.9em;">
                <svg viewBox="0 0 24 24">
                    <rect x="5" y="2" width="14" height="20" rx="2"/>
                    <line x1="12" y1="18" x2="12.01" y2="18"/>
                </svg>
                <span id="deviceHintText">正在检测本设备…</span>
            </div>

            <div class="login-form">
                <div class="field-group">
                    <label id="regNickLabel">昵称</label>
                    <input type="text" id="regNick" placeholder="请输入昵称" maxlength="12" />
                </div>
                <div class="field-group">
                    <label id="regPhoneLabel">手机号</label>
                    <input type="tel" id="regPhone" placeholder="请输入手机号" maxlength="11" />
                </div>
                <div class="field-group">
                    <label id="regPassLabel">密码</label>
                    <input type="password" id="regPassword" placeholder="请设置密码（至少6位）" />
                </div>
                <div class="field-group">
                    <label id="regPass2Label">确认密码</label>
                    <input type="password" id="regPassword2" placeholder="请再次输入密码" />
                </div>
                <button class="login-continue" id="registerBtn">
                    <span id="registerBtnText">注册</span>
                    <svg class="icon" viewBox="0 0 24 24">
                        <path d="m6 17 5-5-5-5"/>
                        <path d="m13 17 5-5-5-5"/>
                    </svg>
                </button>
                <div class="login-error" id="registerError"></div>
            </div>
            <div class="login-footer">
                <span id="hasAccountText">已有账号？</span>
                <button class="switch-link" id="toLoginBtn">去登录</button>
            </div>
        </div>
    </div>

    <div id="toast"></div>

    <!-- ===== 通用提示弹窗 ===== -->
    <div class="modal-overlay" id="uiModal">
        <div class="modal-box">
            <div class="modal-icon" id="uiModalIconWrap">
                <svg id="uiModalIcon" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10"/>
