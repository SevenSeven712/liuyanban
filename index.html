* { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
:root {

--bg-input: #eaf3ea;
--border: #c8e0c8;
--text: #1e3a2e;
--text-muted: #5a7a6a;
--text-light: #8aaa9a;
--primary: #2e7d32;
--primary-light: #4caf50;
--primary-glow: rgba(46, 125, 50, 0.25);
--primary-bg: #e8f5e9;

html, body {
height: 100%;
font-family: var(--font);
background: var(--bg);
background-image:
radial-gradient(circle at 20% 10%, rgba(46, 125, 50, 0.06) 0%, transparent 45%),
radial-gradient(circle at 80% 90%, rgba(76, 175, 80, 0.06) 0%, transparent 45%);

align-items: center;
justify-content: center;
padding: 20px;
overflow: hidden;

.login-card {
width: 23em;
max-width: 92vw;
max-height: 92vh;
overflow-y: auto;
background: var(--bg-card);
border-radius: var(--radius);
padding: 2.2em 2em;
position: relative;
border: 1px solid var(--border);
box-shadow: var(--shadow);
-webkit-overflow-scrolling: touch;
}
.login-card::-webkit-scrollbar { width: 4px; }
.login-card::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
.login-card::after {
content: "";
position: absolute;
inset: 0;
border-radius: var(--radius);
background-image:
linear-gradient(rgba(46, 125, 50, 0.04) 1px, transparent 1px),
linear-gradient(90deg, rgba(46, 125, 50, 0.04) 1px, transparent 1px);
background-size: 2em 2em;
opacity: 0.6;
pointer-events: none;
z-index: 0;
}
.login-card::before {
content: "";
position: absolute;
inset: 0;
border-radius: var(--radius);
background: linear-gradient(115deg,
transparent 0%, transparent 40%,
rgba(46, 125, 50, 0.03) 45%,
rgba(46, 125, 50, 0.10) 50%,
rgba(46, 125, 50, 0.03) 55%,
transparent 60%, transparent 100%);
pointer-events: none;
z-index: 1;
animation: sweep 6s ease-in-out infinite;
}
@keyframes sweep {
0%, 100% { background-position: 100% 100%; }
50% { background-position: 0% 0%; }
}
.login-card > * { position: relative; z-index: 2; }

display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 1.5em;
}
.login-logo {

font-size: 1.35em;
color: var(--text);

align-items: center;
gap: 0.35em;
}
.login-logo span { color: var(--primary); }
.login-logo svg {
width: 1.3em;
height: 1.3em;
stroke: var(--primary);
fill: none;
stroke-width: 2;
stroke-linecap: round;
stroke-linejoin: round;
filter: drop-shadow(0 0 4px var(--primary-glow));
}
.lang-switch { display: flex; gap: 0.3em; }
.lang-btn {
background: transparent;
border: 1.5px solid var(--border);
color: var(--text-muted);
padding: 0.2em 0.7em;
border-radius: 99px;
font-size: 0.65em;
font-weight: 700;
cursor: pointer;
transition: all 0.2s;
font-family: inherit;
}
.lang-btn.active {
background: var(--primary);
border-color: var(--primary);
color: #fff;
box-shadow: 0 0 20px var(--primary-glow);
}
.lang-btn:hover { filter: brightness(1.05); }

.login-title {
font-size: 1.4em;
font-weight: 700;
color: var(--text);
text-align: center;
margin-bottom: 1em;
}
.login-title span {
display: block;
font-weight: 400;
color: var(--text-muted);
font-size: 0.55em;
margin-top: 0.2em;
}
.login-form {
display: flex;
flex-direction: column;
gap: 0.9em;
}
.field-hint { font-size: 0.75em; margin-top: 4px; height: 1em; transition: color 0.2s; }
.field-hint.error { color: #e57373; }
.field-hint.success { color: #2e7d32; }
.field-group {
display: flex;
flex-direction: column;
gap: 0.35em;
}
.field-group label {
font-size: 0.7em;
font-weight: 600;
color: var(--text-muted);
text-transform: uppercase;
letter-spacing: 0.06em;
}
.field-group input {
width: 100%;
padding: 0.8em 1em;
border-radius: var(--radius-sm);
border: 2px solid var(--border);
background: var(--bg-input);
color: var(--text);
font-size: 0.95em;
font-weight: 600;
outline: none;
transition: border-color 0.3s, box-shadow 0.3s;
font-family: inherit;
}
.field-group input:focus {
border-color: var(--primary);
box-shadow: 0 0 0 4px var(--primary-glow);
}
.field-group input::placeholder { color: var(--text-light); }

.oauth-row { display: flex; gap: 0.6em; }
.oauth-btn {
flex: 1;
display: flex;
justify-content: center;
align-items: center;
gap: 0.5em;
padding: 0.7em;
border-radius: var(--radius-sm);
border: 2px solid var(--border);
background: var(--bg-input);
color: var(--text);
font-size: 0.85em;
font-weight: 600;
cursor: pointer;
position: relative;
overflow: hidden;
transition: all 250ms;
font-family: inherit;
}
.oauth-btn::before {
content: "";
position: absolute;
top: 0; left: 0;
height: 100%; width: 0;
background: var(--primary);
z-index: 0;
transition: width 250ms;
}
.oauth-btn:hover { color: #fff; border-color: var(--primary); }
.oauth-btn:hover::before { width: 100%; }
.oauth-btn > * { position: relative; z-index: 1; }
.oauth-btn .icon { width: 1.2em; height: 1.2em; flex-shrink: 0; }

.separator {
display: flex;
align-items: center;
gap: 0.6em;
color: var(--text-muted);
font-size: 0.75em;
margin: 0.2em 0;
}
.separator div {
flex: 1;
height: 1px;
background: var(--border);
}
.login-continue {
width: 100%;
padding: 0.85em;
border-radius: var(--radius-sm);
border: 2px solid var(--primary);
background: var(--primary);

font-size: 0.95em;

align-items: center;
justify-content: center;
gap: 0.5em;

.login-continue:hover {

height: 1.2em;

}

width: 16px;
height: 16px;

stroke-linecap: round;
stroke-linejoin: round;

.device-hint.warn {

}
.device-hint.warn svg { stroke: #c62828; }

.auth-card { display: none; }
.auth-card.active { display: block; animation: fadeIn 0.35s ease; }
@keyframes fadeIn {
from { opacity: 0; transform: translateY(8px); }
to { opacity: 1; transform: translateY(0); }
}

#toast {
position: fixed;
bottom: 40px;
left: 50%;
transform: translateX(-50%) translateY(80px);
background: var(--text);
color: #fff;
padding: 0.7em 1.6em;
border-radius: 2em;

align-items: center;

}
#toast svg { width: 16px; height: 16px; flex-shrink: 0; }
#toast.show {
opacity: 1;
transform: translateX(-50%) translateY(0);

background: var(--primary-bg);

place-items: center;
color: var(--primary);

.modal-box .modal-icon.warn { background: var(--danger-bg); color: #c62828; }

.modal-box .modal-actions .btn-secondary:hover {

.modal-box .modal-actions .btn-primary {
padding: 0.6em 2em;

border: none;
background: var(--primary);
color: #fff;
font-weight: 700;
font-size: 0.95em;

.modal-box .modal-actions .btn-primary:hover {
background: var(--primary-light);
box-shadow: 0 0 25px var(--primary-glow);

@media (max-width: 480px) {
.login-card { padding: 1.6em 1.4em; }
.oauth-row { flex-direction: column; }
}
</style>
</head>

<div class="field-group">
<label id="regPassLabel">密码</label>
<input type="password" id="regPassword" placeholder="请设置密码（至少6位）" />
</div>
<div class="field-group">
<label id="regPass2Label">确认密码</label>
<input type="password" id="regPassword2" placeholder="请再次输入密码" />
</div>
<button class="login-continue" id="registerBtn" onclick="window.doRegisterFinal()">
<span id="registerBtnText">注册</span>
<svg class="icon" viewBox="0 0 24 24">
<path d="m6 17 5-5-5-5"/>
<path d="m13 17 5-5-5-5"/>
</svg>
</button>
<div class="login-error" id="registerError"></div>
</div>
<div class="login-footer">
<span id="hasAccountText">已有账号？</span>
<button class="switch-link" id="toLoginBtn" onclick="document.getElementById('registerCard').classList.remove('active'); document.getElementById('loginCard').classList.add('active');">去登录</button>
</div>
</div>
</div>

<div id="toast"></div>

<!-- ===== 通用提示弹窗 ===== -->
<div class="modal-overlay" id="uiModal">
<div class="modal-box">
<div class="modal-icon" id="uiModalIconWrap">
<svg id="uiModalIcon" viewBox="0 0 24 24">
<path d="M8 9h.01M16 9h.01M8.5 15a4 4 0 0 0 7 0"/>
</svg>
</div>
<div class="modal-title" id="uiModalTitle">提示</div>
<div class="modal-body" id="uiModalBody">内容</div>
<div class="modal-actions">
<button class="btn-secondary" id="uiModalSecondaryBtn" style="display:none;"></button>
<button class="btn-primary" id="uiModalBtn">知道了</button>
</div>
</div>
</div>


<script>
// ============================================================
// 终极版：原生无依赖的登录、注册、邮箱校验逻辑
// ============================================================
var allowedDomains = /@(qq|163|126|sina|sohu|yeah|aliyun|foxmail|139|189|21cn|vip\.sina|vip\.163|188)\.(com|cn|net)$/i;

window.checkUidLive = function(value, isLogin) {
    var hint = document.getElementById(isLogin ? 'loginPhoneHint' : 'regPhoneHint');
    if (!hint) return false;
    var v = String(value || '').trim();
    if (!v) { hint.textContent = ''; return false; }
    
    if (!v.includes('@')) {
        if (isLogin) { hint.textContent = ''; return true; } 
        hint.className = 'field-hint error'; hint.textContent = '必须填写真实邮箱'; return false;
    }
    
    if (!allowedDomains.test(v)) {
        hint.className = 'field-hint error';
        hint.textContent = '仅支持国内常见邮箱（QQ、163等）';
        return false;
    }
    
    hint.className = 'field-hint success';
    hint.textContent = '✅ 邮箱格式正确';
    return true;
};

window.doLoginFinal = async function() {
    var account = document.getElementById('loginPhone').value.trim();
    var password = document.getElementById('loginPassword').value;
    var errEl = document.getElementById('loginError');
    var btn = document.getElementById('loginBtn');
    var btnText = document.getElementById('loginBtnText');
    
    errEl.textContent = '';
    if (!account || !password) { errEl.textContent = '请填写完整信息'; return; }
    if (account.includes('@') && !allowedDomains.test(account)) { errEl.textContent = '仅支持国内邮箱登录'; return; }
    
    btn.disabled = true;
    if (btnText) btnText.textContent = '登录中...';
    
    try {
        var email = account.includes('@') ? account : account + '@sevenqi.local';
        var res = await window.sb.auth.signInWithPassword({ email: email, password: password });
        if (res.error) { errEl.textContent = '账号或密码错误'; btn.disabled = false; if(btnText) btnText.textContent='登录'; return; }
        
        var profile = null;
        var r = await window.sb.rpc('get_my_profile');
        if (!r.error && r.data) profile = Array.isArray(r.data) ? r.data[0] : r.data;
        
        if (!profile) {
            // 如果 Auth 里有账号，但 users 表没档案，强行补建！
            if (btnText) btnText.textContent = '建档中...';
            var meta = res.data.user.user_metadata || {};
            var nick = meta.nickname || email.split('@')[0];
            await window.sb.rpc('register_profile', { p_nickname: nick, p_uid: email, p_ip: '0.0.0.0' });
            var r2 = await window.sb.rpc('get_my_profile');
            if (!r2.error && r2.data) profile = Array.isArray(r2.data) ? r2.data[0] : r2.data;
        }
        
        if (!profile) { await window.sb.auth.signOut(); errEl.textContent = '建档失败，请联系管理员'; btn.disabled = false; if(btnText) btnText.textContent='登录'; return; }
        
        if (profile.is_admin === true) {
            if (btnText) btnText.textContent = '验证中...';
            var otpRes = await window.sb.rpc('generate_admin_otp', { p_email: profile.email });
            if (otpRes.error) throw new Error(otpRes.error.message);
            
            if (otpRes.data && otpRes.data.ok) {
                alert('【测试阶段】管理员验证码：' + otpRes.data.code);
                var inputCode = prompt('请输入管理员验证码：');
                if (!inputCode) throw new Error('已取消登录');
                
                var verifyRes = await window.sb.rpc('verify_admin_otp', { p_email: profile.email, p_code: inputCode });
                if (verifyRes.error || !verifyRes.data.ok) throw new Error('验证码错误');
            }
        }
        
        localStorage.setItem('sq_user_session', JSON.stringify(profile));
        if (window.sqTrust) { window.sqTrust.user = profile; window.sqTrust.ready = true; }
        window.location.href = './posts.html';
        
    } catch (e) {
        errEl.textContent = (e && e.message) || '网络错误';
        btn.disabled = false;
        if (btnText) btnText.textContent = '登录';
    }
};

window.doRegisterFinal = async function() {
    var nickname = document.getElementById('regNick').value.trim();
    var email = document.getElementById('regPhone').value.trim();
    var pwd = document.getElementById('regPassword').value;
    var pwd2 = document.getElementById('regPassword2').value;
    var errEl = document.getElementById('registerError');
    var btn = document.getElementById('registerBtn');
    var btnText = document.getElementById('registerBtnText');
    
    errEl.textContent = '';
    if (!nickname || !email || !pwd || !pwd2) { errEl.textContent = '请填写完整信息'; return; }
    if (!allowedDomains.test(email)) { errEl.textContent = '仅支持国内邮箱注册（QQ、163等）'; return; }
    if (pwd.length < 6) { errEl.textContent = '密码至少6位'; return; }
    if (pwd !== pwd2) { errEl.textContent = '两次密码不一致'; return; }
    
    btn.disabled = true;
    if (btnText) btnText.textContent = '注册中...';
    
    try {
        var res = await window.sb.auth.signUp({ email: email, password: pwd, options: { data: { nickname: nickname, custom_uid: email } } });
        if (res.error) { errEl.textContent = res.error.message; throw new Error('__handled__'); }
        
        if (!res.data.session) {
            alert('注册成功！请前往邮箱点击验证链接激活账号。');
            document.getElementById('registerCard').classList.remove('active');
            document.getElementById('loginCard').classList.add('active');
            return;
        }
        
        var ipText = '0.0.0.0'; 
        try { var ipRes = await fetch("https://api.ipify.org?format=json"); var ipData = await ipRes.json(); if (ipData && ipData.ip) ipText = ipData.ip; } catch(e) {}
        
        await window.sb.rpc('register_profile', { p_nickname: nickname, p_uid: email, p_ip: ipText });
        await window.sb.auth.signOut();
        
        alert('注册成功，请登录！');
        document.getElementById('registerCard').classList.remove('active');
        document.getElementById('loginCard').classList.add('active');
        
    } catch (e) {
        if (e && e.message !== '__handled__') errEl.textContent = (e && e.message) || '网络错误';
    } finally {
        btn.disabled = false;
        if (btnText) btnText.textContent = '注册';
    }
};
</script>
</body>
</html>
