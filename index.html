<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>通行证 · Seven戚社区</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        :root {
            --bg: #f5faf5;
            --bg-card: #ffffff;
            --bg-input: #eaf3ea;
            --border: #c8e0c8;
            --text: #1e3a2e;
            --text-muted: #5a7a6a;
            --text-light: #8aaa9a;
            --primary: #2e7d32;
            --primary-light: #4caf50;
            --primary-glow: rgba(46, 125, 50, 0.25);
            --primary-bg: #e8f5e9;
            --shadow: 0 8px 32px rgba(46, 125, 50, 0.12);
            --danger: #e57373;
            --danger-bg: #ffebee;
            --radius: 16px;
            --radius-sm: 10px;
            --font: "Space Grotesk", "PingFang SC", "Segoe UI", system-ui, sans-serif;
        }
        html, body {
            height: 100%;
            font-family: var(--font);
            background: var(--bg);
            background-image:
                radial-gradient(circle at 20% 10%, rgba(46, 125, 50, 0.06) 0%, transparent 45%),
                radial-gradient(circle at 80% 90%, rgba(76, 175, 80, 0.06) 0%, transparent 45%);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }
        .login-card {
            width: 23em;
            max-width: 92vw;
            max-height: 92vh;
            overflow-y: auto;
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 2.2em 2em;
            position: relative;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            -webkit-overflow-scrolling: touch;
        }
        .login-card::-webkit-scrollbar { width: 4px; }
        .login-card::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
        .login-card::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: var(--radius);
            background-image:
                linear-gradient(rgba(46, 125, 50, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(46, 125, 50, 0.04) 1px, transparent 1px);
            background-size: 2em 2em;
            opacity: 0.6;
            pointer-events: none;
            z-index: 0;
        }
        .login-card::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: var(--radius);
            background: linear-gradient(115deg,
                    transparent 0%, transparent 40%,
                    rgba(46, 125, 50, 0.03) 45%,
                    rgba(46, 125, 50, 0.10) 50%,
                    rgba(46, 125, 50, 0.03) 55%,
                    transparent 60%, transparent 100%);
            pointer-events: none;
            z-index: 1;
            animation: sweep 6s ease-in-out infinite;
        }
        @keyframes sweep {
            0%, 100% { background-position: 100% 100%; }
            50% { background-position: 0% 0%; }
        }
        .login-card > * { position: relative; z-index: 2; }

        .login-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5em;
        }
        .login-logo {
            font-weight: 900;
            font-size: 1.35em;
            color: var(--text);
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 0.35em;
        }
        .login-logo span { color: var(--primary); }
        .login-logo svg {
            width: 1.3em;
            height: 1.3em;
            stroke: var(--primary);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 4px var(--primary-glow));
        }
        .lang-switch { display: flex; gap: 0.3em; }
        .lang-btn {
            background: transparent;
            border: 1.5px solid var(--border);
            color: var(--text-muted);
            padding: 0.2em 0.7em;
            border-radius: 99px;
            font-size: 0.65em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .lang-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
            box-shadow: 0 0 20px var(--primary-glow);
        }
        .lang-btn:hover { filter: brightness(1.05); }

        .login-title {
            font-size: 1.4em;
            font-weight: 700;
            color: var(--text);
            text-align: center;
            margin-bottom: 1em;
        }
        .login-title span {
            display: block;
            font-weight: 400;
            color: var(--text-muted);
            font-size: 0.55em;
            margin-top: 0.2em;
        }
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 0.9em;
        }
        .field-group {
            display: flex;
            flex-direction: column;
            gap: 0.35em;
        }
        .field-group label {
            font-size: 0.7em;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }
        .field-group input {
            width: 100%;
            padding: 0.8em 1em;
            border-radius: var(--radius-sm);
            border: 2px solid var(--border);
            background: var(--bg-input);
            color: var(--text);
            font-size: 0.95em;
            font-weight: 600;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
            font-family: inherit;
        }
        .field-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-glow);
        }
        .field-group input::placeholder { color: var(--text-light); }

        .oauth-row { display: flex; gap: 0.6em; }
        .oauth-btn {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5em;
            padding: 0.7em;
            border-radius: var(--radius-sm);
            border: 2px solid var(--border);
            background: var(--bg-input);
            color: var(--text);
            font-size: 0.85em;
            font-weight: 600;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 250ms;
            font-family: inherit;
        }
        .oauth-btn::before {
            content: "";
            position: absolute;
            top: 0; left: 0;
            height: 100%; width: 0;
            background: var(--primary);
            z-index: 0;
            transition: width 250ms;
        }
        .oauth-btn:hover { color: #fff; border-color: var(--primary); }
        .oauth-btn:hover::before { width: 100%; }
        .oauth-btn > * { position: relative; z-index: 1; }
        .oauth-btn .icon { width: 1.2em; height: 1.2em; flex-shrink: 0; }

        .separator {
            display: flex;
            align-items: center;
            gap: 0.6em;
            color: var(--text-muted);
            font-size: 0.75em;
            margin: 0.2em 0;
        }
        .separator div {
            flex: 1;
            height: 1px;
            background: var(--border);
        }
        .login-continue {
            width: 100%;
            padding: 0.85em;
            border-radius: var(--radius-sm);
            border: 2px solid var(--primary);
            background: var(--primary);
            color: #fff;
            font-weight: 700;
            font-size: 0.95em;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5em;
            font-family: inherit;
            margin-top: 0.3em;
        }
        .login-continue:hover {
            background: var(--primary-light);
            border-color: var(--primary-light);
            box-shadow: 0 0 30px var(--primary-glow);
            transform: translateY(-1px);
        }
        .login-continue:disabled {
            opacity: 0.5;
            pointer-events: none;
        }
        .login-continue .icon {
            width: 1.2em;
            height: 1.2em;
            stroke: currentColor;
            stroke-width: 2.5;
            fill: none;
        }
        .login-footer {
            text-align: center;
            margin-top: 1.1em;
            font-size: 0.82em;
            color: var(--text-muted);
        }
        .login-footer .switch-link {
            color: var(--primary);
            font-weight: 700;
            cursor: pointer;
            border: none;
            background: none;
            font-family: inherit;
            font-size: inherit;
            padding: 0 4px;
            text-decoration: underline;
            text-underline-offset: 3px;
        }
        .login-footer .switch-link:hover { color: var(--primary-light); }

        .login-error {
            color: #c62828;
            font-size: 0.78em;
            text-align: center;
            min-height: 1.5em;
            margin-top: 0.2em;
        }

        /* 设备检测提示条 */
        .device-hint {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            background: var(--primary-bg);
            border: 1px solid var(--border);
            font-size: 0.75em;
            color: var(--text-muted);
            line-height: 1.5;
        }
        .device-hint svg {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            stroke: var(--primary);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            margin-top: 2px;
        }
        .device-hint.warn {
            background: var(--danger-bg);
            border-color: #ffcdd2;
            color: #c62828;
        }
        .device-hint.warn svg { stroke: #c62828; }

        .auth-card { display: none; }
        .auth-card.active { display: block; animation: fadeIn 0.35s ease; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--text);
            color: #fff;
            padding: 0.7em 1.6em;
            border-radius: 2em;
            font-weight: 600;
            font-size: 0.85em;
            opacity: 0;
            transition: all 0.4s ease;
            z-index: 300;
            pointer-events: none;
            white-space: nowrap;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #toast svg { width: 16px; height: 16px; flex-shrink: 0; }
        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(30, 58, 46, 0.35);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal-box {
            background: var(--bg-card);
            border-radius: var(--radius);
            max-width: 400px;
            width: 100%;
            padding: 2em;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            text-align: center;
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .modal-overlay.active .modal-box { transform: scale(1); }
        .modal-box .modal-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 0.4em;
            border-radius: 50%;
            background: var(--primary-bg);
            display: grid;
            place-items: center;
            color: var(--primary);
        }
        .modal-box .modal-icon.warn { background: var(--danger-bg); color: #c62828; }
        .modal-box .modal-icon svg {
            width: 32px;
            height: 32px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .modal-box .modal-title {
            font-size: 1.25em;
            font-weight: 900;
            color: var(--text);
            margin-bottom: 0.4em;
        }
        .modal-box .modal-body {
            font-size: 0.95em;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 1.4em;
            white-space: pre-line;
        }
        .modal-box .modal-actions {
            display: flex;
            justify-content: center;
        }
        .modal-box .modal-actions .btn-primary {
            padding: 0.6em 2em;
            border-radius: var(--radius-sm);
            border: none;
            background: var(--primary);
            color: #fff;
            font-weight: 700;
            font-size: 0.95em;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.2s, box-shadow 0.2s;
        }
        .modal-box .modal-actions .btn-primary:hover {
            background: var(--primary-light);
            box-shadow: 0 0 25px var(--primary-glow);
        }

        @media (max-width: 480px) {
            .login-card { padding: 1.6em 1.4em; }
            .oauth-row { flex-direction: column; }
        }
    </style>
</head>
<body>

        <div class="login-header">

                            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>

                        </svg>

        <!-- ===== 注册卡片 ===== -->
        <div id="registerCard" class="auth-card">

    <script>
        // ============================================================
        // Supabase 配置
        // ============================================================
        var SUPABASE_URL = "https://ulvhuqtpdafspbdvkogs.supabase.co";
        var SUPABASE_ANON_KEY = "sb_publishable_Ew8kKf2z05kmYIK2XNu00g_dzAirtIM";
        window.sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ============================================================
        // 设备 ID 相关
        // ============================================================
        var MAX_ACCOUNTS_PER_DEVICE = 2;

        function getDeviceId() {
            var id = localStorage.getItem('sq_device_id');
            if (!id) {
                if (window.crypto && crypto.randomUUID) {
                    id = 'dev_' + crypto.randomUUID();
                } else {
                    id = 'dev_' + Date.now() + '_' + Math.random().toString(36).slice(2);
                }
                localStorage.setItem('sq_device_id', id);
            }
            return id;
        }

        async function getDeviceRegisterCount(deviceId) {
            try {
                var res = await window.sb.from('device_registrations')
                    .select('id', { count: 'exact', head: true })
                    .eq('device_id', deviceId);
                if (res.error) throw res.error;
                return res.count || 0;
            } catch (e) {
                console.warn('设备检测失败:', e);
                return 0; // 检测失败不阻止注册
            }
        }

        async function recordDeviceRegistration(deviceId, userId, phone) {
            try {
                await window.sb.from('device_registrations').insert([{
                    device_id: deviceId,
                    user_id: userId,
                    phone: phone
                }]);
            } catch (e) {
                console.warn('设备记录写入失败:', e);
            }
        }

        async function refreshDeviceHint() {
            var hintEl = document.getElementById('deviceHint');
            var textEl = document.getElementById('deviceHintText');
            var t = T();
            var deviceId = getDeviceId();
            var count = await getDeviceRegisterCount(deviceId);
            var remain = MAX_ACCOUNTS_PER_DEVICE - count;

            if (remain <= 0) {
                hintEl.classList.add('warn');
                textEl.textContent = t.deviceLimitReached.replace('{n}', MAX_ACCOUNTS_PER_DEVICE);
                document.getElementById('registerBtn').disabled = true;
            } else {
                hintEl.classList.remove('warn');

        function applyLang(lang) {
            currentLang = lang;

                b.classList.toggle('active', b.dataset.lang === lang);

        // ============================================================
        // 工具
        // ============================================================
        function showToast(msg) {
            var toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(window.toastTimer);
            window.toastTimer = setTimeout(function() { toast.classList.remove('show'); }, 2500);
        }

        function showModal(title, body, isWarn) {
            document.getElementById('uiModalTitle').textContent = title;
            document.getElementById('uiModalBody').textContent = body;
            var iconWrap = document.getElementById('uiModalIconWrap');
            if (isWarn) iconWrap.classList.add('warn');
            else iconWrap.classList.remove('warn');
            document.getElementById('uiModal').classList.add('active');
        }
        document.getElementById('uiModalBtn').onclick = function() {
            document.getElementById('uiModal').classList.remove('active');
        };
        document.getElementById('uiModal').addEventListener('click', function(e) {
            if (e.target === this) this.classList.remove('active');
        });

        async function hashPassword(password) {
            var encoder = new TextEncoder();
            var data = encoder.encode(password);
            var hashBuffer = await crypto.subtle.digest('SHA-256', data);
            var hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(function(b) { return b.toString(16).padStart(2, '0'); }).join('');
        }

        function generateDefaultAvatar(nickname) {
            var colors = ["#6ee7b7", "#fbbf24", "#f87171", "#a78bfa", "#f472b6", "#38bdf8", "#2e7d32", "#e67e22"];
            var color = colors[Math.floor(Math.random() * colors.length)];
            var initial = nickname.charAt(0).toUpperCase();
            var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100">' +
                '<rect width="100" height="100" fill="' + color + '" rx="50"/>' +
                '<text x="50" y="58" font-size="40" text-anchor="middle" fill="white" font-family="sans-serif">' + initial + '</text></svg>';
            return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
        }

        // ============================================================
        // 卡片切换
        // ============================================================
        function showLoginCard() {
            document.getElementById('loginCard').classList.add('active');
            document.getElementById('registerCard').classList.remove('active');
            document.getElementById('loginError').textContent = '';
            document.getElementById('registerError').textContent = '';
        }
        function showRegisterCard() {
            document.getElementById('registerCard').classList.add('active');
            document.getElementById('loginCard').classList.remove('active');
            document.getElementById('loginError').textContent = '';
            document.getElementById('registerError').textContent = '';
            // 进入注册卡片时刷新设备提示
            refreshDeviceHint();
        }
        document.getElementById('toRegisterBtn').onclick = showRegisterCard;
        document.getElementById('toLoginBtn').onclick = showLoginCard;

        // ============================================================
        // 登录/注册
        // ============================================================
        async function registerUser(phone, password, nickname) {
            var hashed = await hashPassword(password);
            var avatar = generateDefaultAvatar(nickname);
            var res = await window.sb.from('users')
                .insert([{ phone: phone, password: hashed, nickname: nickname, avatar_url: avatar }])
                .select();
            if (res.error) {
                if (res.error.code === '23505') throw new Error(T().phoneExists);
                throw res.error;
            }
            return res.data && res.data[0];
        }

        async function loginUser(phone, password) {
            var hashed = await hashPassword(password);
            var res = await window.sb.from('users').select('*').eq('phone', phone).eq('password', hashed);
            if (res.error) throw res.error;
            if (!res.data || res.data.length === 0) throw new Error(T().loginFail);
            return res.data[0];
        }

        function handleLogin() {
            var t = T();
            var phone = document.getElementById('loginPhone').value.trim();
            var password = document.getElementById('loginPassword').value.trim();
            var errEl = document.getElementById('loginError');
            var btn = document.getElementById('loginBtn');

            if (!phone || !password) { errEl.textContent = t.fillAll; return; }
            if (!/^\d{11}$/.test(phone)) { errEl.textContent = t.badPhone; return; }
            if (password.length < 6) { errEl.textContent = t.shortPwd; return; }

            errEl.textContent = t.logging;
            btn.disabled = true;

            loginUser(phone, password)
                .then(function(user) {
                    errEl.textContent = '';
                    localStorage.setItem('sq_user_session', JSON.stringify(user));
                    showToast(t.loginSuccess);
                    var now = new Date();
                    var bannedUntil = user.banned_until ? new Date(user.banned_until) : null;
                    if (bannedUntil && bannedUntil > now) {
                        console.warn('用户已被封禁，仍可浏览');
                    }
                    setTimeout(function() {
                        window.location.href = '/liuyanban/posts.html';
                    }, 400);
                })
                .catch(function(err) {
                    errEl.textContent = err.message || t.loginFail;
                    btn.disabled = false;
                });
        }

        async function handleRegister() {
            var t = T();
            var nickname = document.getElementById('regNick').value.trim();
            var phone = document.getElementById('regPhone').value.trim();
            var password = document.getElementById('regPassword').value.trim();
            var password2 = document.getElementById('regPassword2').value.trim();
            var errEl = document.getElementById('registerError');
            var btn = document.getElementById('registerBtn');

            if (!nickname || !phone || !password || !password2) { errEl.textContent = t.fillAll; return; }
            if (nickname.toLowerCase() === 'seven戚') { errEl.textContent = t.nicknameTaken; return; }
            if (!/^\d{11}$/.test(phone)) { errEl.textContent = t.badPhone; return; }
            if (password.length < 6) { errEl.textContent = t.shortPwd; return; }
            if (password !== password2) { errEl.textContent = t.pwdMismatch; return; }

            // ============ 设备检测 ============
            var deviceId = getDeviceId();
            btn.disabled = true;
            errEl.textContent = t.registering;

            var count = await getDeviceRegisterCount(deviceId);
            if (count >= MAX_ACCOUNTS_PER_DEVICE) {
                errEl.textContent = '';
                btn.disabled = false;
                showModal(
                    t.deviceLimitTitle,
                    t.deviceLimitBody.replace('{n}', MAX_ACCOUNTS_PER_DEVICE),
                    true
                );
                return;
            }

            // ============ 注册 ============
            registerUser(phone, password, nickname)
                .then(async function(newUser) {
                    errEl.textContent = '';
                    // 记录设备注册历史
                    if (newUser && newUser.id) {
                        await recordDeviceRegistration(deviceId, newUser.id, phone);
                    }
                    showToast(t.registerSuccess);
                    showLoginCard();
                    document.getElementById('loginPhone').value = phone;
                    document.getElementById('loginPassword').value = '';
                    document.getElementById('loginPassword').focus();
                    document.getElementById('regNick').value = '';
                    document.getElementById('regPhone').value = '';
                    document.getElementById('regPassword').value = '';
                    document.getElementById('regPassword2').value = '';
                    btn.disabled = false;
                })
                .catch(function(err) {
                    errEl.textContent = err.message || '注册失败';
                    btn.disabled = false;
                    console.error('注册失败:', err);
                });
        }

        document.getElementById('loginBtn').onclick = handleLogin;
        document.getElementById('registerBtn').onclick = handleRegister;

        // ============================================================
        // 第三方登录
        // ============================================================
        document.getElementById('googleBtn').onclick = function(e) {
            e.preventDefault();
            showModal(T().modalTitle, T().modalDescGoogle);
        };
        document.getElementById('githubBtn').onclick = function(e) {
            e.preventDefault();
            showModal(T().modalTitle, T().modalDescGithub);
        };

        // ============================================================
        // 语言切换
        // ============================================================
        document.querySelectorAll('.lang-btn').forEach(function(btn) {
            btn.onclick = function() {
                applyLang(this.dataset.lang);
            };
        });

        // ============================================================
        // 回车提交
        // ============================================================
        document.querySelectorAll('input').forEach(function(inp) {
            inp.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    if (document.getElementById('loginCard').classList.contains('active')) {
                        handleLogin();
                    } else {
                        handleRegister();
                    }
                }
            });
        });

        // ============================================================
        // 已登录自动跳转
        // ============================================================
        (function checkSession() {
            var session = localStorage.getItem('sq_user_session');
            if (session) {
                try {
                    var user = JSON.parse(session);
                    if (user && user.id) {
                        window.location.href = '/liuyanban/posts.html';
                        return;
                    }
                } catch (e) {}
            }
            applyLang('zh');
            showLoginCard();
        })();

        document.addEventListener('gesturestart', function(e) { e.preventDefault(); });
    </script>
