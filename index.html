<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#2e7d32" />
<link rel="apple-touch-icon" href="./icon.svg" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>通行证 · Seven戚社区</title>
<script src="./vendor/supabase.js"></script>
<script>window.supabase||document.write('<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"><\/script>');</script>
<script>
  // 提前给 common.js 发信号，让它不要弹自带的开屏，这里由本页面接管开屏
  sessionStorage.setItem('sq_boot_shown', '1');
</script>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
:root {
--bg: #f5faf5; --bg-card: #ffffff; --bg-input: #eaf3ea; --border: #c8e0c8;
--text: #1e3a2e; --text-muted: #5a7a6a; --primary: #2e7d32; --primary-light: #4caf50;
--primary-glow: rgba(46, 125, 50, 0.25); --primary-bg: #e8f5e9;
--shadow: 0 8px 32px rgba(46, 125, 50, 0.12); --radius: 16px; --radius-sm: 10px;
--font: "Space Grotesk", "PingFang SC", "Segoe UI", system-ui, sans-serif;
}
html, body { height: 100%; font-family: var(--font); background: var(--bg); color: var(--text); overflow: hidden; }

/* ===== 1. 开屏动画 (全屏黑底) ===== */
#bootScreen {
    position: fixed; inset: 0; z-index: 99999; background: #000;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 0.6s ease; opacity: 1;
}
#bootScreen.hide { opacity: 0; pointer-events: none; }
.boot-inner { position: relative; width: 160px; height: 60px; display: flex; align-items: center; justify-content: center; }
.boot-loader {
    position: absolute; inset: 0; z-index: 1;
    background-color: transparent;
    -webkit-mask: repeating-linear-gradient(90deg, transparent 0, transparent 6px, black 7px, black 8px);
    mask: repeating-linear-gradient(90deg, transparent 0, transparent 6px, black 7px, black 8px);
}
.boot-loader::after {
    content: ""; position: absolute; inset: 0;
    background-image: radial-gradient(circle at 50% 50%, #ff0 0%, transparent 50%), radial-gradient(circle at 45% 45%, #f00 0%, transparent 45%), radial-gradient(circle at 55% 55%, #0ff 0%, transparent 45%), radial-gradient(circle at 45% 55%, #0f0 0%, transparent 45%), radial-gradient(circle at 55% 45%, #00f 0%, transparent 45%);
    -webkit-mask: radial-gradient(circle at 50% 50%, transparent 0%, transparent 10%, black 25%);
    mask: radial-gradient(circle at 50% 50%, transparent 0%, transparent 10%, black 25%);
    animation: boot-transform 2s infinite alternate, boot-opacity 3s infinite;
}
@keyframes boot-transform { 0% { transform: translate(-55%); } 100% { transform: translate(55%); } }
@keyframes boot-opacity { 0%, 100% { opacity: 0; } 30%, 70% { opacity: 1; } }
.boot-text {
    position: relative; z-index: 2; color: #fff; font-size: 1.2em; font-weight: 900; letter-spacing: 2px;
    text-shadow: 0 0 10px #fff; animation: textPulse 1.5s infinite alternate;
}
@keyframes textPulse { 0% { opacity: 0.5; } 100% { opacity: 1; text-shadow: 0 0 20px #fff, 0 0 30px var(--primary); } }

/* ===== 2. 引导页 (四页) ===== */
#introScreen {
    position: fixed; inset: 0; z-index: 9000; background: #fff;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity 0.4s ease; opacity: 1;
}
#introScreen.hide { opacity: 0; pointer-events: none; }
.intro-slide { display: none; text-align: center; padding: 20px; width: 100%; max-width: 400px; }
.intro-slide.active { display: block; animation: fadeIn 0.5s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.intro-icon { width: 96px; height: 96px; border-radius: 28px; margin: 0 auto 24px; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #4caf50, #2e7d32); box-shadow: 0 12px 32px rgba(46,125,50,0.2); }
.intro-title { font-size: 1.8em; font-weight: 900; margin-bottom: 12px; color: #1e3a2e; }
.intro-desc { font-size: 0.95em; color: #5a7a6a; line-height: 1.7; margin-bottom: 40px; }
.intro-dots { display: flex; gap: 8px; margin-bottom: 24px; }
.intro-dots .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(46,125,50,0.2); transition: all 0.4s; }
.intro-dots .dot.active { width: 28px; border-radius: 4px; background: #2e7d32; }
.intro-btn { background: linear-gradient(135deg, #4caf50, #2e7d32); color: #fff; border: none; padding: 16px 48px; font-size: 1.05em; font-weight: 700; border-radius: 99px; cursor: pointer; min-width: 220px; box-shadow: 0 10px 25px rgba(46,125,50,0.3); }
.skip-btn { background: none; border: none; color: #8aaa9a; font-size: 0.85em; margin-top: 16px; cursor: pointer; }

/* ===== 3. 登录/注册层 ===== */
#authScreen {
    position: fixed; inset: 0; z-index: 8000; background: var(--bg);
    display: none; align-items: center; justify-content: center; padding: 20px;
    background-image: radial-gradient(circle at 20% 10%, rgba(46, 125, 50, 0.06) 0%, transparent 45%), radial-gradient(circle at 80% 90%, rgba(76, 175, 80, 0.06) 0%, transparent 45%);
    transition: opacity 0.4s ease; opacity: 1; overflow-y: auto;
}
#authScreen.hide { opacity: 0; pointer-events: none; }
.login-card { width: 23em; max-width: 92vw; background: #fff; border-radius: 16px; padding: 2.2em 2em; border: 1px solid #c8e0c8; box-shadow: 0 8px 32px rgba(46,125,50,0.12); }
.login-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5em; }
.login-logo { font-weight: 900; font-size: 1.35em; color: #1e3a2e; display: flex; align-items: center; gap: 0.35em; }
.login-logo span { color: #2e7d32; }
.login-title { font-size: 1.4em; font-weight: 700; text-align: center; margin-bottom: 1em; }
.login-title span { display: block; font-weight: 400; color: #5a7a6a; font-size: 0.55em; margin-top: 0.2em; }
.login-form { display: flex; flex-direction: column; gap: 0.9em; }
.field-group { display: flex; flex-direction: column; gap: 0.35em; }
.field-group label { font-size: 0.7em; font-weight: 600; color: #5a7a6a; }
.field-group input { width: 100%; padding: 0.8em 1em; border-radius: 10px; border: 2px solid #c8e0c8; background: #eaf3ea; font-size: 0.95em; outline: none; transition: all 0.2s; }
.field-group input:focus { border-color: #2e7d32; box-shadow: 0 0 0 4px rgba(46,125,50,0.1); }
.login-continue { width: 100%; padding: 0.85em; border-radius: 10px; border: none; background: #2e7d32; color: #fff; font-weight: 700; font-size: 0.95em; cursor: pointer; margin-top: 0.3em; transition: all 0.2s; }
.login-continue:hover { background: #4caf50; transform: translateY(-1px); }
.login-footer { text-align: center; margin-top: 1.1em; font-size: 0.82em; color: #5a7a6a; }
.login-footer .switch-link { color: #2e7d32; font-weight: 700; cursor: pointer; border: none; background: none; padding: 0 4px; text-decoration: underline; }
.login-error { color: #c62828; font-size: 0.78em; text-align: center; min-height: 1.5em; margin-top: 0.2em; }
.auth-card { display: none; }
.auth-card.active { display: block; animation: fadeIn 0.3s ease; }
</style>
</head>
<body>

<!-- 1. 开屏动画 -->
<div id="bootScreen">
    <div class="boot-inner">
        <div class="boot-loader"></div>
        <div class="boot-text">Seven戚 出品</div>
    </div>
</div>

<!-- 2. 引导页 -->
<div id="introScreen">
    <div id="introSlide0" class="intro-slide active">
        <div class="intro-icon"><svg viewBox="0 0 64 64" width="48" height="48" fill="none"><path d="M16 24C16 18.4772 20.4772 14 26 14H38C43.5228 14 48 18.4772 48 24V32C48 37.5228 43.5228 42 38 42H30L20 50V42C17.7909 42 16 40.2091 16 38V24Z" fill="rgba(255,255,255,0.9)"/></svg></div>
        <div class="intro-title">社区广场</div>
        <div class="intro-desc">帖子广场、实时聊天群、匿名留言板<br>发布动态，随便聊聊</div>
    </div>
    <div id="introSlide1" class="intro-slide">
        <div class="intro-icon" style="background:linear-gradient(135deg,#7c3aed,#db2777);"><svg viewBox="0 0 64 64" width="48" height="48" fill="none"><path d="M22 24C16 24 12 30 12 38C12 44 16 48 20 48C24 48 26 46 28 42H36C38 46 40 48 44 48C48 48 52 44 52 38C52 30 48 24 42 24H22Z" fill="rgba(255,255,255,0.9)"/></svg></div>
        <div class="intro-title">互动游戏</div>
        <div class="intro-desc">开个房间，和朋友一起玩<br>斗地主、五子棋等</div>
    </div>
    <div id="introSlide2" class="intro-slide">
        <div class="intro-icon" style="background:linear-gradient(135deg,#d4af37,#b8941f);"><svg viewBox="0 0 64 64" width="48" height="48" fill="none"><path d="M20 24H44L46 48C46.2 50.2 44.5 52 42.3 52H21.7C19.5 52 17.8 50.2 18 48L20 24Z" fill="rgba(255,255,255,0.9)"/></svg></div>
        <div class="intro-title">皮肤商城</div>
        <div class="intro-desc">45 款精美气泡皮肤任你挑<br>每日签到赚小七币</div>
    </div>
    <div id="introSlide3" class="intro-slide">
        <div class="intro-icon" style="background:linear-gradient(135deg,#0ea5e9,#0284c7);"><svg viewBox="0 0 64 64" width="48" height="48" fill="none"><rect x="14" y="20" width="36" height="26" rx="4" fill="rgba(255,255,255,0.9)"/></svg></div>
        <div class="intro-title">匿名留言板</div>
        <div class="intro-desc">无需登录，随写随发<br>每天 3 条额度，安全审核</div>
    </div>
    
    <div class="intro-dots" id="introDots">
        <div class="dot active"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    </div>
    <button id="introNextBtn" class="intro-btn">下一步</button>
    <button id="introSkipBtn" class="skip-btn">跳过，直接进入 →</button>
</div>

<!-- 3. 登录注册页 -->
<div id="authScreen">
    <div class="login-card">
        <div class="login-header"><div class="login-logo"><span>Seven</span>戚</div></div>
        
        <div id="loginCard" class="auth-card active">
            <div class="login-title"><span>欢迎回来</span><span>登录以继续</span></div>
            <div class="login-form">
                <div class="field-group"><label>邮箱账号</label><input type="email" id="loginEmail" placeholder="请输入真实邮箱" /></div>
                <div class="field-group"><label>密码</label><input type="password" id="loginPassword" placeholder="请输入密码" /></div>
                <button class="login-continue" id="loginBtn">登录</button>
                <div class="login-error" id="loginError"></div>
            </div>
            <div class="login-footer"><span>没有账号？</span><button class="switch-link" id="toRegisterBtn">去注册</button></div>
        </div>

        <div id="registerCard" class="auth-card">
            <div class="login-title"><span>创建账户</span><span>加入 Seven戚 社区</span></div>
            <div class="login-form">
                <div class="field-group"><label>昵称</label><input type="text" id="regNick" maxlength="12" placeholder="请输入昵称" /></div>
                <div class="field-group"><label>邮箱账号</label><input type="email" id="regEmail" placeholder="请输入真实邮箱" /></div>
                <div class="field-group"><label>密码</label><input type="password" id="regPassword" placeholder="密码至少6位" /></div>
                <div class="field-group"><label>确认密码</label><input type="password" id="regPassword2" placeholder="再次输入密码" /></div>
                <button class="login-continue" id="registerBtn">注册</button>
                <div class="login-error" id="registerError"></div>
            </div>
            <div class="login-footer"><span>已有账号？</span><button class="switch-link" id="toLoginBtn">去登录</button></div>
        </div>
    </div>
</div>

<script>
// ============================================================
// 1. Supabase 初始化 (兜底)
// ============================================================
var SUPABASE_URL = "https://ljbxeuqnlxiffvbnwepv.supabase.co";
var SUPABASE_ANON_KEY = "sb_publishable_OT_i4T2SnTxA8bHKnSQ1sw_0Es4l8SP";
if (!window.sb) window.sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ============================================================
// 2. 档案操作
// ============================================================
async function fetchMyProfileServer() {
    try {
        var r = await window.sb.rpc('get_my_profile');
        if (!r.error && r.data) return Array.isArray(r.data) ? r.data[0] : r.data;
    } catch (e) {}
    try {
        var s = await window.sb.auth.getUser();
        var me = s && s.data && s.data.user;
        if (!me) return null;
        var q = await window.sb.from('users').select('*').eq('id', me.id).maybeSingle();
        if (!q.error && q.data) return q.data;
    } catch (e) {}
    return null;
}

async function ensureProfileFromAuth(nickname) {
    try {
        var s = await window.sb.auth.getUser();
        var me = s && s.data && s.data.user;
        if (!me) return null;
        var nick = nickname || (me.user_metadata && me.user_metadata.nickname) || (me.email || '').split('@')[0];
        
        var ip = '0.0.0.0';
        try { var res = await fetch('https://api.ipify.org?format=json'); ip = (await res.json()).ip; } catch(e) {}
        
        var r = await window.sb.rpc('register_profile', { p_nickname: nick, p_ip: ip });
        if (!r.error) return await fetchMyProfileServer();
        
        var ins = await window.sb.from('users').insert([{ id: me.id, nickname: nick, ip_address: ip }]).select();
        if (!ins.error && ins.data[0]) return ins.data[0];
        return await fetchMyProfileServer();
    } catch (e) { return null; }
}

function saveLocalSession(profile) {
    if (!profile) return;
    var o = {}; ['id', 'nickname', 'avatar_url', 'is_admin', 'coins', 'banned_until'].forEach(k => { if (profile[k] !== undefined) o[k] = profile[k]; });
    localStorage.setItem('sq_user_session', JSON.stringify(o));
}

// ============================================================
// 3. 登录注册逻辑
// ============================================================
async function doLogin() {
    var email = document.getElementById('loginEmail').value.trim();
    var password = document.getElementById('loginPassword').value;
    var errEl = document.getElementById('loginError');
    if (!email || !password) return errEl.textContent = '请填写邮箱和密码';
    
    errEl.textContent = '登录中...';
    try {
        var res = await window.sb.auth.signInWithPassword({ email, password });
        if (res.error) throw new Error('账号或密码错误');
        
        var profile = await fetchMyProfileServer() || await ensureProfileFromAuth();
        if (!profile) throw new Error('档案补建失败');
        
        // 管理员拦截
        if (profile.is_admin === true) {
            var code = prompt('【管理员验证】请输入 6 位验证码：');
            if(!code) throw new Error('必须输入验证码');
            var v = await window.sb.rpc('verify_admin_otp', { p_code: code.trim() });
            if (v.error || (v.data && !v.data.ok)) throw new Error('验证码错误');
        }
        
        saveLocalSession(profile);
        document.getElementById('authScreen').classList.add('hide');
        setTimeout(() => window.location.href = './posts.html', 400);
    } catch (e) { errEl.textContent = e.message; }
}

async function doRegister() {
    var nickname = document.getElementById('regNick').value.trim();
    var email = document.getElementById('regEmail').value.trim();
    var pwd = document.getElementById('regPassword').value;
    var pwd2 = document.getElementById('regPassword2').value;
    var errEl = document.getElementById('registerError');
    
    if (!nickname || !email || !pwd) return errEl.textContent = '请填写完整信息';
    if (pwd !== pwd2) return errEl.textContent = '两次密码不一致';
    
    errEl.textContent = '注册中...';
    try {
        var res = await window.sb.auth.signUp({ email, password: pwd, options: { data: { nickname: nickname } } });
        if (res.error) throw new Error(res.error.message);
        
        if (!res.data.session) {
            alert('注册成功，请去邮箱查收验证邮件后再登录。');
            switchCard('login');
            document.getElementById('loginEmail').value = email;
            return;
        }
        
        await ensureProfileFromAuth(nickname);
        document.getElementById('authScreen').classList.add('hide');
        setTimeout(() => window.location.href = './posts.html', 400);
    } catch (e) { errEl.textContent = e.message; }
}

function switchCard(which) {
    ['loginCard', 'registerCard'].forEach(function (id) {
        var el = document.getElementById(id);
        if (el) el.classList.toggle('active', id === which + 'Card');
    });
    document.getElementById('loginError').textContent = '';
    document.getElementById('registerError').textContent = '';
}

// ============================================================
// 4. 核心：开屏 -> 静默判定 -> 分流
// ============================================================
(async function init() {
    // 按钮绑定
    document.getElementById('toRegisterBtn').onclick = () => switchCard('register');
    document.getElementById('toLoginBtn').onclick = () => switchCard('login');
    document.getElementById('loginBtn').onclick = doLogin;
    document.getElementById('registerBtn').onclick = doRegister;
    document.getElementById('loginPassword').addEventListener('keydown', e => e.key === 'Enter' && doLogin());
    document.getElementById('regPassword2').addEventListener('keydown', e => e.key === 'Enter' && doRegister());

    // 引导页按钮逻辑
    var currentSlide = 0;
    var totalSlides = 4;
    function updateSlide(idx) {
        currentSlide = idx;
        document.querySelectorAll('.intro-slide').forEach((el, i) => el.classList.toggle('active', i === idx));
        document.querySelectorAll('.intro-dots .dot').forEach((el, i) => el.classList.toggle('active', i === idx));
        document.getElementById('introNextBtn').textContent = idx === totalSlides - 1 ? '开启体验' : '下一步';
    }
    document.getElementById('introNextBtn').onclick = function() {
        if (currentSlide < totalSlides - 1) updateSlide(currentSlide + 1);
        else finishIntro();
    };
    document.getElementById('introSkipBtn').onclick = finishIntro;
    
    function finishIntro() {
        localStorage.setItem('seven_intro_shown_v5', '1');
        document.getElementById('introScreen').classList.add('hide');
        setTimeout(() => {
            document.getElementById('introScreen').style.display = 'none';
            document.getElementById('authScreen').style.display = 'flex';
        }, 400);
    }

    // 计时器：保证开屏动画至少显示 1.8 秒
    var minTimePromise = new Promise(resolve => setTimeout(resolve, 1800));
    
    // 静默检查登录状态
    var authPromise = (async function() {
        try {
            var s = await window.sb.auth.getSession();
            if (s.data && s.data.session) {
                var p = await fetchMyProfileServer() || await ensureProfileFromAuth();
                if (p) { saveLocalSession(p); return 'AUTHED'; }
            }
        } catch(e) {}
        return 'GUEST';
    })();

    // 等待两边都完成
    var results = await Promise.all([minTimePromise, authPromise]);
    var status = results[1];

    // 隐藏开屏
    document.getElementById('bootScreen').classList.add('hide');
    setTimeout(() => document.getElementById('bootScreen').style.display = 'none', 600);

    // 分流
    if (status === 'AUTHED') {
        // 已登录，去主页
        window.location.replace('./posts.html');
    } else {
        // 未登录
        if (!localStorage.getItem('seven_intro_shown_v5')) {
            // 第一次来，显示引导
            document.getElementById('introScreen').style.display = 'flex';
        } else {
            // 来过，显示登录框
            document.getElementById('authScreen').style.display = 'flex';
        }
    }
})();
</script>
</body>
</html>
