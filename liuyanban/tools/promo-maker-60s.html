<!DOCTYPE html>
<html lang="zh">
<head>

<style>

        box-shadow: 0 6px 20px rgba(46,125,50,.35);
    }
    button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(46,125,50,.5); }
    button:disabled { background: #3a4440; box-shadow: none; cursor: not-allowed; opacity: .7; }
    #status { font-size: 13px; color: #8aaa9a; text-align: center; line-height: 1.6; max-width: 420px; }
</style>
</head>
<body>

<h1>SEVEN戚社区 · 60秒推广视频</h1>
<canvas id="videoCanvas"></canvas>

<div class="controls">
    <button id="startBtn">开始生成 60 秒视频</button>
    <div id="status">录制期间请勿切换标签页或最小化窗口，否则会掉帧。</div>
</div>

<script>
const canvas = document.getElementById('videoCanvas');
const ctx = canvas.getContext('2d');
const W = 1080, H = 1920;
canvas.width = W;
canvas.height = H;

const DURATION = 60;
const FPS = 30;

const C = {
    primary: '#2e7d32',
    primaryLight: '#4caf50',
    bg: '#f5faf5',
    text: '#1e3a2e',
    muted: '#5a7a6a',
    light: '#8aaa9a',
    white: '#ffffff',
    dark: '#0f1713',
    orange: '#f57f17',
    danger: '#e57373',
    line: '#e2eee2'
};

const PHONE = { x: W / 2 - 390, y: 210, w: 780, h: 1500, r: 64 };
const NAV_H = 190;

/* ---------- 工具 ---------- */
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.min(Math.max(v, a), b);
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

function hex2rgb(h) {
    return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function mix(c1, c2, t) {
    const a = hex2rgb(c1), b = hex2rgb(c2);
    return 'rgb(' + Math.round(lerp(a[0], b[0], t)) + ',' +
        Math.round(lerp(a[1], b[1], t)) + ',' +
        Math.round(lerp(a[2], b[2], t)) + ')';
}

function roundPath(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
}
function roundRect(x, y, w, h, r, color, stroke) {
    roundPath(x, y, w, h, r);
    if (color) { ctx.fillStyle = color; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.stroke(); }
}
function circle(cx, cy, r, color) {
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
}
function textAt(str, x, y, size, color, weight = 'bold', align = 'center') {
    ctx.fillStyle = color;
    ctx.font = weight + ' ' + size + 'px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = align;
    ctx.textBaseline = 'middle';
    ctx.fillText(str, x, y);
}
function textCenter(str, y, size, color, weight = 'bold') {
    textAt(str, W / 2, y, size, color, weight, 'center');
}
function drawHeart(cx, cy, s, color) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.beginPath();
    ctx.moveTo(0, s * 0.95);
    ctx.bezierCurveTo(-s * 1.4, s * 0.15, -s * 0.9, -s * 0.85, 0, -s * 0.25);
    ctx.bezierCurveTo(s * 0.9, -s * 0.85, s * 1.4, s * 0.15, 0, s * 0.95);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
    ctx.restore();
}
function drawBubble(cx, cy, s, color) {
    ctx.save();
    ctx.translate(cx, cy);
    const w = s * 1.9, h = s * 1.5, r = s * 0.45;
    roundPath(-w / 2, -h / 2, w, h, r);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-w / 2 + s * 0.35, h / 2 - 1);
    ctx.lineTo(-w / 2 - s * 0.1, h / 2 + s * 0.5);
    ctx.lineTo(-w / 2 + s * 0.85, h / 2 - 1);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
}

/* ---------- 时间轴控制 ---------- */
function bgColor(time) {
    if (time < 5.8) return C.dark;
    if (time < 6.4) return mix(C.dark, C.bg, (time - 5.8) / 0.6);
    if (time < 51.4) return C.bg;
    if (time < 52.6) return mix(C.bg, C.dark, (time - 51.4) / 1.2);
    return C.dark;
}

function phoneState(time) {
    if (time < 6) return { a: 0, dy: 320 };
    if (time < 7) {
        const k = easeOut((time - 6) / 1);
        return { a: k, dy: lerp(320, 0, k) };
    }
    if (time < 52) return { a: 1, dy: 0 };
    if (time < 53) {
        const k = easeOut((time - 52) / 1);
        return { a: 1 - k, dy: lerp(0, 320, k) };
    }
    return { a: 0, dy: 320 };
}

function screenAlpha(time) {
    let a = 1;
    for (const t0 of [24, 40]) {
        const dt = Math.abs(time - t0);
        if (dt < 0.4) a = Math.min(a, dt / 0.4);
    }
    return a;
}

/* ---------- 第一幕：品牌亮相 0-6s ---------- */
function drawIntro(time) {
    if (time > 6) return;

    const appear = easeOut(clamp(time / 1.2, 0, 1));
    const fade = time > 4.6 ? 1 - clamp((time - 4.6) / 1.2, 0, 1) : 1;
    const base = appear * fade;
    if (base <= 0.001) return;

    const g = ctx.createRadialGradient(W / 2, H / 2 - 100, 80, W / 2, H / 2 - 100, 900);
    g.addColorStop(0, 'rgba(46,125,50,' + (0.28 * base) + ')');
    g.addColorStop(1, 'rgba(15,23,19,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    const scale = lerp(0.75, 1, easeOut(clamp(time / 1.6, 0, 1)));
    ctx.save();
    ctx.translate(W / 2, H / 2 - 165);
    ctx.scale(scale, scale);
    ctx.globalAlpha = base;
    textAt('Seven', 0, 0, 150, C.white);
    ctx.restore();

    ctx.globalAlpha = base;
    textAt('戚社区', W / 2, H / 2 + 65, 124, C.primaryLight);

    if (time > 1.6) {
        const k = easeOut(clamp((time - 1.6) / 1, 0, 1));
        ctx.globalAlpha = k * fade;
        textCenter('一个属于年轻人的纯净社区', H / 2 + 265, 50, C.muted, 'normal');
    }
    if (time > 2.9) {
        const k = easeOut(clamp((time - 2.9) / 1, 0, 1));
        ctx.globalAlpha = k * fade;
        ctx.fillStyle = C.primary;
        ctx.fillRect(W / 2 - 180 * k, H / 2 + 355, 360 * k, 3);
        textCenter('发帖  ·  聊天  ·  游戏', H / 2 + 425, 40, C.light, 'normal');
    }
    ctx.globalAlpha = 1;
}

/* ---------- 第二幕：帖子广场 6-24s ---------- */
function drawPosts(time, sx, sy, sw, sa, pa) {
    const cardW = sw - 80;
    const cardH = 360;
    const gap = 40;
    const top = sy + NAV_H + 40;

    let scroll = 0;
    if (time > 15) scroll = easeInOut(clamp((time - 15) / 2, 0, 1)) * (cardH + gap);

    const posts = [
        { av: '明', name: '小明', tm: '3分钟前', txt: '今天天气真好，出去走走', like: 23, cmt: 8 },
        { av: '杰', name: '阿杰', tm: '8分钟前', txt: '求推荐好玩的游戏！', like: 42, cmt: 15 },
        { av: '棋', name: '棋友', tm: '12分钟前', txt: '有人一起下五子棋吗？', like: 17, cmt: 6 }
    ];

    for (let i = 0; i < posts.length; i++) {
        const p = posts[i];
        const at = 7 + i * 2.6;
        if (time < at) continue;

        const a = clamp((time - at) / 0.5, 0, 1);
        const slideIn = (1 - easeOut(a)) * 60;
        const y = top + i * (cardH + gap) - scroll;
        if (y + cardH < sy + NAV_H || y > sy + PHONE.h) continue;

        const cx = sx + 40 + slideIn;
        ctx.globalAlpha = pa * sa * a;

        roundRect(cx, y, cardW, cardH, 28, C.white, C.line);

        circle(cx + 68, y + 68, 38, i === 0 ? C.primary : C.primaryLight);
        textAt(p.av, cx + 68, y + 68, 36, C.white);

        textAt(p.name, cx + 128, y + 48, 32, C.text, 'bold', 'left');
        textAt(p.tm, cx + 128, y + 92, 24, C.light, 'normal', 'left');

        textAt(p.txt, cx + 38, y + 195, 40, C.text, 'bold', 'left');

        ctx.globalAlpha = pa * sa * a;
        drawHeart(cx + 52, y + 302, 15, '#e57373');
        textAt(String(p.like), cx + 80, y + 302, 30, C.muted, 'normal', 'left');
        drawBubble(cx + 170, y + 302, 15, C.muted);
        textAt(String(p.cmt), cx + 198, y + 302, 30, C.muted, 'normal', 'left');
    }

    // 点赞动画
    if (time > 9 && time < 10.6) {
        const k = (time - 9) / 1.6;
        const s = k < 0.3 ? lerp(0.4, 1.7, k / 0.3) : lerp(1.7, 1, (k - 0.3) / 0.7);
        const alpha = 1 - clamp((k - 0.55) / 0.45, 0, 1);
        const y0 = top + 0 * (cardH + gap) - scroll;
        ctx.globalAlpha = pa * sa * alpha;
        drawHeart(sx + 40 + cardW / 2, y0 + cardH / 2 + 10, 62 * s, C.danger);
    }
    ctx.globalAlpha = 1;
}

/* ---------- 第三幕：实时聊天 24-40s ---------- */
function drawChat(time, sx, sy, sw, sh, sa, pa) {
    const startY = sy + NAV_H + 70;
    const step = 130;
    const bh = 96;

    const msgs = [
        { at: 25.0, side: 'left', txt: '在吗？一起打游戏！', size: 36 },
        { at: 27.2, side: 'right', txt: '马上来！', size: 36 },
        { at: 29.4, side: 'left', txt: '我开个房间等你', size: 36 },
        { at: 31.6, side: 'right', txt: '好嘞，房号多少？', size: 36 }
    ];

    for (let i = 0; i < msgs.length; i++) {
        const m = msgs[i];
        if (time < m.at) continue;
        const a = clamp((time - m.at) / 0.3, 0, 1);
        const y = startY + i * step;

        let tw = 0;
        ctx.font = '500 ' + m.size + 'px "PingFang SC","Microsoft YaHei",sans-serif';
        tw = ctx.measureText(m.txt).width;
        const bw = Math.min(tw + 70, sw - 240);

        let bx;
        if (m.side === 'left') {
            bx = sx + 120 + (1 - easeOut(a)) * 30;
            circle(sx + 66, y + bh / 2, 34, C.primary);
            textAt('友', sx + 66, y + bh / 2, 30, C.white);
        } else {
            bx = sx + sw - 120 - bw - (1 - easeOut(a)) * 30;
            circle(sx + sw - 66, y + bh / 2, 34, C.primaryLight);
            textAt('我', sx + sw - 66, y + bh / 2, 30, C.white);
        }

        ctx.globalAlpha = pa * sa * a;
        roundRect(bx, y, bw, bh, 26, m.side === 'left' ? C.white : C.primary,
            m.side === 'left' ? C.line : null);

        ctx.globalAlpha = pa * sa * a;
        textAt(m.txt, bx + 35, y + bh / 2, m.size, m.side === 'left' ? C.text : C.white, '500', 'left');
    }

    // 输入框 + 打字机
    if (time > 33) {
        const iy = sy + sh - 180;
        ctx.globalAlpha = pa * sa;
        roundRect(sx + 40, iy, sw - 200, 110, 26, C.white, C.line);

        const full = '房号 1234，密码 8888';
        const n = Math.floor(clamp((time - 33.4) / 4, 0, 1) * full.length);

        ctx.globalAlpha = pa * sa;
        textAt(full.slice(0, n), sx + 78, iy + 55, 34, C.text, '500', 'left');

        if (time < 37.6 && Math.floor(time * 2) % 2 === 0) {
            ctx.font = '500 34px "PingFang SC","Microsoft YaHei",sans-serif';
            const wpx = ctx.measureText(full.slice(0, n)).width;
            ctx.fillStyle = C.primary;
            ctx.fillRect(sx + 80 + wpx, iy + 32, 4, 48);
        }

        circle(sx + sw - 110, iy + 55, 50, C.primary);
        ctx.beginPath();
        ctx.moveTo(sx + sw - 134, iy + 33);
        ctx.lineTo(sx + sw - 134, iy + 77);
        ctx.lineTo(sx + sw - 90, iy + 55);
        ctx.closePath();
        ctx.fillStyle = C.white;
        ctx.fill();
    }

    // 发送后的气泡
    if (time > 38) {
        const a = clamp((time - 38) / 0.3, 0, 1);
        const y = startY + 4 * step;
        const txt = '房号 1234，密码 8888';
        ctx.font = '500 32px "PingFang SC","Microsoft YaHei",sans-serif';
        const bw = Math.min(ctx.measureText(txt).width + 70, sw - 240);
        const bx = sx + sw - 120 - bw - (1 - easeOut(a)) * 30;

        ctx.globalAlpha = pa * sa * a;
        circle(sx + sw - 66, y + bh / 2, 34, C.primaryLight);
        textAt('我', sx + sw - 66, y + bh / 2, 30, C.white);
        roundRect(bx, y, bw, bh, 26, C.primary);
        textAt(txt, bx + 35, y + bh / 2, 32, C.white, '500', 'left');

        if (time > 38.4) {
            const k = clamp((time - 38.4) / 0.4, 0, 1);
            ctx.globalAlpha = pa * sa * k;
            textAt('已发送', sx + sw - 120, y + bh + 42, 26, C.light, 'normal', 'right');
        }
    }
    ctx.globalAlpha = 1;
}

/* ---------- 第四幕：游戏大厅 40-52s ---------- */
function drawGames(time, sx, sy, sw, sh, sa, pa) {
    const cardW = sw - 100;
    const cardH = 240;
    const gap = 40;
    const top = sy + NAV_H + 60;

    const games = [
        { at: 41.0, type: 'cards', name: '斗地主', desc: '3 人实时对战', bgc: '#fff3e0' },
        { at: 43.0, type: 'gomoku', name: '五子棋', desc: '1v1 智斗', bgc: '#e8f5e9' },
        { at: 45.0, type: 'more', name: '更多游戏', desc: '持续上新中', bgc: '#e3f2fd' }
    ];

    for (let i = 0; i < games.length; i++) {
        const g = games[i];
        if (time < g.at) continue;
        const a = clamp((time - g.at) / 0.4, 0, 1);
        const y = top + i * (cardH + gap);
        const dx = (1 - easeOut(a)) * 70;

        ctx.globalAlpha = pa * sa * a;
        roundRect(sx + 50 + dx, y, cardW, cardH, 28, C.white, C.line);

        circle(sx + 50 + dx + 128, y + cardH / 2, 72, g.bgc);
        const ix = sx + 50 + dx + 128, iy0 = y + cardH / 2;
        if (g.type === 'cards') {
            ctx.save();
            ctx.translate(ix, iy0);
            ctx.rotate(-0.18);
            roundRect(-34, -50, 54, 80, 8, '#ffffff', '#d0d0d0');
            ctx.restore();
            ctx.save();
            ctx.translate(ix, iy0);
            ctx.rotate(0.16);
            roundRect(-16, -42, 54, 80, 8, '#ffffff', '#d0d0d0');
            drawHeart(ix + 12, iy0 - 4, 14, '#e57373');
            ctx.restore();
        } else if (g.type === 'gomoku') {
            ctx.strokeStyle = '#8d6e63';
            ctx.lineWidth = 3;
            const n = 5, stp = 22, off = -n * stp / 2;
            for (let gi = 0; gi <= n; gi++) {
                ctx.beginPath();
                ctx.moveTo(ix + off + gi * stp, iy0 + off);
                ctx.lineTo(ix + off + gi * stp, iy0 + off + n * stp);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(ix + off, iy0 + off + gi * stp);
                ctx.lineTo(ix + off + n * stp, iy0 + off + gi * stp);
                ctx.stroke();
            }
            circle(ix - 11, iy0 - 11, 9, '#263238');
            circle(ix + 11, iy0 + 11, 9, '#ffffff');
            ctx.strokeStyle = '#90a4ae';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(ix + 11, iy0 + 11, 9, 0, Math.PI * 2);
            ctx.stroke();
        } else {
            circle(ix - 30, iy0, 14, '#4caf50');
            circle(ix, iy0, 14, '#ffb74d');
            circle(ix + 30, iy0, 14, '#64b5f6');
        }

        textAt(g.name, sx + 50 + dx + 240, y + cardH / 2 - 22, 44, C.text, 'bold', 'left');
        textAt(g.desc, sx + 50 + dx + 240, y + cardH / 2 + 34, 28, C.light, 'normal', 'left');

        ctx.globalAlpha = pa * sa * a;
        textAt('›', sx + 50 + dx + cardW - 60, y + cardH / 2, 56, C.light, 'normal');
    }

    // 匹配成功遮罩
    if (time > 46.5) {
        const a = clamp((time - 46.5) / 0.5, 0, 1);
        ctx.globalAlpha = a;
        ctx.fillStyle = '#0d1712';
        ctx.fillRect(sx, sy, sw, sh);
        const vg = ctx.createRadialGradient(sx + sw / 2, sy + sh / 2, 100, sx + sw / 2, sy + sh / 2, 700);
        vg.addColorStop(0, 'rgba(46,125,50,0.22)');
        vg.addColorStop(1, 'rgba(13,23,18,0)');
        ctx.fillStyle = vg;
        ctx.fillRect(sx, sy, sw, sh);

        ctx.globalAlpha = a;
        textAt('匹配成功！', sx + sw / 2, sy + sh / 2 - 70, 80, C.white);
        textAt('斗地主 · 3 人局', sx + sw / 2, sy + sh / 2 + 30, 42, '#a5d6a7', 'normal');

        for (let i = 0; i < 3; i++) {
            const dy = Math.sin(time * 4 + i * 0.9) * 12;
            ctx.globalAlpha = a * 0.9;
            circle(sx + sw / 2 - 50 + i * 50, sy + sh / 2 + 150 + dy, 11, C.primaryLight);
        }
        ctx.globalAlpha = 1;
    }
}

/* ---------- 手机外壳 ---------- */
function drawPhone(time) {
    const st = phoneState(time);
    if (st.a <= 0.002) return;

    const { x, y, w, h, r } = PHONE;
    const sa = screenAlpha(time);

    ctx.save();
    ctx.globalAlpha = st.a;
    ctx.translate(0, st.dy);

    // 外壳
    ctx.shadowColor = 'rgba(0,0,0,0.35)';
    ctx.shadowBlur = 70;
    ctx.shadowOffsetY = 26;
    roundRect(x, y, w, h, r, '#121a16');
    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 0;

    // 屏幕
    const sx = x + 12, sy = y + 12, sw = w - 24, sh = h - 24, sr = r - 10;
    roundRect(sx, sy, sw, sh, sr, C.bg);

    ctx.save();
    roundPath(sx, sy, sw, sh, sr);
    ctx.clip();

    // 顶部导航
    let navColor = C.primary;
    let navTitle = '帖子广场';
    if (time >= 24 && time < 40) { navTitle = '实时私聊'; }
    if (time >= 40) { navColor = C.orange; navTitle = '游戏大厅'; }

    ctx.globalAlpha = st.a * sa;
    ctx.fillStyle = navColor;
    ctx.fillRect(sx, sy, sw, NAV_H);

    ctx.globalAlpha = st.a * sa;
    textAt(navTitle, sx + sw / 2, sy + NAV_H / 2 + 6, 52, C.white);

    // 状态栏小点
    ctx.globalAlpha = st.a * sa * 0.9;
    for (let i = 0; i < 3; i++) {
        circle(sx + sw - 120 + i * 26, sy + 48, 6, 'rgba(255,255,255,0.75)');
    }

    // 内容
    if (time < 24) drawPosts(time, sx, sy, sw, sa, st.a);
    else if (time < 40) drawChat(time, sx, sy, sw, sh, sa, st.a);
    else drawGames(time, sx, sy, sw, sh, sa, st.a);

    ctx.restore(); // clip
    ctx.restore(); // phone
    ctx.globalAlpha = 1;
}

/* ---------- 第五幕：结尾号召 52-60s ---------- */
function drawOutro(time) {
    const t = time - 52;
    if (t < 0) return;

    const g = ctx.createRadialGradient(W / 2, H / 2 - 100, 60, W / 2, H / 2 - 100, 900);
    g.addColorStop(0, 'rgba(46,125,50,' + clamp(t / 2, 0, 1) * 0.3 + ')');
    g.addColorStop(1, 'rgba(15,23,19,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    if (t > 0.8) {
        const k = easeOut(clamp((t - 0.8) / 0.9, 0, 1));
        ctx.globalAlpha = k;
        textCenter('告别繁杂，回归纯粹', H / 2 - 230 + (1 - k) * 40, 64, C.primaryLight);
    }

    if (t > 2.1) {
        const k = easeOut(clamp((t - 2.1) / 0.9, 0, 1));
        ctx.globalAlpha = k;
        ctx.save();
        ctx.translate(W / 2, H / 2 - 120 + (1 - k) * 40);
        ctx.scale(lerp(0.9, 1, k), lerp(0.9, 1, k));
        textAt('立刻加入', 0, 0, 84, C.white);
        textAt('Seven戚社区', 0, 166, 104, C.primaryLight);
        ctx.restore();
    }

    if (t > 3.6) {
        const k = easeOut(clamp((t - 3.6) / 0.9, 0, 1));
        ctx.globalAlpha = k;
        ctx.fillStyle = C.primary;
        ctx.fillRect(W / 2 - 220 * k, H / 2 + 140, 440 * k, 4);
    }

    if (t > 3.8) {
        const k = easeOut(clamp((t - 3.8) / 0.9, 0, 1));
        ctx.globalAlpha = k;
        textCenter('sevenseven712.github.io/liuyanban', H / 2 + 255, 36, C.light, 'normal');
    }

    if (t > 5.4) {
        const k = easeOut(clamp((t - 5.4) / 0.8, 0, 1));
        ctx.globalAlpha = k * 0.8;
        textCenter('发帖 · 聊天 · 游戏 · 皮肤商店', H / 2 + 330, 30, C.muted, 'normal');
    }
    ctx.globalAlpha = 1;
}

/* ---------- 主渲染 ---------- */
function render(time) {
    ctx.globalAlpha = 1;
    ctx.fillStyle = bgColor(time);
    ctx.fillRect(0, 0, W, H);

    if (time < 6) drawIntro(time);
    if (time >= 6 && time < 53) drawPhone(time);
    if (time >= 52) drawOutro(time);
}

/* ---------- 录制 ---------- */
const startBtn = document.getElementById('startBtn');
const statusEl = document.getElementById('status');
let recording = false;

function pickMime() {
    const list = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
    for (const m of list) {
        if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m;
    }
    return '';
}

startBtn.onclick = () => {
    if (recording) return;

    const mime = pickMime();
    if (!mime) {
        statusEl.textContent = '当前浏览器不支持 WebM 录制，请使用 Chrome / Edge。';
        return;
    }

    recording = true;
    startBtn.disabled = true;
    statusEl.textContent = '正在录制中（约 60 秒），请勿切换标签页…';

    const stream = canvas.captureStream(FPS);
    const chunks = [];
    let rec;
    try {
        rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 6000000 });
    } catch (e) {
        statusEl.textContent = '录制器初始化失败：' + e.message;
        recording = false;
        startBtn.disabled = false;
        return;
    }

    rec.ondataavailable = e => { if (e.data && e.data.size > 0) chunks.push(e.data); };

    rec.onstop = () => {
        const blob = new Blob(chunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'sevenqi_promo_60s.webm';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 2000);

        recording = false;
        startBtn.disabled = false;
        statusEl.innerHTML = '✅ 录制完成，视频已下载（' + (blob.size / 1048576).toFixed(1) + ' MB）。<br>如需 MP4，可用格式工厂或 ffmpeg 转码。';
    };

    rec.start(100);
    const t0 = performance.now();

    function loop(now) {
        const elapsed = (now - t0) / 1000;
        if (elapsed >= DURATION) {
            render(DURATION);
            rec.stop();
            return;
        }
        render(elapsed);
        requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
};

// 首帧预览
render(0);
</script>
