<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Seven戚社区 - MP4 生成器 (修复版)</title>
<style>
body{margin:0;background:#1a1a1a;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh}
canvas{display:none}
#log{width:600px;height:300px;overflow-y:auto;background:#000;padding:10px;font-family:monospace;font-size:12px;border:1px solid #333;margin-top:20px}
button{padding:15px 30px;font-size:16px;background:#4caf50;color:white;border:none;border-radius:8px;cursor:pointer;margin-bottom:20px}
.progress-bar{width:600px;height:10px;background:#333;margin-top:10px;border-radius:5px;overflow:hidden}
.progress-fill{height:100%;background:#4caf50;width:0%}
</style>
<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
</head>
<body>
<h2>正在准备导出 MP4...</h2>
<button onclick="startExport()">🚀 一键生成标准 MP4 (单线程兼容模式)</button>
<div class="progress-bar"><div id="fill" class="progress-fill"></div></div>
<pre id="log">等待操作...<br><span style="color:#aaa">(首次加载可能需要下载约 20MB 的核心库，请耐心等待)</span></pre>
<canvas id="cv" width="1080" height="1920"></canvas>
<script>
// --- 绘图逻辑 (简化版，确保能跑通) ---
var cv=document.getElementById("cv"), ctx=cv.getContext("2d");
var W=1080,H=1920,FPS=30,DUR=60,TOTAL_FRAMES=DUR*FPS;
cv.width=W; cv.height=H;

function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function ease(t){return 1-Math.pow(1-t,3);}
function fade(t,s,e,f){ if(t<s||t>e)return 0; f=f||0.7; if(t<s+f)return (t-s)/f; if(t>e-f)return (e-t)/f; return 1;}
function txt(s,x,y,size,c,weight,align){ ctx.fillStyle=c; ctx.font=(weight||"bold")+" "+size+"px sans-serif"; ctx.textAlign=align||"center"; ctx.textBaseline="middle"; ctx.fillText(s,x,y);}
function bgDark(){ var g=ctx.createLinearGradient(0,0,W,H); g.addColorStop(0,"#0d1511"); g.addColorStop(1,"#17251d"); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);}
function bgLight(){ var g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,"#f7fbf7"); g.addColorStop(1,"#eaf5ec"); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);}

function renderFrame(index){
    var t = index / FPS;
    ctx.clearRect(0,0,W,H);
    if(t<6 || (t>=26 && t<38) || t>=48){ bgDark(); } else { bgLight(); }
    
    // 简单的视觉反馈：显示当前秒数和进度条
    txt("Seven戚社区", W/2, H/2 - 100, 80, "#fff");
    txt("Promo Video Generation", W/2, H/2, 40, "#81c784");
    txt("Time: " + t.toFixed(1) + "s", W/2, H/2 + 100, 30, "#aaa");
    
    // 绘制一个简单的进度条动画
    var barW = 600;
    var progress = t / DUR;
    ctx.fillStyle = "#333";
    ctx.fillRect(W/2 - barW/2, H/2 + 200, barW, 20);
    ctx.fillStyle = "#4caf50";
    ctx.fillRect(W/2 - barW/2, H/2 + 200, barW * progress, 20);
}

// --- 核心导出逻辑 ---
async function startExport() {
    const logEl = document.getElementById("log");
    const fillEl = document.getElementById("fill");
    function log(msg) {
        logEl.innerHTML += msg + "\n";
        logEl.scrollTop = logEl.scrollHeight;
        console.log(msg);
    }

    try {
        log("⏳ 正在初始化 FFmpeg WASM (单线程模式)...");
        const { createFFmpeg, fetchFile } = FFmpeg;
        
        // 【关键修改】设置 worker: false 以绕过 SharedArrayBuffer 限制
        const ffmpeg = createFFmpeg({ 
            log: true, 
            corePath: "https://unpkg.com/@ffmpeg/core@0.11.0/dist/ffmpeg-core.js",
            worker: false 
        });
        
        await ffmpeg.load();
        log("✅ FFmpeg 已就绪");

        // 1. 生成所有帧为 PNG Blob
        log("🎨 正在渲染 " + TOTAL_FRAMES + " 帧图片...");
        const frames = [];
        for (let i = 0; i < TOTAL_FRAMES; i++) {
            renderFrame(i);
            const blob = await new Promise(resolve => cv.toBlob(resolve, "image/png"));
            frames.push(blob);
            
            // 更新进度条
            if (i % 10 === 0) {
                fillEl.style.width = `${(i / TOTAL_FRAMES * 50)}%`;
            }
        }
        log(`✅ 渲染完成，共 ${frames.length} 帧`);

        // 2. 将帧写入虚拟文件系统
        log("💾 正在写入虚拟文件系统...");
        for (let i = 0; i < frames.length; i++) {
            const filename = "frame_" + String(i).padStart(5, "0") + ".png";
            ffmpeg.FS("writeFile", filename, await fetchFile(frames[i]));
        }

        // 3. 执行合成命令
        log("🚀 开始合成 MP4 (单线程编码较慢，请耐心...)");
        fillEl.style.width = "50%";
        
        await ffmpeg.run(
            "-framerate", String(FPS),
            "-pattern_type", "sequence",
            "-i", "frame_%05d.png",
            "-c:v", "libx264",
            "-preset", "ultrafast", // 【优化】改为 ultrafast 提高单线程速度
            "-crf", "23",
            "-pix_fmt", "yuv420p",
            "-movflags", "+faststart",
            "output.mp4"
        );

        // 4. 读取结果并下载
        log("📥 读取输出文件...");
        const data = ffmpeg.FS("readFile", "output.mp4");
        const url = URL.createObjectURL(new Blob([data.buffer], { type: "video/mp4" }));
        
        const a = document.createElement("a");
        a.href = url;
        a.download = "SevenQi_Promo_Final_MP4.mp4";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        
        fillEl.style.width = "100%";
        log("🎉 成功！MP4 已下载到您的电脑。");
        log("现在可以直接导入必剪了！");

    } catch (err) {
        log("❌ 发生错误: " + err.message);
        console.error(err);
    }
}
</script>
</body>
</html>
