// --- 音频合成逻辑 ---
let audioCtx = null;
let gainNode = null;

function initAudio() {
    if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AC();
        gainNode = audioCtx.createGain();
        gainNode.gain.value = 0.3; // 音量大小
        gainNode.connect(audioCtx.destination);
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
}

function playNote(freq, timeOffset, duration, type = 'square') {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const env = audioCtx.createGain();
    
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + timeOffset);
    
    env.gain.setValueAtTime(0, audioCtx.currentTime + timeOffset);
    env.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime + timeOffset + 0.05);
    env.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + timeOffset + duration);
    
    osc.connect(env);
    env.connect(gainNode);
    
    osc.start(audioCtx.currentTime + timeOffset);
    osc.stop(audioCtx.currentTime + timeOffset + duration + 0.1);
}

function generateBGM(startTime) {
    // 简单的 C大调 旋律片段循环
    // C4=261.63, D4=293.66, E4=329.63, F4=349.23, G4=392.00, A4=440.00, B4=493.88, C5=523.25
    const notes = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63, 261.63, 293.66]; 
    const bassNotes = [130.81, 164.81, 196.00, 130.81]; // C3, E3, G3
    
    let t = startTime;
    while (t < DUR) {
        // 主旋律 (每拍一个音，速度稍快)
        for(let i=0; i<notes.length; i++) {
            playNote(notes[i], t - performance.now()/1000, 0.2, 'triangle');
            t += 0.25;
        }
        
        // 低音鼓点效果 (简单模拟)
        playNote(bassNotes[Math.floor(Math.random()*bassNotes.length)], t - performance.now()/1000 - 0.5, 0.4, 'sine');
        
        // 休息一小会儿再重复
        t += 0.5;
    }
}

// --- 录制逻辑 ---
btn.onclick = async function() {
    if (btn.disabled) return;
    
    // 1. 初始化音频上下文 (必须在用户交互中调用)
    initAudio();
    
    // 2. 获取媒体流
    const videoStream = cv.captureStream(FPS);
    
    // 尝试获取音频轨道用于混合 (Web Audio API -> MediaStreamDestination)
    let dest = audioCtx.createMediaStreamDestination();
    gainNode.connect(dest);
    const audioTrack = dest.stream.getAudioTracks()[0];
    
    // 组合 Video + Audio Track
    const combinedStream = new MediaStream([videoStream.getVideoTracks()[0], audioTrack]);
    
    // 3. 检查支持的格式
    const mimeTypes = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
    let selectedMime = '';
    for (const m of mimeTypes) {
        if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) {
            selectedMime = m;
            break;
        }
    }
    
    if (!selectedMime) {
        alert("浏览器不支持 WebM 录制");
        return;
    }

    btn.disabled = true;
    statusEl.textContent = '正在录制 (含BGM)，请勿切换标签页...';

    const chunks = [];
    const recorder = new MediaRecorder(combinedStream, { 
        mimeType: selectedMime, 
        videoBitsPerSecond: 6000000 
    });

    recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
    
    recorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'sevenqi_promo_60s_with_bgm.webm';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 2000);
        
        btn.disabled = false;
        statusEl.innerHTML = '✅ 录制完成！已包含背景音乐。<br>文件大小: ' + (blob.size/1048576).toFixed(1) + ' MB';
    };

    recorder.start(100);
    
    // 启动 BGM 生成器
    const startT = performance.now();
    generateBGM(startT);

    // 动画循环
    function loop(now) {
        const elapsed = (now - startT) / 1000;
        if (elapsed >= DUR) {
            render(DUR);
            recorder.stop();
            return;
        }
        render(elapsed);
        requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
};
