<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Seven戚 · 留言板</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    <style>
        /* ===== 完整样式 ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        :root {
            --bg: #f5faf5;
            --bg-card: #ffffff;
            --bg-input: #eaf3ea;
            --border: #c8e0c8;
            --text: #1e3a2e;
            --text-muted: #5a7a6a;
            --text-light: #8aaa9a;
            --primary: #2e7d32;
            --primary-light: #4caf50;
            --primary-glow: rgba(76, 175, 80, 0.25);
            --primary-bg: #e8f5e9;
            --shadow: 0 8px 32px rgba(46, 125, 50, 0.12);
            --radius: 16px;
            --radius-sm: 10px;
            --font: "Space Grotesk", "PingFang SC", "Segoe UI", system-ui, sans-serif;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --danger: #e57373;
            --danger-bg: #ffebee;
            --official-blue: #2b6cff;
        }
        html, body { height: 100%; font-family: var(--font); background: var(--bg); color: var(--text); overflow: hidden; }
        #mainApp { display: flex; flex-direction: column; height: 100vh; height: 100dvh; background: var(--bg); }
        .app-header {
            flex-shrink: 0; padding: 12px 20px 8px 20px;
            background: var(--bg-card); border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            z-index: 50; backdrop-filter: blur(12px);
            background: rgba(255,255,255,0.92);
            min-height: 56px;
        }
        .app-header .brand {
            font-weight: 900; font-size: 1.1em; color: var(--text);
            display: flex; align-items: center; gap: 0.4em;
            cursor: default; user-select: none;
        }
        .app-header .brand span { color: var(--primary); }
        .app-header .brand small { font-weight: 400; font-size: 0.55em; color: var(--text-muted); margin-left: 0.3em; }
        .app-header .brand .author-badge {
            background: var(--primary); color: #fff; font-size: 0.55em;
            padding: 0 8px; border-radius: 99px; line-height: 18px;
            margin-left: 6px; display: none;
        }
        .app-header .brand .author-badge.active { display: inline-block; }
        .app-header .user-area {
            display: flex; align-items: center; gap: 10px;
            cursor: pointer; padding: 4px 10px 4px 6px;
            border-radius: 99px; transition: background 0.2s;
        }
        .app-header .user-area:hover { background: var(--primary-bg); }
        .app-header .avatar {
            width: 32px; height: 32px; border-radius: 50%;
            background: var(--primary); color: #fff;
            display: grid; place-items: center;
            font-weight: 700; font-size: 14px; flex-shrink: 0;
            background-size: cover;
            background-position: center;
        }
        .app-header .user-name {
            font-weight: 600; font-size: 0.85em;
            max-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .app-header .chevron { color: var(--text-muted); font-size: 0.7em; transition: transform 0.3s; }
        .app-header .chevron.open { transform: rotate(180deg); }
        .author-mode-hint {
            font-size: 0.6em; color: var(--primary); margin-left: 10px;
            font-weight: 700; display: none;
        }
        .author-mode-hint.active { display: inline; }

        .banned-banner {
            flex-shrink: 0;
            background: #ffebee;
            color: #c62828;
            padding: 6px 16px;
            font-size: 0.8em;
            font-weight: 600;
            text-align: center;
            border-bottom: 1px solid #ffcdd2;
            display: none;
        }
        .banned-banner.active { display: block; }

        .app-content { flex: 1; min-height: 0; display: flex; flex-direction: column; }
        .msg-list {
            flex: 1; overflow-y: auto;
            padding: 16px 20px 8px 20px;
            display: flex; flex-direction: column; gap: 12px;
            -webkit-overflow-scrolling: touch;
        }
        .fixed-input-area {
            flex-shrink: 0;
            padding: 10px 20px calc(10px + var(--safe-bottom));
            background: var(--bg);
            border-top: 1px solid var(--border);
            display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
        }
        .fixed-input-area .input-wrapper { flex: 1; display: flex; gap: 8px; min-width: 0; }
        .fixed-input-area input {
            flex: 1; padding: 10px 14px; border-radius: 99px;
            border: 2px solid var(--border); background: var(--bg-input);
            font-family: inherit; font-size: 0.85em; outline: none;
            transition: border-color 0.2s; color: var(--text); min-width: 0;
        }
        .fixed-input-area input:focus { border-color: var(--primary); }
        .fixed-input-area input:disabled { opacity: 0.5; }
        .fixed-input-area button {
            padding: 8px 20px; border-radius: 99px; border: none;
            background: var(--primary); color: #fff;
            font-weight: 700; font-size: 0.85em; cursor: pointer;
            transition: background 0.2s; font-family: inherit;
            white-space: nowrap; flex-shrink: 0;
            display: flex; align-items: center; gap: 6px;
            min-width: 80px; justify-content: center;
        }
        .fixed-input-area button:hover { background: var(--primary-light); }
        .fixed-input-area button:disabled { opacity: 0.5; pointer-events: none; }
        .fixed-input-area .author-options {
            display: none; align-items: center; gap: 12px;
            width: 100%; margin-top: 4px;
        }
        .fixed-input-area .author-options.active { display: flex; }
        .fixed-input-area .author-options label {
            font-size: 0.75em; font-weight: 600; color: var(--text-muted);
            display: flex; align-items: center; gap: 4px; cursor: pointer;
        }

        .app-tabs {
            flex-shrink: 0;
            display: flex; background: var(--bg-card);
            border-top: 1px solid var(--border);
            padding: 6px 0 calc(6px + var(--safe-bottom));
            z-index: 50; backdrop-filter: blur(12px);
            background: rgba(255,255,255,0.96);
        }
        .tab-btn {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; gap: 2px;
            background: none; border: none;
            font-family: var(--font); font-size: 0.6em; font-weight: 600;
            color: var(--text-muted); padding: 4px 0;
            cursor: pointer; transition: color 0.2s;
            position: relative; text-decoration: none;
        }
        .tab-btn .tab-icon { font-size: 1.6em; line-height: 1.2; }
        .tab-btn.active { color: var(--primary); }
        .tab-btn.active::after {
            content: ''; position: absolute; top: -1px;
            left: 30%; right: 30%; height: 3px;
            background: var(--primary); border-radius: 0 0 4px 4px;
        }
        .tab-btn .badge {
            position: absolute; top: 0; right: 20%;
            background: var(--primary); color: #fff;
            font-size: 0.6em; font-weight: 700;
            padding: 1px 6px; border-radius: 99px;
            min-width: 16px; text-align: center;
            transform: translateY(-4px);
        }

        .msg {
            display: flex; gap: 12px; padding: 14px;
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            transition: box-shadow 0.2s; flex-shrink: 0;
        }
        .msg:hover { box-shadow: var(--shadow); }
        .msg .avatar {
            width: 38px; height: 38px; border-radius: 50%;
            flex: none; display: grid; place-items: center;
            font-weight: 700; font-size: 16px; color: #0b0e14;
            background: var(--primary);
            background-size: cover;
            background-position: center;
        }
        .msg .body { flex: 1; min-width: 0; }
        .msg .meta {
            display: flex; align-items: center; gap: 8px;
            margin-bottom: 5px; flex-wrap: wrap;
        }
        .msg .name { font-size: 14px; font-weight: 600; }
        .msg .official-tag {
            background: #2b6cff; color: #fff; font-size: 10px;
            font-weight: 600; padding: 0 8px; border-radius: 999px; line-height: 18px;
        }
        .msg .time { font-size: 11.5px; color: var(--text-muted); }
        .msg .txt { font-size: 14px; line-height: 1.6; color: var(--text); word-break: break-word; }
        .msg .ip {
            margin-top: 6px; font-size: 11.5px; color: var(--text-muted);
            display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
        }
        .msg .ip .ip-text { display: flex; align-items: center; gap: 4px; }
        .msg .ip .ip-text::before { content: "📍"; opacity: .6; }
        .msg .ip .comment-btn {
            background: none; border: none; color: var(--text-muted);
            cursor: pointer; font-size: 13px;
            display: flex; align-items: center; gap: 4px;
            padding: 2px 6px; border-radius: 999px;
            transition: .2s; font-family: inherit;
        }
        .msg .ip .comment-btn:hover { background: rgba(0,0,0,0.05); color: var(--text); }
        .msg .ip .comment-btn .count { font-size: 12px; font-weight: 600; }
        .msg .ip .comment-btn.official { color: var(--official-blue); }
        .msg .del-btn {
            background: none; border: none; color: #e57373;
            cursor: pointer; font-size: 13px; opacity: 0.6;
            transition: .2s; padding: 0 4px; margin-left: auto;
            display: flex; align-items: center; gap: 4px;
        }
        .msg .del-btn:hover { opacity: 1; }
        .msg.pinned { border-color: var(--primary); box-shadow: 0 0 12px var(--primary-glow); }

        .icon-svg { width: 1.2em; height: 1.2em; fill: currentColor; flex-shrink: 0; }
        .btn-text { margin-left: 2px; }
        .empty-state { text-align: center; color: var(--text-muted); padding: 40px 20px; font-size: 0.85em; }
        .empty-state .big { font-size: 2.8em; margin-bottom: 8px; opacity: 0.5; }
        .loading-state { text-align: center; color: var(--text-muted); padding: 40px 20px; font-size: 0.9em; }
        .loading-state .spinner {
            display: inline-block; width: 30px; height: 30px;
            border: 3px solid var(--border); border-top-color: var(--primary);
            border-radius: 50%; animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error-state { text-align: center; color: #c62828; padding: 40px 20px; font-size: 0.9em; }
        .error-state .big { font-size: 2.8em; margin-bottom: 8px; opacity: 0.7; }
        #toast {
            position: fixed; bottom: 80px; left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--text); color: #fff;
            padding: 0.7em 1.6em; border-radius: 2em;
            font-weight: 600; font-size: 0.85em;
            opacity: 0; transition: all 0.4s ease;
            z-index: 9999 !important; pointer-events: none;
            white-space: nowrap; box-shadow: var(--shadow);
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        @media (max-width: 480px) {
            .app-header { padding: 10px 14px 6px 14px; min-height: 48px; }
            .app-header .brand { font-size: 0.95em; }
            .app-header .user-name { max-width: 60px; font-size: 0.75em; }
            .msg-list { padding: 12px 14px 4px 14px; }
            .fixed-input-area {
                padding: 8px 14px calc(8px + var(--safe-bottom));
                flex-direction: column; align-items: stretch;
            }
            .fixed-input-area .input-wrapper { flex: 1; }
            .fixed-input-area input { padding: 8px 12px; font-size: 0.8em; }
            .fixed-input-area button { padding: 6px 14px; font-size: 0.8em; }
            .fixed-input-area .author-options { justify-content: flex-start; gap: 10px; }
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

        .comment-overlay {
            position: fixed; inset: 0; z-index: 999;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
            display: none; align-items: center; justify-content: center;
            padding: 20px; animation: fadeIn 0.3s ease;
        }
        .comment-overlay.active { display: flex; }
        .comment-panel {
            background: var(--bg-card); border-radius: var(--radius);
            max-width: 560px; width: 100%; max-height: 80vh;
            padding: 24px; display: flex; flex-direction: column;
            border: 1px solid var(--border); box-shadow: var(--shadow);
        }
        .comment-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px;
        }
        .comment-header h4 { font-size: 1.1em; }
        .comment-close {
            background: none; border: none; font-size: 1.5em;
            cursor: pointer; color: var(--text-muted);
            transition: .2s; padding: 0 4px; display: flex; align-items: center;
        }
        .comment-close:hover { color: var(--text); }
        .comment-list {
            flex: 1; overflow-y: auto; margin-bottom: 12px;
            display: flex; flex-direction: column; gap: 8px;
            max-height: 50vh;
        }
        .comment-item {
            background: var(--bg-input); border-radius: var(--radius-sm);
            padding: 10px 12px; border-left: 3px solid var(--border);
        }
        .comment-item.official { border-left-color: #2b6cff; background: rgba(43,108,255,0.06); }
        .comment-item .meta {
            display: flex; align-items: center; gap: 8px;
            flex-wrap: wrap; font-size: 0.8em; color: var(--text-muted);
        }
        .comment-item .meta .name { font-weight: 700; color: var(--text); }
        .comment-item .meta .official-tag {
            background: #2b6cff; color: #fff;
            font-size: 0.55em; padding: 0 6px; border-radius: 99px; line-height: 16px;
        }
        .comment-item .txt { font-size: 0.9em; line-height: 1.5; margin-top: 4px; color: var(--text); }
        .comment-item .time { font-size: 0.7em; color: var(--text-light); }
        .comment-item .del-comment-btn {
            background: none; border: none; color: #e57373;
            cursor: pointer; font-size: 0.75em;
            transition: .2s; margin-left: auto;
            padding: 0 4px;
        }
        .comment-item .del-comment-btn:hover { opacity: 1; }
        .comment-input-area {
            display: flex; gap: 8px; border-top: 1px solid var(--border);
            padding-top: 12px;
        }
        .comment-input-area input {
            flex: 1; padding: 8px 14px; border-radius: 99px;
            border: 2px solid var(--border); background: var(--bg-input);
            font-family: inherit; font-size: 0.85em; outline: none;
            transition: border-color 0.2s; color: var(--text);
        }
        .comment-input-area input:focus { border-color: var(--primary); }
        .comment-input-area input:disabled { opacity: 0.5; }
        .comment-input-area button {
            padding: 8px 18px; border-radius: 99px; border: none;
            background: var(--primary); color: #fff;
            font-weight: 700; font-size: 0.85em; cursor: pointer;
            transition: background 0.2s; font-family: inherit;
            white-space: nowrap; display: flex; align-items: center; gap: 6px;
        }
        .comment-input-area button:hover { background: var(--primary-light); }
        .comment-input-area button:disabled { opacity: 0.5; pointer-events: none; }
        .comment-empty { text-align: center; color: var(--text-muted); padding: 20px 0; font-size: 0.85em; }

        .profile-overlay {
            position: fixed; inset: 0; z-index: 200;
            display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.35); backdrop-filter: blur(6px);
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .profile-overlay.active { opacity: 1; pointer-events: auto; }
        .profile-card {
            background: var(--bg-card); border-radius: var(--radius);
            padding: 2em 2.2em; max-width: 90vw; width: 22em;
            box-shadow: var(--shadow); border: 1px solid var(--border);
            transform: scale(0.9) translateY(20px);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .profile-overlay.active .profile-card { transform: scale(1) translateY(0); }
        .profile-card .profile-avatar {
            width: 64px; height: 64px; border-radius: 50%;
            background: var(--primary); color: #fff;
            display: grid; place-items: center;
            font-size: 28px; font-weight: 700; margin: 0 auto 12px;
            object-fit: cover;
        }
        .profile-card .avatar-upload {
            text-align: center;
            margin-top: 4px;
        }
        .profile-card .avatar-upload label {
            font-size: 0.7em;
            color: var(--primary);
            cursor: pointer;
            text-decoration: underline;
        }
        .profile-card .avatar-upload input[type="file"] {
            display: none;
        }
        .profile-card h3 { text-align: center; font-size: 1.1em; margin-bottom: 4px; }
        .profile-card .sub { text-align: center; color: var(--text-muted); font-size: 0.75em; margin-bottom: 16px; }
        .profile-card .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
        .profile-card .field label {
            font-size: 0.7em; font-weight: 600; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 0.05em;
        }
        .profile-card .field input {
            padding: 8px 12px; border-radius: var(--radius-sm);
            border: 2px solid var(--border); background: var(--bg-input);
            font-family: inherit; font-size: 0.9em; outline: none;
            transition: border-color 0.2s; color: var(--text);
        }
        .profile-card .field input:focus { border-color: var(--primary); }
        .profile-card .actions {
            display: flex; gap: 8px; margin-top: 8px;
        }
        .profile-card .actions button {
            flex: 1; padding: 8px; border-radius: var(--radius-sm);
            border: none; font-weight: 700; font-size: 0.8em;
            cursor: pointer; transition: all 0.2s; font-family: inherit;
            display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .profile-card .actions .save-btn { background: var(--primary); color: #fff; }
        .profile-card .actions .save-btn:hover { background: var(--primary-light); }
        .profile-card .actions .logout-btn { background: #ffebee; color: #c62828; }
        .profile-card .actions .logout-btn:hover { background: #ffcdd2; }
        .profile-card .actions .close-btn { background: var(--bg-input); color: var(--text-muted); }
        .profile-card .actions .close-btn:hover { background: var(--border); }

        /* 自定义弹窗（复用） */
        .custom-modal {
            position: fixed; inset: 0; z-index: 2000;
            background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px);
            display: none; align-items: center; justify-content: center;
            padding: 20px;
        }
        .custom-modal.active { display: flex; }
        .custom-modal .modal-box {
            background: var(--bg-card); border-radius: var(--radius);
            max-width: 420px; width: 100%; padding: 24px;
            box-shadow: var(--shadow); border: 1px solid var(--border);
        }
        .custom-modal .modal-box .modal-title { font-size: 1.2em; font-weight: 700; margin-bottom: 8px; color: var(--text); }
        .custom-modal .modal-box .modal-body { font-size: 0.95em; color: var(--text-muted); line-height: 1.6; margin-bottom: 16px; }
        .custom-modal .modal-box .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
        .custom-modal .modal-box .modal-actions button { padding: 6px 18px; border-radius: var(--radius-sm); border: none; font-weight: 600; font-size: 0.85em; cursor: pointer; transition: background 0.2s; font-family: inherit; }
        .custom-modal .modal-box .modal-actions .btn-danger { background: var(--danger); color: #fff; }
        .custom-modal .modal-box .modal-actions .btn-danger:hover { background: #c62828; }
        .custom-modal .modal-box .modal-actions .btn-secondary { background: var(--bg-input); color: var(--text-muted); }
        .custom-modal .modal-box .modal-actions .btn-secondary:hover { background: var(--border); }
        .custom-modal .modal-box .modal-actions .btn-primary { background: var(--primary); color: #fff; }
        .custom-modal .modal-box .modal-actions .btn-primary:hover { background: var(--primary-light); }
    </style>
</head>
<body>
    <div id="mainApp">
        <header class="app-header">
            <div class="brand" id="brandArea">
                🌿 <span id="brandName">Seven</span>戚
                <small>留言板</small>
                <span class="author-badge" id="authorBadge">👑 作者模式</span>
                <span class="author-mode-hint" id="authorModeHint">(作者模式已激活)</span>
            </div>
            <div class="user-area" onclick="openProfile()">
                <div class="avatar" id="headerAvatar">S</div>
                <span class="user-name" id="headerName">用户</span>
                <span class="chevron" id="chevronIcon">▼</span>
            </div>
        </header>

        <div class="banned-banner" id="bannedBanner">
            ⚠️ 账号已被封禁，无法发布留言或评论。解封时间：<span id="bannedUntilDisplay"></span>
        </div>

        <div class="app-content">
            <div class="msg-list" id="messageList"></div>
            <div class="fixed-input-area" id="messageInputArea">
                <div class="input-wrapper">
                    <input type="text" id="msgInput" placeholder="写留言…" maxlength="200" />
                    <button id="sendMsgBtn" onclick="sendMessage()">
                        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
                        <span class="btn-text">发送</span>
                    </button>
                </div>
                <div class="author-options" id="msgAuthorOptions">
                    <label><input type="checkbox" id="msgPinnedCheck"> 📌 置顶</label>
                    <span style="font-size:0.65em;color:var(--text-muted);">(仅作者)</span>
                </div>
            </div>
        </div>

        <div class="app-tabs">
            <a href="/liuyanban/posts.html" class="tab-btn">
                <span class="tab-icon">📰</span> 帖子
            </a>
            <a href="/liuyanban/messages.html" class="tab-btn active">
                <span class="tab-icon">💌</span> 留言板
            </a>
            <a href="/liuyanban/chats.html" class="tab-btn">
                <span class="tab-icon">💬</span> 聊天群
            </a>
        </div>
    </div>

    <!-- 评论弹窗 -->
    <div class="comment-overlay" id="commentOverlay">
        <div class="comment-panel">
            <div class="comment-header">
                <h4>💬 评论</h4>
                <button class="comment-close" id="closeComment">
                    <svg class="icon-svg" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                </button>
            </div>
            <div class="comment-list" id="commentList"></div>
            <div class="comment-input-area">
                <input type="text" id="commentInput" placeholder="写评论…" maxlength="200" />
                <button id="sendCommentBtn" onclick="sendComment()">
                    <svg class="icon-svg" viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
                    <span class="btn-text">发送</span>
                </button>
            </div>
        </div>
    </div>

    <!-- 个人资料弹窗（含头像上传） -->
    <div class="profile-overlay" id="profileOverlay" onclick="closeProfileOutside(event)">
        <div class="profile-card" onclick="event.stopPropagation()">

                <label for="avatarFileInput">📷 更换头像</label>
                <input type="file" id="avatarFileInput" accept="image/*" />

    <!-- 自定义确认弹窗 -->
    <div class="custom-modal" id="confirmModal">
        <div class="modal-box">
            <div class="modal-title" id="confirmTitle">确认</div>

            <div class="modal-actions">
                <button class="btn-secondary" id="confirmCancel">取消</button>
                <button class="btn-danger" id="confirmOk">确定</button>
            </div>
        </div>
    </div>

    <div id="toast"></div>

    <script>
        // ============================================================
        // Supabase 配置
        // ============================================================
        var SUPABASE_URL = "https://ulvhuqtpdafspbdvkogs.supabase.co";
        var SUPABASE_ANON_KEY = "sb_publishable_Ew8kKf2z05kmYIK2XNu00g_dzAirtIM";
        window.sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ============================================================
        // 工具函数
        // ============================================================
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(window.toastTimer);
            window.toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function escapeHtml(s) {
            if (!s) return '';
            return String(s).replace(/[&<>"']/g, function(c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' } [c];
            });
        }

        var COLORS = ["#6ee7b7", "#fbbf24", "#f87171", "#a78bfa", "#f472b6", "#38bdf8"];

        function pickColor(hex) {
            if (hex && /^#[0-9a-f]{6}$/i.test(hex) && hex.toLowerCase() !== "#000000") return hex;
            return COLORS[Math.floor(Math.random() * COLORS.length)];
        }
        var avatarCache = {};

        function avatarFor(name, color) {
            var key = name + "|" + color;
            if (!avatarCache[key]) avatarCache[key] = pickColor(color);
            return avatarCache[key];
        }

        // ★★★ 头像上传函数 ★★★
        async function uploadAvatar(file, userId) {
            const fileExt = file.name.split('.').pop();
            const fileName = `avatars/${userId}/profile.${fileExt}`;
            const { data, error } = await window.sb.storage
                .from('avatars')
                .upload(fileName, file, { upsert: true });
            if (error) throw error;
            const { data: urlData } = window.sb.storage
                .from('avatars')
                .getPublicUrl(fileName);
            return urlData.publicUrl;
        }

        // ============================================================
        // 作者模式
        // ============================================================
        var isAuthorMode = false;
        var AUTHOR_PASSWORD = "7592";

        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        var brandClickCount = 0;
        var brandClickTimer = null;
        document.getElementById('brandArea').addEventListener('click', async function(e) {
            if (e.target.closest('.author-badge') || e.target.closest('.author-mode-hint')) return;
            brandClickCount++;
            clearTimeout(brandClickTimer);
            brandClickTimer = setTimeout(() => { brandClickCount = 0; }, 800);
            if (brandClickCount === 3) {
                brandClickCount = 0;
                if (!isAuthorMode) {
                    var pwd = prompt('请输入作者密码：');
                    if (pwd === null) return;
                    var hash = await sha256(pwd);
                    var correctHash = await sha256(AUTHOR_PASSWORD);
                    if (hash === correctHash) {
                        isAuthorMode = true;
                        document.getElementById('authorBadge').classList.add('active');
                        document.getElementById('authorModeHint').classList.add('active');
                        document.getElementById('msgAuthorOptions').classList.add('active');
                        showToast('👑 作者模式已激活');
                        renderMessages();
                    } else {
                        showToast('❌ 密码错误');
                    }
                } else {
                    isAuthorMode = false;
                    document.getElementById('authorBadge').classList.remove('active');
                    document.getElementById('authorModeHint').classList.remove('active');
                    document.getElementById('msgAuthorOptions').classList.remove('active');
                    showToast('已退出作者模式');
                    renderMessages();
                }
            }
        });

        // ============================================================
        // 会话管理
        // ============================================================
        var currentUser = null;
        var isAdmin = false;

        function getSessionUser() {
            const stored = localStorage.getItem('sq_user_session');
            if (stored) {
                try { return JSON.parse(stored); } catch { return null; }
            }
            return null;
        }

        function setSessionUser(user) {
            localStorage.setItem('sq_user_session', JSON.stringify(user));
        }

        function clearSession() {
            localStorage.removeItem('sq_user_session');
        }

        // ============================================================
        // 封禁检查
        // ============================================================
        function isUserBanned() {
            if (!currentUser) return false;
            const bannedUntil = currentUser.banned_until ? new Date(currentUser.banned_until) : null;
            return bannedUntil && bannedUntil > new Date();
        }

        function getBannedUntil() {
            if (!currentUser || !currentUser.banned_until) return null;
            return new Date(currentUser.banned_until);
        }

        function updateBannedBanner() {
            const banner = document.getElementById('bannedBanner');
            const display = document.getElementById('bannedUntilDisplay');
            if (isUserBanned()) {
                banner.classList.add('active');
                const until = getBannedUntil();
                display.textContent = until ? until.toLocaleString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '未知';
                document.getElementById('sendMsgBtn').disabled = true;
                document.getElementById('msgInput').disabled = true;
                document.getElementById('msgInput').placeholder = '账号已被封禁，无法留言';
            } else {
                banner.classList.remove('active');
                document.getElementById('sendMsgBtn').disabled = false;
                document.getElementById('msgInput').disabled = false;
                document.getElementById('msgInput').placeholder = '写留言…';
            }
        }

        // ============================================================
        // 留言板数据操作
        // ============================================================
        var messages = [];

        async function fetchMessages() {
            const { data, error } = await window.sb
                .from('messages')
                .select('*')
                .order('created_at', { ascending: false });
            if (error) throw error;
            return data || [];
        }

        async function addMessage(name, text, color, ip, isOfficial, isPinned, parentId) {
            const insertObj = {
                name: name,
                text: text,
                color: color,
                ip: ip,
                is_official: isOfficial,
                is_pinned: isPinned || false
            };
            if (parentId && parentId.trim() !== '') {
                insertObj.parent_id = parentId.trim();
            }
            const { data, error } = await window.sb
                .from('messages')
                .insert([insertObj]);
            if (error) throw error;
            return data;
        }

        async function deleteMessage(id) {
            const { data: children } = await window.sb
                .from('messages')
                .select('id')
                .eq('parent_id', id);
            if (children && children.length) {
                const childIds = children.map(c => c.id);
                const { error: delChild } = await window.sb
                    .from('messages')
                    .delete()
                    .in('id', childIds);
                if (delChild) throw delChild;
            }
            const { error } = await window.sb
                .from('messages')
                .delete()
                .eq('id', id);
            if (error) throw error;
        }

        async function deleteCommentOnly(id) {
            const { error } = await window.sb
                .from('messages')
                .delete()
                .eq('id', id);
            if (error) throw error;
        }

        // ============================================================
        // 获取 IP
        // ============================================================
        async function fetchIP() {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 5000);
            try {
                var res = await fetch("https://api.ipify.org?format=json", { signal: controller.signal });
                var data = await res.json();
                return data.ip || "0.0.0.0";
            } catch (e) { return "0.0.0.0"; } finally { clearTimeout(timeoutId); }
        }

        // ============================================================
        // 渲染留言板（实时计算评论数）
        // ============================================================
        var messagesLoading = false;
        var messagesError = null;

        async function renderMessages() {
            const container = document.getElementById('messageList');
            if (messagesLoading) {
                container.innerHTML = `
                    <div class="loading-state">
                        <div class="spinner"></div>
                        <div>正在加载留言...</div>
                    </div>
                `;
                return;
            }
            if (messagesError) {
                container.innerHTML = `
                    <div class="error-state">
                        <div class="big">⚠️</div>
                        <div>加载失败，请联系站主修复</div>
                        <div style="font-size:0.75em;margin-top:8px;color:var(--text-muted);">错误信息：${escapeHtml(messagesError)}</div>
                    </div>
                `;
                return;
            }
            if (!messages || messages.length === 0) {
                container.innerHTML = `<div class="empty-state"><div class="big">💌</div>暂无留言，快来写第一条吧！</div>`;
                return;
            }

            const mainMessages = messages.filter(m => !m.parent_id);
            mainMessages.sort((a, b) => {
                if (a.is_pinned && !b.is_pinned) return -1;
                if (!a.is_pinned && b.is_pinned) return 1;
                return new Date(b.created_at) - new Date(a.created_at);
            });

            const commentInfo = {};
            mainMessages.forEach(m => {
                const related = messages.filter(c => String(c.parent_id) === String(m.id));
                commentInfo[m.id] = {
                    count: related.length,
                    hasOfficial: related.some(c => c.is_official === true)
                };
            });

            let html = '';
            for (const m of mainMessages) {
                const isOfficial = m.is_official || m.name === 'Seven戚';
                const timeStr = new Date(m.created_at).toLocaleString('zh-CN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                const color = m.color || pickColor(null);
                const av = avatarFor(m.name, color);
                const officialTag = isOfficial ? `<span class="official-tag">官方</span>` : '';
                const pinnedClass = m.is_pinned ? 'pinned' : '';
                const info = commentInfo[m.id] || { count: 0, hasOfficial: false };
                const commentCount = info.count;
                const hasOfficialComment = info.hasOfficial;
                const commentIconClass = hasOfficialComment ? 'comment-btn official' : 'comment-btn';

                let delBtn = '';
                if (isAdmin || isAuthorMode) {
                    delBtn = `<button class="del-btn" onclick="deleteMessageById('${m.id}')">
                        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        删除
                    </button>`;
                }

                const commentBtn = `
                    <button class="${commentIconClass}" onclick="openCommentPanel('${m.id}')">
                        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
                        <span class="count">${commentCount}</span>
                    </button>
                `;

                html += `
                    <div class="msg ${pinnedClass}" data-id="${m.id}">
                        <div class="avatar" style="background:${av}">${escapeHtml(m.name.slice(0,1))}</div>
                        <div class="body">
                            <div class="meta">
                                <span class="name">${escapeHtml(m.name)}</span>
                                ${officialTag}
                                <span class="time">${timeStr}</span>
                                ${m.is_pinned ? '📌' : ''}
                            </div>
                            <div class="txt">${escapeHtml(m.text)}</div>
                            <div class="ip">
                                <span class="ip-text">${escapeHtml(m.ip || '未知')}</span>
                                ${commentBtn}
                                ${delBtn}
                            </div>
                        </div>
                    </div>
                `;
            }
            container.innerHTML = html;
            container.scrollTop = 0;
        }

        // ============================================================
        // 删除留言（主+子）
        // ============================================================
        async function deleteMessageById(id) {
            if (!isAdmin && !isAuthorMode) { showToast('权限不足'); return; }
            showConfirm('删除留言', '确定要删除此留言及其所有评论吗？', async () => {
                try {
                    await deleteMessage(id);
                    messages = messages.filter(m => m.id !== id && m.parent_id !== id);
                    await renderMessages();
                    if (currentCommentParentId === id) closeCommentPanel();
                    showToast('🗑️ 留言已删除（含评论）');
                } catch (err) {
                    showToast('删除失败：' + err.message);
                }
            });
        }

        // ============================================================
        // 删除评论（仅单条）
        // ============================================================
        async function deleteCommentOnlyById(id) {
            if (!isAdmin && !isAuthorMode) { showToast('权限不足'); return; }
            showConfirm('删除评论', '确定要删除此评论吗？', async () => {
                try {
                    await deleteCommentOnly(id);
                    messages = messages.filter(m => m.id !== id);
                    await renderMessages();
                    if (currentCommentParentId) renderComments(currentCommentParentId);
                    showToast('🗑️ 评论已删除');
                } catch (err) {
                    showToast('删除失败：' + err.message);
                }
            });
        }

        // ============================================================
        // 发送留言
        // ============================================================
        function sendMessage() {
            if (!currentUser) { showToast('请先登录'); return; }
            if (isUserBanned()) { showToast('账号已被封禁，无法留言'); return; }
            const input = document.getElementById('msgInput');
            const content = input.value.trim();
            if (!content) { showToast('请输入内容'); return; }
            const btn = document.getElementById('sendMsgBtn');
            btn.disabled = true;
            const originalHTML = btn.innerHTML;
            btn.innerHTML = `<span class="spinner" style="display:inline-block;width:1em;height:1em;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite;margin-right:4px;"></span> 发送中...`;

            const color = pickColor(null);
            const isOfficial = isAuthorMode || currentUser.nickname === 'Seven戚';
            const isPinned = isAuthorMode && document.getElementById('msgPinnedCheck').checked;

            (async function() {
                try {
                    const ip = await fetchIP();
                    const { data } = await addMessage(currentUser.nickname, content, color, ip, isOfficial, isPinned, null);
                    if (data && data.length) {
                        const newMsg = {
                            id: data[0].id,
                            name: currentUser.nickname,
                            text: content,
                            color: color,
                            ip: ip,
                            created_at: new Date().toISOString(),
                            is_official: isOfficial,
                            is_pinned: isPinned,
                            parent_id: null
                        };
                        messages.push(newMsg);
                        await renderMessages();
                    } else {
                        await loadAllData();
                    }
                    input.value = '';
                    if (isPinned) document.getElementById('msgPinnedCheck').checked = false;
                    showToast('💌 留言已发送');
                } catch (err) {
                    showToast('发送失败：' + err.message);
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = originalHTML;
                }
            })();
        }

        // ============================================================
        // 评论功能（实时更新）
        // ============================================================
        var currentCommentParentId = null;
        var commentList = document.getElementById('commentList');
        var commentInput = document.getElementById('commentInput');
        var sendCommentBtn = document.getElementById('sendCommentBtn');
        var closeCommentBtn = document.getElementById('closeComment');
        var commentOverlay = document.getElementById('commentOverlay');

        function openCommentPanel(parentId) {
            currentCommentParentId = parentId;
            commentOverlay.classList.add('active');
            renderComments(parentId);
            commentInput.value = '';
            if (isUserBanned()) {
                commentInput.disabled = true;
                sendCommentBtn.disabled = true;
                commentInput.placeholder = '账号已被封禁，无法评论';
            } else {
                commentInput.disabled = false;
                sendCommentBtn.disabled = false;
                commentInput.placeholder = '写评论…';
            }
            commentInput.focus();
        }

        function closeCommentPanel() {
            commentOverlay.classList.remove('active');
            currentCommentParentId = null;
        }
        closeCommentBtn.addEventListener('click', closeCommentPanel);
        commentOverlay.addEventListener('click', function(e) {
            if (e.target === commentOverlay) closeCommentPanel();
        });

        function renderComments(parentId) {
            const comments = messages.filter(m => m.parent_id === parentId).sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
            if (!comments.length) {
                commentList.innerHTML = '<div class="comment-empty">还没有评论，来抢沙发吧</div>';
                return;
            }
            let html = '';
            comments.forEach(c => {
                const isOfficial = c.is_official || c.name === 'Seven戚';
                const timeStr = new Date(c.created_at).toLocaleString('zh-CN', { hour: '2-digit', minute: '2-digit' });
                const officialTag = isOfficial ? `<span class="official-tag">官方</span>` : '';
                let delBtn = '';
                if (isAdmin || isAuthorMode) {
                    delBtn = `<button class="del-comment-btn" onclick="deleteCommentOnlyById('${c.id}')">🗑️</button>`;
                }
                html += `
                    <div class="comment-item ${isOfficial ? 'official' : ''}">
                        <div class="meta">
                            <span class="name">${escapeHtml(c.name)}</span>
                            ${officialTag}
                            <span class="time">${timeStr}</span>
                            ${delBtn}
                        </div>
                        <div class="txt">${escapeHtml(c.text)}</div>
                    </div>
                `;
            });
            commentList.innerHTML = html;
            commentList.scrollTop = commentList.scrollHeight;
        }

        function sendComment() {
            if (!currentUser) { showToast('请先登录'); return; }
            if (!currentCommentParentId) { showToast('请先选择要评论的留言'); return; }
            if (isUserBanned()) { showToast('账号已被封禁，无法评论'); return; }
            const text = commentInput.value.trim();
            if (!text) { showToast('请输入评论内容'); return; }

            const btn = sendCommentBtn;
            btn.disabled = true;
            const originalHTML = btn.innerHTML;
            btn.innerHTML = `<span class="spinner" style="display:inline-block;width:1em;height:1em;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite;margin-right:4px;"></span> 发送中...`;

            const color = pickColor(null);
            (async function() {
                try {
                    const ip = await fetchIP();
                    const isOfficial = isAuthorMode || currentUser.nickname === 'Seven戚';
                    const { data } = await addMessage(
                        currentUser.nickname,
                        text,
                        color,
                        ip,
                        isOfficial,
                        false,
                        currentCommentParentId
                    );
                    if (data && data.length) {
                        const newComment = {
                            id: data[0].id,
                            name: currentUser.nickname,
                            text: text,
                            color: color,
                            ip: ip,
                            created_at: new Date().toISOString(),
                            is_official: isOfficial,
                            is_pinned: false,
                            parent_id: currentCommentParentId
                        };
                        messages.push(newComment);
                        await renderMessages();
                        renderComments(currentCommentParentId);
                    } else {
                        await loadAllData();
                    }
                    commentInput.value = '';
                    showToast('💬 评论已发送');
                } catch (err) {
                    showToast('评论失败：' + err.message);
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = originalHTML;
                }
            })();
        }

        // ============================================================
        // 自定义确认弹窗
        // ============================================================
        function showConfirm(title, body, onOk) {
            const modal = document.getElementById('confirmModal');
            document.getElementById('confirmTitle').textContent = title;
            document.getElementById('confirmBody').textContent = body;
            modal.classList.add('active');
            const cancelBtn = document.getElementById('confirmCancel');
            const okBtn = document.getElementById('confirmOk');
            const cleanup = () => {
                modal.classList.remove('active');
                cancelBtn.removeEventListener('click', cancelHandler);
                okBtn.removeEventListener('click', okHandler);
            };
            const cancelHandler = () => { cleanup(); };
            const okHandler = () => { if (onOk) onOk(); cleanup(); };
            cancelBtn.addEventListener('click', cancelHandler);
            okBtn.addEventListener('click', okHandler);
            modal.addEventListener('click', function bgClick(e) {
                if (e.target === modal) { cleanup(); modal.removeEventListener('click', bgClick); }
            });
        }

        // ============================================================
        // 加载数据
        // ============================================================
        async function loadAllData() {
            messagesLoading = true;
            messagesError = null;
            await renderMessages();
            try {
                const data = await fetchMessages();
                messages = data;
                if (messages.length === 0) {
                    try {
                        await addMessage('系统', '欢迎来到留言板！快来留下你的足迹吧 🌟', '#6ee7b7', '0.0.0.0', false, false, null);
                        const newData = await fetchMessages();
                        messages = newData;
                    } catch (insertErr) { console.warn('插入欢迎留言失败:', insertErr); }
                }
            } catch (err) {
                messagesError = err.message || '加载失败';
            } finally {
                messagesLoading = false;
                await renderMessages();
            }
        }

        // ============================================================
        // 个人资料（含头像上传 + 禁止普通用户设置 Seven戚）
        // ============================================================
        function openProfile() {
            if (!currentUser) return;
            document.getElementById('profileNameInput').value = currentUser.nickname;
            document.getElementById('profileAvatar').src = currentUser.avatar_url || `data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="%232e7d32" rx="50"/><text x="50" y="58" font-size="40" text-anchor="middle" fill="white" font-family="sans-serif">${currentUser.nickname.charAt(0).toUpperCase()}</text></svg>`;
            document.getElementById('profileNameDisplay').textContent = currentUser.nickname;
            document.getElementById('profileOverlay').classList.add('active');
            document.getElementById('chevronIcon').classList.add('open');
        }

        function closeProfile() {
            document.getElementById('profileOverlay').classList.remove('active');
            document.getElementById('chevronIcon').classList.remove('open');
        }

        function closeProfileOutside(e) {
            if (e.target === e.currentTarget) closeProfile();
        }

        // ★★★ 头像上传事件 ★★★
        document.getElementById('avatarFileInput').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;
            try {
                showToast('⏳ 正在上传头像...');
                const avatarUrl = await uploadAvatar(file, currentUser.id);
                await window.sb
                    .from('users')
                    .update({ avatar_url: avatarUrl })
                    .eq('id', currentUser.id);
                currentUser.avatar_url = avatarUrl;
                setSessionUser(currentUser);
                updateHeader();
                document.getElementById('profileAvatar').src = avatarUrl;
                showToast('✅ 头像已更新');
                await loadAllData();
            } catch (err) {
                showToast('上传失败：' + err.message);
                console.error(err);
            }
            this.value = '';
        });

        // ★★★ 保存昵称时禁止普通用户设置 Seven戚 ★★★
        function saveProfile() {
            const newName = document.getElementById('profileNameInput').value.trim();
            if (!newName) { showToast('请输入昵称'); return; }
            if (newName.toLowerCase() === 'seven戚' && currentUser.phone !== '17355394710') {
                showToast('该昵称不可用，请使用其他名称');
                return;
            }
            window.sb
                .from('users')
                .update({ nickname: newName })
                .eq('id', currentUser.id)
                .then(() => {
                    currentUser.nickname = newName;
                    setSessionUser(currentUser);
                    updateHeader();
                    loadAllData();
                    closeProfile();
                    showToast('✅ 昵称已更新');
                })
                .catch(err => showToast('更新失败：' + err.message));
        }

        function updateHeader() {
            if (currentUser) {
                const initial = currentUser.nickname.charAt(0).toUpperCase() || 'U';
                document.getElementById('headerName').textContent = currentUser.nickname;
                const avatarEl = document.getElementById('headerAvatar');
                if (currentUser.avatar_url) {
                    avatarEl.style.backgroundImage = `url(${currentUser.avatar_url})`;
                    avatarEl.style.backgroundSize = 'cover';
                    avatarEl.textContent = '';
                } else {
                    avatarEl.style.backgroundImage = '';
                    avatarEl.textContent = initial;
                }
                const profileAvatar = document.getElementById('profileAvatar');
                profileAvatar.src = currentUser.avatar_url || `data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="%232e7d32" rx="50"/><text x="50" y="58" font-size="40" text-anchor="middle" fill="white" font-family="sans-serif">${initial}</text></svg>`;
                document.getElementById('profileNameDisplay').textContent = currentUser.nickname;
                document.getElementById('profileNameInput').value = currentUser.nickname;
            }
        }

        function logout() {
            showConfirm('退出登录', '确定要退出登录吗？', () => {
                closeProfile();
                clearSession();
                showToast('👋 已退出登录');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 500);
            });
        }

        // ============================================================
        // 初始化（含跨页面同步）
        // ============================================================
        (function init() {
            const session = getSessionUser();
            if (!session || !session.id) {
                window.location.href = 'index.html';
                return;
            }
            currentUser = session;
            isAdmin = (currentUser.phone === '17355394710');
            updateHeader();
            updateBannedBanner();
            loadAllData();

            window.sb.channel('public')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, () => loadAllData())
                .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'messages' }, () => loadAllData())
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'messages' }, () => loadAllData())
                .subscribe();

            // ★★★ 跨页面同步 ★★★
            function syncUser() {
                const session = getSessionUser();
                if (session && session.id) {
                    if (!currentUser || currentUser.id !== session.id ||
                        currentUser.avatar_url !== session.avatar_url ||
                        currentUser.nickname !== session.nickname) {
                        currentUser = session;
                        isAdmin = (currentUser.phone === '17355394710');
                        updateHeader();
                        updateBannedBanner();
                        loadAllData();
                    }
                }
            }
            window.addEventListener('focus', syncUser);
            document.addEventListener('visibilitychange', function() {
                if (!document.hidden) syncUser();
            });
        })();

        document.addEventListener('gesturestart', function(e) { e.preventDefault(); });
    </script>
</body>
</html>
