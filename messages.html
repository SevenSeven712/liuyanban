<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#2e7d32" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Seven戚 · 留言板</title>
    <script src="./vendor/supabase.js"></script>
    <script>window.supabase||document.write('<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"><\/script>');</script>
    <script src="./common.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        :root {
            --bg: #f5faf5; --bg-card: #ffffff; --bg-input: #eaf3ea; --border: #c8e0c8;
            --text: #1e3a2e; --text-muted: #5a7a6a; --text-light: #8aaa9a;
            --primary: #2e7d32; --primary-light: #4caf50; --primary-bg: #e8f5e9;
            --shadow: 0 8px 32px rgba(46,125,50,0.12); --radius: 16px; --radius-sm: 10px;
            --font: "Space Grotesk", "PingFang SC", "Segoe UI", system-ui, sans-serif;
            --danger: #e57373;
        }
        html, body { height: 100%; font-family: var(--font); background: var(--bg); color: var(--text); overflow: hidden; }
        #mainApp { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
        .app-header { flex-shrink: 0; padding: 12px 20px; background: rgba(255,255,255,0.92); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; z-index: 50; min-height: 56px; }
        .app-header .brand { font-weight: 900; font-size: 1.1em; color: var(--text); display: flex; align-items: center; gap: 0.4em; }
        .app-header .brand span { color: var(--primary); }
        .app-content { flex: 1; min-height: 0; display: flex; flex-direction: column; }
        .msg-list { flex: 1; overflow-y: auto; padding: 16px 20px 8px 20px; display: flex; flex-direction: column; gap: 12px; }
        .fixed-input-area { flex-shrink: 0; padding: 10px 20px calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--bg); border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: center; }
        .fixed-input-area input { flex: 1; padding: 10px 14px; border-radius: 99px; border: 2px solid var(--border); background: var(--bg-input); font-family: inherit; font-size: 0.85em; outline: none; color: var(--text); }
        .fixed-input-area input:focus { border-color: var(--primary); }
        .fixed-input-area button { padding: 8px 20px; border-radius: 99px; border: none; background: var(--primary); color: #fff; font-weight: 700; font-size: 0.85em; cursor: pointer; }
        .msg { display: flex; gap: 12px; padding: 14px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-sm); }
        .msg .avatar { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 16px; color: #fff; background: var(--primary); flex-shrink: 0; }
        .msg .body { flex: 1; min-width: 0; }
        .msg .meta { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; flex-wrap: wrap; }
        .msg .name { font-size: 14px; font-weight: 600; }
        .msg .time { font-size: 11.5px; color: var(--text-muted); }
        .msg .txt { font-size: 14px; line-height: 1.6; word-break: break-word; }
        .msg .ip { margin-top: 6px; font-size: 11.5px; color: var(--text-light); }
        .empty-state { text-align: center; color: var(--text-muted); padding: 40px 20px; font-size: 0.85em; }
        .loading-state { text-align: center; padding: 40px 20px; font-size: 0.9em; }
        #toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: var(--text); color: #fff; padding: 10px 20px; border-radius: 99px; opacity: 0; transition: .3s; z-index: 9999; pointer-events: none; }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(-10px); }
    </style>
</head>
<body>
    <div id="mainApp">
        <div id="header-container"></div>
        <div class="app-content">
            <div class="msg-list" id="messageList">
                <div class="loading-state">加载中...</div>
            </div>
            <div class="fixed-input-area">
                <input type="text" id="msgInput" placeholder="写留言..." maxlength="200" />
                <button id="sendMsgBtn">发送</button>
            </div>
        </div>
        <div id="footer-container"></div>
    </div>
    <div id="toast"></div>

    <script>
        function showToast(msg) {
            var t = document.getElementById('toast');
            if (!t) return;
            t.textContent = msg; t.classList.add('show');
            clearTimeout(window.toastTimer);
            window.toastTimer = setTimeout(function () { t.classList.remove('show'); }, 3000);
        }
        function escapeHtml(s) {
            if (!s) return '';
            return String(s).replace(/[&<>"']/g, function(c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }
        function safeColor(c) {
            if (!c) return '#2e7d32';
            var s = String(c).trim();
            if (/^#[0-9a-fA-F]{3,8}$/.test(s)) return s;
            return '#2e7d32';
        }

        var currentUser = null;

        async function fetchMessages() {
            var res = await window.sb.from('messages').select('*').order('created_at', { ascending: false });
            if (res.error) throw res.error;
            return res.data || [];
        }

        async function sendMessage() {
            var input = document.getElementById('msgInput');
            var content = input.value.trim();
            if (!content) { showToast('请输入内容'); return; }
            
            if (currentUser && currentUser.banned_until && new Date(currentUser.banned_until) > new Date()) {
                showToast('账号已被封禁，无法留言'); return;
            }

            var btn = document.getElementById('sendMsgBtn');
            btn.disabled = true;
            btn.textContent = '发送中...';

            try {
                var ip = '0.0.0.0';
                try {
                    var ipRes = await fetch("https://api.ipify.org?format=json");
                    var ipData = await ipRes.json();
                    if (ipData && ipData.ip) ip = ipData.ip;
                } catch(e) {}

                var res = await window.sb.from('messages').insert([{
                    name: currentUser ? currentUser.nickname : '神秘游客',
                    text: content,
                    user_id: currentUser ? currentUser.id : null,
                    ip: ip,
                    is_official: currentUser && currentUser.is_admin,
                    is_pinned: false,
                    is_approved: true
                }]);
                
                if (res.error) {
                    if (res.error.code === 'P0001' || res.error.message.includes('封禁')) {
                        throw new Error(res.error.message);
                    }
                    throw res.error;
                }
                
                showToast('留言成功！');
                input.value = '';
                loadAllData();
            } catch (err) {
                showToast('发送失败：' + err.message);
            } finally {
                btn.disabled = false;
                btn.textContent = '发送';
            }
        }

        async function loadAllData() {
            var container = document.getElementById('messageList');
            container.innerHTML = '<div class="loading-state">加载中...</div>';
            try {
                var data = await fetchMessages();
                if (!data.length) {
                    container.innerHTML = '<div class="empty-state">暂无留言，快来写第一条吧！</div>';
                    return;
                }
                var html = '';
                data.forEach(function(m) {
                    var timeStr = new Date(m.created_at).toLocaleString('zh-CN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                    var officialTag = m.is_official ? '<span style="background:#2b6cff;color:#fff;font-size:10px;padding:0 6px;border-radius:99px;">官方</span>' : '';
                    html += '<div class="msg">';
                    html += '<div class="avatar" style="background:' + safeColor(m.color) + '">' + escapeHtml(m.name.slice(0,1)) + '</div>';
                    html += '<div class="body">';
                    html += '<div class="meta"><span class="name">' + escapeHtml(m.name) + ' ' + officialTag + '</span>';
                    html += '<span class="time">' + timeStr + '</span></div>';
                    html += '<div class="txt">' + escapeHtml(m.text) + '</div>';
                    html += '<div class="ip">' + escapeHtml(m.ip || '') + '</div>';
                    html += '</div></div>';
                });
                container.innerHTML = html;
            } catch (e) {
                container.innerHTML = '<div class="empty-state">加载失败：' + e.message + '</div>';
            }
        }

        window.addEventListener('DOMContentLoaded', function() {
            currentUser = getSessionUser();
            if (typeof renderHeader === 'function') renderHeader('留言板', 'messages');
            if (typeof renderFooter === 'function') renderFooter('messages');
            
            document.getElementById('sendMsgBtn').onclick = sendMessage;
            document.getElementById('msgInput').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') sendMessage();
            });
            
            loadAllData();
        });
    </script>
</body>
</html>
