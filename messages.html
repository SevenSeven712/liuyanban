<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Seven戚 · 留言板</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        :root {
            --bg: #f5faf5;
            --bg-card: #ffffff;
            --bg-input: #eaf3ea;
            --border: #c8e0c8;
            --text: #1e3a2e;
            --text-muted: #5a7a6a;
            --text-light: #8aaa9a;
            --primary: #2e7d32;
            --primary-light: #4caf50;
            --primary-glow: rgba(76, 175, 80, 0.25);
            --primary-bg: #e8f5e9;
            --shadow: 0 8px 32px rgba(46, 125, 50, 0.12);
            --radius: 16px;
            --radius-sm: 10px;
            --font: "Space Grotesk", "PingFang SC", "Segoe UI", system-ui, sans-serif;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --danger: #e57373;
            --danger-bg: #ffebee;
            --official-blue: #2b6cff;
        }
        html, body { height: 100%; font-family: var(--font); background: var(--bg); color: var(--text); overflow: hidden; }
        #mainApp { display: flex; flex-direction: column; height: 100vh; height: 100dvh; background: var(--bg); }

        .app-header {
            flex-shrink: 0; padding: 12px 20px 8px 20px;
            background: rgba(255,255,255,0.92);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            z-index: 50; min-height: 56px;
        }
        .app-header .brand { font-weight: 900; font-size: 1.1em; color: var(--text); display: flex; align-items: center; gap: 0.4em; }
        .app-header .brand span { color: var(--primary); }
        .app-header .brand small { font-weight: 400; font-size: 0.55em; color: var(--text-muted); margin-left: 0.3em; }
        .app-header .user-area { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 4px 10px 4px 6px; border-radius: 99px; }
        .app-header .user-area:hover { background: var(--primary-bg); }
        .app-header .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--primary); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 14px; flex-shrink: 0; background-size: cover; background-position: center; }
        .app-header .user-name { font-weight: 600; font-size: 0.85em; max-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .app-header .chevron { color: var(--text-muted); font-size: 0.7em; }

        .app-tabs {
            flex-shrink: 0; display: flex;
            background: rgba(255,255,255,0.96);
            border-top: 1px solid var(--border);
            padding: 6px 0 calc(6px + var(--safe-bottom));
            z-index: 50;
        }
        .tab-btn {
            flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
            background: none; border: none; font-family: var(--font); font-size: 0.6em; font-weight: 600;
            color: var(--text-muted); padding: 4px 0; cursor: pointer; text-decoration: none;
            position: relative;
        }
        .tab-btn .tab-icon { font-size: 1.6em; line-height: 1.2; }
        .tab-btn.active { color: var(--primary); }
        .tab-btn.active::after { content: ''; position: absolute; top: -1px; left: 30%; right: 30%; height: 3px; background: var(--primary); border-radius: 0 0 4px 4px; }
        .tab-btn .badge { position: absolute; top: -2px; right: 15%; background: #e57373; color: #fff; font-size: 0.6em; font-weight: 700; padding: 1px 6px; border-radius: 99px; min-width: 16px; text-align: center; }

        .banned-banner { flex-shrink: 0; background: #ffebee; color: #c62828; padding: 6px 16px; font-size: 0.8em; font-weight: 600; text-align: center; border-bottom: 1px solid #ffcdd2; display: none; }
        .banned-banner.active { display: block; }

        .app-content { flex: 1; min-height: 0; display: flex; flex-direction: column; }
        .msg-list { flex: 1; overflow-y: auto; padding: 16px 20px 8px 20px; display: flex; flex-direction: column; gap: 12px; -webkit-overflow-scrolling: touch; }

        .fixed-input-area {
            flex-shrink: 0; padding: 10px 20px calc(10px + var(--safe-bottom));
            background: var(--bg); border-top: 1px solid var(--border);
            display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
        }
        .fixed-input-area .input-wrapper { flex: 1; display: flex; gap: 8px; min-width: 0; }
        .fixed-input-area input {
            flex: 1; padding: 10px 14px; border-radius: 99px;
            border: 2px solid var(--border); background: var(--bg-input);
            font-family: inherit; font-size: 0.85em; outline: none; color: var(--text); min-width: 0;
        }
        .fixed-input-area input:focus { border-color: var(--primary); }
        .fixed-input-area input:disabled { opacity: 0.5; }
        .fixed-input-area button {
            padding: 8px 20px; border-radius: 99px; border: none;
            background: var(--primary); color: #fff; font-weight: 700; font-size: 0.85em;
            cursor: pointer; font-family: inherit; white-space: nowrap;
            display: flex; align-items: center; gap: 6px;
        }
        .fixed-input-area button:hover { background: var(--primary-light); }
        .fixed-input-area button:disabled { opacity: 0.5; pointer-events: none; }
        .fixed-input-area .author-options { display: none; align-items: center; gap: 12px; width: 100%; margin-top: 4px; }
        .fixed-input-area .author-options.active { display: flex; }
        .fixed-input-area .author-options label { font-size: 0.75em; font-weight: 600; color: var(--text-muted); display: flex; align-items: center; gap: 4px; cursor: pointer; }

        .msg {
            display: flex; gap: 12px; padding: 14px;
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius-sm); flex-shrink: 0;
        }
        .msg .avatar {
            width: 38px; height: 38px; border-radius: 50%; flex: none;
            display: grid; place-items: center; font-weight: 700; font-size: 16px;
            color: #fff; background: var(--primary);
            background-size: cover; background-position: center;
        }
        .msg .body { flex: 1; min-width: 0; }
        .msg .meta { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; flex-wrap: wrap; }
        .msg .name { font-size: 14px; font-weight: 600; }
        .msg .official-tag { background: #2b6cff; color: #fff; font-size: 10px; font-weight: 600; padding: 0 8px; border-radius: 999px; line-height: 18px; }
        .msg .time { font-size: 11.5px; color: var(--text-muted); }
        .msg .txt { font-size: 14px; line-height: 1.6; color: var(--text); word-break: break-word; }
        .msg .ip { margin-top: 6px; font-size: 11.5px; color: var(--text-muted); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .msg .ip .ip-text { display: flex; align-items: center; gap: 4px; }
        .msg .ip .comment-btn {
            background: none; border: none; color: var(--text-muted);
            cursor: pointer; font-size: 13px; display: flex; align-items: center;
            gap: 4px; padding: 2px 6px; border-radius: 999px; font-family: inherit;
        }
        .msg .ip .comment-btn:hover { background: rgba(0,0,0,0.05); color: var(--text); }
        .msg .ip .comment-btn.official { color: var(--official-blue); }
        .msg .ip .report-btn {
            background: none; border: none; color: var(--text-muted);
            cursor: pointer; font-size: 12px; opacity: 0.6;
            padding: 2px 6px; display: flex; align-items: center;
            gap: 4px; border-radius: 999px;
        }
        .msg .ip .report-btn:hover { opacity: 1; color: var(--danger); }
        .msg .ip .del-btn {
            background: none; border: none; color: #e57373;
            cursor: pointer; font-size: 13px; opacity: 0.6;
            padding: 0 4px; margin-left: auto;
            display: flex; align-items: center; gap: 4px;
        }
        .msg .ip .del-btn:hover { opacity: 1; }
        .msg.pinned { border-color: var(--primary); box-shadow: 0 0 12px var(--primary-glow); }

        .icon-svg { width: 1em; height: 1em; fill: currentColor; flex-shrink: 0; }
        .empty-state { text-align: center; color: var(--text-muted); padding: 40px 20px; font-size: 0.85em; }
        .empty-state .big { font-size: 2.8em; margin-bottom: 8px; opacity: 0.5; }
        .loading-state { text-align: center; color: var(--text-muted); padding: 40px 20px; font-size: 0.9em; }
        .loading-state .spinner {
            display: inline-block; width: 30px; height: 30px;
            border: 3px solid var(--border); border-top-color: var(--primary);
            border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error-state { text-align: center; color: #c62828; padding: 40px 20px; font-size: 0.9em; }

        #toast {
            position: fixed; bottom: 80px; left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--text); color: #fff;
            padding: 0.7em 1.6em; border-radius: 2em;
            font-weight: 600; font-size: 0.85em;
            opacity: 0; transition: all 0.4s ease;
            z-index: 9999; pointer-events: none;
            white-space: nowrap; box-shadow: var(--shadow);
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        @media (max-width: 480px) {
            .app-header { padding: 10px 14px 6px 14px; min-height: 48px; }
            .app-header .brand { font-size: 0.95em; }
            .app-header .user-name { max-width: 60px; font-size: 0.75em; }
            .msg-list { padding: 12px 14px 4px 14px; }
            .fixed-input-area { padding: 8px 14px calc(8px + var(--safe-bottom)); flex-direction: column; align-items: stretch; }
            .fixed-input-area .input-wrapper { flex: 1; }
            .fixed-input-area input { padding: 8px 12px; font-size: 0.8em; }
            .fixed-input-area button { padding: 6px 14px; font-size: 0.8em; }
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

        /* 评论弹窗 */
        .comment-overlay {
            position: fixed; inset: 0; z-index: 999;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
            display: none; align-items: center; justify-content: center; padding: 20px;
            animation: fadeIn 0.3s ease;
        }
        .comment-overlay.active { display: flex; }
        .comment-panel {
            background: var(--bg-card); border-radius: var(--radius);
            max-width: 560px; width: 100%; max-height: 80vh; padding: 24px;
            display: flex; flex-direction: column; border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }
        .comment-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .comment-header h4 { font-size: 1.1em; display: flex; align-items: center; gap: 6px; }
        .comment-close { background: none; border: none; cursor: pointer; color: var(--text-muted); padding: 4px; display: flex; }
        .comment-close:hover { color: var(--text); }
        .comment-list { flex: 1; overflow-y: auto; margin-bottom: 12px; display: flex; flex-direction: column; gap: 8px; max-height: 50vh; }
        .comment-item {
            background: var(--bg-input); border-radius: var(--radius-sm);
            padding: 10px 12px; border-left: 3px solid var(--border);
        }
        .comment-item.official { border-left-color: #2b6cff; background: rgba(43,108,255,0.06); }
        .comment-item .meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 0.8em; color: var(--text-muted); }
        .comment-item .meta .name { font-weight: 700; color: var(--text); }
        .comment-item .meta .official-tag { background: #2b6cff; color: #fff; font-size: 0.55em; padding: 0 6px; border-radius: 99px; line-height: 16px; }
        .comment-item .txt { font-size: 0.9em; line-height: 1.5; margin-top: 4px; color: var(--text); }
        .comment-item .time { font-size: 0.7em; color: var(--text-light); }
        .comment-item .del-comment-btn { background: none; border: none; color: #e57373; cursor: pointer; padding: 0 4px; margin-left: auto; display: flex; align-items: center; }
        .comment-input-area { display: flex; gap: 8px; border-top: 1px solid var(--border); padding-top: 12px; }
        .comment-input-area input {
            flex: 1; padding: 8px 14px; border-radius: 99px;
            border: 2px solid var(--border); background: var(--bg-input);
            font-family: inherit; font-size: 0.85em; outline: none; color: var(--text);
        }
        .comment-input-area input:focus { border-color: var(--primary); }
        .comment-input-area input:disabled { opacity: 0.5; }
        .comment-input-area button {
            padding: 8px 18px; border-radius: 99px; border: none;
            background: var(--primary); color: #fff; font-weight: 700; font-size: 0.85em;
            cursor: pointer; font-family: inherit; white-space: nowrap;
            display: flex; align-items: center; gap: 6px;
        }
        .comment-input-area button:hover { background: var(--primary-light); }
        .comment-input-area button:disabled { opacity: 0.5; pointer-events: none; }
        .comment-empty { text-align: center; color: var(--text-muted); padding: 20px 0; font-size: 0.85em; }

        /* 确认弹窗 */
        .custom-modal {
            position: fixed; inset: 0; z-index: 2000;
            background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px);
            display: none; align-items: center; justify-content: center; padding: 20px;
        }
        .custom-modal.active { display: flex; }
        .custom-modal .modal-box {
            background: var(--bg-card); border-radius: var(--radius);
            max-width: 420px; width: 100%; padding: 24px;
            box-shadow: var(--shadow); border: 1px solid var(--border);
        }
        .custom-modal .modal-title { font-size: 1.2em; font-weight: 700; margin-bottom: 8px; color: var(--text); }
        .custom-modal .modal-body { font-size: 0.95em; color: var(--text-muted); line-height: 1.6; margin-bottom: 16px; white-space: pre-wrap; }
        .custom-modal .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
        .custom-modal .modal-actions button {
            padding: 6px 18px; border-radius: var(--radius-sm);
            border: none; font-weight: 600; font-size: 0.85em;
            cursor: pointer; font-family: inherit;
        }
        .custom-modal .modal-actions .btn-danger { background: var(--danger); color: #fff; }
        .custom-modal .modal-actions .btn-danger:hover { background: #c62828; }
        .custom-modal .modal-actions .btn-secondary { background: var(--bg-input); color: var(--text-muted); }
        .custom-modal .modal-actions .btn-secondary:hover { background: var(--border); }
    </style>
</head>
<body>
    <div id="mainApp">
        <div id="header-container"></div>

        <div class="banned-banner" id="bannedBanner">
            账号已被封禁，无法发布留言或评论。解封时间：<span id="bannedUntilDisplay"></span>
        </div>

        <div class="app-content">
            <div class="msg-list" id="messageList"></div>
            <div class="fixed-input-area" id="messageInputArea">
                <div class="input-wrapper">
                    <input type="text" id="msgInput" placeholder="写留言…" maxlength="200" />
                    <button id="sendMsgBtn" onclick="sendMessage()">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"/>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                        </svg>
                        <span class="btn-text">发送</span>
                    </button>
                </div>
                <div class="author-options" id="msgAuthorOptions">
                    <label><input type="checkbox" id="msgPinnedCheck"> 置顶</label>
                    <span style="font-size:0.65em;color:var(--text-muted);">(仅作者)</span>
                </div>
            </div>
        </div>

        <div id="footer-container"></div>
    </div>

    <!-- 评论弹窗 -->
    <div class="comment-overlay" id="commentOverlay">
        <div class="comment-panel">
            <div class="comment-header">
                <h4>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                    </svg>
                    评论
                </h4>
                <button class="comment-close" id="closeComment">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="comment-list" id="commentList"></div>
            <div class="comment-input-area">
                <input type="text" id="commentInput" placeholder="写评论…" maxlength="200" />
                <button id="sendCommentBtn" onclick="sendComment()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"/>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                    </svg>
                    <span class="btn-text">发送</span>
                </button>
            </div>
        </div>
    </div>

    <!-- 确认弹窗 -->
    <div class="custom-modal" id="confirmModal">
        <div class="modal-box">
            <div class="modal-title" id="confirmTitle">确认</div>
            <div class="modal-body" id="confirmBody">确定要执行此操作吗？</div>
            <div class="modal-actions">
                <button class="btn-secondary" id="confirmCancel">取消</button>
                <button class="btn-danger" id="confirmOk">确定</button>
            </div>
        </div>
    </div>

    <div id="toast"></div>

    <script src="/liuyanban/common.js"></script>
<script>
// ============ 举报相关兜底（防止 common.js 缺失） ============
window.pushNotification = window.pushNotification || async function(userId, payload) {
    if (!window.sb || !userId) return;
    try {
        await window.sb.from('notifications').insert([Object.assign({ user_id: userId, is_read: false }, payload)]);
    } catch (e) { console.warn('通知发送失败', e); }
};

window.openReportDialog = window.openReportDialog || function(reportedUserId, contentType, contentId, contentSnapshot) {
    var old = document.getElementById('reportOverlay');
    if (old) old.remove();
    var overlay = document.createElement('div');
    overlay.className = 'report-overlay';
    overlay.id = 'reportOverlay';
    var typeText = { post: '帖子', comment: '评论', message: '留言', chat: '聊天消息' }[contentType] || '内容';
    overlay.innerHTML =
        '<div class="report-panel">' +
        '<div class="report-header"><h3>🚨 举报' + typeText + '</h3>' +
        '<button class="report-close" onclick="closeReportDialog()">✕</button></div>' +
        '<div class="report-body">' +
        '<div class="report-field"><label>举报原因（必选）</label><div class="report-reasons">' +
        '<label class="report-reason-option"><input type="radio" name="reportReason" value="色情低俗"> 色情低俗</label>' +
        '<label class="report-reason-option"><input type="radio" name="reportReason" value="骚扰辱骂"> 骚扰辱骂</label>' +
        '<label class="report-reason-option"><input type="radio" name="reportReason" value="垃圾广告"> 垃圾广告</label>' +
        '<label class="report-reason-option"><input type="radio" name="reportReason" value="虚假信息"> 虚假信息</label>' +
        '<label class="report-reason-option"><input type="radio" name="reportReason" value="政治敏感"> 政治敏感</label>' +
        '<label class="report-reason-option"><input type="radio" name="reportReason" value="其他"> 其他</label>' +
        '</div></div>' +
        '<div class="report-field"><label>补充说明（选填）</label><textarea id="reportDescription" placeholder="请描述具体情况..." maxlength="500"></textarea></div>' +
        '<div class="report-field"><label>被举报内容预览</label><div class="report-preview">' + (contentSnapshot ? String(contentSnapshot).replace(/</g,'&lt;') : '(无内容)') + '</div></div>' +
        '</div>' +
        '<div class="report-footer"><button class="report-cancel" onclick="closeReportDialog()">取消</button>' +
        '<button class="report-submit" id="reportSubmitBtn">提交举报</button></div>' +
        '</div>';
    document.body.appendChild(overlay);
    document.getElementById('reportSubmitBtn').onclick = async function() {
        var r = document.querySelector('input[name="reportReason"]:checked');
        if (!r) { alert('请选择举报原因'); return; }
        var d = document.getElementById('reportDescription');
        var desc = d ? d.value.trim() : '';
        try {
            var cu = JSON.parse(localStorage.getItem('sq_user_session') || '{}');
            if (!cu.id) { alert('请先登录'); return; }
            var ins = await window.sb.from('reports').insert([{
                reporter_id: cu.id, reported_user_id: reportedUserId,
                content_type: contentType, content_id: contentId,
                content_snapshot: contentSnapshot, reason: r.value, description: desc
            }]).select();
            if (ins.error) throw ins.error;
            var adm = await window.sb.from('users').select('id').eq('phone','17355394710').single();
            if (adm.data) {
                await window.pushNotification(adm.data.id, {
                    type: 'report', notification_type: 'report',
                    report_id: ins.data[0].id, report_reason: r.value,
                    extra_text: contentSnapshot ? String(contentSnapshot).substring(0,100) : ''
                });
            }
            closeReportDialog();
            alert('✅ 举报已提交，管理员会尽快处理');
        } catch (err) { alert('举报失败：' + err.message); }
    };
    if (!document.getElementById('report-dialog-styles')) {
        var s = document.createElement('style');
        s.id = 'report-dialog-styles';
        s.textContent = '.report-overlay{position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;padding:20px;}' +
        '.report-panel{background:#fff;border-radius:16px;max-width:460px;width:100%;max-height:85vh;display:flex;flex-direction:column;overflow:hidden;}' +
        '.report-header{display:flex;justify-content:space-between;align-items:center;padding:18px 20px 12px;border-bottom:1px solid #e8f0e8;}' +
        '.report-header h3{font-size:1.05em;margin:0;}' +
        '.report-close{background:none;border:none;font-size:1.3em;cursor:pointer;color:#8aaa9a;}' +
        '.report-body{padding:16px 20px;overflow-y:auto;flex:1;}' +
        '.report-field{margin-bottom:14px;}' +
        '.report-field label{display:block;font-size:0.75em;font-weight:600;color:#5a7a6a;margin-bottom:6px;}' +
        '.report-reasons{display:grid;grid-template-columns:1fr 1fr;gap:6px;}' +
        '.report-reason-option{display:flex;align-items:center;gap:6px;padding:8px 10px;border:1.5px solid #c8e0c8;border-radius:8px;font-size:0.85em;cursor:pointer;}' +
        '.report-field textarea{width:100%;padding:10px;border:2px solid #c8e0c8;border-radius:10px;font-family:inherit;font-size:0.85em;outline:none;min-height:70px;box-sizing:border-box;}' +
        '.report-preview{background:#f5faf5;border:1px solid #e0e0e0;border-radius:8px;padding:10px;font-size:0.8em;color:#5a7a6a;max-height:80px;overflow:hidden;}' +
        '.report-footer{display:flex;gap:8px;padding:12px 20px 18px;border-top:1px solid #e8f0e8;}' +
        '.report-footer button{flex:1;padding:10px;border-radius:10px;border:none;font-weight:700;font-size:0.9em;cursor:pointer;}' +
        '.report-cancel{background:#eaf3ea;color:#5a7a6a;}' +
        '.report-submit{background:#e57373;color:#fff;}';
        document.head.appendChild(s);
    }
};

window.closeReportDialog = window.closeReportDialog || function() {
    var el = document.getElementById('reportOverlay');
    if (el) el.remove();
};
</script>
    <script>
        // ============================================================
        // Supabase 配置
        // ============================================================
        var SUPABASE_URL = "https://ulvhuqtpdafspbdvkogs.supabase.co";
        var SUPABASE_ANON_KEY = "sb_publishable_Ew8kKf2z05kmYIK2XNu00g_dzAirtIM";
        window.sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ============================================================
        // 工具函数
        // ============================================================
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(window.toastTimer);
            window.toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function escapeHtml(s) {
            if (!s) return '';
            return String(s).replace(/[&<>"']/g, function(c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }

        var COLORS = ["#6ee7b7", "#fbbf24", "#f87171", "#a78bfa", "#f472b6", "#38bdf8"];
        function pickColor(hex) {
            if (hex && /^#[0-9a-f]{6}$/i.test(hex) && hex.toLowerCase() !== "#000000") return hex;
            return COLORS[Math.floor(Math.random() * COLORS.length)];
        }

        // ============================================================
        // 作者模式
        // ============================================================
        var isAuthorMode = false;
        var AUTHOR_PASSWORD = "7592";
        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // ============================================================
        // 会话与权限
        // ============================================================
        var currentUser = null;
        var isAdmin = false;

        function isUserBanned() {
            if (!currentUser) return false;
            const bannedUntil = currentUser.banned_until ? new Date(currentUser.banned_until) : null;
            return bannedUntil && bannedUntil > new Date();
        }

        function getBannedUntil() {
            if (!currentUser || !currentUser.banned_until) return null;
            return new Date(currentUser.banned_until);
        }

        function updateBannedBanner() {
            const banner = document.getElementById('bannedBanner');
            const display = document.getElementById('bannedUntilDisplay');
            if (isUserBanned()) {
                banner.classList.add('active');
                const until = getBannedUntil();
                display.textContent = until ? until.toLocaleString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '未知';
                document.getElementById('sendMsgBtn').disabled = true;
                document.getElementById('msgInput').disabled = true;
                document.getElementById('msgInput').placeholder = '账号已被封禁，无法留言';
            } else {
                banner.classList.remove('active');
                document.getElementById('sendMsgBtn').disabled = false;
                document.getElementById('msgInput').disabled = false;
                document.getElementById('msgInput').placeholder = '写留言…';
            }
        }

        // ============================================================
        // 数据操作
        // ============================================================
        var messages = [];

        async function fetchMessages() {
            const { data, error } = await window.sb
                .from('messages')
                .select('*')
                .order('created_at', { ascending: false });
            if (error) throw error;
            return data || [];
        }

        async function addMessage(name, text, color, ip, isOfficial, isPinned, parentId) {
            const insertObj = {
                name: name,
                text: text,
                color: color,
                ip: ip,
                is_official: isOfficial,
                is_pinned: isPinned || false
            };
            if (parentId && parentId.trim() !== '') {
                insertObj.parent_id = parentId.trim();
            }
            const { data, error } = await window.sb
                .from('messages')
                .insert([insertObj]);
            if (error) throw error;
            return data;
        }

        async function deleteMessage(id) {
            const { data: children } = await window.sb
                .from('messages')
                .select('id')
                .eq('parent_id', id);
            if (children && children.length) {
                const childIds = children.map(c => c.id);
                const { error: delChild } = await window.sb
                    .from('messages')
                    .delete()
                    .in('id', childIds);
                if (delChild) throw delChild;
            }
            const { error } = await window.sb
                .from('messages')
                .delete()
                .eq('id', id);
            if (error) throw error;
        }

        async function deleteCommentOnly(id) {
            const { error } = await window.sb
                .from('messages')
                .delete()
                .eq('id', id);
            if (error) throw error;
        }

        // ============================================================
        // 获取 IP
        // ============================================================
        async function fetchIP() {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 5000);
            try {
                var res = await fetch("https://api.ipify.org?format=json", { signal: controller.signal });
                var data = await res.json();
                return data.ip || "0.0.0.0";
            } catch (e) { return "0.0.0.0"; } finally { clearTimeout(timeoutId); }
        }

        // ============================================================
        // 渲染留言板
        // ============================================================
        var messagesLoading = false;
        var messagesError = null;

        async function renderMessages() {
            const container = document.getElementById('messageList');
            if (messagesLoading) {
                container.innerHTML = '<div class="loading-state"><div class="spinner"></div><div>正在加载留言...</div></div>';
                return;
            }
            if (messagesError) {
                container.innerHTML = '<div class="error-state">加载失败，请联系站主修复</div>';
                return;
            }
            if (!messages || messages.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="big">💌</div>暂无留言，快来写第一条吧！</div>';
                return;
            }

            const mainMessages = messages.filter(m => !m.parent_id);
            mainMessages.sort((a, b) => {
                if (a.is_pinned && !b.is_pinned) return -1;
                if (!a.is_pinned && b.is_pinned) return 1;
                return new Date(b.created_at) - new Date(a.created_at);
            });

            const commentInfo = {};
            mainMessages.forEach(m => {
                const related = messages.filter(c => String(c.parent_id) === String(m.id));
                commentInfo[m.id] = {
                    count: related.length,
                    hasOfficial: related.some(c => c.is_official === true)
                };
            });

            let html = '';
            for (const m of mainMessages) {
                const isOfficial = m.is_official || m.name === 'Seven戚';
                const timeStr = new Date(m.created_at).toLocaleString('zh-CN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                const color = m.color || pickColor(null);
                const officialTag = isOfficial ? '<span class="official-tag">官方</span>' : '';
                const pinnedClass = m.is_pinned ? 'pinned' : '';
                const info = commentInfo[m.id] || { count: 0, hasOfficial: false };
                const commentIconClass = info.hasOfficial ? 'comment-btn official' : 'comment-btn';

                // 删除按钮
                let delBtn = '';
                if (isAdmin || isAuthorMode) {
                    delBtn = '<button class="del-btn" onclick="deleteMessageById(\'' + m.id + '\')">' +
                        '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                        '<polyline points="3 6 5 6 21 6"/>' +
                        '<path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>' +
                        '</svg>删除</button>';
                }

                // 举报按钮
                let reportBtn = '';
                if (currentUser && m.name !== currentUser.nickname) {
                    var snapshotSafe = escapeHtml(m.text || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
                    var nameSafe = escapeHtml(m.name || '').replace(/'/g, "\\'");
                    reportBtn = '<button class="report-btn" onclick="event.stopPropagation();reportMessage(\'' + m.id + '\',\'' + nameSafe + '\',\'' + snapshotSafe + '\')" title="举报">' +
                        '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                        '<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/>' +
                        '<line x1="4" y1="22" x2="4" y2="15"/>' +
                        '</svg>举报</button>';
                }

                const commentBtn = '<button class="' + commentIconClass + '" onclick="openCommentPanel(\'' + m.id + '\')">' +
                    '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                    '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>' +
                    '</svg>' +
                    '<span class="count">' + info.count + '</span></button>';

                html += '<div class="msg ' + pinnedClass + '" data-id="' + m.id + '">' +
                    '<div class="avatar" style="background:' + color + '">' + escapeHtml(m.name.slice(0,1)) + '</div>' +
                    '<div class="body">' +
                        '<div class="meta">' +
                            '<span class="name">' + escapeHtml(m.name) + '</span>' +
                            officialTag +
                            '<span class="time">' + timeStr + '</span>' +
                            (m.is_pinned ? '<span style="font-size:0.7em;color:var(--primary);">置顶</span>' : '') +
                        '</div>' +
                        '<div class="txt">' + escapeHtml(m.text) + '</div>' +
                        '<div class="ip">' +
                            '<span class="ip-text">' + escapeHtml(m.ip || '未知') + '</span>' +
                            commentBtn +
                            reportBtn +
                            delBtn +
                        '</div>' +
                    '</div>' +
                '</div>';
            }
            container.innerHTML = html;
            container.scrollTop = 0;
        }

        // ============================================================
        // 举报功能
        // ============================================================
        async function reportMessage(contentId, author, contentSnapshot) {
            try {
                var userRes = await window.sb.from('users').select('id').eq('nickname', author).single();
                if (userRes.error || !userRes.data) { showToast('无法找到该用户'); return; }
                openReportDialog(userRes.data.id, 'message', contentId, contentSnapshot);
            } catch (err) {
                showToast('举报失败：' + err.message);
            }
        }

        // ============================================================
        // 删除留言（主+子）
        // ============================================================
        async function deleteMessageById(id) {
            if (!isAdmin && !isAuthorMode) { showToast('权限不足'); return; }
            showConfirm('删除留言', '确定要删除此留言及其所有评论吗？', async () => {
                try {
                    await deleteMessage(id);
                    messages = messages.filter(m => m.id !== id && m.parent_id !== id);
                    await renderMessages();
                    if (currentCommentParentId === id) closeCommentPanel();
                    showToast('留言已删除（含评论）');
                } catch (err) {
                    showToast('删除失败：' + err.message);
                }
            });
        }

        async function deleteCommentOnlyById(id) {
            if (!isAdmin && !isAuthorMode) { showToast('权限不足'); return; }
            showConfirm('删除评论', '确定要删除此评论吗？', async () => {
                try {
                    await deleteCommentOnly(id);
                    messages = messages.filter(m => m.id !== id);
                    await renderMessages();
                    if (currentCommentParentId) renderComments(currentCommentParentId);
                    showToast('评论已删除');
                } catch (err) {
                    showToast('删除失败：' + err.message);
                }
            });
        }

        // ============================================================
        // 发送留言
        // ============================================================
        function sendMessage() {
            if (!currentUser) { showToast('请先登录'); return; }
            if (isUserBanned()) { showToast('账号已被封禁，无法留言'); return; }
            const input = document.getElementById('msgInput');
            const content = input.value.trim();
            if (!content) { showToast('请输入内容'); return; }
            const btn = document.getElementById('sendMsgBtn');
            btn.disabled = true;
            const originalHTML = btn.innerHTML;
            btn.innerHTML = '发送中...';

            const color = pickColor(null);
            const isOfficial = isAuthorMode || currentUser.nickname === 'Seven戚';
            const isPinned = isAuthorMode && document.getElementById('msgPinnedCheck').checked;

            (async function() {
                try {
                    const ip = await fetchIP();
                    const { data } = await addMessage(currentUser.nickname, content, color, ip, isOfficial, isPinned, null);
                    if (data && data.length) {
                        messages.push({
                            id: data[0].id,
                            name: currentUser.nickname,
                            text: content,
                            color: color,
                            ip: ip,
                            created_at: new Date().toISOString(),
                            is_official: isOfficial,
                            is_pinned: isPinned,
                            parent_id: null
                        });
                        await renderMessages();
                    } else {
                        await loadAllData();
                    }
                    input.value = '';
                    if (isPinned) document.getElementById('msgPinnedCheck').checked = false;
                    showToast('留言已发送');
                } catch (err) {
                    showToast('发送失败：' + err.message);
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = originalHTML;
                }
            })();
        }

        // ============================================================
        // 评论功能
        // ============================================================
        var currentCommentParentId = null;
        var commentList = document.getElementById('commentList');
        var commentInput = document.getElementById('commentInput');
        var sendCommentBtn = document.getElementById('sendCommentBtn');
        var closeCommentBtn = document.getElementById('closeComment');
        var commentOverlay = document.getElementById('commentOverlay');

        function openCommentPanel(parentId) {
            currentCommentParentId = parentId;
            commentOverlay.classList.add('active');
            renderComments(parentId);
            commentInput.value = '';
            if (isUserBanned()) {
                commentInput.disabled = true;
                sendCommentBtn.disabled = true;
                commentInput.placeholder = '账号已被封禁，无法评论';
            } else {
                commentInput.disabled = false;
                sendCommentBtn.disabled = false;
                commentInput.placeholder = '写评论…';
            }
            commentInput.focus();
        }

        function closeCommentPanel() {
            commentOverlay.classList.remove('active');
            currentCommentParentId = null;
        }
        closeCommentBtn.addEventListener('click', closeCommentPanel);
        commentOverlay.addEventListener('click', function(e) {
            if (e.target === commentOverlay) closeCommentPanel();
        });

        function renderComments(parentId) {
            const comments = messages.filter(m => m.parent_id === parentId).sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
            if (!comments.length) {
                commentList.innerHTML = '<div class="comment-empty">还没有评论，来抢沙发吧</div>';
                return;
            }
            let html = '';
            comments.forEach(c => {
                const isOfficial = c.is_official || c.name === 'Seven戚';
                const timeStr = new Date(c.created_at).toLocaleString('zh-CN', { hour: '2-digit', minute: '2-digit' });
                const officialTag = isOfficial ? '<span class="official-tag">官方</span>' : '';
                let delBtn = '';
                if (isAdmin || isAuthorMode) {
                    delBtn = '<button class="del-comment-btn" onclick="deleteCommentOnlyById(\'' + c.id + '\')" title="删除">' +
                        '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                        '<polyline points="3 6 5 6 21 6"/>' +
                        '<path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>' +
                        '</svg></button>';
                }
                html += '<div class="comment-item ' + (isOfficial ? 'official' : '') + '">' +
                    '<div class="meta">' +
                        '<span class="name">' + escapeHtml(c.name) + '</span>' +
                        officialTag +
                        '<span class="time">' + timeStr + '</span>' +
                        delBtn +
                    '</div>' +
                    '<div class="txt">' + escapeHtml(c.text) + '</div>' +
                '</div>';
            });
            commentList.innerHTML = html;
            commentList.scrollTop = commentList.scrollHeight;
        }

        function sendComment() {
            if (!currentUser) { showToast('请先登录'); return; }
            if (!currentCommentParentId) { showToast('请先选择要评论的留言'); return; }
            if (isUserBanned()) { showToast('账号已被封禁，无法评论'); return; }
            const text = commentInput.value.trim();
            if (!text) { showToast('请输入评论内容'); return; }

            const btn = sendCommentBtn;
            btn.disabled = true;
            const originalHTML = btn.innerHTML;
            btn.innerHTML = '发送中...';

            const color = pickColor(null);
            (async function() {
                try {
                    const ip = await fetchIP();
                    const isOfficial = isAuthorMode || currentUser.nickname === 'Seven戚';
                    const { data } = await addMessage(
                        currentUser.nickname,
                        text,
                        color,
                        ip,
                        isOfficial,
                        false,
                        currentCommentParentId
                    );
                    if (data && data.length) {
                        const newComment = {
                            id: data[0].id,
                            name: currentUser.nickname,
                            text: text,
                            color: color,
                            ip: ip,
                            created_at: new Date().toISOString(),
                            is_official: isOfficial,
                            is_pinned: false,
                            parent_id: currentCommentParentId
                        };
                        messages.push(newComment);
                        await renderMessages();
                        renderComments(currentCommentParentId);
                    } else {
                        await loadAllData();
                    }
                    commentInput.value = '';
                    showToast('评论已发送');
                } catch (err) {
                    showToast('评论失败：' + err.message);
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = originalHTML;
                }
            })();
        }

        // ============================================================
        // 自定义确认弹窗
        // ============================================================
        function showConfirm(title, body, onOk) {
            const modal = document.getElementById('confirmModal');
            document.getElementById('confirmTitle').textContent = title;
            document.getElementById('confirmBody').textContent = body;
            modal.classList.add('active');
            const cancelBtn = document.getElementById('confirmCancel');
            const okBtn = document.getElementById('confirmOk');
            const cleanup = () => {
                modal.classList.remove('active');
                cancelBtn.removeEventListener('click', cancelHandler);
                okBtn.removeEventListener('click', okHandler);
            };
            const cancelHandler = () => { cleanup(); };
            const okHandler = () => { if (onOk) onOk(); cleanup(); };
            cancelBtn.addEventListener('click', cancelHandler);
            okBtn.addEventListener('click', okHandler);
            modal.addEventListener('click', function bgClick(e) {
                if (e.target === modal) { cleanup(); modal.removeEventListener('click', bgClick); }
            });
        }

        // ============================================================
        // 加载数据
        // ============================================================
        async function loadAllData() {
            messagesLoading = true;
            messagesError = null;
            await renderMessages();
            try {
                const data = await fetchMessages();
                messages = data;
                if (messages.length === 0) {
                    try {
                        await addMessage('系统', '欢迎来到留言板！快来留下你的足迹吧', '#6ee7b7', '0.0.0.0', false, false, null);
                        const newData = await fetchMessages();
                        messages = newData;
                    } catch (insertErr) { console.warn('插入欢迎留言失败:', insertErr); }
                }
            } catch (err) {
                messagesError = err.message || '加载失败';
            } finally {
                messagesLoading = false;
                await renderMessages();
            }
        }

        // ============================================================
        // 作者模式激活（三击 logo）
        // ============================================================
        var brandClickCount = 0;
        var brandClickTimer = null;

        function bindBrandClick() {
            var brandEl = document.querySelector('.brand');
            if (!brandEl) return;
            brandEl.addEventListener('click', async function(e) {
                brandClickCount++;
                clearTimeout(brandClickTimer);
                brandClickTimer = setTimeout(function() { brandClickCount = 0; }, 800);
                if (brandClickCount === 3) {
                    brandClickCount = 0;
                    if (!isAuthorMode) {
                        var pwd = prompt('请输入作者密码：');
                        if (pwd === null) return;
                        var hash = await sha256(pwd);
                        var correctHash = await sha256(AUTHOR_PASSWORD);
                        if (hash === correctHash) {
                            isAuthorMode = true;
                            document.getElementById('msgAuthorOptions').classList.add('active');
                            showToast('作者模式已激活');
                            renderMessages();
                        } else {
                            showToast('密码错误');
                        }
                    } else {
                        isAuthorMode = false;
                        document.getElementById('msgAuthorOptions').classList.remove('active');
                        showToast('已退出作者模式');
                        renderMessages();
                    }
                }
            });
        }

        // ============================================================
        // 初始化
        // ============================================================
        (function init() {
            const session = getSessionUser();
            if (!session || !session.id) {
                window.location.href = 'index.html';
                return;
            }
            currentUser = session;
            isAdmin = (currentUser.phone === '17355394710');

            renderHeader('留言板', 'messages');
            renderFooter('messages');

            bindBrandClick();
            updateBannedBanner();
            loadAllData();

            // 实时订阅
            window.sb.channel('public-messages')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, function() { loadAllData(); })
                .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'messages' }, function() { loadAllData(); })
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'messages' }, function() { loadAllData(); })
                .subscribe();

            // 用户信息同步
            function syncUser() {
                const s = getSessionUser();
                if (s && s.id) {
                    if (!currentUser || currentUser.id !== s.id ||
                        currentUser.avatar_url !== s.avatar_url ||
                        currentUser.nickname !== s.nickname) {
                        currentUser = s;
                        isAdmin = (currentUser.phone === '17355394710');
                        updateBannedBanner();
                        renderMessages();
                    }
                }
            }
            window.addEventListener('focus', syncUser);
            document.addEventListener('visibilitychange', function() {
                if (!document.hidden) syncUser();
            });
        })();

        document.addEventListener('gesturestart', function(e) { e.preventDefault(); });
    </script>
