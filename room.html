<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>房间 · Seven戚</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
:root{--bg:#f5faf5;--bg-card:#fff;--bg-input:#eaf3ea;--border:#c8e0c8;--text:#1e3a2e;--text-muted:#5a7a6a;--text-light:#8aaa9a;--primary:#2e7d32;--primary-light:#4caf50;--primary-bg:#e8f5e9;--shadow:0 8px 32px rgba(46,125,50,.12);--radius-sm:10px;--font:"Space Grotesk","PingFang SC","Segoe UI",system-ui,sans-serif;--danger:#e57373;--danger-bg:#ffebee;--danger-text:#c62828;--warning:#ffa726;--official-blue:#2b6cff;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);overflow:hidden}
body{display:flex;flex-direction:column;height:100vh;height:100dvh}
.view-list,.view-detail{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);transition:transform .3s cubic-bezier(.4,0,.2,1)}
.view-list.hidden{transform:translateX(-30%);opacity:.5;pointer-events:none}
.view-detail{transform:translateX(100%)}
.view-detail.open{transform:translateX(0)}
.page-header{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:calc(10px + var(--safe-t)) 14px 10px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--border);min-height:56px;backdrop-filter:blur(8px);z-index:10}
.page-header .back{background:none;border:none;cursor:pointer;padding:4px;color:var(--text);display:flex;flex-shrink:0}
.page-header .back svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.page-header .title{font-weight:700;font-size:1em;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.header-actions{display:flex;gap:6px;flex-shrink:0}
.header-action{background:var(--bg-input);color:var(--text);border:none;border-radius:99px;padding:6px 12px;font-size:.75em;font-weight:700;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:4px;position:relative}
.header-action.primary{background:var(--primary);color:#fff}
.header-action svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.header-action .cnt{background:var(--danger);color:#fff;font-size:.85em;font-weight:800;min-width:16px;height:16px;line-height:16px;text-align:center;border-radius:99px;padding:0 4px}
.room-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:16px;overflow-y:auto}
.room-card{position:relative;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:18px 12px;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;transition:.2s;min-height:126px;justify-content:center;text-align:center}
.room-card:hover{border-color:var(--primary);box-shadow:var(--shadow);transform:translateY(-2px)}
.room-card-icon{color:var(--primary)}
.room-card-icon svg{width:44px;height:44px;stroke:currentColor;fill:none;stroke-width:1.5}
.room-card-name{font-weight:700;font-size:.9em;line-height:1.3;word-break:break-word;max-width:100%}
.room-card-meta{font-size:.66em;color:var(--text-muted)}
.room-card-badge{position:absolute;top:8px;left:8px;background:var(--official-blue);color:#fff;font-size:.55em;font-weight:700;padding:1px 7px;border-radius:99px;line-height:15px}
.room-edit-btn{position:absolute;top:6px;right:6px;background:var(--bg-input);border:none;border-radius:50%;width:26px;height:26px;display:grid;place-items:center;cursor:pointer;color:var(--text-muted);padding:0}
.room-edit-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.room-edit-btn:hover{background:var(--primary);color:#fff}
.empty-state{grid-column:1/-1;text-align:center;color:var(--text-muted);padding:60px 20px;font-size:.85em}
.empty-state .big{font-size:2.8em;margin-bottom:8px;opacity:.5}
.loading-state{grid-column:1/-1;text-align:center;color:var(--text-muted);padding:40px 20px;font-size:.9em}
.spinner{display:inline-block;width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:12px}
@keyframes spin{to{transform:rotate(360deg)}}
.room-body{flex:1;min-height:0;display:flex;flex-direction:column;transition:background .8s;background:linear-gradient(135deg,#f5faf5,#e8f5e9);overflow:hidden}
.room-body[data-theme="gomoku"]{background:linear-gradient(135deg,#f5faf5,#e8f5e9);color:var(--text)}
.room-body[data-theme="draw"]{background:linear-gradient(135deg,#e3f2fd,#bbdefb 35%,#90caf9 70%,#fff);background-size:200% 200%;animation:drawBgFlow 10s ease infinite;color:#0d47a1}
.room-body[data-theme="spy"]{background:linear-gradient(135deg,#1a0f2a,#2a1a3a 50%,#0d0818);color:#e0d5f0}
.room-body[data-theme="werewolf"]{background:linear-gradient(135deg,#3a0a0a,#1a0505 50%,#0d0202);color:#e0d5d5}
@keyframes drawBgFlow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.stage-wrap{flex-shrink:0;padding:12px 14px 0;position:relative;z-index:1;display:flex;flex-direction:column;min-height:0}
.chat-panel{flex:1;display:flex;flex-direction:column;min-height:0}
.mic-panel{background:rgba(255,255,255,.92);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;backdrop-filter:blur(8px)}
.room-body[data-theme="spy"] .mic-panel,.room-body[data-theme="werewolf"] .mic-panel{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2)}
.mic-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mic-title{font-size:.8em;font-weight:700}
.mic-mode{font-size:.65em;color:var(--primary);background:var(--primary-bg);padding:2px 10px;border-radius:99px;font-weight:700}
.mic-off{font-size:.75em;color:var(--text-muted);text-align:center;padding:10px 0}
.mic-seats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mic-seat{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:10px;background:rgba(255,255,255,.7);border:1.5px dashed var(--border)}
.room-body[data-theme="spy"] .mic-seat,.room-body[data-theme="werewolf"] .mic-seat{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2)}
.mic-seat.on{background:var(--primary-bg);border-style:solid;border-color:var(--primary)}
.mic-avatar{width:34px;height:34px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;background-size:cover;background-position:center}
.mic-avatar.empty{background:#dfe9df;color:var(--text-light);font-size:18px}
.mic-name{font-size:.62em;color:var(--text-muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.mic-seat.on .mic-name{color:var(--text)}
.room-body[data-theme="spy"] .mic-seat.on .mic-name,.room-body[data-theme="werewolf"] .mic-seat.on .mic-name{color:inherit}
.mic-x{position:absolute;top:1px;right:1px;background:none;border:none;color:var(--danger);cursor:pointer;font-size:11px;padding:0 3px;line-height:1}
.mic-actions{display:flex;gap:8px;margin-top:10px}
.mic-btn{flex:1;padding:8px;border-radius:99px;border:none;font-family:inherit;font-weight:700;font-size:.78em;cursor:pointer}
.mic-btn.join{background:var(--primary);color:#fff}
.mic-btn.leave{background:var(--danger-bg);color:var(--danger-text)}
.mic-btn.waiting{background:var(--warning);color:#fff}
.mic-queue{margin-top:10px;border-top:1px dashed var(--border);padding-top:8px}
.mic-queue-title{font-size:.68em;color:var(--text-muted);font-weight:700;margin-bottom:6px}
.mic-queue-item{display:flex;align-items:center;gap:6px;font-size:.75em;padding:5px 8px;background:rgba(255,255,255,.5);border-radius:8px;margin-bottom:5px}
.mic-queue-item span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.mic-queue-item button{border:none;border-radius:99px;padding:3px 10px;font-size:.85em;font-weight:700;cursor:pointer;font-family:inherit}
.mic-queue-item button:first-of-type{background:var(--primary);color:#fff}
.mic-queue-item button:last-of-type{background:var(--danger-bg);color:var(--danger-text)}
.game-stage{display:none;background:rgba(255,255,255,.9);border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;backdrop-filter:blur(10px);position:relative;margin-top:10px}
.room-body[data-theme="spy"] .game-stage,.room-body[data-theme="werewolf"] .game-stage{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.15)}
.game-stage.active{display:flex;flex-direction:column}
.game-topbar{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid rgba(0,0,0,.06);flex-shrink:0}
.room-body[data-theme="spy"] .game-topbar,.room-body[data-theme="werewolf"] .game-topbar{border-bottom-color:rgba(255,255,255,.12)}
.gpm-players{display:flex;align-items:center;gap:6px;flex:1;overflow-x:auto;padding:2px 0}
.gpm-player{display:flex;align-items:center;gap:5px;background:rgba(0,0,0,.05);border-radius:99px;padding:3px 10px 3px 3px;flex-shrink:0}
.room-body[data-theme="spy"] .gpm-player,.room-body[data-theme="werewolf"] .gpm-player{background:rgba(255,255,255,.1)}
.gpm-avatar{width:22px;height:22px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700;font-size:10px;background-size:cover;background-position:center;flex-shrink:0}
.gpm-name{font-size:.68em;font-weight:700;white-space:nowrap;max-width:60px;overflow:hidden;text-overflow:ellipsis}
.gpm-turn{box-shadow:0 0 0 2px var(--primary);animation:pulseTurn 1.5s infinite}
.gpm-player.gpm-offline{opacity:.45;filter:grayscale(1)}
.gpm-player.gpm-offline .gpm-name::after{content:" 离线";font-size:.85em;color:var(--text-muted)}
@keyframes pulseTurn{0%,100%{box-shadow:0 0 0 2px var(--primary)}50%{box-shadow:0 0 0 4px rgba(46,125,50,.3)}}
.fs-btn{background:rgba(0,0,0,.06);border:none;border-radius:8px;width:30px;height:30px;display:grid;place-items:center;cursor:pointer;color:inherit;flex-shrink:0}
.room-body[data-theme="spy"] .fs-btn,.room-body[data-theme="werewolf"] .fs-btn{background:rgba(255,255,255,.12)}
.fs-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.fs-btn:hover{background:rgba(0,0,0,.12)}
.fs-btn:active{background:var(--primary);color:#fff}
@media(hover:hover){.fs-btn:hover{background:var(--primary);color:#fff}}
.game-content{padding:10px;min-height:180px;max-height:60vh;overflow-y:auto;position:relative;flex:1}
.danmaku-layer{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:100;display:none}
.game-stage:fullscreen .danmaku-layer{display:block}
body.pseudo-fs{overflow:hidden}
body.pseudo-fs #gameStage{position:fixed;inset:0;z-index:4000;margin:0;border-radius:0}
body.pseudo-fs .danmaku-layer{display:block}
/* 全屏：铺满 + 不透明主题背景 */
.game-stage:fullscreen{border:none;border-radius:0;margin:0}
.game-stage:fullscreen,.game-stage:fullscreen.active{background:#e8f5e9}
.room-body[data-theme="draw"] .game-stage:fullscreen{background:#bbdefb}
.room-body[data-theme="spy"] .game-stage:fullscreen{background:#1a0f2a}
.room-body[data-theme="werewolf"] .game-stage:fullscreen{background:#1a0505}
.room-body[data-theme="doudizhu"] .game-stage:fullscreen{background:#0b3d1e}
body.pseudo-fs .room-body .game-stage,body.pseudo-fs #gameStage{background:#e8f5e9}
body.pseudo-fs .room-body[data-theme="draw"] #gameStage{background:#bbdefb}
body.pseudo-fs .room-body[data-theme="spy"] #gameStage{background:#1a0f2a}
body.pseudo-fs .room-body[data-theme="werewolf"] #gameStage{background:#1a0505}
body.pseudo-fs .room-body[data-theme="doudizhu"] #gameStage{background:#0b3d1e}
.danmaku-item{position:absolute;left:100%;white-space:nowrap;color:#fff;font-weight:700;font-size:1.05em;padding:6px 14px;background:rgba(0,0,0,.38);border-radius:99px;text-shadow:0 1px 3px rgba(0,0,0,.9);animation:danmakuScroll linear forwards;backdrop-filter:blur(4px)}
@keyframes danmakuScroll{from{transform:translateX(0)}to{transform:translateX(calc(-100vw - 100%))}}
.spectator-bar{display:flex;align-items:center;gap:8px;padding:6px 10px;background:linear-gradient(90deg,rgba(255,167,38,.18),rgba(255,167,38,.06));border-bottom:1px solid rgba(255,167,38,.3);font-size:.75em;font-weight:700;flex-shrink:0;color:#bf7000}
.room-body[data-theme="spy"] .spectator-bar,.room-body[data-theme="werewolf"] .spectator-bar{background:linear-gradient(90deg,rgba(255,167,38,.2),rgba(255,167,38,.08));color:#ffd699}
.spectator-bar .eye{display:flex;align-items:center;gap:4px}
.spectator-bar .eye svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.spectator-bar .spacer{flex:1}
.spectator-bar button{background:var(--primary);color:#fff;border:none;border-radius:99px;padding:4px 12px;font-family:inherit;font-weight:700;font-size:.9em;cursor:pointer}
.spectator-bar button.ghost{background:rgba(0,0,0,.1);color:var(--text-muted)}
.spectator-bar button:disabled{opacity:.5;pointer-events:none}
.game-lobby{display:flex;flex-direction:column;align-items:center;gap:14px;padding:20px 10px;text-align:center}
.lobby-icon{width:72px;height:72px;display:grid;place-items:center;color:var(--primary)}
.lobby-icon svg{width:56px;height:56px;stroke:currentColor;fill:none;stroke-width:1.5}
.lobby-title{font-size:1.1em;font-weight:800}
.lobby-desc{font-size:.8em;color:var(--text-muted);max-width:320px;line-height:1.6}
.lobby-players{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0;max-width:100%}
.lobby-player{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.05);border-radius:99px;padding:4px 12px 4px 4px;font-size:.78em;font-weight:700}
.room-body[data-theme="spy"] .lobby-player,.room-body[data-theme="werewolf"] .lobby-player{background:rgba(255,255,255,.1)}
.lobby-player .gpm-avatar{width:24px;height:24px}
.lobby-player.host{border:1px solid var(--primary);background:var(--primary-bg)}
.room-body[data-theme="spy"] .lobby-player.host,.room-body[data-theme="werewolf"] .lobby-player.host{background:rgba(46,125,50,.35);border-color:#66bb6a}
.lobby-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.lobby-btn{padding:10px 24px;border-radius:99px;border:none;font-family:inherit;font-weight:700;font-size:.88em;cursor:pointer;transition:.2s}
.lobby-btn.join{background:var(--primary);color:#fff}
.lobby-btn.join:hover{background:var(--primary-light)}
.lobby-btn.spectate{background:rgba(0,0,0,.06);color:var(--text);border:2px solid var(--border)}
.room-body[data-theme="spy"] .lobby-btn.spectate,.room-body[data-theme="werewolf"] .lobby-btn.spectate{background:rgba(255,255,255,.1);color:#e0d5f0;border-color:rgba(255,255,255,.2)}
.lobby-btn.spectate:hover{background:var(--primary-bg);border-color:var(--primary);color:var(--primary)}
.lobby-btn.start{background:var(--official-blue);color:#fff;animation:pulseStart 1.6s infinite}
@keyframes pulseStart{0%,100%{box-shadow:0 0 0 0 rgba(43,108,255,.5)}50%{box-shadow:0 0 0 8px rgba(43,108,255,0)}}
.lobby-btn:disabled{opacity:.5;pointer-events:none;animation:none}
.lobby-count{font-size:.75em;color:var(--text-muted);font-weight:700}
.lobby-hint{font-size:.78em;color:var(--text-muted);margin-top:2px}
.gomoku-wrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.gomoku-status{font-size:.85em;font-weight:700;text-align:center;min-height:22px}
.gomoku-board{display:grid;grid-template-columns:repeat(15,1fr);width:min(78vw,320px);aspect-ratio:1;background:#dcb35c;border-radius:8px;padding:4px;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.gmk-cell{position:relative;display:flex;align-items:center;justify-content:center;border:.5px solid rgba(90,60,20,.45);cursor:pointer}
.gmk-cell:active{background:rgba(255,255,255,.25)}
.gmk-cell.gmk-sel{background:rgba(255,213,79,.45);box-shadow:inset 0 0 0 2px #f0b429}
.gmk-sel-mark{position:absolute;width:40%;height:40%;border-radius:50%;background:rgba(240,180,41,.6);animation:gmkPulse .9s infinite}
@keyframes gmkPulse{0%,100%{opacity:.5;transform:scale(.85)}50%{opacity:1;transform:scale(1)}}
.gomoku-place-btn{margin-top:12px;padding:11px 40px;border:none;border-radius:99px;background:linear-gradient(180deg,#ffd54f,#f0b429);color:#3e2723;font-weight:800;font-family:inherit;font-size:.9em;cursor:pointer;box-shadow:0 4px 12px rgba(240,180,41,.45);letter-spacing:2px;animation:gmkBtnIn .25s}
@keyframes gmkBtnIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.gomoku-place-btn:active{transform:translateY(2px)}
.gmk-stone{width:84%;height:84%;border-radius:50%;display:block;box-shadow:0 1px 3px rgba(0,0,0,.35);animation:stoneIn .16s ease}
@keyframes stoneIn{from{transform:scale(.4);opacity:.4}to{transform:scale(1);opacity:1}}
.gmk-stone.black{background:radial-gradient(circle at 32% 32%,#6a6a6a,#000)}
.gmk-stone.white{background:radial-gradient(circle at 32% 32%,#fff,#b9b9b9)}
.draw-wrap{display:flex;flex-direction:column;gap:10px}
.draw-info{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.8em;font-weight:700;flex-wrap:wrap}
.draw-timer{background:rgba(25,118,210,.15);color:#1976d2;padding:4px 12px;border-radius:99px;font-weight:800;font-size:1.05em;min-width:60px;text-align:center}
.draw-timer.urgent{background:rgba(229,57,53,.18);color:#e53935;animation:pulseUrgent .8s infinite}
@keyframes pulseUrgent{0%,100%{opacity:1}50%{opacity:.5}}
.draw-word{background:linear-gradient(135deg,#1976d2,#42a5f5);color:#fff;padding:5px 14px;border-radius:99px;font-size:1.05em;letter-spacing:2px}
.draw-word.hidden-word{background:rgba(255,255,255,.4);color:#1976d2;letter-spacing:6px}
.draw-canvas-wrap{position:relative;width:100%;max-width:100%;background:#fff;border-radius:10px;overflow:hidden;border:2px solid #90caf9;box-sizing:border-box}
.draw-canvas{display:block;width:100%;touch-action:none;cursor:crosshair}
.draw-tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.draw-color{width:24px;height:24px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.15);cursor:pointer}
.draw-color.active{box-shadow:0 0 0 3px #1976d2}
.draw-size{background:#fff;border:2px solid #90caf9;color:#1976d2;font-weight:700;padding:4px 10px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:.75em}
.draw-size.active{background:#1976d2;color:#fff;border-color:#1976d2}
.draw-guess-box{display:flex;gap:6px}
.draw-guess-box input{flex:1;padding:8px 12px;border:2px solid #90caf9;border-radius:10px;font-family:inherit;font-size:.85em;outline:none;background:#fff;color:#0d47a1}
.draw-guess-box button{padding:8px 16px;border:none;background:#1976d2;color:#fff;border-radius:10px;font-weight:700;cursor:pointer;font-family:inherit;font-size:.8em}
.draw-messages{max-height:80px;overflow-y:auto;font-size:.75em;background:rgba(255,255,255,.5);border-radius:8px;padding:6px 10px}
.draw-msg{margin-bottom:3px;color:#0d47a1}
.draw-msg.correct{color:#2e7d32;font-weight:700}
.draw-scoreboard{display:flex;flex-wrap:wrap;gap:6px;font-size:.72em;justify-content:center}
.draw-score{background:rgba(255,255,255,.55);border-radius:8px;padding:4px 10px;font-weight:700;display:flex;align-items:center;gap:4px}
.draw-score.drawing{background:var(--primary-bg);border:1px solid var(--primary);color:var(--primary);box-shadow:0 0 0 2px rgba(46,125,50,.2)}
.draw-score .pts{color:#1976d2;font-weight:900}
.draw-intermission{text-align:center;padding:30px 20px;color:#1976d2;font-weight:800}
.draw-intermission .big{font-size:1.3em;margin-bottom:10px}
.spy-wrap{display:flex;flex-direction:column;gap:10px;color:#e0d5f0}
.spy-role-card{background:linear-gradient(135deg,rgba(180,140,255,.2),rgba(120,80,200,.15));border:2px solid rgba(200,160,255,.4);border-radius:12px;padding:14px;text-align:center;backdrop-filter:blur(8px)}
.spy-role-label{font-size:.65em;text-transform:uppercase;letter-spacing:.1em;opacity:.7;margin-bottom:4px}
.spy-role-word{font-size:1.4em;font-weight:900;letter-spacing:4px;background:linear-gradient(135deg,#c8a5ff,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

.ddz-wrap{display:flex;flex-direction:column;gap:8px;color:#e8f5e9;width:100%}
.ddz-info{display:flex;justify-content:space-between;font-size:.75em;font-weight:700;background:rgba(255,255,255,.08);border-radius:8px;padding:6px 10px}
.ddz-table{position:relative;min-height:130px;display:flex;flex-direction:column;gap:8px;background:rgba(0,0,0,.18);border-radius:12px;padding:10px}
.ddz-seat{display:flex;align-items:center;gap:8px;font-size:.75em;font-weight:700}
.ddz-seat .avatar{width:26px;height:26px;border-radius:50%;background:var(--primary);display:grid;place-items:center;font-size:11px;background-size:cover;background-position:center}
.ddz-seat.landlord .name{color:#ffd54f}
.ddz-seat.turn{outline:2px solid #ffd54f;border-radius:8px;padding:2px 6px}
.ddz-count{background:rgba(255,255,255,.15);border-radius:99px;padding:1px 8px;font-size:.9em}
.ddz-play-area{display:flex;justify-content:center;align-items:center;gap:4px;min-height:64px;flex-wrap:wrap;background:rgba(0,0,0,.15);border-radius:10px;padding:6px}
.ddz-play-label{font-size:.7em;opacity:.7}
.ddz-hand{display:flex;justify-content:center;flex-wrap:wrap;gap:2px;padding:6px 0;min-height:66px}
.ddz-card{width:38px;height:54px;border-radius:6px;background:#fff;color:#222;border:1px solid #bbb;box-shadow:0 2px 4px rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;cursor:pointer;user-select:none;position:relative;transition:transform .12s;flex-shrink:0}
.ddz-card .rk{font-size:16px;line-height:1}
.ddz-card .su{font-size:13px;line-height:1}
.ddz-card.red{color:#d32f2f}
.ddz-card.black{color:#212121}
.ddz-card.sel{transform:translateY(-14px);box-shadow:0 6px 10px rgba(0,0,0,.4);border-color:#ffd54f}
.ddz-card.mini{width:26px;height:38px}
.ddz-card.mini .rk{font-size:12px}
.ddz-card.mini .su{font-size:10px}
.ddz-card.back{background:linear-gradient(135deg,#1565c0,#0d47a1);color:transparent;border-color:#0b3d91}
.ddz-card.back .rk,.ddz-card.back .su{display:none}
.ddz-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.ddz-btn{padding:9px 18px;border:none;border-radius:10px;font-weight:800;font-family:inherit;font-size:.82em;cursor:pointer;background:#ffd54f;color:#3e2723}
.ddz-btn.pass{background:rgba(255,255,255,.2);color:#e8f5e9}
.ddz-btn:disabled{opacity:.4;cursor:default}
.ddz-status{text-align:center;font-size:.85em;font-weight:800;color:#ffd54f;padding:4px}
.ddz-result{text-align:center;padding:24px 16px}
.ddz-result .big{font-size:1.4em;font-weight:900;margin-bottom:10px}
.ddz-board{display:flex;flex-direction:column;gap:8px;color:#e8f5e9;width:100%}
.ddz-opps{display:flex;gap:10px}
.ddz-opp{flex:1;display:flex;flex-direction:column;gap:5px;background:rgba(0,0,0,.2);border-radius:12px;padding:8px;border:2px solid rgba(255,255,255,.12);transition:border-color .2s}
.ddz-opp.turn{border-color:#ffd54f}
.ddz-opp.landlord{border-color:rgba(255,213,79,.6)}
.ddz-opp-head{display:flex;align-items:center;gap:7px;position:relative}
.ddz-opp-head .avatar{width:28px;height:28px;border-radius:50%;background:var(--primary);display:grid;place-items:center;font-size:12px;background-size:cover;background-position:center;flex-shrink:0;border:2px solid rgba(255,255,255,.2)}
.ddz-opp-head .nm{flex:1;font-size:.78em;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ddz-opp.landlord .nm{color:#ffd54f}
.ddz-opp-head .cnt{font-size:.7em;color:rgba(232,245,233,.7)}
.ddz-opp-head .crown{position:absolute;top:-13px;right:2px;font-size:13px}
.ddz-bubble{align-self:center;font-size:.68em;font-weight:800;padding:3px 10px;border-radius:99px;animation:ddzIn .3s}
.ddz-bubble.yes{background:#ffd54f;color:#3e2723}
.ddz-bubble.no{background:rgba(255,255,255,.15);color:rgba(232,245,233,.7)}
.ddz-opp-play{display:flex;justify-content:center;flex-wrap:wrap;gap:1px;min-height:36px;align-items:center;animation:ddzIn .25s}
.ddz-center{display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:center;flex:1;min-height:50px}
.ddz-my-play{display:flex;justify-content:center;flex-wrap:wrap;gap:2px;min-height:40px;align-items:center;animation:ddzIn .25s}
.ddz-pass-tag{font-size:.7em;color:rgba(232,245,233,.65);font-weight:800;padding:5px 12px;background:rgba(0,0,0,.22);border-radius:99px}
@keyframes ddzIn{from{opacity:0;transform:translateY(10px) scale(.9)}to{opacity:1;transform:none}}
.ddz-card.deal-in{animation:ddzDeal .3s ease}
@keyframes ddzDeal{from{opacity:0;transform:translateY(-30px) scale(.5)}to{opacity:1;transform:none}}

.room-messages{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px;position:relative;z-index:1;min-height:0}
.rm-msg{display:flex;gap:9px;flex-shrink:0;max-width:92%}
.rm-msg.self{align-self:flex-end;flex-direction:row-reverse}
.rm-avatar{width:30px;height:30px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;flex-shrink:0;background-size:cover;background-position:center}
.rm-bubble{background:rgba(255,255,255,.85);border:1px solid rgba(0,0,0,.06);border-radius:12px;padding:7px 11px;min-width:0}
.room-body[data-theme="spy"] .rm-bubble,.room-body[data-theme="werewolf"] .rm-bubble{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.15)}
.rm-msg.self .rm-bubble{background:var(--primary-bg);border-color:var(--primary)}
.rm-name{font-size:.66em;color:var(--text-muted);font-weight:700;margin-bottom:2px}
.rm-text{font-size:.84em;line-height:1.5;word-break:break-word}
.room-input-area{flex-shrink:0;display:flex;gap:8px;align-items:center;padding:10px 14px calc(10px + var(--safe-b));background:rgba(255,255,255,.9);border-top:1px solid var(--border);backdrop-filter:blur(8px);z-index:2}
.room-input-area input{flex:1;padding:10px 14px;border-radius:99px;border:2px solid var(--border);background:var(--bg-input);font-family:inherit;font-size:.85em;outline:none;min-width:0;color:var(--text)}
.room-input-area input:focus{border-color:var(--primary)}
.room-input-area .game-btn{background:var(--bg-card);border:2px solid var(--border);color:var(--text);padding:8px 14px;border-radius:99px;font-size:.78em;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;display:flex;align-items:center;gap:4px}
.room-input-area .game-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.room-input-area .game-btn:hover:not(:disabled){border-color:var(--primary);color:var(--primary)}
.room-input-area .game-btn:disabled{opacity:.5;pointer-events:none}
.rp-list{padding:0 14px;display:flex;flex-direction:column;gap:8px;flex-shrink:0;}
.rp-list:not(:empty){padding-top:12px;}
.rp-card{flex-shrink:0;max-width:78%;align-self:center;background:linear-gradient(135deg,#ff7043,#e64a19);border-radius:14px;padding:14px 18px;color:#fff;cursor:pointer;box-shadow:0 6px 18px rgba(230,74,25,.3);position:relative;overflow:hidden;transition:transform .15s;}
.rp-card:active{transform:scale(.97)}
.rp-card.grabbed{background:linear-gradient(135deg,#9e9e9e,#757575);box-shadow:none;cursor:default;}
.rp-card.done{background:linear-gradient(135deg,#bdbdbd,#9e9e9e);box-shadow:none;cursor:default;}
.rp-card .rp-top{display:flex;align-items:center;gap:8px;font-weight:800;font-size:.9em;}
.rp-card .rp-top svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;flex-shrink:0;}
.rp-card .rp-sub{font-size:.72em;opacity:.9;margin-top:5px;}
.rp-card .rp-amt{font-size:1.5em;font-weight:900;margin-top:4px;}
.rp-rank-item{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-radius:8px;background:var(--bg-input);margin-bottom:6px;font-size:.85em;}
.rp-rank-item .rr-left{display:flex;align-items:center;gap:10px;}
.rp-rank-item .rr-no{width:20px;text-align:center;font-weight:800;color:var(--text-muted);}
.rp-rank-item .rr-no.top1{color:#e6a700;}
.rp-rank-item .rr-amt{font-weight:800;color:var(--primary);}
.room-input-area .send-btn{background:var(--primary);color:#fff;border:none;padding:9px 16px;border-radius:99px;font-weight:700;font-size:.8em;cursor:pointer;font-family:inherit}
@media (min-width: 900px) {
  .room-body{flex-direction:row}
  .stage-wrap{flex:7;padding:14px;min-height:0;overflow:hidden;display:flex;flex-direction:column}
  .game-stage{flex:1;margin-top:0;min-height:0}
  .game-stage.active{flex:1}
  .game-content{flex:1;max-height:none}
  .gomoku-board{width:min(56vw,520px)}
  .chat-panel{flex:0 0 360px;max-width:360px;border-left:1px solid var(--border);background:rgba(255,255,255,.55);backdrop-filter:blur(8px)}
  .room-messages{flex:1}
}
.drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .3s;z-index:399}
.drawer-backdrop.open{opacity:1;pointer-events:auto}
.game-drawer{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:20px 20px 0 0;padding:8px 16px calc(20px + var(--safe-b));transform:translateY(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);z-index:400;max-height:70vh;overflow-y:auto;box-shadow:0 -8px 32px rgba(0,0,0,.15)}
.game-drawer.open{transform:translateY(0)}
.drawer-handle{width:44px;height:5px;background:#ddd;border-radius:99px;margin:0 auto 12px}
.drawer-title{font-size:1em;font-weight:800;margin-bottom:14px;text-align:center}
.game-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.game-card{background:var(--bg);border:2px solid var(--border);border-radius:14px;padding:16px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;transition:.2s;text-align:center}
.game-card:hover{border-color:var(--primary);background:var(--primary-bg);transform:translateY(-2px)}
.game-card.active{border-color:var(--primary);background:var(--primary-bg);box-shadow:0 0 0 3px rgba(46,125,50,.15)}
.game-card-icon{width:44px;height:44px;display:grid;place-items:center;color:var(--primary)}
.game-card-icon svg{width:32px;height:32px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.game-card-name{font-weight:800;font-size:.9em}
.game-card-desc{font-size:.66em;color:var(--text-muted)}
.member-drawer{position:fixed;top:0;right:0;bottom:0;width:300px;max-width:85vw;background:#fff;box-shadow:-8px 0 32px rgba(0,0,0,.15);transform:translateX(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);z-index:401;display:flex;flex-direction:column;padding-top:var(--safe-t)}
.member-drawer.open{transform:translateX(0)}
.member-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 12px;border-bottom:1px solid var(--border)}
.member-head h3{font-size:1em;font-weight:800;display:flex;align-items:center;gap:8px}
.member-head .cnt{background:var(--primary);color:#fff;font-size:.75em;font-weight:800;padding:1px 8px;border-radius:99px}
.member-head button{background:none;border:none;cursor:pointer;color:var(--text-light);padding:4px;display:flex}
.member-head button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.member-body{flex:1;overflow-y:auto;padding:12px 14px}
.member-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;margin-bottom:6px}
.member-row:hover{background:var(--bg-input)}
.member-row .avatar{width:38px;height:38px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px;flex-shrink:0;background-size:cover;background-position:center}
.member-row .info{flex:1;min-width:0}
.member-row .name{font-weight:700;font-size:.9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.member-row .role{font-size:.68em;color:var(--text-muted);font-weight:600;margin-top:2px}
.member-row .role.host{color:var(--primary);font-weight:800}
.member-row .role.game{color:var(--official-blue);font-weight:700}
.member-row .online-dot{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.2);flex-shrink:0}
.member-mute-btn{background:var(--bg-input);border:none;border-radius:8px;padding:4px 10px;font-size:.68em;font-weight:700;font-family:inherit;cursor:pointer;color:var(--text-muted);flex-shrink:0}
.member-mute-btn.on{background:rgba(229,57,53,.12);color:var(--danger)}
.re-danger{margin:4px 18px 10px;padding:12px 14px;border:1px solid rgba(229,57,53,.3);border-radius:10px;background:rgba(229,57,53,.05)}
.re-danger-title{font-size:.72em;font-weight:800;color:var(--danger);cursor:pointer;display:flex;align-items:center;gap:4px;user-select:none}

.re-tabs{display:flex;gap:6px;padding:10px 18px 0;border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto}
.re-tab{padding:9px 16px;border:none;background:none;font-family:inherit;font-size:.85em;font-weight:700;color:var(--text-muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.re-tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.re-tabpane{display:none}
.re-tabpane.active{display:block}
.re-danger-body .re-danger-btn{margin-top:6px}
.re-danger-title.open svg{transform:rotate(180deg)}
.re-danger-body{margin-top:8px}
.re-danger-btn{display:block;width:100%;margin-bottom:6px;padding:9px;border:none;border-radius:8px;background:rgba(229,57,53,.12);color:var(--danger);font-weight:700;font-family:inherit;font-size:.82em;cursor:pointer}
.re-danger-btn:last-child{margin-bottom:0}
.re-danger-btn:hover{background:var(--danger);color:#fff}
.re-overlay{position:fixed;inset:0;z-index:3000;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px}
.re-panel{background:#fff;border-radius:16px;max-width:480px;width:100%;max-height:88vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 16px 48px rgba(0,0,0,.25)}
.re-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 12px;border-bottom:1px solid var(--border)}
.re-head h3{font-size:1.02em;margin:0;font-weight:800}
.re-head button{background:none;border:none;cursor:pointer;color:var(--text-light);padding:4px}
.re-head button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.re-body{padding:16px 18px;overflow-y:auto;flex:1}
.re-field{margin-bottom:16px}
.re-field>label{display:block;font-size:.72em;font-weight:700;color:var(--text-muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
.re-field input[type=text]{width:100%;padding:10px 12px;border:2px solid var(--border);border-radius:10px;font-family:inherit;font-size:.9em;outline:none;box-sizing:border-box;color:var(--text);background:var(--bg-input)}
.re-radio-row{display:flex;gap:8px;flex-wrap:wrap}
.re-radio{flex:1;min-width:120px;display:flex;align-items:center;gap:7px;padding:10px 12px;border:2px solid var(--border);border-radius:10px;font-size:.8em;font-weight:600;cursor:pointer}
.re-radio input{accent-color:var(--primary)}

.re-foot .cancel{background:var(--bg-input);color:var(--text-muted)}
.re-foot .ok{background:var(--primary);color:#fff}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:#fff;padding:.7em 1.5em;border-radius:2em;font-weight:600;font-size:.85em;opacity:0;transition:all .4s ease;z-index:9999;pointer-events:none;white-space:nowrap;box-shadow:var(--shadow);max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.custom-modal{position:fixed;inset:0;z-index:5000;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:20px}
.custom-modal.active{display:flex}
.custom-modal .modal-box{background:#fff;border-radius:16px;max-width:420px;width:100%;padding:24px;box-shadow:var(--shadow);border:1px solid var(--border)}
.modal-title{font-size:1.2em;font-weight:700;margin-bottom:8px}
.modal-body{font-size:.95em;color:var(--text-muted);margin-bottom:12px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.modal-pref{display:flex;align-items:center;gap:6px;font-size:.82em;color:var(--text-muted);margin-bottom:14px;cursor:pointer}
.modal-pref input{accent-color:var(--primary)}

.modal-actions button{padding:6px 18px;border-radius:10px;border:none;font-weight:600;cursor:pointer;font-family:inherit}
.modal-actions .btn-danger{background:#e57373;color:#fff}
.modal-actions .btn-secondary{background:var(--bg-input);color:var(--text-muted)}
/* 游戏设置弹窗 */
.gprefs-overlay{position:fixed;inset:0;z-index:6000;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:20px}
.gprefs-overlay.open{display:flex}
.gprefs-box{background:#fff;border-radius:16px;padding:22px 20px;max-width:340px;width:100%;box-shadow:0 16px 48px rgba(0,0,0,.25)}
.gprefs-box h3{font-size:1.05em;margin:0 0 16px;color:var(--text)}

.gprefs-close{display:block;width:100%;padding:11px;border:none;border-radius:10px;background:var(--primary);color:#fff;font-weight:800;font-family:inherit;font-size:.9em;cursor:pointer}
.toggle-switch{display:inline-block;position:relative;width:52px;height:30px;flex-shrink:0}
.toggle-input{display:none}
.toggle-label{position:absolute;top:0;left:0;width:52px;height:30px;background-color:#ccc;border-radius:30px;cursor:pointer;transition:background-color .3s ease}
.toggle-label::before{content:"";position:absolute;top:2px;left:2px;width:26px;height:26px;background-color:#fff;border-radius:50%;transition:transform .3s ease;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.toggle-input:checked + .toggle-label{background-color:var(--primary)}

<script>
var SUPABASE_URL="https://ulvhuqtpdafspbdvkogs.supabase.co";
var SUPABASE_ANON_KEY="sb_publishable_b3zSRFSj9k73_tIxO1yJYw_IEK9tPLg";
window.sb=window.sb||window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

function showToast(m){var t=document.getElementById('toast');if(!t)return;t.textContent=m;t.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(function(){t.classList.remove('show')},2600)}
function escapeHtml(s){if(!s)return '';return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function showConfirm(title,body,onOk,prefKey,prefLabel){

============================================================ */

/* 兜底：处理游戏中已掉线（不在 Presence 中）的玩家 */
async function cleanupOfflineGamePlayers(onlineIds){
  try{
    if(!state.room)return;
    var room=await freshRoom();
    state.room=room;
    var game=room.current_game;
    if(!game||!game.players||!game.players.length)return;
    var gdef=GAMES.find(function(x){return x.id===game.type})||{min:2,max:2};
    var hostOnline=game.players.some(function(p){return p.user_id===game.host_id&&onlineIds.indexOf(p.user_id)>=0});
    var offline=game.players.filter(function(p){return onlineIds.indexOf(p.user_id)<0}).map(function(p){return p.user_id});
    var oldOffline=(game.state&&game.state.offlineIds)||[];
    var offlineChanged=(offline.length!==oldOffline.length)||offline.some(function(u){return oldOffline.indexOf(u)<0;});
    // 游戏已结束：直接把离线者从玩家列表移除（结算页不保留已退的人）
    if(game.status==='finished'){
      if(offline.length===0)return;
      var keptPlayers=game.players.filter(function(p){return onlineIds.indexOf(p.user_id)>=0});
      if(keptPlayers.length===game.players.length)return;
      var ngF=Object.assign({},game,{players:keptPlayers});
      await window.sb.from("rooms").update({current_game:ngF}).eq("id",room.id);
      state.room.current_game=ngF;renderMic();renderGame();
      return;
    }
    if(!offlineChanged){ renderGpmPlayers(game.players||[],game); return; }
    // 五子棋（双人）：有人掉线 或 房主掉线 → 直接结束整局
    if(game.type==="gomoku"){
      if(offline.length>0||!hostOnline){
        await window.sb.from("rooms").update({current_game:null}).eq("id",room.id);
        state.room.current_game=null;renderMic();renderGame();
        if(offline.length>0)showToast("对手已离线，对局结束");else showToast("房主已离线，对局结束");
        return;
      }
      return;
    }
    // 房主掉线（多人游戏）→ 结束整局
    if(!hostOnline){
      await window.sb.from("rooms").update({current_game:null}).eq("id",room.id);
      state.room.current_game=null;renderMic();renderGame();showToast("房主已离线，对局结束");
      return;
    }
    var stNow=Object.assign({},game.state||{},{offlineIds:offline});
    // 谁是卧底 / 狼人杀：掉线 = 出局
    if(game.type==="spy"){
      var elim=(stNow.eliminated||[]).slice();
      offline.forEach(function(u){if(elim.indexOf(u)<0)elim.push(u);});
      stNow.eliminated=elim;
    }else if(game.type==="werewolf"){
      var al=(stNow.alive||[]).slice();
      offline.forEach(function(u){var i=al.indexOf(u);if(i>=0)al.splice(i,1);});
      stNow.alive=al;
    }else if(game.type==="draw"){
      // 你画我猜：当前画手掉线 → 跳到下一轮
      var curDrawer=(stNow.order||[])[stNow.drawer_index];
      if(offline.indexOf(curDrawer)>=0)stNow.round_end=true;
    }
    var ng=Object.assign({},game,{state:stNow});
    await window.sb.from("rooms").update({current_game:ng}).eq("id",room.id);
    state.room.current_game=ng;renderMic();renderGame();
  }catch(e){}
}

async function toggleMuteUser(uid){

      if(_co.indexOf(currentUser.id)<0||_p.mute===false){showToast('没有权限');return}
    }
    var room=await freshRoom();
    var muted=(room.muted_user_ids||[]).slice();
    var idx=muted.indexOf(uid);
    if(idx>=0)muted.splice(idx,1);else muted.push(uid);
    var patch={muted_user_ids:muted};
    if(idx<0){
      patch.mic_speaking=(room.mic_speaking||[]).filter(function(m){return m.user_id!==uid});
      patch.mic_requests=(room.mic_requests||[]).filter(function(m){return m.user_id!==uid});
    }
    await patchRoom(patch);
    showToast(idx>=0?'已解除禁言':'已禁言');
    if(state.memberChannel){
      var raw=state.memberChannel.presenceState();var arr2=[];
      Object.keys(raw).forEach(function(k){var l=raw[k];if(!l||!l.length)return;var pr=l[0];arr2.push({id:k,nickname:pr.nickname||'用户',avatar_url:pr.avatar_url||'',joined_at:pr.joined_at||''})});

    }

}

var WORDS_SPY=[['饺子','馄饨'],['火车','高铁'],['医生','护士'],['可乐','雪碧'],['蝴蝶','蜜蜂'],['面条','米粉'],['雨伞','阳伞'],['苹果','梨子'],['老虎','狮子'],['手机','平板'],['铅笔','钢笔'],['沙发','椅子']];

async function updateGame(patch){
  var res=await window.sb.from('rooms').update({current_game:patch}).eq('id',state.room.id).select().single();
  if(res.error)throw res.error;state.room=res.data;renderMic();renderGame();

async function selectGame(gameId){
  var game=state.room&&state.room.current_game;
  if(game&&game.host_id&&game.host_id!==currentUser.id){
    var hostStillIn=(game.players||[]).some(function(p){return p.user_id===game.host_id});
    if(hostStillIn){showToast('只有房主能切换游戏');closeGameDrawer();return}
  }
  closeGameDrawer();
  if(game){showConfirm('切换游戏','当前有游戏进行中，确定要切换吗？',async function(){await startGame(gameId)})}

}

async function startGame(gameId){
  var g=GAMES.find(function(x){return x.id===gameId});if(!g)return;
  var newGame={
    type:gameId,
    status:'lobby',
    started_at:new Date().toISOString(),
    host_id:currentUser.id,
    players:[{user_id:currentUser.id,nickname:currentUser.nickname,avatar_url:currentUser.avatar_url||'',seat:0}],
    state:initGameState(gameId)
  };
  try{await updateGame(newGame);showToast('已创建「'+g.name+'」，等待玩家加入')}catch(e){showToast('启动失败：'+e.message)}
}
function initGameState(type){
  if(type==='gomoku')return{board:emptyBoard(),turn:'black',winner:null};
  if(type==='draw')return{order:[],drawer_index:0,word:'',strokes:[],correct:[],messages:[],scores:{},round_started_at:0,round_end:false};
  if(type==='spy')return{words:{},spy_ids:[],phase:'describe',descriptions:[],votes:{},eliminated:[],round:1};
  if(type==='werewolf')return{roles:{},phase:'choose',alive:[],night_action:null,day:1,votes:{},mode:0};
  if(type==='doudizhu')return{phase:'bid',order:[],hands:{},bottom:[],bids:{},bidTurn:0,bidCount:0,maxBid:0,maxBidder:null,landlord:null,currentTurn:null,lastPlay:null,passCount:0,winner:null,winnerSide:null,multiplier:1,bombCount:0};
  return{};
}

/* ★ 房主退出 → 游戏直接结束 */
async function leaveGame(){
  if(!state.room||!state.room.current_game)return;
  var game=state.room.current_game;
  if(game.host_id===currentUser.id){
    await updateGame(null);
    state.spectating=false;
    return;
  }
  var players=(game.players||[]).filter(function(p){return p.user_id!==currentUser.id});
  if(!players.length){await updateGame(null)}
  else{
    var ns=Object.assign({},game,{players:players});
    if(game.type==='gomoku')ns.state=Object.assign({},game.state,{board:emptyBoard(),turn:'black',winner:null});
    if(game.type==='draw'){ns.state=Object.assign({},game.state,{order:(game.state.order||[]).filter(function(id){return id!==currentUser.id}),strokes:[],correct:[]})}
    if(game.type==='doudizhu')ns.state=Object.assign({},game.state,{phase:'finished',aborted:true,winner:null});
    await updateGame(ns);
  }
  state.spectating=false;
}
window.leaveGame=leaveGame;

async function joinGame(){
  if(!state.room||!state.room.current_game)return;
  var game=state.room.current_game;var g=GAMES.find(function(x){return x.id===game.type});if(!g)return;
  var players=game.players||[];

  try{await updateGame(ng);state.spectating=false;showToast('已加入，等待房主开始')}catch(e){showToast('加入失败：'+e.message)}
}

async function beginGame(){
  if(!state.room||!state.room.current_game)return;
  var game=state.room.current_game;
  if(game.host_id!==currentUser.id){showToast('只有房主能开始游戏');return}
  var g=GAMES.find(function(x){return x.id===game.type});if(!g)return;
  var players=game.players||[];
  if(players.length<g.min){showToast('至少需要 '+g.min+' 人');return}
  var st=Object.assign({},game.state);
  if(game.type==='gomoku'){
    st=Object.assign({},st,{board:emptyBoard(),turn:'black',winner:null});
  }
  else if(game.type==='draw'){
    var ids=players.slice().sort(function(a,b){return a.seat-b.seat}).map(function(p){return p.user_id});
    st=Object.assign({},st,{order:ids,drawer_index:0,word:pickWord(),strokes:[],correct:[],messages:[],scores:{},round_started_at:Date.now(),round_end:false});
  }
  else if(game.type==='spy'){
    var n=players.length;var spyCount=n>=6?2:1;
    var pair=WORDS_SPY[Math.floor(Math.random()*WORDS_SPY.length)];
    var shuffled=players.slice().sort(function(){return Math.random()-.5});
    var spyIds=[],words={};
    shuffled.forEach(function(p,i){if(i<spyCount){spyIds.push(p.user_id);words[p.user_id]=pair[1]}else words[p.user_id]=pair[0]});
    st=Object.assign({},st,{words:words,spy_ids:spyIds,phase:'describe',descriptions:[],votes:{},eliminated:[],round:1});
  }
  else if(game.type==='werewolf'){
    st=Object.assign({},st,{roles:{},phase:'choose',alive:players.map(function(p){return p.user_id}),day:1,votes:{},night_action:null,mode:0});
  }
  else if(game.type==='doudizhu'){
    var dzIds=players.slice().sort(function(a,b){return a.seat-b.seat}).map(function(p){return p.user_id});
    var dzDeck=ddzShuffle(ddzNewDeck());
    var dzHands={};
    dzIds.forEach(function(uid,i){dzHands[uid]=ddzSort(dzDeck.slice(i*17,i*17+17))});
    st=Object.assign({},st,{phase:'bid',order:dzIds,hands:dzHands,bottom:dzDeck.slice(51,54),bids:{},bidTurn:0,bidCount:0,maxBid:0,maxBidder:null,landlord:null,currentTurn:null,lastPlay:null,passCount:0,winner:null,winnerSide:null,multiplier:1,bombCount:0});
  }
  var ng=Object.assign({},game,{status:'playing',state:st});
  try{await updateGame(ng);showToast('游戏开始！')}catch(e){showToast('开始失败：'+e.message)}
}
window.beginGame=beginGame;

function startGameTick(){

  gameTickInterval=setInterval(gameTick,1000);
  startOfflineCheck();
}
function startOfflineCheck(){
  if(offlineCheckTimer)clearInterval(offlineCheckTimer);
  offlineCheckTimer=setInterval(function(){
    if(!state.room)return;
    if(!state.memberChannel)return;
    try{
      var raw=state.memberChannel.presenceState();
      var ids=Object.keys(raw).filter(function(k){return raw[k]&&raw[k].length;});
      cleanupOfflineGamePlayers(ids);
    }catch(e){}
  },15000);
}
function stopOfflineCheck(){ if(offlineCheckTimer){clearInterval(offlineCheckTimer);offlineCheckTimer=null;} }
function gameTick(){
  if(!state.room||!state.room.current_game)return;
  var game=state.room.current_game;
  if(game.status!=='playing')return;
  if(game.type==='draw'){
    var st=game.state;
    if(!st.round_started_at||st.round_end)return;
    var elapsed=Date.now()-st.round_started_at;
    var remaining=Math.max(0,DRAW_ROUND_MS-elapsed);
    var drawerId=(st.order||[])[st.drawer_index];
    var players=game.players||[];
    var guessers=players.filter(function(p){return p.user_id!==drawerId});
    var allCorrect=guessers.length>0&&guessers.every(function(p){return (st.correct||[]).indexOf(p.user_id)>=0});
    var timerEl=document.getElementById('drawTimer');
    if(timerEl){
      var mm=Math.floor(remaining/60000),ss=Math.floor((remaining%60000)/1000);
      timerEl.textContent=mm+':'+(ss<10?'0':'')+ss;
      if(remaining<=30000)timerEl.classList.add('urgent');else timerEl.classList.remove('urgent');
    }
    if(remaining<=0||allCorrect){
      (async function(){
        try{
          var cur=state.room.current_game;
          if(!cur||cur.type!=='draw'||cur.state.round_end)return;
          var ns=Object.assign({},cur.state,{round_end:true});
          await updateGame(Object.assign({},cur,{state:ns}));
          setTimeout(advanceDrawRound,1500);
        }catch(e){}
      })();
    }
  }
}
async function advanceDrawRound(){
  if(!state.room||!state.room.current_game)return;
  var game=state.room.current_game;
  if(game.type!=='draw')return;
  var st=game.state;
  if(!st.round_end)return;
  var drawerId=(st.order||[])[st.drawer_index];
  var players=game.players||[];
  var guessers=players.filter(function(p){return p.user_id!==drawerId});
  var allCorrect=guessers.length>0&&guessers.every(function(p){return (st.correct||[]).indexOf(p.user_id)>=0});
  var scores=Object.assign({},st.scores||{});
  if(allCorrect&&drawerId)scores[drawerId]=(scores[drawerId]||0)+2;
  var nextIdx=(st.drawer_index||0)+1;
  var finished=nextIdx>=(st.order||[]).length;
  var ns;
  if(finished){
    ns=Object.assign({},st,{scores:scores,round_end:true,phase:'finished'});
  }else{
    ns=Object.assign({},st,{scores:scores,drawer_index:nextIdx,word:pickWord(),strokes:[],correct:[],messages:[],round_started_at:Date.now(),round_end:false});
  }
  try{await updateGame(Object.assign({},game,{state:ns}))}catch(e){}
}

  if(!gomokuSel)return;

async function doPlaceStone(r,c,myColor){
  var game=state.room&&state.room.current_game;if(!game||game.type!=='gomoku')return;
  var st=game.state;if(game.status!=='playing'||st.board[r][c])return;

  if(curColor!==myColor||st.turn!==myColor)return;
  var board=st.board.map(function(row){return row.slice()});var stone=myColor==='black'?'b':'w';board[r][c]=stone;
  var won=checkWinGmk(board,r,c,stone);
  var ns={board:board,turn:myColor==='black'?'white':'black',winner:won?myColor:null};

function checkWinGmk(board,r,c,color){var dirs=[[0,1],[1,0],[1,1],[1,-1]];for(var d=0;d<dirs.length;d++){var dr=dirs[d][0],dc=dirs[d][1],cnt=1;for(var s=-1;s<=1;s+=2){var rr=r+dr*s,cc=c+dc*s;while(rr>=0&&rr<15&&cc>=0&&cc<15&&board[rr][cc]===color){cnt++;rr+=dr*s;cc+=dc*s}}if(cnt>=5)return true}return false}

var drawState={color:'#000000',size:5,drawing:false,currentStroke:null,canvas:null,ctx:null,isDrawer:false};

function initDrawCanvas(game,isDrawer){
  var canvas=document.getElementById('drawCanvas');if(!canvas)return;
  var wrap=canvas.parentElement;
  // 用 requestAnimationFrame 等布局稳定后再取宽度
  var setup=function(){
    var w=wrap.clientWidth;if(!w||w<50){requestAnimationFrame(setup);return;}
    var h=Math.max(180,Math.min(w,300));
    canvas.width=w;canvas.height=h;canvas.style.height=h+'px';
    drawState.canvas=canvas;drawState.ctx=canvas.getContext('2d');drawState.isDrawer=isDrawer;
    redrawStrokes(game.state.strokes||[]);
  };
  requestAnimationFrame(setup);
  if(!isDrawer)return;
  canvas.addEventListener('mousedown',startDraw);canvas.addEventListener('mousemove',moveDraw);canvas.addEventListener('mouseup',endDraw);canvas.addEventListener('mouseleave',endDraw);
  canvas.addEventListener('touchstart',function(e){e.preventDefault();startDraw(e.touches[0])},{passive:false});
  canvas.addEventListener('touchmove',function(e){e.preventDefault();moveDraw(e.touches[0])},{passive:false});
  canvas.addEventListener('touchend',function(e){e.preventDefault();endDraw()},{passive:false});
}
function getPos(canvas,e){var r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height}}
function startDraw(e){if(!drawState.isDrawer)return;drawState.drawing=true;drawState.currentStroke={color:drawState.color,size:drawState.size,points:[getPos(drawState.canvas,e)]}}
function moveDraw(e){if(!drawState.drawing)return;var p=getPos(drawState.canvas,e);var s=drawState.currentStroke;var last=s.points[s.points.length-1];s.points.push(p);var ctx=drawState.ctx;var W=drawState.canvas.width,H=drawState.canvas.height;ctx.strokeStyle=s.color;ctx.lineWidth=s.size;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(last.x*W,last.y*H);ctx.lineTo(p.x*W,p.y*H);ctx.stroke();clearTimeout(drawState._syncTimer);drawState._syncTimer=setTimeout(syncStrokes,150)}
function endDraw(){if(!drawState.drawing)return;drawState.drawing=false;if(drawState.currentStroke&&drawState.currentStroke.points.length<2)drawState.currentStroke.points.push(drawState.currentStroke.points[0]);syncStrokes()}
async function syncStrokes(){if(!state.room||!state.room.current_game)return;var game=state.room.current_game;var strokes=(game.state.strokes||[]).slice();if(drawState.currentStroke&&strokes.indexOf(drawState.currentStroke)<0)strokes.push(drawState.currentStroke);try{await updateGame(Object.assign({},game,{state:Object.assign({},game.state,{strokes:strokes})}))}catch(e){}}
function redrawStrokes(strokes){var ctx=drawState.ctx;if(!ctx)return;var W=drawState.canvas.width,H=drawState.canvas.height;ctx.clearRect(0,0,W,H);strokes.forEach(function(s){ctx.strokeStyle=s.color;ctx.lineWidth=s.size;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();s.points.forEach(function(p,i){if(i===0)ctx.moveTo(p.x*W,p.y*H);else ctx.lineTo(p.x*W,p.y*H)});ctx.stroke()})}

var ddzSuits=['♠','♥','♣','♦'];
function ddzVal(id){return id<52?(Math.floor(id/4))+3:(id===52?16:17);}
function ddzSuit(id){return id<52?id%4:-1;}
function ddzNewDeck(){var d=[];for(var i=0;i<54;i++)d.push(i);return d;}
function ddzShuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function ddzSort(c){return c.slice().sort(function(a,b){return ddzVal(a)-ddzVal(b)||ddzSuit(a)-ddzSuit(b);});}
function ddzValName(v){return v===16?'小王':v===17?'大王':v===15?'2':v===14?'A':v===13?'K':v===12?'Q':v===11?'J':String(v);}
function ddzCardHTML(id,opts){
  opts=opts||{};
  var v=ddzVal(id);
  var cls='ddz-card'+(opts.mini?' mini':'')+(opts.sel?' sel':'');
  if(v>=16){
    cls+=' red';
    return '<div class="'+cls+'" data-id="'+id+'"><div class="rk">'+(v===17?'大':'小')+'</div><div class="su">王</div></div>';
  }
  var suit=ddzSuit(id);
  var red=(suit===1||suit===3);
  cls+=red?' red':' black';
  return '<div class="'+cls+'" data-id="'+id+'"><div class="rk">'+ddzValName(v)+'</div><div class="su">'+ddzSuits[suit]+'</div></div>';
}
function ddzCheckPlane(cnt,keys,n){
  var trioVals=keys.filter(function(k){return cnt[k]>=3&&k<=14;}).sort(function(a,b){return a-b;});
  var segs=[],cur=[];
  for(var i=0;i<trioVals.length;i++){
    if(!cur.length||trioVals[i]===cur[cur.length-1]+1)cur.push(trioVals[i]);
    else{if(cur.length>=2)segs.push(cur);cur=[trioVals[i]];}
  }
  if(cur.length>=2)segs.push(cur);
  for(var s=0;s<segs.length;s++){
    var seg=segs[s];
    for(var L=seg.length;L>=2;L--){
      for(var st=0;st+L<=seg.length;st++){
        var sub=seg.slice(st,st+L);
        var remain=n-3*L;
        if(remain===L){
          var rc=Object.assign({},cnt);sub.forEach(function(v){rc[v]-=3;});
          var tot=0;Object.keys(rc).forEach(function(k){tot+=rc[k];});
          if(tot===L)return{type:'plane_single',len:L,value:sub[sub.length-1]};
        }
        if(remain===2*L){
          var rc2=Object.assign({},cnt);sub.forEach(function(v){rc2[v]-=3;});
          var tot2=0,okp=true;Object.keys(rc2).forEach(function(k){var c=rc2[k];tot2+=c;if(c!==0&&c!==2)okp=false;});
          if(tot2===2*L&&okp)return{type:'plane_pair',len:L,value:sub[sub.length-1]};
        }
      }
    }
  }
  return null;
}
function ddzAnalyze(cards){
  if(!cards||!cards.length)return null;
  var vals=cards.map(ddzVal).sort(function(a,b){return a-b;});
  var n=vals.length;
  var cnt={};vals.forEach(function(v){cnt[v]=(cnt[v]||0)+1;});
  var keys=Object.keys(cnt).map(Number).sort(function(a,b){return a-b;});
  var counts=keys.map(function(k){return cnt[k];});
  var maxCnt=Math.max.apply(null,counts);
  if(n===2&&vals[0]===16&&vals[1]===17)return{type:'rocket',len:1,value:100};
  if(n===4&&keys.length===1)return{type:'bomb',len:1,value:keys[0]};
  if(n===1)return{type:'single',len:1,value:vals[0]};
  if(n===2&&keys.length===1)return{type:'pair',len:1,value:keys[0]};
  if(n===3&&keys.length===1)return{type:'trio',len:1,value:keys[0]};
  if(n===4&&maxCnt===3){var tv=keys.filter(function(k){return cnt[k]===3})[0];return{type:'trio_single',len:1,value:tv};}
  if(n===5&&maxCnt===3&&keys.length===2){var tv2=keys.filter(function(k){return cnt[k]===3})[0];return{type:'trio_pair',len:1,value:tv2};}
  if(n>=5&&keys.length===n&&vals[n-1]<=14){
    var ok=true;for(var i=1;i<n;i++){if(vals[i]!==vals[i-1]+1){ok=false;break;}}
    if(ok)return{type:'straight',len:n,value:vals[n-1]};
  }
  if(n>=6&&n%2===0&&keys.length===n/2&&counts.every(function(c){return c===2;})&&vals[n-1]<=14){
    var ok2=true;for(var i=1;i<keys.length;i++){if(keys[i]!==keys[i-1]+1){ok2=false;break;}}
    if(ok2)return{type:'straight_pair',len:keys.length,value:keys[keys.length-1]};
  }
  if(n>=6&&n%3===0&&keys.length===n/3&&counts.every(function(c){return c===3;})&&vals[n-1]<=14){
    var ok3=true;for(var i=1;i<keys.length;i++){if(keys[i]!==keys[i-1]+1){ok3=false;break;}}
    if(ok3)return{type:'plane',len:keys.length,value:keys[keys.length-1]};
  }
  return ddzCheckPlane(cnt,keys,n);
}
function ddzCanBeat(play,last){
  if(!play)return false;
  if(!last)return true;
  if(play.type==='rocket')return true;
  if(last.type==='rocket')return false;
  if(play.type==='bomb'&&last.type!=='bomb')return true;
  if(play.type==='bomb'&&last.type==='bomb')return play.value>last.value;
  if(last.type==='bomb')return false;
  if(play.type!==last.type)return false;
  if(play.len!==last.len)return false;
  return play.value>last.value;
}

async function ddzBid(want){

    hands[currentUser.id]=ddzSort((hands[currentUser.id]||[]).concat(st.bottom||[]));
    ns.hands=hands;ns.lastPlay=null;ns.lastPlays={};ns.passCount=0;
  }else{
    ns.bidCount=(st.bidCount||0)+1;ns.bidTurn=(st.bidTurn||0)+1;
    if(ns.bidCount>=3){
      var ids=st.order;var deck=ddzShuffle(ddzNewDeck());var hands2={};
      ids.forEach(function(uid,i){hands2[uid]=ddzSort(deck.slice(i*17,i*17+17))});
      ns.phase='bid';ns.hands=hands2;ns.bottom=deck.slice(51,54);ns.bidTurn=0;ns.bidCount=0;ns.bids={};
      showToast('三家都不叫，重新发牌');
    }
  }
  try{await updateGame(Object.assign({},game,{state:ns}))}catch(e){showToast('操作失败：'+e.message)}
}

async function ddzPlay(){
  var game=state.room&&state.room.current_game;
  if(!game||game.type!=='doudizhu')return;
  var st=game.state;
  if(st.phase!=='play'||st.currentTurn!==currentUser.id)return;
  var handEl=document.getElementById('ddzHand');
  var sel=[];handEl.querySelectorAll('.ddz-card.sel').forEach(function(e){sel.push(parseInt(e.dataset.id,10))});
  if(!sel.length){showToast('请选择要出的牌');return}
  var type=ddzAnalyze(sel);
  if(!type){showToast('牌型不合法');return}
  var last=st.lastPlay;
  if(last&&last.uid!==currentUser.id&&!ddzCanBeat(type,last.typeInfo)){showToast('打不过上家');return}
  var ns=Object.assign({},st);
  var hands=Object.assign({},st.hands);
  var myHand=hands[currentUser.id]||[];
  var newHand=myHand.filter(function(c){return sel.indexOf(c)<0});
  hands[currentUser.id]=newHand;ns.hands=hands;
  ns.lastPlay={uid:currentUser.id,cards:ddzSort(sel).slice(),typeInfo:type};
  ns.lastPlays=Object.assign({},st.lastPlays||{});
  if(st.newRound){ns.lastPlays={};ns.newRound=false;}
  ns.lastPlays[currentUser.id]={cards:ddzSort(sel).slice(),typeInfo:type};
  ns.passCount=0;
  if(type.type==='bomb'||type.type==='rocket'){ns.multiplier=(st.multiplier||1)*2;}
  var order=st.order;var myIdx=order.indexOf(currentUser.id);
  ns.currentTurn=order[(myIdx+1)%order.length];
  if(newHand.length===0){
    ns.phase='finished';ns.winner=currentUser.id;
    ns.winnerSide=(currentUser.id===st.landlord)?'landlord':'farmer';
  }
  try{await updateGame(Object.assign({},game,{state:ns}))}catch(e){showToast('出牌失败：'+e.message)}
}
window.ddzPlay=ddzPlay;
async function ddzPass(){
  var game=state.room&&state.room.current_game;

  if(st.phase!=='play'||st.currentTurn!==currentUser.id)return;

  try{await updateGame(Object.assign({},game,{state:ns}))}catch(e){showToast('操作失败：'+e.message)}
}

      .select('packet_id, amount')
      .eq('user_id', currentUser.id)

function renderRedPackets(){
  var c = document.getElementById('rpList');
  if(!c) return;
  if(!rpState.list.length){ c.innerHTML = ''; return; }
  c.innerHTML = rpState.list.map(function(p){
    var mine = rpMyGrabs[p.id];
    var finished = p.remaining_count <= 0;
    var cls = mine !== undefined ? 'grabbed' : (finished ? 'done' : '');
    var sub, amtHtml = '';
    if(mine !== undefined){
      sub = '你已领取 · 看看手气';
      amtHtml = '<div class="rp-amt">' + mine + ' 币</div>';
    } else if(finished){
      sub = '手慢了，红包已领完';
    } else {
      sub = '剩余 ' + p.remaining_count + '/' + p.count + ' 份';
    }
    return '<div class="rp-card ' + cls + '" data-rp="' + p.id + '">' +
      '<div class="rp-top"><svg viewBox="0 0 24 24"><rect x="4" y="9" width="16" height="11" rx="2"/><path d="M4 9h16M12 3v6M9 6l3-3 3 3"/></svg>' +
      escapeHtml(p.sender_name || '匿名') + ' 的红包</div>' +
      amtHtml +
      '<div class="rp-sub">' + sub + '</div>' +
    '</div>';
  }).join('');
  c.querySelectorAll('.rp-card').forEach(function(el){
    el.onclick = function(){ openRedPacketDetail(this.dataset.rp); };
  });

async function sendRedPacket(){
  if(!state.room) return;
  if(isUserBanned()){ showToast('账号已被封禁'); return; }
  var total = parseInt(document.getElementById('rpTotal').value, 10);
  var count = parseInt(document.getElementById('rpCount').value, 10);
  if(!total || total < 1){ showToast('请输入红包总积分'); return; }
  if(!count || count < 2){ showToast('份数至少 2 份'); return; }
  if(count > total){ showToast('份数不能超过总积分（每份至少 1 币）'); return; }
  var btn = document.getElementById('rpSendBtn');
  btn.disabled = true;
  try{
    var res = await window.sb.rpc('send_red_packet', {
      p_user_id: currentUser.id,
      p_room_id: state.room.id,
      p_total: total,
      p_count: count
    });
    if(res.error) throw res.error;
    var d = res.data;
    if(!d || !d.ok){ showToast((d && d.message) || '发送失败'); btn.disabled = false; return; }
    if(d.balance !== undefined){ currentUser.coins = d.balance; setSessionUser(currentUser); }
    document.getElementById('rpTotal').value = '';
    document.getElementById('rpCount').value = '';
    closeRedPacketDrawer();
    showToast('红包已发出');
    await loadRedPackets();
  }catch(e){ showToast('发送失败：' + e.message); }
  btn.disabled = false;
}

async function openRedPacketDetail(packetId){
  var p = rpState.list.find(function(x){ return String(x.id) === String(packetId); });
  if(!p) return;
  var mine = rpMyGrabs[p.id];
  if(mine === undefined && p.remaining_count > 0 && p.sender_id !== currentUser.id){
    await grabRedPacket(p.id);
    p = rpState.list.find(function(x){ return String(x.id) === String(packetId); }) || p;
    mine = rpMyGrabs[p.id];
  }
  showRedPacketDetailDrawer(p, mine);
}

        var raw=state.memberChannel.presenceState();

        arr.sort(function(a,b){return (a.joined_at||'').localeCompare(b.joined_at||'')});
        renderMemberList(arr);
      }
    })
    .on('postgres_changes',{event:'DELETE',schema:'public',table:'rooms',filter:'id=eq.'+roomId},function(){showToast('房间已被删除');leaveRoomLocal();history.replaceState({},'',location.pathname);showList();loadRooms()})
    .subscribe();
  state.msgChannel=window.sb.channel('sq-room-msg-'+roomId+'-'+Date.now())
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'room_messages',filter:'room_id=eq.'+roomId},function(p){if(state.messages.some(function(x){return x.id===p.new.id}))return;state.messages.push(p.new);state.lastMsgId=p.new.id;renderMessages();pushDanmaku(p.new.author||'',p.new.content||'')})
    .on('postgres_changes',{event:'DELETE',schema:'public',table:'room_messages',filter:'room_id=eq.'+roomId},function(){loadMessages()})
    .subscribe();
  if(state.rpChannel){window.sb.removeChannel(state.rpChannel);state.rpChannel=null}
  state.rpChannel=window.sb.channel('sq-room-rp-'+roomId+'-'+Date.now())
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'red_packets',filter:'room_id=eq.'+roomId},function(){loadRedPackets()})
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'red_packets',filter:'room_id=eq.'+roomId},function(p){var i=rpState.list.findIndex(function(x){return x.id===p.new.id});if(i>=0){rpState.list[i]=p.new;renderRedPackets();}else{loadRedPackets()}})
    .subscribe();
}

/* ============================================================
   房间设置（管理员）
============================================================ */
async function fetchAllUsers(){var r=await window.sb.from('users').select('id, nickname, avatar_url, phone');return r.data||[]}
async function openRoomEditor(){
  if(!isAdmin||!state.room)return;
  var room=await freshRoom();var users=await fetchAllUsers();
  var coIds=room.co_admin_ids||[],permsMap=room.co_admin_permissions||{},mutedIds=room.muted_user_ids||[];
  var old=document.getElementById('roomEditorOverlay');if(old)old.remove();
  var overlay=document.createElement('div');overlay.className='re-overlay';overlay.id='roomEditorOverlay';
  var userRows=users.filter(function(u){return u.id!==currentUser.id}).map(function(u){
    var isCo=coIds.indexOf(u.id)>=0,isMuted=mutedIds.indexOf(u.id)>=0;var p=permsMap[u.id]||{};
    function chk(k,label){var checked=p[k]!==false;return '<label class="re-chk"><input type="checkbox" data-perm="'+k+'" data-uid="'+u.id+'" '+(checked?'checked':'')+'> '+label+'</label>'}
    var hostBtn=(u.id!==(room.creator_id||''))?'<button type="button" class="re-host-btn" onclick="setRoomHost(\''+u.id+'\')">设为房主</button>':'<span style="font-size:.7em;color:var(--text-muted);">当前房主</span>';
    return '<div class="re-user"><div class="re-user-top"><span class="re-name">'+escapeHtml(u.nickname)+'</span><label class="re-chk"><input type="checkbox" data-co="'+u.id+'" '+(isCo?'checked':'')+'> 协管</label><label class="re-chk"><input type="checkbox" data-mute="'+u.id+'" '+(isMuted?'checked':'')+'> 禁言</label>'+hostBtn+'</div><div class="re-perms'+(isCo?' on':'')+'" data-perms-for="'+u.id+'">'+chk('revoke','撤回消息')+chk('mute','禁言用户')+chk('mic','管理连麦')+chk('game','发起游戏')+'</div></div>';
  }).join('');
  overlay.innerHTML='<div class="re-panel"><div class="re-head"><h3><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:4px;"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>房间设置</h3><button id="reClose"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div><div class="re-body"><div class="re-field"><label>房间名称</label><input type="text" id="reName" maxlength="20" value="'+escapeHtml(room.name)+'" /></div><div class="re-field"><label>连麦模式</label><div class="re-radio-row"><label class="re-radio"><input type="radio" name="reMicMode" value="free" '+(room.mic_mode!=='host'?'checked':'')+'> 自由连麦</label><label class="re-radio"><input type="radio" name="reMicMode" value="host" '+(room.mic_mode==='host'?'checked':'')+'> 主持人连麦</label></div></div><div class="re-field"><label>连麦开关</label><label class="re-chk" style="font-size:.85em;"><input type="checkbox" id="reMicEnabled" '+(room.mic_enabled!==false?'checked':'')+'> 允许连麦</label></div><div class="re-field"><label>游戏设置</label><label class="re-chk" style="font-size:.85em;color:var(--danger);"><input type="checkbox" id="reGameDisabled" '+(room.game_disabled?'checked':'')+'> 禁止本房间所有游戏</label></div><div class="re-field"><label>协助管理员 &amp; 权限</label>'+(userRows||'<div style="font-size:.8em;color:var(--text-muted);padding:8px 0;">暂无其他用户</div>')+'</div></div><div class="re-foot"><button class="cancel" id="reCancel">取消</button><button class="ok" id="reSave">保存</button></div></div>';
  document.body.appendChild(overlay);
  // 把设置内容重构成 Tab 结构（基本设置 / 成员权限 / 危险操作）
  try{ restructureRoomEditor(overlay); }catch(e){}
  overlay.querySelectorAll('input[data-co]').forEach(function(cb){cb.onchange=function(){var uid=this.dataset.co;var box=overlay.querySelector('[data-perms-for="'+uid+'"]');if(box)box.classList.toggle('on',this.checked)}});
  overlay.querySelector('#reClose').onclick=function(){overlay.remove()};
  overlay.querySelector('#reCancel').onclick=function(){overlay.remove()};
  overlay.addEventListener('click',function(e){if(e.target===overlay)overlay.remove()});
  overlay.querySelector('#reSave').onclick=async function(){
    var name=overlay.querySelector('#reName').value.trim();if(!name){showToast('请输入房间名称');return}
    var modeEl=overlay.querySelector('input[name="reMicMode"]:checked');var micMode=modeEl?modeEl.value:'free';
    var micEnabled=overlay.querySelector('#reMicEnabled').checked;var gameDisabled=overlay.querySelector('#reGameDisabled').checked;
    var newCoIds=[],newPerms={},newMuted=[];
    overlay.querySelectorAll('input[data-co]').forEach(function(cb){if(cb.checked)newCoIds.push(cb.dataset.co)});
    overlay.querySelectorAll('input[data-mute]').forEach(function(cb){if(cb.checked)newMuted.push(cb.dataset.mute)});
    newCoIds.forEach(function(uid){newPerms[uid]={};overlay.querySelectorAll('input[data-perm][data-uid="'+uid+'"]').forEach(function(cb){newPerms[uid][cb.dataset.perm]=cb.checked})});
    var speaking=(room.mic_speaking||[]).filter(function(m){return newMuted.indexOf(m.user_id)<0});
    var requests=(room.mic_requests||[]).filter(function(m){return newMuted.indexOf(m.user_id)<0});
    try{var upd=await window.sb.from('rooms').update({name:name,mic_mode:micMode,mic_enabled:micEnabled,game_disabled:gameDisabled,co_admin_ids:newCoIds,co_admin_permissions:newPerms,muted_user_ids:newMuted,mic_speaking:speaking,mic_requests:requests}).eq('id',state.room.id).select().single();if(upd.error)throw upd.error;state.room=upd.data;document.getElementById('roomTitle').textContent=upd.data.name;renderMic();renderGame();overlay.remove();showToast('设置已保存')}catch(e){showToast('保存失败：'+e.message)}
  };
}
window.openRoomEditor=openRoomEditor;
function restructureRoomEditor(overlay){
  var body=overlay.querySelector(".re-body"); if(!body) return;
  var fields=Array.prototype.slice.call(body.querySelectorAll(":scope > .re-field"));
  if(!fields.length) return;
  // 分类：前几个字段=基本设置；含“协管/权限”的=成员权限
  var basicFields=[], memberFields=[];
  fields.forEach(function(f){
    var t=f.querySelector("label")?f.querySelector("label").textContent:"";
    if(/协管|权限|成员|管理/.test(t)) memberFields.push(f); else basicFields.push(f);
  });
  body.innerHTML="";
  body.classList.add("re-body-tabbed");
  // Tab 栏
  var tabs=document.createElement("div"); tabs.className="re-tabs";
  tabs.innerHTML='<button class="re-tab active" data-rtab="basic">基本设置</button><button class="re-tab" data-rtab="member">成员权限</button><button class="re-tab" data-rtab="danger">危险操作</button>';
  body.parentNode.insertBefore(tabs, body);
  // pane1 基本
  var p1=document.createElement("div"); p1.className="re-tabpane active"; p1.dataset.pane="basic";
  basicFields.forEach(function(f){p1.appendChild(f);});
  // pane2 成员
  var p2=document.createElement("div"); p2.className="re-tabpane"; p2.dataset.pane="member";
  if(memberFields.length){memberFields.forEach(function(f){p2.appendChild(f);});}
  else{p2.innerHTML='<div style="font-size:.8em;color:var(--text-muted);padding:8px 0;">暂无其他用户</div>';}
  // pane3 危险
  var p3=document.createElement("div"); p3.className="re-tabpane"; p3.dataset.pane="danger";
  p3.innerHTML='<div class="re-danger-body" id="reDangerBody"><button class="re-danger-btn" id="reClearMsgs">清空房间消息</button><button class="re-danger-btn" id="reClearGame">清空当前游戏</button><button class="re-danger-btn" id="reDisband">解散房间</button></div><label class="re-chk" style="margin-top:12px;display:flex;align-items:center;gap:8px;font-size:.85em;"><input type="checkbox" id="reMuteAll" '+(state.room.mute_all?"checked":"")+'> 全员禁言（管理员除外）</label>';
  body.appendChild(p1); body.appendChild(p2); body.appendChild(p3);
  // Tab 切换
  tabs.querySelectorAll(".re-tab").forEach(function(btn){
    btn.onclick=function(){
      var t=this.dataset.rtab;
      tabs.querySelectorAll(".re-tab").forEach(function(b){b.classList.toggle("active",b.dataset.rtab===t);});
      body.querySelectorAll(".re-tabpane").forEach(function(p){p.classList.toggle("active",p.dataset.pane===t);});
    };
  });
  // 绑定危险操作
  var cm=overlay.querySelector("#reClearMsgs"); if(cm) cm.onclick=clearRoomMessages;
  var cg=overlay.querySelector("#reClearGame"); if(cg) cg.onclick=function(){ overlay.remove(); clearCurrentGame(); };
  var db=overlay.querySelector("#reDisband"); if(db) db.onclick=function(){overlay.remove();disbandRoom();};
  var ma=overlay.querySelector("#reMuteAll"); if(ma) ma.onchange=function(){ toggleMuteAll(this.checked); };
}
window.switchReTab=function(){};

/* 游戏设置弹窗逻辑 */
document.getElementById("gamePrefsBtn").onclick=function(){
  var ov=document.getElementById("gamePrefsOverlay");if(!ov)return;
  var tg=document.getElementById("gomokuConfirmToggle");
  if(tg)tg.checked=(localStorage.getItem("gomoku_skip_confirm")!=="1");
  ov.classList.add("open");
};
document.getElementById("gamePrefsClose").onclick=function(){document.getElementById("gamePrefsOverlay").classList.remove("open");};
document.getElementById("gamePrefsOverlay").addEventListener("click",function(e){if(e.target===this)this.classList.remove("open");});
document.getElementById("gomokuConfirmToggle").onchange=function(){
  if(this.checked){localStorage.removeItem("gomoku_skip_confirm");showToast("已开启落子确认");}
  else{localStorage.setItem("gomoku_skip_confirm","1");showToast("已关闭落子确认");}
};

/* ★ 房主退出页面 → 游戏结束 */
window.addEventListener('beforeunload',function(){
  if(state.room&&currentUser){
    try{
      var sp=(state.room.mic_speaking||[]).filter(function(m){return m.user_id!==currentUser.id});
      var rq=(state.room.mic_requests||[]).filter(function(m){return m.user_id!==currentUser.id});
      window.sb.from('rooms').update({mic_speaking:sp,mic_requests:rq}).eq('id',state.room.id);
      if(state.room.current_game){
        var game=state.room.current_game;
        if(game.host_id===currentUser.id){
          window.sb.from('rooms').update({current_game:null}).eq('id',state.room.id);
        }else{
          var ps=(game.players||[]).filter(function(p){return p.user_id!==currentUser.id});
          if(!ps.length)window.sb.from('rooms').update({current_game:null}).eq('id',state.room.id);
          else{
            var ng=Object.assign({},game,{players:ps});
            if(game.type==='gomoku')ng.state=Object.assign({},game.state,{board:emptyBoard(),turn:'black',winner:null});
            window.sb.from('rooms').update({current_game:ng}).eq('id',state.room.id);
          }
        }
      }
    }catch(e){}
  }
});
document.addEventListener('gesturestart',function(e){e.preventDefault()});
