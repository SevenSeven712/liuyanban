<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Seven戚 · 聊天群</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
:root{--bg:#f5faf5;--bg-card:#fff;--bg-input:#eaf3ea;--border:#c8e0c8;--text:#1e3a2e;--text-muted:#5a7a6a;--text-light:#8aaa9a;--primary:#2e7d32;--primary-light:#4caf50;--primary-bg:#e8f5e9;--shadow:0 8px 32px rgba(46,125,50,.12);--radius:16px;--radius-sm:10px;--font:"Space Grotesk","PingFang SC","Segoe UI",system-ui,sans-serif;--danger:#e57373;--success:#22c55e;--official-blue:#2b6cff;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);overflow:hidden}
#mainApp{display:flex;flex-direction:column;height:100vh;height:100dvh;background:var(--bg)}
.app-header{flex-shrink:0;padding:12px 16px;background:rgba(255,255,255,.94);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;min-height:56px;z-index:50;gap:8px}
.app-header .brand{font-weight:900;font-size:1.05em;display:flex;align-items:center;gap:.35em;cursor:pointer;white-space:nowrap}
.app-header .brand span{color:var(--primary)}
.app-header .brand small{font-weight:400;font-size:.55em;color:var(--text-muted);margin-left:.3em}
.header-right{display:flex;align-items:center;gap:4px;flex-shrink:0}
.user-area{display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 8px 4px 4px;border-radius:99px}
.user-area:hover{background:var(--primary-bg)}
.user-area .avatar{width:30px;height:30px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex-shrink:0;background-size:cover;background-position:center}
.user-area .user-name{font-weight:600;font-size:.8em;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dots-btn{background:none;border:none;cursor:pointer;padding:6px;border-radius:50%;display:grid;place-items:center;color:var(--text-muted);flex-shrink:0;position:relative}
.dots-btn:hover{background:var(--primary-bg);color:var(--primary)}
.dots-btn svg{width:22px;height:22px;fill:currentColor}
.dots-btn .online-badge{position:absolute;top:0;right:0;background:var(--success);color:#fff;font-size:.55em;font-weight:800;padding:1px 5px;border-radius:99px;line-height:13px;min-width:14px;text-align:center}
.app-tabs{flex-shrink:0;display:flex;background:rgba(255,255,255,.96);border-top:1px solid var(--border);padding:6px 0 calc(6px + var(--safe-b));z-index:50}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;font-family:var(--font);font-size:.6em;font-weight:600;color:var(--text-muted);padding:4px 0;cursor:pointer;text-decoration:none;position:relative}
.tab-btn .tab-icon{font-size:1.6em;line-height:1.2;display:flex;align-items:center;justify-content:center;width:1.7em;height:1.7em}
.tab-btn .tab-icon svg{width:100%;height:100%;display:block;stroke:currentColor;fill:none}
.tab-btn.active{color:var(--primary)}
.tab-btn.active::after{content:'';position:absolute;top:-1px;left:30%;right:30%;height:3px;background:var(--primary);border-radius:0 0 4px 4px}
.tab-btn .badge{position:absolute;top:-2px;right:15%;background:#e57373;color:#fff;font-size:.6em;font-weight:700;padding:1px 6px;border-radius:99px;min-width:16px;text-align:center}
.banned-banner{flex-shrink:0;background:#ffebee;color:#c62828;padding:6px 16px;font-size:.8em;font-weight:600;text-align:center;border-bottom:1px solid #ffcdd2;display:none}
.banned-banner.active{display:block}
.app-content{flex:1;min-height:0;display:flex;flex-direction:column}
.chat-messages{flex:1;overflow-y:auto;padding:16px 14px 8px;display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
.time-divider{text-align:center;font-size:.7em;color:var(--text-light);padding:6px 0;position:relative}
.time-divider span{background:var(--bg);padding:0 12px;position:relative;z-index:1}
.time-divider::before{content:'';position:absolute;left:10%;right:10%;top:50%;height:1px;background:var(--border);z-index:0}
.row{display:flex;align-items:flex-start;gap:8px;max-width:85%;}
.row.other{align-self:flex-start;}
.row.self{align-self:flex-end;flex-direction:row-reverse;}
.row .avatar{width:38px;height:38px;border-radius:50%;flex-shrink:0;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px;cursor:pointer;background-size:cover;background-position:center;overflow:hidden;}
.row .avatar.self-av{background:#4caf50;}
.row .bubble-wrap{display:flex;flex-direction:column;cursor:pointer;min-width:0;align-items:flex-start;}
.row.self .bubble-wrap{align-items:flex-end;}
.row .bubble{padding:9px 13px;font-size:.88em;line-height:1.5;word-break:break-word;position:relative;transition:transform .15s;}
.row .bubble:hover{transform:scale(1.02);}
.row .uname{font-size:.68em;color:var(--text-muted);margin-bottom:3px;display:flex;align-items:center;gap:6px;}
.row.self .uname{flex-direction:row-reverse;text-align:right;}
/* ===== 气泡皮肤（来自 bubble-demo.html，共 45 种 b0~b44）===== */
/* 0-24 静态 */
.b0 .bubble{background:#fff;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.1);color:#1a1a1a;}
.b0.self .bubble{background:#95ec69;color:#1a1a1a;}
.b1 .bubble{border-radius:20px;background:linear-gradient(135deg,#4caf50,#2e7d32);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08);}
.b1.self .bubble{background:linear-gradient(135deg,#4caf50,#2e7d32);color:#fff;}
.b2 .bubble{border-radius:14px;background:#141414;color:#ff2d95;border:1px solid #ff2d95;box-shadow:0 0 14px rgba(255,45,149,.55);}
.b2.self .bubble{color:#ff2d95;border-color:#ff2d95;box-shadow:0 0 14px rgba(255,45,149,.55);}
.b3 .bubble{border-radius:18px 18px 4px 18px;background:linear-gradient(135deg,#a855f7,#7e22ce);color:#fff;}
.b3.self .bubble{border-radius:18px 18px 4px 18px;background:linear-gradient(135deg,#a855f7,#7e22ce);color:#fff;}
.b4 .bubble{border-radius:20px;background:linear-gradient(135deg,#ff6b9d,#f06292);color:#fff;}
.b4.self .bubble{background:linear-gradient(135deg,#ff6b9d,#f06292);color:#fff;}
.b5 .bubble{border-radius:16px;background:rgba(46,125,50,.85);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.6);color:#fff;}
.b5.self .bubble{background:rgba(46,125,50,.85);color:#fff;}
.b6 .bubble{border-radius:18px;background:#e8f5e9;color:#2e3a2e;box-shadow:4px 4px 10px #c5d6c5,-4px -4px 10px #fff;}
.b6.self .bubble{background:#e8f5e9;box-shadow:4px 4px 10px #c5d6c5,-4px -4px 10px #fff;}
.b7 .bubble{border-radius:16px;background:linear-gradient(135deg,#7c3aed,#db2777);color:#fff;box-shadow:0 0 16px rgba(219,39,119,.5);}
.b7.self .bubble{background:linear-gradient(135deg,#7c3aed,#db2777);color:#fff;box-shadow:0 0 16px rgba(219,39,119,.5);}
.b8 .bubble{border-radius:10px;background:linear-gradient(135deg,#d4af37,#b8941f);color:#1a1a1a;border:1px solid #d4af37;}
.b8.self .bubble{background:linear-gradient(135deg,#d4af37,#b8941f);color:#1a1a1a;}
.b9 .bubble{border-radius:16px 4px 4px 4px;background:#ffe082;color:#5d4037;font-family:"Comic Sans MS","楷体",cursive;}
.b9.self .bubble{border-radius:16px 4px 4px 4px;background:#ffe082;}
.b10 .bubble{border-radius:14px;background:linear-gradient(180deg,#66bb6a,#43a047);color:#fff;box-shadow:0 2px 0 #2e7d32,0 5px 10px rgba(0,0,0,.2);}
.b10.self .bubble{background:linear-gradient(180deg,#66bb6a,#43a047);color:#fff;box-shadow:0 2px 0 #2e7d32,0 5px 10px rgba(0,0,0,.2);}
.b11 .bubble{border-radius:18px;background:linear-gradient(135deg,#f857a6,#ff5858);color:#fff;}
.b11.self .bubble{background:linear-gradient(135deg,#f857a6,#ff5858);color:#fff;}
.b12 .bubble{border-radius:16px 16px 6px 16px;background:linear-gradient(135deg,#b8a9a9,#9c8b8b);color:#fff;}
.b12.self .bubble{border-radius:16px 16px 6px 16px;background:linear-gradient(135deg,#b8a9a9,#9c8b8b);color:#fff;}
.b13 .bubble{border-radius:6px;background:#39ff14;color:#001a00;border:1px solid #39ff14;font-family:"Courier New",monospace;}
.b13.self .bubble{background:#39ff14;color:#001a00;}
.b14 .bubble{border-radius:18px;background:rgba(255,152,0,.9);color:#fff;backdrop-filter:blur(4px);border:2px solid rgba(255,255,255,.7);}
.b14.self .bubble{background:rgba(255,152,0,.9);border-color:rgba(255,255,255,.7);}
.b15 .bubble{border-radius:16px;background:#fff;color:#333;border:3px solid transparent;background-image:linear-gradient(#fff,#fff),linear-gradient(135deg,#4facfe,#00f2fe);background-origin:border-box;background-clip:padding-box,border-box;}
.b15.self .bubble{background-image:linear-gradient(#fff,#fff),linear-gradient(135deg,#4facfe,#00f2fe);}
.b16 .bubble{border-radius:14px;background:rgba(46,125,50,.85);backdrop-filter:blur(20px) saturate(180%);border:1px solid rgba(255,255,255,.8);color:#fff;}
.b16.self .bubble{background:rgba(46,125,50,.85);color:#fff;}
.b17 .bubble{border-radius:12px;background:linear-gradient(135deg,#2a2a2a,#1a1a1a);color:#ffd700;border:1.5px solid #ffd700;box-shadow:0 0 12px rgba(255,215,0,.55),inset 0 0 6px rgba(255,215,0,.15);}
.b17.self .bubble{background:linear-gradient(135deg,#2a2a2a,#1a1a1a);color:#ffd700;border:1.5px solid #ffd700;box-shadow:0 0 12px rgba(255,215,0,.55),inset 0 0 6px rgba(255,215,0,.15);}
.b18 .bubble{border-radius:20px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;}
.b18.self .bubble{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;}
.b19 .bubble{border-radius:16px;background:linear-gradient(135deg,#e53935,#c62828);color:#fff;}
.b19.self .bubble{background:linear-gradient(135deg,#e53935,#c62828);color:#fff;}
.b20 .bubble{border-radius:8px;background:#fff;color:#000;font-weight:600;border:2px solid #000;}
.b20.self .bubble{background:#fff;color:#000;border:2px solid #000;}
.b21 .bubble{border-radius:6px;background:#07c160;color:#fff;box-shadow:0 1px 4px rgba(0,0,0,.08);}
.b21.self .bubble{background:#07c160;color:#fff;}
.b22 .bubble{border-radius:14px;background:linear-gradient(135deg,#0ea5e9,#0284c7);color:#fff;}
.b22.self .bubble{background:linear-gradient(135deg,#0ea5e9,#0284c7);color:#fff;}
.b23 .bubble{border-radius:20px 20px 6px 20px;background:linear-gradient(135deg,#d4145a,#7a1fa2);color:#fff;}
.b23.self .bubble{border-radius:20px 20px 6px 20px;background:linear-gradient(135deg,#d4145a,#7a1fa2);color:#fff;}
.b24 .bubble{border-radius:14px;background:#fff;color:#ec4899;border:2px solid #ec4899;box-shadow:0 0 12px rgba(236,72,153,.4);}
.b24.self .bubble{background:#fff;color:#ec4899;border-color:#ec4899;box-shadow:0 0 12px rgba(236,72,153,.4);}

/* 25-34 动态 */
@keyframes flowBorder{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.b25 .bubble{border-radius:14px;background:#111;color:#fff;position:relative;isolation:isolate;}
.b25 .bubble::before{content:'';position:absolute;inset:-2px;border-radius:16px;z-index:-1;background:linear-gradient(90deg,#ff0000,#ff7300,#fffb00,#48ff00,#00ffd5,#002bff,#7a00ff,#ff00c8,#ff0000);background-size:400% 400%;animation:flowBorder 3s linear infinite;}
@keyframes breathe{0%,100%{box-shadow:0 0 8px rgba(76,175,80,.4)}50%{box-shadow:0 0 24px rgba(76,175,80,.9)}}
.b26 .bubble{border-radius:16px;background:linear-gradient(135deg,#4caf50,#2e7d32);color:#fff;animation:breathe 2.5s ease-in-out infinite;}
.b26.self .bubble{background:linear-gradient(135deg,#4caf50,#2e7d32);color:#fff;}
@keyframes gradientFlow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.b27 .bubble{border-radius:16px;background:linear-gradient(270deg,#f093fb,#f5576c,#4facfe,#00f2fe);background-size:300% 300%;color:#fff;animation:gradientFlow 5s ease infinite;}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.b28 .bubble{border-radius:20px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.12);animation:floaty 2s ease-in-out infinite;}
.b28.self .bubble{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;}
@keyframes shine{0%{left:-100%}60%,100%{left:200%}}
.b29 .bubble{border-radius:14px;background:linear-gradient(135deg,#2e7d32,#4caf50);color:#fff;position:relative;overflow:hidden;}
.b29 .bubble::after{content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-20deg);animation:shine 3s infinite;}
@keyframes jelly{0%,100%{transform:scale(1,1)}25%{transform:scale(1.06,.94)}50%{transform:scale(.96,1.04)}75%{transform:scale(1.02,.98)}}
.b30 .bubble{border-radius:18px;background:linear-gradient(135deg,#a1c4fd,#c2e9fb);color:#1e3a8a;animation:jelly 1.5s ease-in-out infinite;}
.b30.self .bubble{background:linear-gradient(135deg,#a1c4fd,#c2e9fb);color:#1e3a8a;}
.b31 .bubble{border-radius:16px;background:linear-gradient(135deg,#1a1a2e,#16213e);color:#ffd700;position:relative;overflow:hidden;}
.b31 .bubble::before{content:'✨ ✨ ✨';position:absolute;top:2px;left:0;right:0;font-size:.6em;text-align:center;animation:twinkle 2s ease-in-out infinite;}
@keyframes twinkle{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes liquid{0%,100%{border-radius:60% 40% 50% 50%/50% 60% 40% 50%}50%{border-radius:40% 60% 60% 40%/60% 40% 60% 40%}}
.b32 .bubble{background:linear-gradient(135deg,#00c6ff,#0072ff);color:#fff;animation:liquid 4s ease-in-out infinite;}
@keyframes neonPulse{0%,100%{box-shadow:0 0 6px #0ff,0 0 12px #0ff}50%{box-shadow:0 0 16px #0ff,0 0 32px #0ff}}
.b33 .bubble{border-radius:12px;background:#0a0a0a;color:#f0f;border:2px solid #f0f;animation:neonPulse 1.8s ease-in-out infinite;}
.b33.self .bubble{color:#f0f;border-color:#f0f;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.b34 .bubble{border-radius:14px;background:#e8f5e9;color:#333;border:1px solid #ddd;}
.b34 .bubble::after{content:'▌';color:#2e7d32;animation:blink 1s step-end infinite;margin-left:2px;}
.b34.self .bubble{background:#e8f5e9;}

/* 35-44 可爱 SVG */

.b35.self .bubble{background:linear-gradient(135deg,#ff9a9e,#fecfef);color:#8a2a4a;}
.b36 .bubble{border-radius:18px;background:linear-gradient(135deg,#ffb6c1,#ff8fb1);color:#fff;position:relative;overflow:hidden;}
.b36 .bubble::after{content:'';position:absolute;right:-8px;top:-8px;width:44px;height:44px;opacity:.55;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><g fill='%23ff8fb1' stroke='%23e05780' stroke-width='.8' stroke-linejoin='round'><path d='M12 4c1.2 1.6 1.2 3.4 0 4.6-1.2-1.2-1.2-3 0-4.6z'/><path d='M12 20c-1.2-1.6-1.2-3.4 0-4.6 1.2 1.2 1.2 3 0 4.6z'/><path d='M4 12c1.6-1.2 3.4-1.2 4.6 0-1.2 1.2-3 1.2-4.6 0z'/><path d='M20 12c-1.6 1.2-3.4 1.2-4.6 0 1.2-1.2 3-1.2 4.6 0z'/><path d='M6.3 6.3c2 .2 3.3 1.4 3.5 3.3-1.9-.2-3.2-1.4-3.5-3.3z'/><path d='M17.7 17.7c-2-.2-3.3-1.4-3.5-3.3 1.9.2 3.2 1.4 3.5 3.3z'/><path d='M17.7 6.3c-.2 2-1.4 3.3-3.3 3.5.2-1.9 1.4-3.2 3.3-3.5z'/><path d='M6.3 17.7c.2-2 1.4-3.3 3.3-3.5-.2 1.9-1.4 3.2-3.3 3.5z'/></g><circle cx='12' cy='12' r='1.4' fill='%23fff3f7'/></svg>") center/contain no-repeat;}
.b36.self .bubble{background:linear-gradient(135deg,#ffb6c1,#ff8fb1);color:#fff;}
.b37 .bubble{border-radius:16px;background:linear-gradient(135deg,#4a4a8a,#2d2d5a);color:#ffe082;position:relative;padding-left:32px;}
.b37 .bubble::before{content:'';position:absolute;left:8px;top:50%;transform:translateY(-50%);width:18px;height:18px;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 2.4l2.7 5.9 6.3.8-4.6 4.4 1.2 6.3-5.6-3-5.6 3 1.2-6.3L2.9 9.1l6.3-.8z' fill='%23ffd54f' stroke='%23f9a825' stroke-width='1' stroke-linejoin='round'/><path d='M12 6.5l1.4 3 3.2.4-2.3 2.2.6 3.2L12 13.7 9.1 15.3l.6-3.2-2.3-2.2 3.2-.4z' fill='%23fff8e1' opacity='.7'/></svg>") center/contain no-repeat;animation:twinkle 2s ease-in-out infinite;}
.b37.self .bubble{background:linear-gradient(135deg,#4a4a8a,#2d2d5a);}
.b38 .bubble{border-radius:20px;background:#ffeef5;color:#a83a6a;border:1px solid #f0d0e0;position:relative;margin-top:10px;}
.b38 .bubble::before{content:'';position:absolute;left:10px;top:-14px;width:28px;height:24px;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 26'><g stroke='%23e88cb0' stroke-width='1.4'><path d='M10 24C6 22 5 15 6.5 9 7.5 5 9 2.5 10.5 2.5s3 2.5 3.5 6.5c.6 5-.5 12-4 15z' fill='%23fff'/><path d='M22 24c4-2 5-9 3.5-15-1-4-2.5-6.5-4-6.5s-3 2.5-3.5 6.5c-.6 5 .5 12 4 15z' fill='%23fff'/><path d='M10.3 21c-2-2-2.6-8-1.6-12 .5-2 1.3-3.6 1.8-3.6s1.3 1.6 1.8 3.6c1 4 .4 10-2 12z' fill='%23ffc9dc' stroke='none'/><path d='M21.7 21c2-2 2.6-8 1.6-12-.5-2-1.3-3.6-1.8-3.6s-1.3 1.6-1.8 3.6c-1 4-.4 10 2 12z' fill='%23ffc9dc' stroke='none'/></g></svg>") center/contain no-repeat;}

/* ===== 气泡皮肤结束 ===== */
.sys-recall{text-align:center;font-size:.72em;color:var(--text-muted);padding:6px 0;line-height:1.5;flex-shrink:0}
.sys-recall .deleted-by{color:var(--official-blue);font-weight:600}
.sys-recall .rc-icon{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-right:4px;stroke:var(--text-muted);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.row .official-badge{font-size:.5em;background:var(--primary);color:#fff;padding:0 6px;border-radius:99px;line-height:16px;font-weight:700}
.pill-bar{flex-shrink:0;display:flex;gap:8px;align-items:center;padding:8px 16px 0;overflow-x:auto;background:var(--bg)}
.pill-btn{position:relative;display:inline-flex;align-items:center;gap:6px;padding:8px 22px;border-radius:999px;border:2px solid var(--border);background:var(--bg-card);color:var(--text);font-family:inherit;font-weight:700;font-size:.8em;cursor:pointer;white-space:nowrap;transition:.2s}
.pill-btn:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-bg)}
.pill-btn:active{transform:scale(.97)}
.pill-btn svg{width:15px;height:15px;flex-shrink:0}
.pill-new{position:absolute;top:-7px;right:-4px;background:var(--success);color:#fff;font-size:.6em;font-weight:800;padding:1px 6px;border-radius:999px;line-height:14px;box-shadow:0 2px 6px rgba(34,197,94,.5);letter-spacing:.5px}
.fixed-input-area{flex-shrink:0;padding:10px 16px calc(10px + var(--safe-b));background:var(--bg);border-top:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fixed-input-area .input-wrapper{flex:1;display:flex;gap:8px;min-width:0}
.fixed-input-area input{flex:1;padding:10px 14px;border-radius:99px;border:2px solid var(--border);background:var(--bg-input);font-family:inherit;font-size:.85em;outline:none;min-width:0;color:var(--text)}
.fixed-input-area input:focus{border-color:var(--primary)}
.fixed-input-area input:disabled{opacity:.5}
.fixed-input-area button{padding:8px 18px;border-radius:99px;border:none;background:var(--primary);color:#fff;font-weight:700;font-size:.85em;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px;font-family:inherit}
.fixed-input-area button:hover{background:var(--primary-light)}
.fixed-input-area button:disabled{opacity:.5;pointer-events:none}
.fixed-input-area .admin-clear-btn{background:var(--danger);color:#fff;padding:6px 12px;border-radius:99px;border:none;font-size:.7em;cursor:pointer;display:none}
.rp-list{padding:0 12px;display:flex;flex-direction:column;gap:8px;flex-shrink:0;}
.rp-list:not(:empty){padding-top:12px;}
.rp-card{flex-shrink:0;max-width:78%;align-self:center;background:linear-gradient(135deg,#ff7043,#e64a19);border-radius:14px;padding:13px 18px;color:#fff;cursor:pointer;box-shadow:0 6px 18px rgba(230,74,25,.3);transition:transform .15s;}
.rp-card:active{transform:scale(.97)}
.rp-card.grabbed{background:linear-gradient(135deg,#9e9e9e,#757575);box-shadow:none;cursor:default;}
.rp-card.done{background:linear-gradient(135deg,#bdbdbd,#9e9e9e);box-shadow:none;cursor:default;}
.rp-card.exclusive{background:linear-gradient(135deg,#8e24aa,#5e35b1);box-shadow:0 6px 18px rgba(94,53,177,.3);}
.rp-card.exclusive.grabbed,.rp-card.exclusive.done{background:linear-gradient(135deg,#9e9e9e,#757575);}
.rp-card .rp-top{display:flex;align-items:center;gap:8px;font-weight:800;font-size:.88em;}
.rp-card .rp-top svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;flex-shrink:0;}
.rp-card .rp-sub{font-size:.7em;opacity:.9;margin-top:5px;}
.rp-card .rp-amt{font-size:1.4em;font-weight:900;margin-top:4px;}
.rp-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:998;opacity:0;pointer-events:none;transition:opacity .3s;}
.rp-backdrop.open{opacity:1;pointer-events:auto;}
.rp-sheet{position:fixed;left:0;right:0;bottom:0;background:var(--bg-card);border-radius:20px 20px 0 0;z-index:999;padding:8px 20px calc(20px + var(--safe-b));transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);max-height:82vh;overflow-y:auto;}
.rp-sheet.open{transform:translateY(0);}
.rp-handle{width:40px;height:4px;background:var(--border);border-radius:99px;margin:6px auto 14px;}
.rp-title{font-weight:800;font-size:1.05em;margin-bottom:16px;}
.rp-field{margin-bottom:14px;}
.rp-field label{display:block;font-size:.72em;font-weight:600;color:var(--text-muted);margin-bottom:6px;}
.rp-field input,.rp-field select{width:100%;padding:11px 14px;border:2px solid var(--border);border-radius:10px;font-family:inherit;font-size:1em;outline:none;box-sizing:border-box;background:var(--bg-input);color:var(--text);}
.rp-field input:focus,.rp-field select:focus{border-color:var(--primary);}
.rp-type-row{display:flex;gap:8px;}
.rp-type{flex:1;padding:9px;border-radius:10px;border:2px solid var(--border);background:#fff;color:var(--text-muted);font-weight:700;font-size:.82em;cursor:pointer;font-family:inherit;}
.rp-type.active{border-color:var(--primary);background:var(--primary-bg);color:var(--primary);}
.rp-send{width:100%;padding:13px;border-radius:10px;border:none;background:var(--primary);color:#fff;font-weight:700;font-size:1em;cursor:pointer;font-family:inherit;margin-top:6px;}
.rp-send:disabled{opacity:.5;pointer-events:none;}
.rp-hint{font-size:.72em;color:var(--text-light);margin-top:10px;text-align:center;}
.rp-rank-item{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-radius:8px;background:var(--bg-input);margin-bottom:6px;font-size:.85em;}
.rp-rank-item .rr-left{display:flex;align-items:center;gap:10px;}
.rp-rank-item .rr-no{width:20px;text-align:center;font-weight:800;color:var(--text-muted);}
.rp-rank-item .rr-no.top1{color:#e6a700;}
.rp-rank-item .rr-amt{font-weight:800;color:var(--primary);}
.icon-svg{width:1.2em;height:1.2em;fill:currentColor;flex-shrink:0}
.empty-state{text-align:center;color:var(--text-muted);padding:40px 20px;font-size:.85em}
.empty-state .big{font-size:2.8em;margin-bottom:8px;opacity:.5}
.loading-state{text-align:center;color:var(--text-muted);padding:40px 20px;font-size:.9em}
.loading-state .spinner{display:inline-block;width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:12px}
@keyframes spin{to{transform:rotate(360deg)}}
.chat-ctx-menu{position:fixed;z-index:10000;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 32px rgba(0,0,0,.15);padding:4px 0;min-width:130px}
.chat-ctx-item{padding:10px 16px;font-size:.85em;cursor:pointer;color:var(--text);display:flex;align-items:center;gap:8px}
.chat-ctx-item:hover{background:var(--primary-bg);color:var(--primary)}
.chat-ctx-item.danger:hover{background:#ffebee;color:var(--danger)}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:#fff;padding:.7em 1.5em;border-radius:2em;font-weight:600;font-size:.85em;opacity:0;transition:all .4s ease;z-index:9999;pointer-events:none;white-space:nowrap;box-shadow:var(--shadow);max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.custom-modal{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:20px}
.custom-modal.active{display:flex}
.custom-modal .modal-box{background:var(--bg-card);border-radius:var(--radius);max-width:420px;width:100%;padding:24px;box-shadow:var(--shadow);border:1px solid var(--border)}
.modal-title{font-size:1.2em;font-weight:700;margin-bottom:8px}
.modal-body{font-size:.95em;color:var(--text-muted);margin-bottom:16px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.modal-actions{display:flex;gap:8px;justify-content:flex-end}
.modal-actions button{padding:6px 18px;border-radius:var(--radius-sm);border:none;font-weight:600;cursor:pointer;font-family:inherit}
.modal-actions .btn-danger{background:var(--danger);color:#fff}
.modal-actions .btn-secondary{background:var(--bg-input);color:var(--text-muted)}
/* 在线用户 overlay */
.online-overlay{position:fixed;inset:0;z-index:300;background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);will-change:transform}
.online-overlay.open{transform:translateX(0)}
.online-header{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:calc(10px + var(--safe-t)) 14px 10px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--border);min-height:56px;backdrop-filter:blur(8px)}
.online-header .back{background:none;border:none;cursor:pointer;padding:4px;color:var(--text);display:flex}
.online-header .back svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.online-header .title{font-weight:700;font-size:1em;flex:1}
.online-header .live-dot{display:flex;align-items:center;gap:5px;font-size:.7em;color:var(--success);font-weight:700}
.online-header .live-dot .dot{width:7px;height:7px;border-radius:50%;background:var(--success);box-shadow:0 0 0 3px rgba(34,197,94,.18);animation:pulseDot 1.8s infinite}
@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.4}}
.online-body{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}
.me-card{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--primary-bg);border:1px solid var(--primary);border-radius:var(--radius-sm);margin-bottom:14px}
.ou-avatar{width:42px;height:42px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700;font-size:16px;flex-shrink:0;background-size:cover;background-position:center}
.ou-info{flex:1;min-width:0}
.ou-name{font-weight:700;font-size:.92em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ou-status{font-size:.72em;color:var(--success);display:flex;align-items:center;gap:5px;margin-top:2px;font-weight:600}
.ou-status .dot{width:7px;height:7px;border-radius:50%;background:var(--success);box-shadow:0 0 0 3px rgba(34,197,94,.18)}
.section-label{font-size:.7em;font-weight:700;color:var(--text-light);text-transform:uppercase;letter-spacing:.06em;margin:6px 0 10px;display:flex;align-items:center;gap:6px}
.online-list{display:flex;flex-direction:column;gap:10px}
.online-user{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);animation:fadeInUp .3s ease}
@keyframes fadeInUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.online-user.me{border-color:var(--primary);background:var(--primary-bg)}
.empty-online{text-align:center;padding:70px 20px;color:var(--text-muted)}
.empty-online-icon{font-size:3.2em;opacity:.45;margin-bottom:14px}
.empty-online-title{font-size:.98em;font-weight:700;color:var(--text);margin-bottom:6px}
.empty-online-sub{font-size:.78em;color:var(--text-light);line-height:1.6}
@media (max-width:480px){.app-header{padding:10px 12px}.chat-messages{padding:12px 12px 4px}.fixed-input-area{padding:8px 12px calc(8px + var(--safe-b))}.pill-bar{padding:8px 12px 0}.row{max-width:90%}.user-area .user-name{max-width:54px;font-size:.72em}}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}
</style>

<body>

<div id="mainApp">
  <div id="header-container"></div>
  <div class="banned-banner" id="bannedBanner">账号已被封禁，无法发送聊天消息。解封时间：<span id="bannedUntilDisplay"></span></div>
  <div class="app-content">
    <div class="rp-list" id="rpList"></div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="pill-bar">
      <button class="pill-btn" id="roomPillBtn" type="button" onclick="location.href='/liuyanban/room.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6"/>
        </svg>
        房间
        <span class="pill-new">新</span>
      </button>
    </div>
    <div class="fixed-input-area">
      <button id="chatRedPacketBtn" type="button" style="background:linear-gradient(135deg,#ff7043,#e64a19);">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;"><rect x="4" y="9" width="16" height="11" rx="2"/><path d="M4 9h16M12 3v6M9 6l3-3 3 3"/></svg>
        红包
      </button>
      <div class="input-wrapper">
        <input type="text" id="chatInput" placeholder="说点什么…" maxlength="200" />
        <button id="sendChatBtn" type="button">
          <svg class="icon-svg" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
          <span class="btn-text">发送</span>
        </button>
      </div>
      <button class="admin-clear-btn" id="clearChatBtn" type="button">清空聊天</button>
    </div>
  </div>
  <div id="footer-container"></div>
</div>

<div class="rp-backdrop" id="rpBackdrop"></div>
<div class="rp-sheet" id="rpSheet">
  <div class="rp-handle"></div>
  <div class="rp-title">发红包</div>
  <div class="rp-field">
    <label>红包总积分</label>
    <input type="number" id="crpTotal" placeholder="如 100" min="1" />
  </div>
  <div class="rp-field">
    <label>类型</label>
    <div class="rp-type-row">
      <button type="button" class="rp-type active" data-t="group">拼手气（群红包）</button>
      <button type="button" class="rp-type" data-t="exclusive">专属红包</button>
    </div>
  </div>
  <div class="rp-field" id="crpCountField">
    <label>可领份数（至少 2 份）</label>
    <input type="number" id="crpCount" placeholder="如 5" min="2" />
  </div>
  <div class="rp-field" id="crpTargetField" style="display:none;">
    <label>指定领取人（在线用户）</label>
    <select id="crpTarget"></select>

function scheduleRender(){
  if(renderDebounce)clearTimeout(renderDebounce);

}

function initPresence(){
  if(onlineChannel){try{window.sb.removeChannel(onlineChannel)}catch(e){}onlineChannel=null}
  // 每个用户用 user_id 作为 presence key，保证唯一
  onlineChannel=window.sb.channel('sq-chat-online',{
    config:{presence:{key:currentUser.id}}
  });

  // 全量同步
  onlineChannel.on('presence',{event:'sync'},function(){
    var raw=onlineChannel.presenceState();
    var map={};
    Object.keys(raw).forEach(function(key){
      var arr=raw[key];
      if(!arr||!arr.length)return;
      var p=arr[0];
      var uid=p.user_id||key;
      map[uid]={
        id:uid,
        nickname:p.nickname||'用户',
        avatar_url:p.avatar_url||'',
        online_at:p.online_at||''
      };
    });
    onlineUsers=map;
    scheduleRender();
  });

  // 有新人加入
  onlineChannel.on('presence',{event:'join'},function(payload){
    if(payload&&payload.newPresences){
      payload.newPresences.forEach(function(p){
        var uid=p.user_id||'';
        if(!uid)return;
        onlineUsers[uid]={id:uid,nickname:p.nickname||'用户',avatar_url:p.avatar_url||'',online_at:p.online_at||''};
      });
      scheduleRender();
    }
  });

  // 有人离开
  onlineChannel.on('presence',{event:'leave'},function(payload){
    if(payload&&payload.leftPresences){
      payload.leftPresences.forEach(function(p){
        var uid=p.user_id||'';
        if(uid&&onlineUsers[uid])delete onlineUsers[uid];
      });
      scheduleRender();
    }
  });

  onlineChannel.subscribe(function(status){
    if(status==='SUBSCRIBED'){
      onlineChannel.track({
        user_id:currentUser.id,
        nickname:currentUser.nickname,
        avatar_url:currentUser.avatar_url||'',
        online_at:new Date().toISOString()
      });
    }else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'){
      // 断线后 3 秒重连
      setTimeout(initPresence,3000);
    }
  });
}

function formatTimeDivider(date){
  var now=new Date(),d=new Date(date);
  var sy=d.getFullYear()===now.getFullYear();
  var sd=sy&&d.getMonth()===now.getMonth()&&d.getDate()===now.getDate();
  var hm=d.toTimeString().slice(0,5);
  if(sd)return hm;
  if(sy)return(d.getMonth()+1)+'月'+d.getDate()+'日 '+hm;
  return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 '+hm;
}

    var res = await window.sb.from('red_packet_grabs')
      .select('packet_id, amount')
      .eq('user_id', currentUser.id)
      .in('packet_id', ids);
    (res.data || []).forEach(function(g){ crpState.myGrabs[g.packet_id] = g.amount; });
  }catch(e){}
}

function renderChatRedPackets(){
  var c = document.getElementById('rpList');
  if(!c) return;
  if(!crpState.list.length){ c.innerHTML = ''; return; }
  c.innerHTML = crpState.list.map(function(p){
    var mine = crpState.myGrabs[p.id];
    var finished = p.remaining_count <= 0;
    var isExclusive = !!p.target_user_id;
    var cls = (isExclusive ? 'exclusive ' : '') + (mine !== undefined ? 'grabbed' : (finished ? 'done' : ''));
    var sub, amtHtml = '';
    if(mine !== undefined){
      sub = isExclusive ? '专属红包 · 你已领取' : '你已领取 · 看看手气';
      amtHtml = '<div class="rp-amt">' + mine + ' 币</div>';
    } else if(finished){
      sub = '手慢了，红包已领完';
    } else if(isExclusive){
      var isTarget = p.target_user_id === currentUser.id;
      sub = isTarget ? '专属红包 · 点击领取' : '专属红包（非指定人无法领取）';
    } else {
      sub = '剩余 ' + p.remaining_count + '/' + p.count + ' 份';
    }
    return '<div class="rp-card ' + cls + '" data-rp="' + p.id + '">' +
      '<div class="rp-top"><svg viewBox="0 0 24 24"><rect x="4" y="9" width="16" height="11" rx="2"/><path d="M4 9h16M12 3v6M9 6l3-3 3 3"/></svg>' +
      escapeHtml(p.sender_name || '匿名') + (isExclusive ? ' 的专属红包' : ' 的红包') + '</div>' +
      amtHtml +
      '<div class="rp-sub">' + sub + '</div>' +
    '</div>';
  }).join('');
  c.querySelectorAll('.rp-card').forEach(function(el){
    el.onclick = function(){ openChatRedPacket(this.dataset.rp); };
  });
}

async function openChatRedPacket(packetId){
  var p = crpState.list.find(function(x){ return String(x.id) === String(packetId); });
  if(!p) return;
  var mine = crpState.myGrabs[p.id];
  if(mine === undefined && p.remaining_count > 0 && p.sender_id !== currentUser.id){
    await grabChatRedPacket(p.id);
    p = crpState.list.find(function(x){ return String(x.id) === String(packetId); }) || p;
    mine = crpState.myGrabs[p.id];
  }
  showChatRedPacketDetail(p, mine);
}

async function grabChatRedPacket(packetId){
  try{
    var res = await window.sb.rpc('grab_red_packet', { p_user_id: currentUser.id, p_packet_id: packetId });
    if(res.error) throw res.error;
    var d = res.data;
    if(d && d.ok){
      showToast('手气不错，抢到 ' + d.amount + ' 币！');
      try{ var u = await window.sb.from('users').select('coins').eq('id', currentUser.id).single(); if(u.data){ currentUser.coins = u.data.coins; setSessionUser(currentUser); } }catch(e){}
      await loadChatRedPackets();
    } else {
      showToast((d && d.message) || '领取失败');
      await loadChatRedPackets();
    }
  }catch(e){ showToast('领取失败：' + e.message); }
}

async function showChatRedPacketDetail(p, myAmount){
  var body = document.getElementById('rpDetailBody');
  body.innerHTML = '<div style="text-align:center;color:var(--text-muted);font-size:.85em;padding:20px;">加载中…</div>';
  openChatRpDetail();
  try{
    var res = await window.sb.from('red_packet_grabs')
      .select('*').eq('packet_id', p.id).order('amount', { ascending: false });
    var rows = res.data || [];
    var html = '<div style="text-align:center;margin-bottom:18px;">' +
      '<div style="font-size:.8em;color:var(--text-muted);">' + escapeHtml(p.sender_name || '匿名') + (p.target_user_id ? ' 的专属红包' : ' 的红包') + '</div>' +
      '<div style="font-size:1.6em;font-weight:900;color:var(--primary);margin-top:4px;">' + p.total + ' 币</div>' +
      '<div style="font-size:.75em;color:var(--text-light);margin-top:4px;">共 ' + p.count + ' 份 · 已领 ' + rows.length + ' 份</div>';
    if(myAmount !== undefined) html += '<div style="margin-top:10px;font-size:.85em;font-weight:700;color:var(--primary);">你领到 ' + myAmount + ' 币</div>';
    html += '</div>';
    if(rows.length){
      html += '<div style="font-size:.72em;font-weight:700;color:var(--text-muted);margin-bottom:8px;">领取排行榜</div>';
      html += rows.map(function(g, i){
        var noCls = i === 0 ? 'top1' : '';
        return '<div class="rp-rank-item"><div class="rr-left"><span class="rr-no ' + noCls + '">' + (i+1) + '</span><span>' + escapeHtml(g.user_name || '用户') + '</span></div><span class="rr-amt">' + g.amount + ' 币</span></div>';
      }).join('');
      if(rows[0]) html += '<div style="font-size:.72em;color:var(--text-light);margin-top:8px;text-align:center;">🏆 手气最佳：' + escapeHtml(rows[0].user_name || '用户') + '（' + rows[0].amount + ' 币）</div>';
    } else {
      html += '<div style="text-align:center;color:var(--text-muted);font-size:.85em;padding:20px;">还没有人领取</div>';
    }
    body.innerHTML = html;
  }catch(e){
    body.innerHTML = '<div style="text-align:center;color:var(--text-muted);font-size:.85em;padding:20px;">加载失败：' + escapeHtml(e.message) + '</div>';
  }
}

var crpType = 'group';
function openChatRpSheet(){
  if(isUserBanned()){ showToast('账号已被封禁'); return; }
  crpType = 'group';
  document.getElementById('crpTotal').value = '';
  document.getElementById('crpCount').value = '';
  syncCrpTypeUI();
  buildCrpTargetOptions();
  document.getElementById('rpBackdrop').classList.add('open');
  document.getElementById('rpSheet').classList.add('open');
}
function closeChatRpSheet(){
  document.getElementById('rpBackdrop').classList.remove('open');
  document.getElementById('rpSheet').classList.remove('open');
}
function syncCrpTypeUI(){
  document.querySelectorAll('.rp-type').forEach(function(b){ b.classList.toggle('active', b.dataset.t === crpType); });
  document.getElementById('crpCountField').style.display = crpType === 'group' ? 'block' : 'none';
  document.getElementById('crpTargetField').style.display = crpType === 'exclusive' ? 'block' : 'none';
}
function buildCrpTargetOptions(){
  var sel = document.getElementById('crpTarget');
  var opts = ['<option value="">请选择在线用户</option>'];
  Object.keys(onlineUsers).forEach(function(k){
    var u = onlineUsers[k];
    if(u.id === currentUser.id) return;
    opts.push('<option value="' + u.id + '">' + escapeHtml(u.nickname || '用户') + '</option>');
  });
  sel.innerHTML = opts.join('');
}
async function sendChatRedPacket(){
  var total = parseInt(document.getElementById('crpTotal').value, 10);
  if(!total || total < 1){ showToast('请输入红包总积分'); return; }
  var count, target = null;
  if(crpType === 'exclusive'){
    target = document.getElementById('crpTarget').value;
    if(!target){ showToast('请选择指定领取人'); return; }
    target = parseInt(target, 10);
    count = 1;
  } else {
    count = parseInt(document.getElementById('crpCount').value, 10);
    if(!count || count < 2){ showToast('份数至少 2 份'); return; }
    if(count > total){ showToast('份数不能超过总积分'); return; }
  }
  var btn = document.getElementById('crpSendBtn');
  btn.disabled = true;
  try{
    var res = await window.sb.rpc('send_red_packet', {
      p_user_id: currentUser.id,
      p_room_id: null,
      p_total: total,
      p_count: count,
      p_scope: 'chat',
      p_target_user_id: target
    });
    if(res.error) throw res.error;
    var d = res.data;
    if(!d || !d.ok){ showToast((d && d.message) || '发送失败'); btn.disabled = false; return; }
    if(d.balance !== undefined){ currentUser.coins = d.balance; setSessionUser(currentUser); }
    closeChatRpSheet();
    showToast('红包已发出');
    await loadChatRedPackets();
  }catch(e){ showToast('发送失败：' + e.message); }
  btn.disabled = false;
}
function openChatRpDetail(){
  document.getElementById('rpDetailBackdrop').classList.add('open');
  document.getElementById('rpDetailSheet').classList.add('open');
}
function closeChatRpDetail(){
  document.getElementById('rpDetailBackdrop').classList.remove('open');
  document.getElementById('rpDetailSheet').classList.remove('open');
}


/* ============================================================
   事件绑定
============================================================ */
document.getElementById('sendChatBtn').addEventListener('click',sendChat);
document.getElementById('chatInput').addEventListener('keydown',function(e){
  if(e.key==='Enter')sendChat();
});
document.getElementById('clearChatBtn').addEventListener('click',clearAllChats);
document.getElementById('chatRedPacketBtn').addEventListener('click',openChatRpSheet);
document.getElementById('rpBackdrop').addEventListener('click',closeChatRpSheet);
document.getElementById('crpSendBtn').addEventListener('click',sendChatRedPacket);
document.getElementById('rpDetailBackdrop').addEventListener('click',closeChatRpDetail);
document.getElementById('rpDetailClose').addEventListener('click',closeChatRpDetail);
document.querySelectorAll('.rp-type').forEach(function(b){
  b.addEventListener('click',function(){ crpType = this.dataset.t; syncCrpTypeUI(); });
});
document.addEventListener('gesturestart',function(e){e.preventDefault()});

/* ============================================================
   初始化
============================================================ */
window.addEventListener('DOMContentLoaded',function(){
  // 底部导航
  if(typeof renderFooter==='function')renderFooter('chats');
  else console.error('renderFooter 未定义，检查 common.js');

  if(isAdmin)document.getElementById('clearChatBtn').style.display='inline-block';

  updateBannedBanner();
  loadAllChats();
  loadChatRedPackets();
  initPresence();  // ★ 启动在线用户

  if(currentUser&&currentUser.id){
    updateLastChatRead(currentUser.id).then(function(){
      if(typeof updateChatBadge==='function')updateChatBadge();
    });
  }

  // 全局聊天实时订阅
  window.sb.channel('chats-page-realtime-'+Date.now())
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'chats'},function(){loadAllChats()})
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'chats'},function(){loadAllChats()})
    .on('postgres_changes',{event:'DELETE',schema:'public',table:'chats'},function(){loadAllChats()})
    .subscribe();

  // 聊天群红包实时订阅（scope=chat）
  crpState.channel = window.sb.channel('chats-rp-'+Date.now())
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'red_packets',filter:'scope=eq.chat'},function(){loadChatRedPackets()})
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'red_packets',filter:'scope=eq.chat'},function(p){
      var i = crpState.list.findIndex(function(x){ return x.id === p.new.id; });
      if(i >= 0){ crpState.list[i] = p.new; renderChatRedPackets(); } else { loadChatRedPackets(); }
    })
    .subscribe();

  // 会话同步
  function syncUser(){
    var s=getSessionUser();
    if(s&&s.id){
      if(!currentUser||currentUser.id!==s.id||currentUser.avatar_url!==s.avatar_url||currentUser.nickname!==s.nickname){
        location.reload();
      }
    }
  }
  window.addEventListener('focus',syncUser);
  document.addEventListener('visibilitychange',function(){
    if(!document.hidden)syncUser();
  });
});
</script>
