<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Seven戚 · 聊天群</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ===== 完整样式（与您之前的 chats.html 完全相同） ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        :root {
            --bg: #f5faf5;
            --bg-card: #ffffff;
            --bg-input: #eaf3ea;
            --border: #c8e0c8;
            --text: #1e3a2e;
            --text-muted: #5a7a6a;
            --text-light: #8aaa9a;
            --primary: #2e7d32;
            --primary-light: #4caf50;
            --primary-glow: rgba(76, 175, 80, 0.25);
            --primary-bg: #e8f5e9;
            --shadow: 0 8px 32px rgba(46, 125, 50, 0.12);
            --radius: 16px;
            --radius-sm: 10px;
            --font: "Space Grotesk", "PingFang SC", "Segoe UI", system-ui, sans-serif;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --danger: #e57373;
            --official-blue: #2b6cff;
        }
        html, body { height: 100%; font-family: var(--font); background: var(--bg); color: var(--text); overflow: hidden; }
        #mainApp { display: flex; flex-direction: column; height: 100vh; height: 100dvh; background: var(--bg); }

        /* 头部、底部样式由 common.js 生成，但保留类定义 */
        .app-header { flex-shrink: 0; padding: 12px 20px 8px 20px; background: rgba(255,255,255,0.92); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; z-index: 50; backdrop-filter: blur(12px); min-height: 56px; }
        .app-header .brand { font-weight: 900; font-size: 1.1em; color: var(--text); display: flex; align-items: center; gap: 0.4em; cursor: default; }
        .app-header .brand span { color: var(--primary); }
        .app-header .brand small { font-weight: 400; font-size: 0.55em; color: var(--text-muted); margin-left: 0.3em; }
        .app-header .user-area { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 4px 10px 4px 6px; border-radius: 99px; transition: background 0.2s; }
        .app-header .user-area:hover { background: var(--primary-bg); }
        .app-header .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--primary); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 14px; flex-shrink: 0; background-size: cover; background-position: center; }
        .app-header .user-name { font-weight: 600; font-size: 0.85em; max-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .app-header .chevron { color: var(--text-muted); font-size: 0.7em; transition: transform 0.3s; }

        .app-tabs { flex-shrink: 0; display: flex; background: rgba(255,255,255,0.96); border-top: 1px solid var(--border); padding: 6px 0 calc(6px + var(--safe-bottom)); z-index: 50; backdrop-filter: blur(12px); }
        .tab-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; background: none; border: none; font-family: var(--font); font-size: 0.6em; font-weight: 600; color: var(--text-muted); padding: 4px 0; cursor: pointer; transition: color 0.2s; position: relative; text-decoration: none; }
        .tab-btn .tab-icon { font-size: 1.6em; line-height: 1.2; }
        .tab-btn.active { color: var(--primary); }
        .tab-btn.active::after { content: ''; position: absolute; top: -1px; left: 30%; right: 30%; height: 3px; background: var(--primary); border-radius: 0 0 4px 4px; }

        /* 封禁横幅 */
        .banned-banner { flex-shrink: 0; background: #ffebee; color: #c62828; padding: 6px 16px; font-size: 0.8em; font-weight: 600; text-align: center; border-bottom: 1px solid #ffcdd2; display: none; }
        .banned-banner.active { display: block; }

        /* 聊天内容 */
        .app-content { flex: 1; min-height: 0; display: flex; flex-direction: column; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 16px 20px 8px 20px; display: flex; flex-direction: column; gap: 4px; -webkit-overflow-scrolling: touch; }
        .time-divider { text-align: center; font-size: 0.7em; color: var(--text-light); padding: 6px 0; position: relative; }
        .time-divider span { background: var(--bg); padding: 0 12px; }
        .time-divider::before { content: ''; position: absolute; left: 10%; right: 10%; top: 50%; height: 1px; background: var(--border); z-index: 0; }
        .time-divider span { position: relative; z-index: 1; }

        .chat-msg { max-width: 85%; padding: 8px 12px; border-radius: var(--radius-sm); background: var(--bg-card); border: 1px solid var(--border); align-self: flex-start; flex-shrink: 0; position: relative; transition: opacity 0.3s; }
        .chat-msg.self { align-self: flex-end; background: var(--primary-bg); border-color: var(--primary); }
        .chat-msg.deleted { opacity: 0.6; background: #f0f0f0; border-color: #ccc; }
        .chat-msg.deleted .chat-text { color: var(--text-muted); font-style: italic; }
        .chat-msg.deleted .deleted-by { color: var(--official-blue); font-weight: 600; }
        .chat-msg .msg-header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
        .chat-msg .msg-header .avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--primary); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 12px; flex-shrink: 0; background-size: cover; background-position: center; }
        .chat-msg .msg-header .name { font-weight: 600; font-size: 0.85em; }
        .chat-msg .msg-header .official-badge { font-size: 0.5em; background: var(--primary); color: #fff; padding: 0 6px; border-radius: 99px; line-height: 16px; }
        .chat-msg .msg-header .revoke-btn { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 0.7em; padding: 0 4px; margin-left: auto; display: none; }
        .chat-msg:hover .revoke-btn { display: inline-block; }
        .chat-msg .msg-header .context-hint { display: none; font-size: 0.6em; color: var(--text-light); margin-left: auto; }
        .chat-msg:hover .context-hint { display: inline; }
        .chat-msg .chat-text { font-size: 0.85em; line-height: 1.5; word-break: break-word; }

        .fixed-input-area { flex-shrink: 0; padding: 10px 20px calc(10px + var(--safe-bottom)); background: var(--bg); border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .fixed-input-area .input-wrapper { flex: 1; display: flex; gap: 8px; min-width: 0; }
        .fixed-input-area input { flex: 1; padding: 10px 14px; border-radius: 99px; border: 2px solid var(--border); background: var(--bg-input); font-family: inherit; font-size: 0.85em; outline: none; transition: border-color 0.2s; color: var(--text); min-width: 0; }
        .fixed-input-area input:focus { border-color: var(--primary); }
        .fixed-input-area input:disabled { opacity: 0.5; }
        .fixed-input-area button { padding: 8px 20px; border-radius: 99px; border: none; background: var(--primary); color: #fff; font-weight: 700; font-size: 0.85em; cursor: pointer; transition: background 0.2s; font-family: inherit; white-space: nowrap; flex-shrink: 0; display: flex; align-items: center; gap: 6px; min-width: 80px; justify-content: center; }
        .fixed-input-area button:hover { background: var(--primary-light); }
        .fixed-input-area button:disabled { opacity: 0.5; pointer-events: none; }
        .fixed-input-area .admin-clear-btn { background: var(--danger); color: #fff; padding: 6px 12px; border-radius: 99px; border: none; font-size: 0.7em; font-weight: 600; cursor: pointer; display: none; transition: 0.2s; }

        .icon-svg { width: 1.2em; height: 1.2em; fill: currentColor; flex-shrink: 0; }
        .btn-text { margin-left: 2px; }
        .empty-state { text-align: center; color: var(--text-muted); padding: 40px 20px; font-size: 0.85em; }
        .empty-state .big { font-size: 2.8em; margin-bottom: 8px; opacity: 0.5; }
        .loading-state { text-align: center; color: var(--text-muted); padding: 40px 20px; font-size: 0.9em; }
        .loading-state .spinner { display: inline-block; width: 30px; height: 30px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 12px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--text); color: #fff; padding: 0.7em 1.6em; border-radius: 2em; font-weight: 600; font-size: 0.85em; opacity: 0; transition: all 0.4s ease; z-index: 9999; pointer-events: none; white-space: nowrap; box-shadow: var(--shadow); }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        @media (max-width: 480px) {
            .app-header { padding: 10px 14px 6px 14px; min-height: 48px; }
            .app-header .brand { font-size: 0.95em; }
            .app-header .user-name { max-width: 60px; font-size: 0.75em; }
            .chat-messages { padding: 12px 14px 4px 14px; }
            .fixed-input-area { padding: 8px 14px calc(8px + var(--safe-bottom)); flex-direction: column; align-items: stretch; }
            .fixed-input-area .input-wrapper { flex: 1; }
            .fixed-input-area input { padding: 8px 12px; font-size: 0.8em; }
            .fixed-input-area button { padding: 6px 14px; font-size: 0.8em; }
            .chat-msg { max-width: 90%; }
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

        /* 确认弹窗 */
        .custom-modal { position: fixed; inset: 0; z-index: 2000; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; padding: 20px; }
        .custom-modal.active { display: flex; }
        .custom-modal .modal-box { background: var(--bg-card); border-radius: var(--radius); max-width: 420px; width: 100%; padding: 24px; box-shadow: var(--shadow); border: 1px solid var(--border); }
        .modal-title { font-size: 1.2em; font-weight: 700; margin-bottom: 8px; color: var(--text); }
        .modal-body { font-size: 0.95em; color: var(--text-muted); line-height: 1.6; margin-bottom: 16px; }
        .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
        .modal-actions button { padding: 6px 18px; border-radius: var(--radius-sm); border: none; font-weight: 600; font-size: 0.85em; cursor: pointer; transition: background 0.2s; font-family: inherit; }
        .modal-actions .btn-danger { background: var(--danger); color: #fff; }
        .modal-actions .btn-secondary { background: var(--bg-input); color: var(--text-muted); }
    </style>
</head>
<body>
    <div id="mainApp">
        <div id="header-container"></div>
        <div class="banned-banner" id="bannedBanner">
            ⚠️ 账号已被封禁，无法发送聊天消息。解封时间：<span id="bannedUntilDisplay"></span>
        </div>
        <div class="app-content">
            <div class="chat-messages" id="chatMessages"></div>
            <div class="fixed-input-area">
                <div class="input-wrapper">
                    <input type="text" id="chatInput" placeholder="说点什么…" maxlength="200" />
                    <button id="sendChatBtn" onclick="sendChat()">
                        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
                        <span class="btn-text">发送</span>
                    </button>
                </div>
                <button class="admin-clear-btn" id="clearChatBtn" onclick="clearAllChats()">🗑️ 清空聊天</button>
            </div>
        </div>
        <div id="footer-container"></div>
    </div>

    <div class="custom-modal" id="confirmModal">
        <div class="modal-box">
            <div class="modal-title" id="confirmTitle">确认</div>
            <div class="modal-body" id="confirmBody">确定要执行此操作吗？</div>
            <div class="modal-actions">
                <button class="btn-secondary" id="confirmCancel">取消</button>
                <button class="btn-danger" id="confirmOk">确定</button>
            </div>
        </div>
    </div>

    <div id="toast"></div>

    <script src="/liuyanban/common.js"></script>
    <script>
        // ============================================================

        renderHeader('聊天群', 'chats');
        renderFooter('chats');

        // ============================================================

        // ============================================================
        function showToast(msg) { ... } // 从原文件复制

        var currentUser = getSessionUser();

        var isAdmin = (currentUser.phone === '17355394710');

        var isAuthorMode = false;
        var AUTHOR_PASSWORD = "7592";
        // 作者模式相关代码...

        var chats = [];
        var chatsLoading = false;
        var usersCache = {};

        async function fetchChats() { ... } // 从原文件复制
        async function addChat(userId, author, content, isOfficial) { ... }
        async function revokeChat(id, author, revoker, isSelf) { ... }
        async function clearAllChats() { ... }
        function formatTimeDivider(date) { ... }
        function shouldShowTimeDivider(prevTime, currentTime) { ... }
        function renderChat() { ... }
        async function doRevoke(id, author, isSelf) { ... }
        function sendChat() { ... }
        async function loadAllData() { ... }
        function showConfirm(title, body, onOk) { ... }
        function updateBannedBanner() { ... }

        // 初始化
        (function init() {
            const session = getSessionUser();
            if (!session || !session.id) { window.location.href = 'index.html'; return; }
            currentUser = session;
            isAdmin = (currentUser.phone === '17355394710');
            renderHeader('聊天群', 'chats');
            renderFooter('chats');
            updateBannedBanner();
            loadAllData();

            // 更新最后查看时间，清除红点
            if (currentUser && currentUser.id) {
                updateLastChatRead(currentUser.id).then(() => {
                    updateChatBadge();
                });
            }

            if (isAdmin) {
                document.getElementById('clearChatBtn').style.display = 'inline-block';
            }

            // ========== 实时订阅（确保表已启用 Realtime） ==========
            window.sb.channel('chats-page-realtime')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chats' }, (payload) => {
                    console.log('收到新消息:', payload.new);
                    loadAllData();
                })
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'chats' }, (payload) => {
                    console.log('消息更新:', payload.new);
                    loadAllData();
                })
                .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'chats' }, (payload) => {
                    console.log('消息删除:', payload.old);
                    loadAllData();
                })
                .subscribe();
        })();
    </script>
</body>
</html>
