<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Seven戚 · 聊天群</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    <style>
        /* ===== 完整样式（与之前相同，略去重复） ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        :root {
            --bg: #f5faf5;
            --bg-card: #ffffff;
            --bg-input: #eaf3ea;
            --border: #c8e0c8;
            --text: #1e3a2e;
            --text-muted: #5a7a6a;
            --text-light: #8aaa9a;
            --primary: #2e7d32;
            --primary-light: #4caf50;
            --primary-glow: rgba(76, 175, 80, 0.25);
            --primary-bg: #e8f5e9;
            --shadow: 0 8px 32px rgba(46, 125, 50, 0.12);
            --radius: 16px;
            --radius-sm: 10px;
            --font: "Space Grotesk", "PingFang SC", "Segoe UI", system-ui, sans-serif;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --danger: #e57373;
            --official-blue: #2b6cff;
        }
        html, body { height: 100%; font-family: var(--font); background: var(--bg); color: var(--text); overflow: hidden; }
        #mainApp { display: flex; flex-direction: column; height: 100vh; height: 100dvh; background: var(--bg); }
        .app-header {
            flex-shrink: 0; padding: 12px 20px 8px 20px;
            background: var(--bg-card); border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            z-index: 50; backdrop-filter: blur(12px);
            background: rgba(255,255,255,0.92);
            min-height: 56px;
        }
        .app-header .brand {
            font-weight: 900; font-size: 1.1em; color: var(--text);
            display: flex; align-items: center; gap: 0.4em;
            cursor: default; user-select: none;
        }
        .app-header .brand span { color: var(--primary); }
        .app-header .brand small { font-weight: 400; font-size: 0.55em; color: var(--text-muted); margin-left: 0.3em; }
        .app-header .brand .author-badge {
            background: var(--primary); color: #fff; font-size: 0.55em;
            padding: 0 8px; border-radius: 99px; line-height: 18px;
            margin-left: 6px; display: none;
        }
        .app-header .brand .author-badge.active { display: inline-block; }
        .app-header .user-area {
            display: flex; align-items: center; gap: 10px;
            cursor: pointer; padding: 4px 10px 4px 6px;
            border-radius: 99px; transition: background 0.2s;
        }
        .app-header .user-area:hover { background: var(--primary-bg); }
        .app-header .avatar {
            width: 32px; height: 32px; border-radius: 50%;
            background: var(--primary); color: #fff;
            display: grid; place-items: center;
            font-weight: 700; font-size: 14px; flex-shrink: 0;
            background-size: cover;
            background-position: center;
        }
        .app-header .user-name {
            font-weight: 600; font-size: 0.85em;
            max-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .app-header .chevron { color: var(--text-muted); font-size: 0.7em; transition: transform 0.3s; }
        .app-header .chevron.open { transform: rotate(180deg); }
        .author-mode-hint {
            font-size: 0.6em; color: var(--primary); margin-left: 10px;
            font-weight: 700; display: none;
        }
        .author-mode-hint.active { display: inline; }

        .banned-banner {
            flex-shrink: 0;
            background: #ffebee;
            color: #c62828;
            padding: 6px 16px;
            font-size: 0.8em;
            font-weight: 600;
            text-align: center;
            border-bottom: 1px solid #ffcdd2;
            display: none;
        }
        .banned-banner.active { display: block; }

        .app-content { flex: 1; min-height: 0; display: flex; flex-direction: column; }
        .chat-messages {
            flex: 1; overflow-y: auto;
            padding: 16px 20px 8px 20px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            -webkit-overflow-scrolling: touch;
        }
        .time-divider {
            text-align: center;
            font-size: 0.7em;
            color: var(--text-light);
            padding: 6px 0;
            position: relative;
        }
        .time-divider span {
            background: var(--bg);
            padding: 0 12px;
        }
        .time-divider::before {
            content: '';
            position: absolute;
            left: 10%;
            right: 10%;
            top: 50%;
            height: 1px;
            background: var(--border);
            z-index: 0;
        }
        .time-divider span {
            position: relative;
            z-index: 1;
        }

        .chat-msg {
            max-width: 85%;
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            background: var(--bg-card);
            border: 1px solid var(--border);
            align-self: flex-start;
            flex-shrink: 0;
            position: relative;
            transition: opacity 0.3s;
        }
        .chat-msg.self {
            align-self: flex-end;
            background: var(--primary-bg);
            border-color: var(--primary);
        }
        .chat-msg.deleted {
            opacity: 0.6;
            background: #f0f0f0;
            border-color: #ccc;
        }
        .chat-msg.deleted .chat-text {
            color: var(--text-muted);
            font-style: italic;
        }
        .chat-msg.deleted .deleted-by {
            color: var(--official-blue);
            font-weight: 600;
        }
        .chat-msg .msg-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }
        .chat-msg .msg-header .avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            display: grid;
            place-items: center;
            font-weight: 700;
            font-size: 12px;
            flex-shrink: 0;
            background-size: cover;
            background-position: center;
        }
        .chat-msg .msg-header .name {
            font-weight: 600;
            font-size: 0.85em;
        }
        .chat-msg .msg-header .official-badge {
            font-size: 0.5em;
            background: var(--primary);
            color: #fff;
            padding: 0 6px;
            border-radius: 99px;
            line-height: 16px;
        }
        .chat-msg .msg-header .revoke-btn {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 0.7em;
            padding: 0 4px;
            margin-left: auto;
            display: none;
        }
        .chat-msg:hover .revoke-btn {
            display: inline-block;
        }
        .chat-msg .msg-header .context-hint {
            display: none;
            font-size: 0.6em;
            color: var(--text-light);
            margin-left: auto;
        }
        .chat-msg:hover .context-hint {
            display: inline;
        }
        .chat-msg .chat-text {
            font-size: 0.85em;
            line-height: 1.5;
            word-break: break-word;
        }

        .fixed-input-area {
            flex-shrink: 0;
            padding: 10px 20px calc(10px + var(--safe-bottom));
            background: var(--bg);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .fixed-input-area .input-wrapper { flex: 1; display: flex; gap: 8px; min-width: 0; }
        .fixed-input-area input {
            flex: 1; padding: 10px 14px; border-radius: 99px;
            border: 2px solid var(--border); background: var(--bg-input);
            font-family: inherit; font-size: 0.85em; outline: none;
            transition: border-color 0.2s; color: var(--text); min-width: 0;
        }
        .fixed-input-area input:focus { border-color: var(--primary); }
        .fixed-input-area input:disabled { opacity: 0.5; }
        .fixed-input-area button {
            padding: 8px 20px; border-radius: 99px; border: none;
            background: var(--primary); color: #fff;
            font-weight: 700; font-size: 0.85em; cursor: pointer;
            transition: background 0.2s; font-family: inherit;
            white-space: nowrap; flex-shrink: 0;
            display: flex; align-items: center; gap: 6px;
            min-width: 80px; justify-content: center;
        }
        .fixed-input-area button:hover { background: var(--primary-light); }
        .fixed-input-area button:disabled { opacity: 0.5; pointer-events: none; }
        .fixed-input-area .admin-clear-btn {
            background: var(--danger);
            color: #fff;
            padding: 6px 12px;
            border-radius: 99px;
            border: none;
            font-size: 0.7em;
            font-weight: 600;
            cursor: pointer;
            display: none;
            transition: 0.2s;
        }
        .fixed-input-area .admin-clear-btn:hover {
            filter: brightness(0.9);
        }

        .app-tabs {
            flex-shrink: 0;
            display: flex; background: var(--bg-card);
            border-top: 1px solid var(--border);
            padding: 6px 0 calc(6px + var(--safe-bottom));
            z-index: 50; backdrop-filter: blur(12px);
            background: rgba(255,255,255,0.96);
        }
        .tab-btn {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; gap: 2px;
            background: none; border: none;
            font-family: var(--font); font-size: 0.6em; font-weight: 600;
            color: var(--text-muted); padding: 4px 0;
            cursor: pointer; transition: color 0.2s;
            position: relative; text-decoration: none;
        }
        .tab-btn .tab-icon { font-size: 1.6em; line-height: 1.2; }
        .tab-btn.active { color: var(--primary); }
        .tab-btn.active::after {
            content: ''; position: absolute; top: -1px;
            left: 30%; right: 30%; height: 3px;
            background: var(--primary); border-radius: 0 0 4px 4px;
        }
        .tab-btn .badge {
            position: absolute; top: 0; right: 20%;
            background: var(--primary); color: #fff;
            font-size: 0.6em; font-weight: 700;
            padding: 1px 6px; border-radius: 99px;
            min-width: 16px; text-align: center;
            transform: translateY(-4px);
        }

        .icon-svg { width: 1.2em; height: 1.2em; fill: currentColor; flex-shrink: 0; }
        .btn-text { margin-left: 2px; }
        .empty-state { text-align: center; color: var(--text-muted); padding: 40px 20px; font-size: 0.85em; }
        .empty-state .big { font-size: 2.8em; margin-bottom: 8px; opacity: 0.5; }
        .loading-state { text-align: center; color: var(--text-muted); padding: 40px 20px; font-size: 0.9em; }
        .loading-state .spinner {
            display: inline-block; width: 30px; height: 30px;
            border: 3px solid var(--border); border-top-color: var(--primary);
            border-radius: 50%; animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #toast {
            position: fixed; bottom: 80px; left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--text); color: #fff;
            padding: 0.7em 1.6em; border-radius: 2em;
            font-weight: 600; font-size: 0.85em;
            opacity: 0; transition: all 0.4s ease;
            z-index: 300; pointer-events: none;
            white-space: nowrap; box-shadow: var(--shadow);
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        @media (max-width: 480px) {
            .app-header { padding: 10px 14px 6px 14px; min-height: 48px; }
            .app-header .brand { font-size: 0.95em; }
            .app-header .user-name { max-width: 60px; font-size: 0.75em; }
            .chat-messages { padding: 12px 14px 4px 14px; }
            .fixed-input-area {
                padding: 8px 14px calc(8px + var(--safe-bottom));
                flex-direction: column; align-items: stretch;
            }
            .fixed-input-area .input-wrapper { flex: 1; }
            .fixed-input-area input { padding: 8px 12px; font-size: 0.8em; }
            .fixed-input-area button { padding: 6px 14px; font-size: 0.8em; }
            .chat-msg { max-width: 90%; }
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

        .profile-overlay {
            position: fixed; inset: 0; z-index: 200;
            display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.35); backdrop-filter: blur(6px);
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .profile-overlay.active { opacity: 1; pointer-events: auto; }
        .profile-card {
            background: var(--bg-card); border-radius: var(--radius);
            padding: 2em 2.2em; max-width: 90vw; width: 22em;
            box-shadow: var(--shadow); border: 1px solid var(--border);
            transform: scale(0.9) translateY(20px);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .profile-overlay.active .profile-card { transform: scale(1) translateY(0); }
        .profile-card .profile-avatar {
            width: 64px; height: 64px; border-radius: 50%;
            background: var(--primary); color: #fff;
            display: grid; place-items: center;
            font-size: 28px; font-weight: 700; margin: 0 auto 12px;
            object-fit: cover;
        }
        .profile-card .avatar-upload {
            text-align: center;
            margin-top: 4px;
        }
        .profile-card .avatar-upload label {
            font-size: 0.7em;
            color: var(--primary);
            cursor: pointer;
            text-decoration: underline;
        }
        .profile-card .avatar-upload input[type="file"] {
            display: none;
        }
        .profile-card h3 { text-align: center; font-size: 1.1em; margin-bottom: 4px; }
        .profile-card .sub { text-align: center; color: var(--text-muted); font-size: 0.75em; margin-bottom: 16px; }
        .profile-card .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
        .profile-card .field label {
            font-size: 0.7em; font-weight: 600; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 0.05em;
        }
        .profile-card .field input {
            padding: 8px 12px; border-radius: var(--radius-sm);
            border: 2px solid var(--border); background: var(--bg-input);
            font-family: inherit; font-size: 0.9em; outline: none;
            transition: border-color 0.2s; color: var(--text);
        }
        .profile-card .field input:focus { border-color: var(--primary); }
        .profile-card .actions {
            display: flex; gap: 8px; margin-top: 8px;
        }
        .profile-card .actions button {
            flex: 1; padding: 8px; border-radius: var(--radius-sm);
            border: none; font-weight: 700; font-size: 0.8em;
            cursor: pointer; transition: all 0.2s; font-family: inherit;
            display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .profile-card .actions .save-btn { background: var(--primary); color: #fff; }
        .profile-card .actions .save-btn:hover { background: var(--primary-light); }
        .profile-card .actions .logout-btn { background: #ffebee; color: #c62828; }
        .profile-card .actions .logout-btn:hover { background: #ffcdd2; }
        .profile-card .actions .close-btn { background: var(--bg-input); color: var(--text-muted); }
        .profile-card .actions .close-btn:hover { background: var(--border); }

        .custom-modal {
            position: fixed; inset: 0; z-index: 2000;
            background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px);
            display: none; align-items: center; justify-content: center;
            padding: 20px;
        }
        .custom-modal.active { display: flex; }
        .custom-modal .modal-box {
            background: var(--bg-card); border-radius: var(--radius);
            max-width: 420px; width: 100%; padding: 24px;
            box-shadow: var(--shadow); border: 1px solid var(--border);
        }
        .custom-modal .modal-box .modal-title { font-size: 1.2em; font-weight: 700; margin-bottom: 8px; color: var(--text); }
        .custom-modal .modal-box .modal-body { font-size: 0.95em; color: var(--text-muted); line-height: 1.6; margin-bottom: 16px; }
        .custom-modal .modal-box .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
        .custom-modal .modal-box .modal-actions button { padding: 6px 18px; border-radius: var(--radius-sm); border: none; font-weight: 600; font-size: 0.85em; cursor: pointer; transition: background 0.2s; font-family: inherit; }
        .custom-modal .modal-box .modal-actions .btn-danger { background: var(--danger); color: #fff; }
        .custom-modal .modal-box .modal-actions .btn-danger:hover { background: #c62828; }
        .custom-modal .modal-box .modal-actions .btn-secondary { background: var(--bg-input); color: var(--text-muted); }
        .custom-modal .modal-box .modal-actions .btn-secondary:hover { background: var(--border); }
        .custom-modal .modal-box .modal-actions .btn-primary { background: var(--primary); color: #fff; }
        .custom-modal .modal-box .modal-actions .btn-primary:hover { background: var(--primary-light); }
    </style>
</head>
<body>
    <div id="mainApp">
        <header class="app-header">
            <div class="brand" id="brandArea">
                🌿 <span id="brandName">Seven</span>戚
                <small>聊天群</small>
                <span class="author-badge" id="authorBadge">👑 作者模式</span>
                <span class="author-mode-hint" id="authorModeHint">(作者模式已激活)</span>
            </div>
            <div class="user-area" onclick="openProfile()">
                <div class="avatar" id="headerAvatar">S</div>
                <span class="user-name" id="headerName">用户</span>
                <span class="chevron" id="chevronIcon">▼</span>
            </div>
        </header>

        <div class="banned-banner" id="bannedBanner">
            ⚠️ 账号已被封禁，无法发送聊天消息。解封时间：<span id="bannedUntilDisplay"></span>
        </div>

        <div class="app-content">
            <div class="chat-messages" id="chatMessages"></div>
            <div class="fixed-input-area">
                <div class="input-wrapper">
                    <input type="text" id="chatInput" placeholder="说点什么…" maxlength="200" />
                    <button id="sendChatBtn" onclick="sendChat()">
                        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
                        <span class="btn-text">发送</span>
                    </button>
                </div>
                <button class="admin-clear-btn" id="clearChatBtn" onclick="clearAllChats()">🗑️ 清空聊天</button>
            </div>
        </div>

        <div class="app-tabs">
            <a href="/liuyanban/posts.html" class="tab-btn">
                <span class="tab-icon">📰</span> 帖子
            </a>
            <a href="/liuyanban/messages.html" class="tab-btn">
                <span class="tab-icon">💌</span> 留言板
            </a>
            <a href="/liuyanban/chats.html" class="tab-btn active">
                <span class="tab-icon">💬</span> 聊天群
            </a>
        </div>
    </div>

    <!-- 个人资料弹窗 -->
    <div class="profile-overlay" id="profileOverlay" onclick="closeProfileOutside(event)">
        <div class="profile-card" onclick="event.stopPropagation()">
            <img class="profile-avatar" id="profileAvatar" src="" alt="avatar" />
            <div class="avatar-upload">
                <label for="avatarFileInput">📷 更换头像</label>
                <input type="file" id="avatarFileInput" accept="image/*" />
            </div>
            <h3 id="profileNameDisplay">用户</h3>
            <div class="sub">Seven戚 社区成员</div>
            <div class="field">
                <label>修改昵称</label>
                <input type="text" id="profileNameInput" maxlength="12" />
            </div>
            <div class="actions">
                <button class="save-btn" onclick="saveProfile()">保存</button>
                <button class="logout-btn" onclick="logout()">退出</button>
                <button class="close-btn" onclick="closeProfile()">关闭</button>
            </div>
        </div>
    </div>

    <!-- 自定义确认弹窗 -->
    <div class="custom-modal" id="confirmModal">
        <div class="modal-box">
            <div class="modal-title" id="confirmTitle">确认</div>
            <div class="modal-body" id="confirmBody">确定要执行此操作吗？</div>
            <div class="modal-actions">
                <button class="btn-secondary" id="confirmCancel">取消</button>
                <button class="btn-danger" id="confirmOk">确定</button>
            </div>
        </div>
    </div>

    <div id="toast"></div>

    <script>
        // ============================================================
        // Supabase 配置
        // ============================================================
        var SUPABASE_URL = "https://ulvhuqtpdafspbdvkogs.supabase.co";
        var SUPABASE_ANON_KEY = "sb_publishable_Ew8kKf2z05kmYIK2XNu00g_dzAirtIM";
        window.sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ============================================================
        // 工具函数
        // ============================================================
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(window.toastTimer);
            window.toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function escapeHtml(s) {
            if (!s) return '';
            return String(s).replace(/[&<>"']/g, function(c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' } [c];
            });
        }

        // 头像上传
        async function uploadAvatar(file, userId) {
            const fileExt = file.name.split('.').pop();
            const fileName = `avatars/${userId}/profile.${fileExt}`;
            const { data, error } = await window.sb.storage
                .from('avatars')
                .upload(fileName, file, { upsert: true });
            if (error) throw error;
            const { data: urlData } = window.sb.storage
                .from('avatars')
                .getPublicUrl(fileName);
            return urlData.publicUrl;
        }

        // ============================================================
        // 作者模式
        // ============================================================
        var isAuthorMode = false;
        var AUTHOR_PASSWORD = "7592";

        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        var brandClickCount = 0;
        var brandClickTimer = null;
        document.getElementById('brandArea').addEventListener('click', async function(e) {
            if (e.target.closest('.author-badge') || e.target.closest('.author-mode-hint')) return;
            brandClickCount++;
            clearTimeout(brandClickTimer);
            brandClickTimer = setTimeout(() => { brandClickCount = 0; }, 800);
            if (brandClickCount === 3) {
                brandClickCount = 0;
                if (!isAuthorMode) {
                    var pwd = prompt('请输入作者密码：');
                    if (pwd === null) return;
                    var hash = await sha256(pwd);
                    var correctHash = await sha256(AUTHOR_PASSWORD);
                    if (hash === correctHash) {
                        isAuthorMode = true;
                        document.getElementById('authorBadge').classList.add('active');
                        document.getElementById('authorModeHint').classList.add('active');
                        showToast('👑 作者模式已激活');
                    } else {
                        showToast('❌ 密码错误');
                    }
                } else {
                    isAuthorMode = false;
                    document.getElementById('authorBadge').classList.remove('active');
                    document.getElementById('authorModeHint').classList.remove('active');
                    showToast('已退出作者模式');
                }
            }
        });

        // ============================================================
        // 会话管理
        // ============================================================
        var currentUser = null;
        var isAdmin = false;

        function getSessionUser() {
            const stored = localStorage.getItem('sq_user_session');
            if (stored) {
                try { return JSON.parse(stored); } catch { return null; }
            }
            return null;
        }

        function setSessionUser(user) {
            localStorage.setItem('sq_user_session', JSON.stringify(user));
        }

        function clearSession() {
            localStorage.removeItem('sq_user_session');
        }

        // ============================================================
        // 封禁检查
        // ============================================================
        function isUserBanned() {
            if (!currentUser) return false;
            const bannedUntil = currentUser.banned_until ? new Date(currentUser.banned_until) : null;
            return bannedUntil && bannedUntil > new Date();
        }

        function getBannedUntil() {
            if (!currentUser || !currentUser.banned_until) return null;
            return new Date(currentUser.banned_until);
        }

        function updateBannedBanner() {
            const banner = document.getElementById('bannedBanner');
            const display = document.getElementById('bannedUntilDisplay');
            if (isUserBanned()) {
                banner.classList.add('active');
                const until = getBannedUntil();
                display.textContent = until ? until.toLocaleString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '未知';
                document.getElementById('sendChatBtn').disabled = true;
                document.getElementById('chatInput').disabled = true;
                document.getElementById('chatInput').placeholder = '账号已被封禁，无法发送消息';
            } else {
                banner.classList.remove('active');
                document.getElementById('sendChatBtn').disabled = false;
                document.getElementById('chatInput').disabled = false;
                document.getElementById('chatInput').placeholder = '说点什么…';
            }
        }

        // ============================================================
        // 聊天数据操作
        // ============================================================
        var chats = [];
        var chatsLoading = false;
        var usersCache = {};

        async function fetchChats() {
            const { data, error } = await window.sb
                .from('chats')
                .select('*, users(id, nickname, avatar_url)')
                .order('created_at', { ascending: true });
            if (error) throw error;
            data.forEach(item => {
                if (item.users) {
                    usersCache[item.users.id] = {
                        nickname: item.users.nickname,
                        avatar_url: item.users.avatar_url
                    };
                }
            });
            return data || [];
        }

        async function addChat(userId, author, content, isOfficial) {
            const { data, error } = await window.sb
                .from('chats')
                .insert([{ user_id: userId, author, content, is_official: isOfficial, is_deleted: false, deleted_by: null }]);
            if (error) throw error;
            return data;
        }

        async function revokeChat(id, author, revoker, isSelf) {
            let newContent;
            if (isSelf) {
                newContent = `${author} 撤回了一条消息`;
            } else {
                newContent = `${author} 的消息被 ${revoker} 撤回了`;
            }
            const { error } = await window.sb
                .from('chats')
                .update({ is_deleted: true, content: newContent, deleted_by: revoker })
                .eq('id', id);
            if (error) throw error;
        }

        // ============================================================
        // ★★★ 修复清空聊天 ★★★
        // ============================================================
        async function clearAllChats() {
            if (!isAdmin) { showToast('权限不足'); return; }
            showConfirm('清空聊天', '确定要删除所有聊天消息吗？此操作不可恢复！', async () => {
                try {
                    // 使用 .delete().not('id', 'is', null) 删除所有记录
                    const { error } = await window.sb
                        .from('chats')
                        .delete()
                        .not('id', 'is', null);
                    if (error) throw error;
                    showToast('🗑️ 所有聊天消息已清空');
                    await loadAllData();
                } catch (err) {
                    showToast('清空失败：' + err.message);
                }
            });
        }

        // ============================================================
        // 时间格式化
        // ============================================================
        function formatTimeDivider(date) {
            const now = new Date();
            const d = new Date(date);
            const isSameYear = d.getFullYear() === now.getFullYear();
            const isSameDay = d.getFullYear() === now.getFullYear() &&
                              d.getMonth() === now.getMonth() &&
                              d.getDate() === now.getDate();
            if (isSameDay) {
                return d.toTimeString().slice(0,5);
            } else if (isSameYear) {
                return (d.getMonth()+1) + '月' + d.getDate() + '日 ' + d.toTimeString().slice(0,5);
            } else {
                return d.getFullYear() + '年' + (d.getMonth()+1) + '月' + d.getDate() + '日 ' + d.toTimeString().slice(0,5);
            }
        }

        function shouldShowTimeDivider(prevTime, currentTime) {
            if (!prevTime) return true;
            const diff = (new Date(currentTime) - new Date(prevTime)) / (1000 * 60);
            return diff > 30;
        }

        // ============================================================
        // 渲染聊天
        // ============================================================
        function renderChat() {
            const container = document.getElementById('chatMessages');
            if (chatsLoading) {
                container.innerHTML = `
                    <div class="loading-state">
                        <div class="spinner"></div>
                        <div>正在加载聊天内容...</div>
                    </div>
                `;
                return;
            }
            if (!chats.length) {
                container.innerHTML = `<div class="empty-state"><div class="big">💬</div>还没有聊天消息，来打个招呼吧！</div>`;
                return;
            }

            let html = '';
            let prevMsgTime = null;

            chats.forEach(c => {
                const isSelf = currentUser && c.user_id === currentUser.id;
                const isOfficial = c.is_official || c.author === 'Seven戚';
                const isDeleted = c.is_deleted === true;

                // 用户信息
                let userInfo = usersCache[c.user_id] || null;
                let displayName = userInfo ? userInfo.nickname : c.author;
                let avatarUrl = userInfo ? userInfo.avatar_url : null;

                // 时间条
                const showDivider = shouldShowTimeDivider(prevMsgTime, c.created_at);
                if (showDivider) {
                    html += `<div class="time-divider"><span>${formatTimeDivider(c.created_at)}</span></div>`;
                }
                prevMsgTime = c.created_at;

                // 气泡
                const officialBadge = isOfficial ? `<span class="official-badge">官方</span>` : '';
                const deletedClass = isDeleted ? 'deleted' : '';
                const revokeBtn = (isAdmin || (currentUser && c.user_id === currentUser.id)) && !isDeleted ? 
                    `<button class="revoke-btn" data-id="${c.id}" data-author="${escapeHtml(c.author)}" data-self="${isSelf}">撤回</button>` : '';
                const contextHint = !isDeleted ? `<span class="context-hint">(长按/右键可撤回)</span>` : '';

                let finalContent = '';
                if (isDeleted) {
                    const contentText = c.content || '';
                    if (contentText.includes('的消息被')) {
                        const match = contentText.match(/^(.*?) 的消息被/);
                        if (match) {
                            const revokedName = match[1];
                            const replaced = contentText.replace(revokedName, `<span class="deleted-by">${escapeHtml(revokedName)}</span>`);
                            finalContent = `<span class="chat-text">${replaced}</span>`;
                        } else {
                            finalContent = `<span class="chat-text">${escapeHtml(contentText)}</span>`;
                        }
                    } else {
                        finalContent = `<span class="chat-text">${escapeHtml(contentText)}</span>`;
                    }
                } else {
                    finalContent = `<span class="chat-text">${escapeHtml(c.content)}</span>`;
                }

                let avatarHtml;
                if (avatarUrl) {
                    avatarHtml = `<div class="avatar" style="background-image:url(${escapeHtml(avatarUrl)});background-size:cover;background-position:center;text-indent:-9999px;"> </div>`;
                } else {
                    const initial = displayName.charAt(0).toUpperCase();
                    avatarHtml = `<div class="avatar">${initial}</div>`;
                }

                html += `
                    <div class="chat-msg ${isSelf ? 'self' : ''} ${deletedClass}" data-id="${c.id}">
                        <div class="msg-header">
                            ${avatarHtml}
                            <span class="name">${escapeHtml(displayName)}</span>
                            ${officialBadge}
                            ${contextHint}
                            ${revokeBtn}
                        </div>
                        ${finalContent}
                    </div>
                `;
            });

            container.innerHTML = html;
            container.scrollTop = container.scrollHeight;

            // 绑定撤回按钮事件
            container.querySelectorAll('.revoke-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const id = this.dataset.id;
                    const author = this.dataset.author;
                    const isSelf = this.dataset.self === 'true';
                    if (!currentUser) return;
                    if (!isAdmin && !isSelf) {
                        showToast('您只能撤回自己的消息');
                        return;
                    }
                    showConfirm('撤回消息', '确定撤回此消息吗？', () => {
                        doRevoke(id, author, isSelf);
                    });
                });
            });

            // 长按/右键
            container.querySelectorAll('.chat-msg:not(.deleted)').forEach(msgEl => {
                msgEl.addEventListener('contextmenu', function(e) {
                    e.preventDefault();
                    const id = this.dataset.id;
                    const author = this.querySelector('.name')?.textContent || '';
                    const isSelf = this.classList.contains('self');
                    if (!currentUser) return;
                    if (!isAdmin && !isSelf) {
                        showToast('您只能撤回自己的消息');
                        return;
                    }
                    showConfirm('撤回消息', '确定撤回此消息吗？', () => {
                        doRevoke(id, author, isSelf);
                    });
                });
                let timer = null;
                msgEl.addEventListener('touchstart', function(e) {
                    timer = setTimeout(() => {
                        const id = this.dataset.id;
                        const author = this.querySelector('.name')?.textContent || '';
                        const isSelf = this.classList.contains('self');
                        if (!currentUser) return;
                        if (!isAdmin && !isSelf) {
                            showToast('您只能撤回自己的消息');
                            return;
                        }
                        if (navigator.vibrate) navigator.vibrate(50);
                        showConfirm('撤回消息', '确定撤回此消息吗？', () => {
                            doRevoke(id, author, isSelf);
                        });
                        timer = null;
                    }, 600);
                });
                msgEl.addEventListener('touchend', function() {
                    if (timer) { clearTimeout(timer); timer = null; }
                });
                msgEl.addEventListener('touchmove', function() {
                    if (timer) { clearTimeout(timer); timer = null; }
                });
            });
        }

        async function doRevoke(id, author, isSelf) {
            try {
                const revoker = currentUser.nickname;
                await revokeChat(id, author, revoker, isSelf);
                showToast('✅ 消息已撤回');
                await loadAllData();
            } catch (err) {
                showToast('撤回失败：' + err.message);
            }
        }

        // ============================================================
        // 发送聊天
        // ============================================================
        function sendChat() {
            if (!currentUser) { showToast('请先登录'); return; }
            if (isUserBanned()) { showToast('账号已被封禁，无法发送消息'); return; }
            const input = document.getElementById('chatInput');
            const content = input.value.trim();
            if (!content) { showToast('请输入内容'); return; }
            const btn = document.getElementById('sendChatBtn');
            btn.disabled = true;
            const originalHTML = btn.innerHTML;
            btn.innerHTML = `<span class="spinner" style="display:inline-block;width:1em;height:1em;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite;margin-right:4px;"></span> 发送中...`;

            const isOfficial = currentUser.nickname === 'Seven戚' || isAuthorMode;
            addChat(currentUser.id, currentUser.nickname, content, isOfficial)
                .then(() => {
                    input.value = '';
                    loadAllData();
                    showToast('💬 消息已发送');
                })
                .catch(err => showToast('发送失败：' + err.message))
                .finally(() => {
                    btn.disabled = false;
                    btn.innerHTML = originalHTML;
                });
        }

        // ============================================================
        // 加载数据
        // ============================================================
        async function loadAllData() {
            chatsLoading = true;
            renderChat();
            try {
                const data = await fetchChats();
                chats = data;
            } catch (err) {
                console.error('加载聊天失败:', err);
                showToast('聊天加载失败');
            } finally {
                chatsLoading = false;
                renderChat();
            }
        }

        // ============================================================
        // 自定义确认弹窗
        // ============================================================
        function showConfirm(title, body, onOk) {
            const modal = document.getElementById('confirmModal');
            document.getElementById('confirmTitle').textContent = title;
            document.getElementById('confirmBody').textContent = body;
            modal.classList.add('active');
            const cancelBtn = document.getElementById('confirmCancel');
            const okBtn = document.getElementById('confirmOk');
            const cleanup = () => {
                modal.classList.remove('active');
                cancelBtn.removeEventListener('click', cancelHandler);
                okBtn.removeEventListener('click', okHandler);
            };
            const cancelHandler = () => { cleanup(); };
            const okHandler = () => { if (onOk) onOk(); cleanup(); };
            cancelBtn.addEventListener('click', cancelHandler);
            okBtn.addEventListener('click', okHandler);
            modal.addEventListener('click', function bgClick(e) {
                if (e.target === modal) { cleanup(); modal.removeEventListener('click', bgClick); }
            });
        }

        // ============================================================
        // 个人资料（含头像上传，并禁止普通用户设置 Seven戚）
        // ============================================================
        function openProfile() {
            if (!currentUser) return;
            document.getElementById('profileNameInput').value = currentUser.nickname;
            document.getElementById('profileAvatar').src = currentUser.avatar_url || `data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="%232e7d32" rx="50"/><text x="50" y="58" font-size="40" text-anchor="middle" fill="white" font-family="sans-serif">${currentUser.nickname.charAt(0).toUpperCase()}</text></svg>`;
            document.getElementById('profileNameDisplay').textContent = currentUser.nickname;
            document.getElementById('profileOverlay').classList.add('active');
            document.getElementById('chevronIcon').classList.add('open');
        }

        function closeProfile() {
            document.getElementById('profileOverlay').classList.remove('active');
            document.getElementById('chevronIcon').classList.remove('open');
        }

        function closeProfileOutside(e) {
            if (e.target === e.currentTarget) closeProfile();
        }

        document.getElementById('avatarFileInput').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;
            try {
                showToast('⏳ 正在上传头像...');
                const avatarUrl = await uploadAvatar(file, currentUser.id);
                await window.sb
                    .from('users')
                    .update({ avatar_url: avatarUrl })
                    .eq('id', currentUser.id);
                currentUser.avatar_url = avatarUrl;
                setSessionUser(currentUser);
                updateHeader();
                document.getElementById('profileAvatar').src = avatarUrl;
                showToast('✅ 头像已更新');
                await loadAllData();
            } catch (err) {
                showToast('上传失败：' + err.message);
                console.error(err);
            }
            this.value = '';
        });

        // ★★★ 修复：普通用户禁止设置昵称为 Seven戚 ★★★
        function saveProfile() {
            const newName = document.getElementById('profileNameInput').value.trim();
            if (!newName) { showToast('请输入昵称'); return; }
            // 只有管理员（手机号 17355394710）可以设置 Seven戚
            if (newName.toLowerCase() === 'seven戚' && currentUser.phone !== '17355394710') {
                showToast('该昵称不可用，请使用其他名称');
                return;
            }
            window.sb
                .from('users')
                .update({ nickname: newName })
                .eq('id', currentUser.id)
                .then(() => {
                    currentUser.nickname = newName;
                    setSessionUser(currentUser);
                    updateHeader();
                    loadAllData();
                    closeProfile();
                    showToast('✅ 昵称已更新');
                })
                .catch(err => showToast('更新失败：' + err.message));
        }

        function updateHeader() {
            if (currentUser) {
                const initial = currentUser.nickname.charAt(0).toUpperCase() || 'U';
                document.getElementById('headerName').textContent = currentUser.nickname;
                const avatarEl = document.getElementById('headerAvatar');
                if (currentUser.avatar_url) {
                    avatarEl.style.backgroundImage = `url(${currentUser.avatar_url})`;
                    avatarEl.style.backgroundSize = 'cover';
                    avatarEl.textContent = '';
                } else {
                    avatarEl.style.backgroundImage = '';
                    avatarEl.textContent = initial;
                }
                const profileAvatar = document.getElementById('profileAvatar');
                profileAvatar.src = currentUser.avatar_url || `data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="%232e7d32" rx="50"/><text x="50" y="58" font-size="40" text-anchor="middle" fill="white" font-family="sans-serif">${initial}</text></svg>`;
                document.getElementById('profileNameDisplay').textContent = currentUser.nickname;
                document.getElementById('profileNameInput').value = currentUser.nickname;
            }
        }

        function logout() {
            showConfirm('退出登录', '确定要退出登录吗？', () => {
                closeProfile();
                clearSession();
                showToast('👋 已退出登录');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 500);
            });
        }

        // ============================================================
        // 初始化
        // ============================================================
        (function init() {
            const session = getSessionUser();
            if (!session || !session.id) {
                window.location.href = 'index.html';
                return;
            }
            currentUser = session;
            isAdmin = (currentUser.phone === '17355394710');
            updateHeader();
            updateBannedBanner();
            loadAllData();

            if (isAdmin) {
                document.getElementById('clearChatBtn').style.display = 'inline-block';
            }

            window.sb.channel('public')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chats' }, () => loadAllData())
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'chats' }, () => loadAllData())
                .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'chats' }, () => loadAllData())
                .subscribe();

            function syncUser() {
                const session = getSessionUser();
                if (session && session.id) {
                    if (!currentUser || currentUser.id !== session.id ||
                        currentUser.avatar_url !== session.avatar_url ||
                        currentUser.nickname !== session.nickname) {
                        currentUser = session;
                        isAdmin = (currentUser.phone === '17355394710');
                        updateHeader();
                        updateBannedBanner();
                        loadAllData();
                    }
                }
            }
            window.addEventListener('focus', syncUser);
            document.addEventListener('visibilitychange', function() {
                if (!document.hidden) syncUser();
            });
        })();

        document.addEventListener('gesturestart', function(e) { e.preventDefault(); });
    </script>
