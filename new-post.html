<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Seven戚 · 帖子广场</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        :root {
            --bg: #f5faf5;
            --bg-card: #ffffff;
            --bg-input: #eaf3ea;
            --border: #c8e0c8;
            --text: #1e3a2e;
            --text-muted: #5a7a6a;
            --text-light: #8aaa9a;
            --primary: #2e7d32;
            --primary-light: #4caf50;
            --primary-bg: #e8f5e9;
            --shadow: 0 8px 32px rgba(46, 125, 50, 0.12);
            --shadow-sm: 0 2px 12px rgba(46, 125, 50, 0.08);
            --radius: 16px;
            --radius-sm: 10px;
            --font: "Space Grotesk", "PingFang SC", "Segoe UI", system-ui, sans-serif;
            --danger: #e57373;
            --danger-bg: #ffebee;
            --danger-text: #c62828;
            --official-blue: #2b6cff;
            --success: #66bb6a;
            --success-bg: #e8f5e9;
            --warning: #ffa726;
            --warning-bg: #fff3e0;
        }
        html, body { height: 100%; font-family: var(--font); background: var(--bg); color: var(--text); overflow: hidden; }
        #mainApp { display: flex; flex-direction: column; height: 100vh; height: 100dvh; background: var(--bg); }

        .app-header {
            flex-shrink: 0; padding: 12px 20px;
            background: rgba(255, 255, 255, 0.92);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            z-index: 50; min-height: 56px;
        }
        .app-header .brand { font-weight: 900; font-size: 1.1em; color: var(--text); display: flex; align-items: center; gap: 0.4em; }
        .app-header .brand span { color: var(--primary); }
        .app-header .brand small { font-weight: 400; font-size: 0.55em; color: var(--text-muted); margin-left: 0.3em; }
        .app-header .user-area { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 4px 10px 4px 6px; border-radius: 99px; }
        .app-header .user-area:hover { background: var(--primary-bg); }
        .app-header .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--primary); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 14px; background-size: cover; background-position: center; }
        .app-header .user-name { font-weight: 600; font-size: 0.85em; max-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .app-header .chevron { color: var(--text-muted); font-size: 0.7em; }

        .app-tabs {
            flex-shrink: 0; display: flex;
            background: rgba(255, 255, 255, 0.96);
            border-top: 1px solid var(--border);
            padding: 6px 0 calc(6px + env(safe-area-inset-bottom, 0px));
            z-index: 50;
        }
        .tab-btn {
            flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
            background: none; border: none; font-family: var(--font); font-size: 0.6em; font-weight: 600;
            color: var(--text-muted); padding: 4px 0; cursor: pointer; text-decoration: none;
            position: relative;
        }
        .tab-btn .tab-icon { font-size: 1.6em; line-height: 1.2; }
        .tab-btn.active { color: var(--primary); }
        .tab-btn.active::after { content: ''; position: absolute; top: -1px; left: 30%; right: 30%; height: 3px; background: var(--primary); border-radius: 0 0 4px 4px; }
        .tab-btn .badge { position: absolute; top: -2px; right: 15%; background: #e57373; color: #fff; font-size: 0.6em; font-weight: 700; padding: 1px 6px; border-radius: 99px; min-width: 16px; text-align: center; }

        .banned-banner { flex-shrink: 0; background: #ffebee; color: #c62828; padding: 6px 16px; font-size: 0.8em; font-weight: 600; text-align: center; border-bottom: 1px solid #ffcdd2; display: none; }
        .banned-banner.active { display: block; }

        .app-content { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 20px; }
        .posts-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
        .posts-header .left { display: flex; gap: 6px; align-items: center; overflow-x: auto; max-width: 100%; }
        .category-btn {
            padding: 4px 14px; border-radius: 99px;
            border: 1.5px solid var(--border); background: transparent;
            color: var(--text-muted); font-size: 0.7em; font-weight: 600;
            cursor: pointer; white-space: nowrap;
        }
        .category-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; }
        .new-post-btn {
            padding: 6px 18px; border-radius: 99px; border: none;
            background: var(--primary); color: #fff; font-weight: 700;
            font-size: 0.75em; cursor: pointer; text-decoration: none;
            display: inline-flex; align-items: center; justify-content: center;
        }
        .new-post-btn:hover { background: var(--primary-light); }
        .floating-post-btn {
            position: fixed; bottom: 85px; right: 20px; z-index: 1000;
            width: 56px; height: 56px; border-radius: 50%;
            background: var(--primary); color: #fff; border: none;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; text-decoration: none;
        }
        .floating-post-btn svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

        .post-card {
            background: var(--bg-card); border-radius: var(--radius-sm);
            padding: 14px 16px; margin-bottom: 12px;
            border: 1px solid var(--border); cursor: pointer;
        }
        .post-card:hover { box-shadow: var(--shadow); }
        .post-card .post-author { display: flex; align-items: center; gap: 10px; margin-bottom: 2px; flex-wrap: wrap; }
        .post-card .post-author .avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 14px; color: #fff; background: var(--primary); background-size: cover; background-position: center; }
        .post-card .post-author .name { font-weight: 600; font-size: 0.9em; }
        .post-card .post-author .official-tag { background: var(--official-blue); color: #fff; font-size: 0.55em; padding: 0 6px; border-radius: 99px; }
        .post-card .post-author .time { font-size: 0.7em; color: var(--text-muted); margin-left: auto; }
        .post-card .post-title { font-weight: 700; font-size: 1em; margin: 4px 0 2px 0; }
        .post-card .post-content { font-size: 0.85em; color: var(--text); line-height: 1.6; margin-bottom: 6px; word-break: break-word; }
        .post-card .post-content img { max-width: 100%; border-radius: 8px; margin: 6px 0; }
        .post-card .post-content.clamped { display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
        .post-card .post-content .expand-link { color: var(--official-blue); font-weight: 600; cursor: pointer; margin-left: 4px; text-decoration: underline; }
        .post-card .post-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 0.65em; color: var(--text-light); border-top: 1px solid var(--border); padding-top: 8px; }
        .post-card .post-footer .comment-count { cursor: pointer; }
        .post-card .post-footer .actions { display: flex; align-items: center; gap: 8px; }
        .post-card .post-footer .actions button { background: none; border: none; cursor: pointer; color: inherit; font-size: inherit; display: inline-flex; align-items: center; gap: 3px; padding: 2px 4px; border-radius: 4px; }
        .post-card .post-footer .actions .del-btn { color: var(--danger); }
        .post-card .post-footer .actions .report-btn { color: var(--warning); }
        .post-card .post-footer .actions .report-btn:hover { background: var(--warning-bg); }
        .post-card .post-footer .actions .del-btn:hover { background: var(--danger-bg); }

        .detail-overlay, .admin-panel-overlay {
            position: fixed; inset: 0; background: var(--bg);
            display: none; flex-direction: column; z-index: 999;
        }
        .detail-overlay.active, .admin-panel-overlay.active { display: flex; }
        .detail-header, .admin-panel-header {
            display: flex; align-items: center; padding: 12px 16px;
            background: var(--bg-card); border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .detail-header .back-btn, .admin-panel-header .back-btn {
            background: none; border: none; cursor: pointer;
            padding: 4px; color: var(--text); display: flex;
        }
        .detail-header .back-btn svg, .admin-panel-header .back-btn svg { width: 22px; height: 22px; }
        .detail-content, .admin-panel-content { flex: 1; overflow-y: auto; padding: 16px 20px; }
        .detail-post { margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
        .detail-post .post-author { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; flex-wrap: wrap; }
        .detail-post .post-author .avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 14px; color: #fff; background: var(--primary); background-size: cover; background-position: center; }
        .detail-post .post-author .name { font-weight: 600; font-size: 0.9em; }
        .detail-post .post-author .official-tag { background: var(--official-blue); color: #fff; font-size: 0.55em; padding: 0 6px; border-radius: 99px; }
        .detail-post .post-author .time { font-size: 0.7em; color: var(--text-muted); margin-left: auto; }
        .detail-post .post-title { font-weight: 700; font-size: 1.1em; margin: 4px 0 2px 0; }
        .detail-post .post-content { font-size: 0.95em; color: var(--text); line-height: 1.6; word-break: break-word; }
        .detail-post .post-content img { max-width: 100%; border-radius: 8px; margin: 6px 0; }
        .detail-comments { flex: 1; margin-top: 8px; }
        .detail-comments .comment-item { display: flex; gap: 10px; padding: 10px 4px; border-bottom: 1px solid var(--border); }
        .detail-comments .comment-item.highlight { background: var(--primary-bg); border: 2px solid var(--primary); border-radius: 8px; }
        .detail-comments .comment-item .avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 12px; color: #fff; background: var(--primary); background-size: cover; background-position: center; }
        .detail-comments .comment-item .body { flex: 1; }
        .detail-comments .comment-item .meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .detail-comments .comment-item .meta .name { font-weight: 600; font-size: 0.85em; }
        .detail-comments .comment-item .meta .official-tag { background: var(--official-blue); color: #fff; font-size: 0.5em; padding: 0 4px; border-radius: 99px; }
        .detail-comments .comment-item .meta .time { font-size: 0.65em; color: var(--text-muted); }
        .detail-comments .comment-item .txt { font-size: 0.85em; line-height: 1.5; margin-top: 2px; }
        .detail-input-area { display: flex; gap: 8px; padding: 12px 16px; background: var(--bg-card); border-top: 1px solid var(--border); flex-shrink: 0; }
        .detail-input-area input { flex: 1; padding: 10px; border-radius: 99px; border: 2px solid var(--border); font-family: inherit; font-size: 0.85em; outline: none; }
        .detail-input-area input:focus { border-color: var(--primary); }
        .detail-input-area button { padding: 10px 20px; border-radius: 99px; border: none; background: var(--primary); color: #fff; font-weight: 700; cursor: pointer; font-family: inherit; }

        .poll-container { margin: 16px 0; padding: 16px; background: #f8faf8; border-radius: 12px; border: 1px solid var(--border); }
        .poll-option { margin-bottom: 12px; }
        .poll-option-header { display: flex; justify-content: space-between; font-size: 0.85em; }
        .poll-option-bar { display: flex; align-items: center; gap: 8px; }
        .poll-option-progress { flex: 1; height: 20px; background: var(--primary-bg); border-radius: 10px; overflow: hidden; }
        .poll-option-fill { height: 100%; background: var(--primary); }
        .poll-option-vote-btn { padding: 2px 8px; background: var(--primary); color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 0.7em; }

        .empty-state { text-align: center; color: var(--text-muted); padding: 40px 20px; }
        .loading-state { text-align: center; padding: 40px 20px; }
        .spinner { width: 30px; height: 30px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        #toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: var(--text); color: #fff; padding: 10px 24px; border-radius: 99px; opacity: 0; transition: 0.4s; z-index: 9999; pointer-events: none; }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(-10px); }

        .custom-modal { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.5); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
        .custom-modal.active { display: flex; }
        .modal-box { background: var(--bg-card); padding: 24px; border-radius: var(--radius); max-width: 400px; width: 100%; box-shadow: var(--shadow); }
        .modal-title { font-size: 1.2em; font-weight: 700; margin-bottom: 8px; }
        .modal-body { font-size: 0.95em; color: var(--text-muted); line-height: 1.6; margin-bottom: 16px; white-space: pre-wrap; }
        .modal-body p { margin-bottom: 8px; }
        .modal-body input { width: 100%; padding: 8px 12px; border-radius: var(--radius-sm); border: 2px solid var(--border); font-family: inherit; font-size: 0.9em; outline: none; box-sizing: border-box; }
        .modal-body input:focus { border-color: var(--primary); }
        .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
        .modal-actions button { padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; font-family: inherit; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-danger:hover { background: #c62828; }
        .btn-secondary { background: var(--bg-input); color: var(--text-muted); }
        .btn-secondary:hover { background: var(--border); }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-light); }

        .admin-panel-content { padding: 16px 20px 32px; }
        .admin-panel-content h3 { font-size: 1em; font-weight: 700; margin: 20px 0 12px 0; color: var(--text); }
        .admin-panel-content h3:first-of-type { margin-top: 0; }

        .admin-user-card {
            background: var(--bg-card); border-radius: var(--radius-sm);
            padding: 14px 16px; margin-bottom: 10px;
            border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            flex-wrap: wrap; gap: 12px;
        }
        .admin-user-card .user-main { display: flex; align-items: center; gap: 14px; min-width: 0; flex: 1; }
        .admin-user-card .user-avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--primary); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 18px; flex-shrink: 0; background-size: cover; background-position: center; }
        .admin-user-card .user-info { min-width: 0; flex: 1; }
        .admin-user-card .user-info .name-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .admin-user-card .user-info .name-row .nickname { font-weight: 700; font-size: 0.95em; color: var(--text); }
        .admin-user-card .user-info .name-row .role-badge { font-size: 0.55em; padding: 0 8px; border-radius: 99px; color: #fff; line-height: 18px; font-weight: 600; }
        .admin-user-card .user-info .name-row .status-badge { font-size: 0.55em; padding: 0 8px; border-radius: 99px; line-height: 18px; font-weight: 600; }
        .admin-user-card .user-info .name-row .status-badge.normal { background: var(--success-bg); color: var(--success); }
        .admin-user-card .user-info .name-row .status-badge.banned { background: var(--danger-bg); color: var(--danger-text); }
        .admin-user-card .user-info .phone-row { font-size: 0.75em; color: var(--text-muted); margin-top: 2px; }
        .admin-user-card .user-actions { display: flex; gap: 6px; flex-wrap: wrap; flex-shrink: 0; }
        .admin-user-card .user-actions button {
            padding: 5px 14px; border-radius: 99px; border: none;
            font-weight: 600; font-size: 0.7em; cursor: pointer;
            display: inline-flex; align-items: center; gap: 4px;
            font-family: inherit; white-space: nowrap;
        }
        .admin-user-card .user-actions .btn-ban { background: var(--danger-bg); color: var(--danger-text); }
        .admin-user-card .user-actions .btn-unban { background: var(--success-bg); color: var(--success); }
        .admin-user-card .user-actions .btn-login { background: var(--primary-bg); color: var(--primary); }

        .admin-cat-item, .admin-role-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 14px; margin-bottom: 6px;
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius-sm); flex-wrap: wrap; gap: 8px;
        }
        .admin-cat-item .cat-info, .admin-role-item .role-info { display: flex; align-items: center; gap: 10px; }
        .admin-cat-item .cat-actions, .admin-role-item .role-actions { display: flex; gap: 4px; flex-wrap: wrap; }
        .admin-cat-item .cat-actions button, .admin-role-item .role-actions button {
            padding: 4px 12px; border-radius: 99px; border: 1px solid var(--border);
            background: var(--bg-card); color: var(--text-muted); cursor: pointer;
            font-size: 0.7em; font-weight: 600; font-family: inherit;
        }
        .admin-add-row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
        .admin-add-row input { flex: 1; padding: 8px 12px; border-radius: 8px; border: 2px solid var(--border); font-family: inherit; font-size: 0.85em; outline: none; min-width: 100px; }
        .admin-add-row button { padding: 8px 16px; border-radius: 8px; border: none; background: var(--primary); color: #fff; font-weight: 700; cursor: pointer; font-family: inherit; }

        @media (max-width: 480px) {
            .app-content { padding: 12px 14px; }
            .floating-post-btn { bottom: 75px; right: 16px; width: 50px; height: 50px; }
            .admin-user-card { padding: 12px 14px; }
            .admin-user-card .user-avatar { width: 36px; height: 36px; font-size: 14px; }
        }
    </style>
</head>
<body>
    <div id="mainApp">
        <div id="header-container"></div>

        <div class="banned-banner" id="bannedBanner">
            账号已被封禁，无法发布新帖或评论。解封时间：<span id="bannedUntilDisplay"></span>
        </div>

        <div class="app-content" id="postContent">
            <div class="posts-header">
                <div class="left" id="categoryFilter">
                    <button class="category-btn active" data-cat="全部" onclick="setCategory('全部', this)">全部</button>
                </div>
                <div style="display:flex; gap:6px;">
                    <button class="new-post-btn" id="adminPanelBtn" style="display:none; background:var(--danger);" onclick="openAdminPanel()">管理</button>
                    <a href="/liuyanban/new-post.html" class="new-post-btn" id="newPostBtn">发帖</a>
                </div>
            </div>
            <div id="postList"></div>
        </div>

        <div id="footer-container"></div>
    </div>

    <a href="/liuyanban/new-post.html" class="floating-post-btn" id="floatingPostBtn">
        <svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </a>

    <!-- 帖子详情 -->
    <div class="detail-overlay" id="detailOverlay">
        <div class="detail-panel" style="display:flex;flex-direction:column;height:100%;">
            <div class="detail-header">
                <button class="back-btn" id="closeDetail">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"/>
                        <polyline points="12 19 5 12 12 5"/>
                    </svg>
                </button>
                <span class="detail-title" style="font-weight:700;font-size:1em;">帖子详情</span>
            </div>
            <div class="detail-content" id="detailContent"></div>
            <div class="detail-input-area">
                <input type="text" id="detailCommentInput" placeholder="写评论…" maxlength="200" />
                <button id="detailSendCommentBtn">发送</button>
            </div>
        </div>
    </div>

    <!-- 管理面板 -->
    <div class="admin-panel-overlay" id="adminPanelOverlay">
        <div class="admin-panel-header">
            <button class="back-btn" id="closeAdminPanel">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"/>
                    <polyline points="12 19 5 12 12 5"/>
                </svg>
            </button>
            <span style="font-weight:700;font-size:1em;">数据管理</span>
        </div>
        <div class="admin-panel-content" id="adminPanelContent"></div>
    </div>

    <!-- 确认弹窗 -->
    <div class="custom-modal" id="confirmModal">
        <div class="modal-box">
            <div class="modal-title" id="confirmTitle"></div>
            <div class="modal-body" id="confirmBody"></div>
            <div class="modal-actions">
                <button class="btn-secondary" id="confirmCancel">取消</button>
                <button class="btn-danger" id="confirmOk">确定</button>
            </div>
        </div>
    </div>

    <!-- 输入弹窗 -->
    <div class="custom-modal" id="promptModal">
        <div class="modal-box">
            <div class="modal-title" id="promptTitle"></div>
            <div class="modal-body">
                <p id="promptMessage"></p>
                <input type="text" id="promptInput" />
            </div>
            <div class="modal-actions">
                <button class="btn-secondary" id="promptCancel">取消</button>
                <button class="btn-primary" id="promptOk">确定</button>
            </div>
        </div>
    </div>

    <div id="toast"></div>

    <script src="/liuyanban/common.js"></script>
<script>
// ============ 举报相关兜底（防止 common.js 缺失） ============
window.pushNotification = window.pushNotification || async function(userId, payload) {
    if (!window.sb || !userId) return;
    try {
        await window.sb.from('notifications').insert([Object.assign({ user_id: userId, is_read: false }, payload)]);
    } catch (e) { console.warn('通知发送失败', e); }
};

window.openReportDialog = window.openReportDialog || function(reportedUserId, contentType, contentId, contentSnapshot) {
    var old = document.getElementById('reportOverlay');
    if (old) old.remove();
    var overlay = document.createElement('div');

        function renderPollUI(poll) {

            if (currentUser) {

            h += '<div style="font-size:0.7em;margin:6px 0">总票数：' + total + '</div>';

                var votes = (poll.poll_votes || []).filter(function(v) { return v.option_id === opt.id; }).length;
                var pct = total ? Math.round(votes / total * 100) : 0;

            var avatar = user ? (user.avatar_url || getUserAvatar(user)) : getUserAvatar({ nickname: post.author });
            var time = new Date(post.created_at).toLocaleString('zh-CN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });

            var commentsHtml = comments.length ?
                comments.map(function(c) {
                    var cu = c.users || null;
                    var cn = cu ? cu.nickname : c.author;
                    var ca = cu ? (cu.avatar_url || getUserAvatar(cu)) : getUserAvatar({ nickname: c.author });
                    return '<div class="comment-item" data-comment-id="' + c.id + '" id="comment-' + c.id + '">' +
                        '<div class="avatar" style="' + (ca && ca.startsWith('http') ?
                            'background-image:url(' + ca + ');background-size:cover;background-position:center;' : '') +
                            '">' + (ca && !ca.startsWith('http') ? cn.charAt(0).toUpperCase() : '') + '</div>' +
                        '<div class="body">' +
                        '<div class="meta"><span class="name">' + escapeHtml(cn) + '</span>' +
                        (c.is_official ? '<span class="official-tag">官方</span>' : '') +
                        '<span class="time">' + new Date(c.created_at).toLocaleString('zh-CN', { hour: '2-digit', minute: '2-digit' }) + '</span></div>' +
                        '<div class="txt">' + escapeHtml(c.content) + '</div>' +
                        '</div></div>';
                }).join('') :
                '<div style="color:var(--text-muted);padding:12px 0;">暂无评论</div>';

            detailContent.innerHTML =
                '<div class="detail-post">' +
                '<div class="post-author">' +
                '<div class="avatar" style="' + (avatar && avatar.startsWith('http') ?
                    'background-image:url(' + avatar + ');background-size:cover;background-position:center;' : '') +
                '">' + (avatar && !avatar.startsWith('http') ? name.charAt(0).toUpperCase() : '') + '</div>' +
                '<span class="name">' + escapeHtml(name) + '</span>' +
                (post.is_official ? '<span class="official-tag">官方</span>' : '') +
                '<span class="time">' + time + '</span>' +
                '</div>' +
                (post.title ? '<div class="post-title">' + escapeHtml(post.title) + '</div>' : '') +
                '<div class="post-content">' + content + '</div>' +
                renderPollUI(poll) +
                '</div>' +
                '<div class="detail-comments"><b>评论 (' + comments.length + ')</b>' + commentsHtml + '</div>';

            const urlParams = new URLSearchParams(window.location.search);
            const commentId = urlParams.get('comment');
            if (commentId) {
                setTimeout(function() {
                    var commentEl = document.getElementById('comment-' + commentId);
                    if (commentEl) {
                        commentEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        commentEl.classList.add('highlight');
                        setTimeout(function() { commentEl.classList.remove('highlight'); }, 3000);
                    }
                }, 300);
            }
        }

        detailSendCommentBtn.onclick = async function() {
            if (!currentUser) return showToast('请先登录');
            var content = detailCommentInput.value.trim();
            if (!content) return showToast('请输入评论');
            await addComment(currentDetailPostId, currentUser.nickname, currentUser.id, content);
            detailCommentInput.value = '';
            await fetchAllCommentCounts();
            await renderDetail(currentDetailPostId);
            showToast('评论已发送');
        };

        // ============================================================
        // 管理面板
        // ============================================================
        var adminPanelOverlay = document.getElementById('adminPanelOverlay');
        var adminPanelContent = document.getElementById('adminPanelContent');

        function openAdminPanel() {
            if (!isAdmin) return;
            adminPanelOverlay.classList.add('active');
            renderAdminPanel();
        }
        document.getElementById('closeAdminPanel').onclick = function() {
            adminPanelOverlay.classList.remove('active');
        };

        async function renderAdminPanel() {
            var users = await fetchAllUsers();
            var roles = await fetchUserRoles();
            var roleMap = {};
            roles.forEach(function(r) { roleMap[r.user_id] = r; });

            var catsHtml = '<h3>分类管理</h3>';
            var displayIndex = 1;
            categories.forEach(function(c, idx) {
                if (c.name === '未分类') return;
                var isPublic = c.is_public !== false;
                catsHtml += '<div class="admin-cat-item">' +
                    '<div class="cat-info"><b>' + escapeHtml(c.name) + '</b> <span style="font-size:0.7em;color:var(--text-muted)">#' +
                    displayIndex + '（顺序）</span></div>' +
                    '<div class="cat-actions">' +
                    '<button onclick="toggleCategoryPublic(\'' + c.id + '\',' + isPublic + ')">' + (isPublic ? '公开' : '私密') + '</button>' +
                    (idx > 0 ? '<button onclick="moveCategoryUp(\'' + c.id + '\')">↑</button>' : '') +
                    (idx < categories.length - 1 ? '<button onclick="moveCategoryDown(\'' + c.id + '\')">↓</button>' : '') +
                    '<button onclick="deleteCategoryById(\'' + c.id + '\')">删除</button>' +
                    '</div></div>';
                displayIndex++;
            });
            catsHtml += '<div class="admin-add-row">' +
                '<input id="newCatName" placeholder="新分类名称" />' +
                '<button onclick="addNewCategory()">添加</button>' +
                '</div>';

            var usersHtml = '<h3>用户管理</h3>';
            users.forEach(function(u) {
                var isBanned = u.banned_until && new Date(u.banned_until) > new Date();
                var role = roleMap[u.id];
                var avatar = u.avatar_url || '';

                usersHtml += '<div class="admin-user-card">';
                usersHtml += '<div class="user-main">';
                usersHtml += '<div class="user-avatar" style="' + (avatar ?
                    'background-image:url(' + avatar + ');background-size:cover;background-position:center;' : '') +
                    '">' + (!avatar ? u.nickname.charAt(0).toUpperCase() : '') + '</div>';
                usersHtml += '<div class="user-info">';
                usersHtml += '<div class="name-row">';
                usersHtml += '<span class="nickname">' + escapeHtml(u.nickname) + '</span>';
                if (role) {
                    usersHtml += '<span class="role-badge" style="background:' + role.role_color + '">' + escapeHtml(role.role_name) + '</span>';
                }
                usersHtml += '<span class="status-badge ' + (isBanned ? 'banned' : 'normal') + '">' + (isBanned ? '已封禁' : '正常') + '</span>';
                usersHtml += '</div>';
                usersHtml += '<div class="phone-row">' + escapeHtml(u.phone) + '</div>';
                usersHtml += '</div></div>';

                usersHtml += '<div class="user-actions">';
                if (isBanned) {
                    usersHtml += '<button class="btn-unban" onclick="unbanUserById(\'' + u.id + '\')">解封</button>';
                } else {
                    usersHtml += '<button class="btn-ban" onclick="banUserPrompt(\'' + u.id + '\',\'' + escapeHtml(u.nickname) + '\')">封号</button>';
                }
                usersHtml += '<button class="btn-login" onclick="loginAsUser(\'' + u.id + '\')">一键登录</button>';
                usersHtml += '</div></div>';
            });

            var uniqueRoles = {};
            roles.forEach(function(r) {
                var key = r.role_name + '|' + r.role_color;
                if (!uniqueRoles[key]) uniqueRoles[key] = { name: r.role_name, color: r.role_color, count: 0 };
                uniqueRoles[key].count++;
            });
            var rolesHtml = '<h3>身份管理</h3>';
            for (var key in uniqueRoles) {
                var r = uniqueRoles[key];
                rolesHtml += '<div class="admin-role-item">' +
                    '<div class="role-info"><div style="width:28px;height:28px;border-radius:50%;background:' + r.color + ';flex-shrink:0;"></div>' +
                    '<b>' + escapeHtml(r.name) + '</b> <span style="font-size:0.7em;color:var(--text-muted)">(' + r.count + '人)</span></div>' +
                    '<div class="role-actions"><button onclick="removeRoleFromAll(\'' + escapeHtml(r.name) + '\')">删除此身份</button></div></div>';
            }
            rolesHtml += '<div class="admin-add-row">' +
                '<input id="newRoleName" placeholder="新身份名称" />' +
                '<input type="color" id="newRoleColor" value="#2e7d32" style="width:48px;height:38px;padding:2px;border:2px solid var(--border);border-radius:8px;cursor:pointer;" />' +
                '<button onclick="createRole()">创建</button>' +
                '</div>';

            adminPanelContent.innerHTML = catsHtml + usersHtml + rolesHtml;
        }

        // ---- 管理面板全局函数 ----
        window.toggleCategoryPublic = async function(id, current) {
            await updateCategory(id, { is_public: !current });
            await loadCategories();
            renderAdminPanel();
        };
        window.moveCategoryUp = async function(id) {
            var idx = categories.findIndex(function(c) { return c.id === id; });
            if (idx > 0) {
                await swapCategoryOrder(id, categories[idx - 1].id);
                await loadCategories();
                renderAdminPanel();
            }
        };
        window.moveCategoryDown = async function(id) {
            var idx = categories.findIndex(function(c) { return c.id === id; });
            if (idx < categories.length - 1) {
                await swapCategoryOrder(id, categories[idx + 1].id);
                await loadCategories();
                renderAdminPanel();
            }
        };
        window.deleteCategoryById = async function(id) {
            showConfirm('删除分类', '确定删除此分类？其下帖子将移入「未分类」', async function() {
                await deleteCategory(id);
                await loadCategories();
                renderAdminPanel();
            });
        };
        window.addNewCategory = async function() {
            var name = document.getElementById('newCatName').value.trim();
            if (!name) return showToast('请输入分类名');
            await addCategory(name, true);
            document.getElementById('newCatName').value = '';
            await loadCategories();
            renderAdminPanel();
        };

        // 封号（改为发送站内通知）
        window.banUserPrompt = function(userId, nickname) {
            showPrompt('封号设置', '为用户 "' + nickname + '" 设置解封时间', '选择解封时间', async function(until) {
                if (!until) return showToast('请选择解封时间');
                var banUntilISO = new Date(until).toISOString();
                await banUser(userId, '违规行为', banUntilISO);

                // 发送站内通知
                await pushNotification(userId, {
                    type: 'ban',
                    notification_type: 'ban',
                    ban_until: banUntilISO,
                    extra_text: '你的账号因违规被封禁，预计解封时间：' + new Date(banUntilISO).toLocaleString('zh-CN')
                });

                showToast('已封号，站内通知已发送');
                renderAdminPanel();
            }, 'datetime-local');
        };
        window.unbanUserById = async function(userId) {
            showConfirm('解封用户', '确定解封该用户吗？', async function() {
                await unbanUser(userId);
                showToast('已解封');
                renderAdminPanel();
            });
        };
        window.loginAsUser = async function(userId) {
            try {
                var res = await window.sb.from('users').select('*').eq('id', userId).single();
                if (res.error) throw res.error;
                if (!res.data) return showToast('用户不存在');
                var user = res.data;
                setSessionUser(user);
                currentUser = user;
                isAdmin = (user.phone === '17355394710');
                renderHeader('帖子广场', 'posts');
                renderFooter('posts');
                await loadCategories();
                await loadAllData();
                adminPanelOverlay.classList.remove('active');
                if (isAdmin) document.getElementById('adminPanelBtn').style.display = 'inline-flex';
                else document.getElementById('adminPanelBtn').style.display = 'none';
                showToast('已切换到 ' + user.nickname);
                if (typeof updateNotificationBadge === 'function') updateNotificationBadge();
            } catch (err) {
                showToast('一键登录失败：' + err.message);
            }
        };
        window.removeRoleFromAll = function(roleName) {
            showConfirm('删除身份', '确定删除身份 "' + roleName + '"？', async function() {
                await removeRoleFromAll(roleName);
                showToast('身份已删除');
                renderAdminPanel();
            });
        };
        window.createRole = function() {
            var name = document.getElementById('newRoleName').value.trim();
            var color = document.getElementById('newRoleColor').value;
            if (!name) return showToast('请输入身份名称');
            showPrompt('分配身份', '请输入要分配该身份的用户ID', '用户UUID', async function(userId) {
                if (!userId) return showToast('请输入用户ID');
                await assignRoleToUser(userId, name, color);
                showToast('身份创建并分配');
                renderAdminPanel();
            });
        };

        // ============================================================
        // 数据加载
        // ============================================================
        async function loadCategories() {
            categories = await fetchCategories();
            renderCategoryFilter();
        }

        async function loadAllData() {
            posts = await fetchPosts();
            await fetchAllCommentCounts();
            await renderPosts();
        }

        // ============================================================
        // 实时订阅
        // ============================================================
        (function init() {
            if (!currentUser || !currentUser.id) window.location.href = '/liuyanban/index.html';

            loadCategories().then(loadAllData);

            window.sb.channel('public-posts')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'posts' }, function() { loadAllData(); })
                .on('postgres_changes', { event: '*', schema: 'public', table: 'post_comments' }, function() {
                    fetchAllCommentCounts();
                    if (currentDetailPostId) renderDetail(currentDetailPostId);
                })
                .on('postgres_changes', { event: '*', schema: 'public', table: 'poll_votes' }, function() {
                    if (currentDetailPostId) renderDetail(currentDetailPostId);
                })
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'post_comments' }, async function(payload) {
                    var newComment = payload.new;
                    if (!newComment) return;
                    var result = await window.sb.from('posts').select('user_id').eq('id', newComment.post_id).single();
                    if (result.data && result.data.user_id === currentUser.id && newComment.user_id !== currentUser.id) {
                        if (getSoundEnabled()) playReminderSound();
                        if (typeof showTopBanner === 'function') showTopBanner('你的帖子收到新评论');
                        if (typeof updateNotificationBadge === 'function') updateNotificationBadge();
                    }
                })
                .subscribe();

            function syncUser() {
                var session = getSessionUser();
                if (session && session.id) {
                    if (!currentUser || currentUser.id !== session.id ||
                        currentUser.avatar_url !== session.avatar_url ||
                        currentUser.nickname !== session.nickname) {
                        currentUser = session;
                        isAdmin = (currentUser.phone === '17355394710');
                        renderHeader('帖子广场', 'posts');
                        renderFooter('posts');
                        if (isAdmin) document.getElementById('adminPanelBtn').style.display = 'inline-flex';
                        else document.getElementById('adminPanelBtn').style.display = 'none';
                        loadAllData();
                        if (typeof updateNotificationBadge === 'function') updateNotificationBadge();
                    }
                }
            }
            window.addEventListener('focus', syncUser);
            document.addEventListener('visibilitychange', function() {
                if (!document.hidden) syncUser();
            });
        })();

        document.addEventListener('gesturestart', function(e) { e.preventDefault(); });
    </script>
</body>
</html>
