<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#2e7d32" />
<link rel="apple-touch-icon" href="./icon.svg" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Seven戚 · 发帖</title>
<script src="./vendor/supabase.js"></script>
<script>window.supabase||document.write('<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"><\/script>');</script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #f5faf5; --bg-card: #ffffff; --bg-input: #eaf3ea; --border: #c8e0c8;
  --text: #1e3a2e; --text-muted: #5a7a6a; --primary: #2e7d32; --primary-light: #4caf50;
  --primary-bg: #e8f5e9; --shadow: 0 8px 32px rgba(46,125,50,0.12); --radius: 16px; --radius-sm: 10px;
  --font: "Space Grotesk", "PingFang SC", "Segoe UI", system-ui, sans-serif;
  --danger: #e57373; --official-blue: #2b6cff;
}
html, body { height: 100%; font-family: var(--font); background: var(--bg); color: var(--text); overflow: hidden; }
#mainApp { display: flex; flex-direction: column; height: 100vh; height: 100dvh; background: var(--bg); }
.app-header { flex-shrink: 0; padding: 12px 20px; background: rgba(255,255,255,0.92); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; min-height: 56px; z-index: 50; }
.app-header .back-btn { background: none; border: none; cursor: pointer; color: var(--text); display: flex; align-items: center; padding: 4px; text-decoration: none; }
.app-header .back-btn svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.app-header .title { font-weight: 700; font-size: 1em; }
.app-header .placeholder { width: 32px; }
.app-content { flex: 1; overflow-y: auto; padding: 16px 20px; -webkit-overflow-scrolling: touch; }
.field-group { margin-bottom: 16px; }
.field-group label { display: block; font-size: 0.7em; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
.field-group input, .field-group select { width: 100%; padding: 10px 12px; border-radius: var(--radius-sm); border: 2px solid var(--border); background: var(--bg-input); font-family: inherit; font-size: 0.9em; outline: none; color: var(--text); }
.field-group input:focus, .field-group select:focus { border-color: var(--primary); }
.editor-container { position: relative; }
.editor-toolbar { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; padding: 6px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-sm); }
.editor-toolbar button { background: none; border: none; cursor: pointer; padding: 6px 8px; border-radius: 6px; color: var(--text-muted); transition: background 0.2s; display: flex; align-items: center; }
.editor-toolbar button:hover { background: var(--primary-bg); color: var(--primary); }
.editor-toolbar button svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.editor-content { min-height: 200px; max-height: 400px; overflow-y: auto; border: 2px solid var(--border); border-radius: var(--radius-sm); padding: 12px; background: var(--bg-input); font-size: 0.9em; line-height: 1.6; outline: none; word-break: break-word; }
.editor-content img { max-width: 100%; border-radius: 8px; margin: 4px 0; }
.actions { display: flex; gap: 8px; margin-top: 16px; }
.actions button { flex: 1; padding: 12px; border-radius: var(--radius-sm); border: none; font-weight: 700; font-size: 1em; cursor: pointer; font-family: inherit; transition: background 0.2s; }
.actions .btn-primary { background: var(--primary); color: #fff; }
.actions .btn-primary:disabled { opacity: 0.5; pointer-events: none; }
.actions .btn-secondary { background: var(--bg-input); color: var(--text-muted); }
#toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--text); color: #fff; padding: 0.7em 1.6em; border-radius: 2em; font-weight: 600; font-size: 0.85em; opacity: 0; transition: all 0.4s ease; z-index: 99999; pointer-events: none; white-space: nowrap; box-shadow: var(--shadow); }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="mainApp">
  <div class="app-header">
    <a href="posts.html" class="back-btn" title="返回帖子广场">
      <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </a>
    <span class="title">发帖</span>
    <div class="placeholder"></div>
  </div>

  <div class="app-content">
    <div class="field-group">
      <label>标题（选填）</label>
      <input type="text" id="postTitleInput" maxlength="100" placeholder="输入帖子标题..." />
    </div>

    <div class="field-group">
      <label>分类</label>
      <select id="postCategorySelect">
        <option value="">加载中...</option>
      </select>
    </div>

    <div class="field-group">
      <label>正文内容</label>
      <div class="editor-container">
        <div class="editor-toolbar" id="editorToolbar">
          <button type="button" onclick="execCommand('bold')" title="粗体"><b>B</b></button>
          <button type="button" onclick="execCommand('italic')" title="斜体"><i>I</i></button>
          <button type="button" onclick="execCommand('underline')" title="下划线"><u>U</u></button>
          <button type="button" onclick="insertImage()" title="插入图片">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          </button>
        </div>
        <div class="editor-content" id="richEditor" contenteditable="true" placeholder="写点什么..."></div>
      </div>
    </div>

    <div class="actions">
      <button class="btn-secondary" onclick="window.location.href='./posts.html'">取消</button>
      <button class="btn-primary" id="submitPostBtn">发布</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="./common.js"></script>
<script>
// ==========================================
// 1. 基础校验
// ==========================================
var currentUser = getSessionUser();
if (!currentUser || !currentUser.id) {
    window.location.href = './index.html';
}
var isAdmin = (currentUser.is_admin === true);

function showToast(msg) {
    var toast = document.getElementById('toast');
    if(!toast) return;
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(window.toastTimer);
    window.toastTimer = setTimeout(function() { toast.classList.remove('show'); }, 3000);
}

function execCommand(cmd) {
    document.execCommand(cmd, false, null);
    document.getElementById('richEditor').focus();
}

// ==========================================
// 2. 分类拉取
// ==========================================
async function loadCategories() {
    try {
        var res = await window.sb.from('categories').select('*').order('sort_order', { ascending: true });
        if (res.error) throw res.error;
        var categories = res.data || [];
        var select = document.getElementById('postCategorySelect');
        var available = categories.filter(function(c) {
            return c.name !== '未分类' && (isAdmin || c.is_public !== false);
        });
        
        if (!available.length) {
            select.innerHTML = '<option value="null">默认分类</option>';
            return;
        }
        select.innerHTML = available.map(function(c) {
            return '<option value="' + c.id + '">' + escapeHtml(c.name) + '</option>';
        }).join('');
    } catch(e) {
        document.getElementById('postCategorySelect').innerHTML = '<option value="null">加载失败</option>';
    }
}

// ==========================================
// 3. 图片上传 (限制 5MB 且严格校验路径)
// ==========================================
async function uploadImage(file) {
    if (file.size > 5 * 1024 * 1024) {
        throw new Error('图片大小不能超过 5MB');
    }
    var ext = file.name.split('.').pop() || 'png';
    // ★ 关键修复：必须上传到以当前用户 ID 为名的文件夹下
    var path = currentUser.id + '/' + Date.now() + '.' + ext;
    
    var up = await window.sb.storage.from('posts').upload(path, file);
    if (up.error) throw up.error;
    
    var pub = window.sb.storage.from('posts').getPublicUrl(path);
    return pub.data.publicUrl;
}

function insertImage() {
    var input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.onchange = async function(e) {
        var file = e.target.files[0];
        if (!file) return;
        try {
            showToast('图片上传中...');
            var url = await uploadImage(file);
            document.execCommand('insertImage', false, url);
        } catch(err) {
            showToast('上传失败：' + err.message);
        }
    };
    input.click();
}

// ==========================================
// 4. 提交发帖
// ==========================================
document.getElementById('submitPostBtn').onclick = async function() {
    var title = document.getElementById('postTitleInput').value.trim();
    var categoryVal = document.getElementById('postCategorySelect').value;
    var category_id = (categoryVal && categoryVal !== 'null') ? parseInt(categoryVal, 10) : null;
    var content = document.getElementById('richEditor').innerHTML.trim();
    
    if (!content || content === '<br>' || content === '<div><br></div>') {
        return showToast('请输入正文内容');
    }
    
    // 防封前置校验
    if (currentUser.banned_until && new Date(currentUser.banned_until) > new Date()) {
        return showToast('账号已被封禁，无法发布');
    }

    var btn = this;
    btn.disabled = true;
    btn.textContent = '发布中...';

    try {
        var isOfficial = isAdmin;
        var res = await window.sb.from('posts').insert([{
            title: title,
            content: content,
            category_id: category_id,
            author: currentUser.nickname,
            user_id: currentUser.id,
            is_official: isOfficial,
            is_pinned: false
        }]);
        
        if (res.error) throw res.error;
        
        showToast('帖子发布成功！');
        setTimeout(function() {
            window.location.href = './posts.html';
        }, 1000);
        
    } catch(e) {
        // 捕获防刷拦截错误
        if (e.message.includes('spam') || e.message.includes('banned') || e.message.includes('limit')) {
            showToast('发布过于频繁，可能触发防刷机制，账号已被限制。');
        } else {
            showToast('发布失败：' + e.message);
        }
        btn.disabled = false;
        btn.textContent = '发布';
    }
};

// 启动
loadCategories();
</script>
</body>
</html>
