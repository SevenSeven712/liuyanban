<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
    <link rel="manifest" href="/liuyanban/manifest.json" />
    <meta name="theme-color" content="#2e7d32" />
    <link rel="apple-touch-icon" href="/liuyanban/icon-192.png" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>气泡预览 · Seven戚</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; user-select:none; }
:root {
  --bg:#f5faf5; --bg-card:#fff; --border:#c8e0c8;
  --text:#1e3a2e; --text-muted:#5a7a6a; --text-light:#8aaa9a;
  --primary:#2e7d32; --primary-light:#4caf50; --primary-bg:#e8f5e9;
  --font:"Space Grotesk","PingFang SC","Segoe UI",system-ui,sans-serif;
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);overflow:hidden;}
#mainApp{display:flex;flex-direction:column;height:100vh;height:100dvh;}
.app-header{flex-shrink:0;padding:12px 20px;background:rgba(255,255,255,.92);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;z-index:50;min-height:56px;}
.app-header .brand{font-weight:900;font-size:1.1em;display:flex;align-items:center;gap:.4em;}
.app-header .brand span{color:var(--primary);}
.app-header .brand small{font-weight:400;font-size:.55em;color:var(--text-muted);margin-left:.3em;}
.app-header .title{font-weight:700;font-size:.85em;color:var(--text-muted);}
.chat-messages{flex:1;overflow-y:auto;padding:16px 14px 8px;display:flex;flex-direction:column;gap:14px;}
.time-divider{text-align:center;font-size:.7em;color:var(--text-light);padding:6px 0;position:relative;}
.time-divider span{background:var(--bg);padding:0 12px;position:relative;z-index:1;}
.time-divider::before{content:'';position:absolute;left:10%;right:10%;top:50%;height:1px;background:var(--border);z-index:0;}
.row{display:flex;align-items:flex-start;gap:8px;max-width:85%;}
.row.other{align-self:flex-start;}
.row.self{align-self:flex-end;flex-direction:row-reverse;}
.row .avatar{width:38px;height:38px;border-radius:6px;flex-shrink:0;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px;cursor:pointer;}
.row .avatar.self-av{background:#4caf50;}
.row .bubble-wrap{display:flex;flex-direction:column;cursor:pointer;}
.row .bubble{padding:9px 13px;font-size:.88em;line-height:1.5;word-break:break-word;position:relative;transition:transform .15s;}
.row .bubble:hover{transform:scale(1.02);}
.row .uname{font-size:.68em;color:var(--text-muted);margin-bottom:3px;}
.row.self .uname{text-align:right;}
.tap-hint{text-align:center;font-size:.72em;color:var(--text-muted);padding:10px;background:var(--primary-bg);border-radius:10px;}
/* 撤回消息（系统提示，居中） */
.sys-recall{text-align:center;font-size:.72em;color:var(--text-light);padding:4px 0;line-height:1.5;}
.sys-recall .deleted-by{color:#4a90d9;font-weight:600;}
.sys-recall .rc-icon{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-right:4px;stroke:var(--text-light);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}

/* 0-24 静态 */
.b0 .bubble{background:#fff;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.1);color:#1a1a1a;}
.b0.self .bubble{background:#95ec69;color:#1a1a1a;}
.b1 .bubble{border-radius:20px;background:linear-gradient(135deg,#4caf50,#2e7d32);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08);}
.b1.self .bubble{background:linear-gradient(135deg,#4caf50,#2e7d32);color:#fff;}

.b2.self .bubble{color:#ff2d95;border-color:#ff2d95;box-shadow:0 0 14px rgba(255,45,149,.55);}
.b3 .bubble{border-radius:18px 18px 4px 18px;background:linear-gradient(135deg,#a855f7,#7e22ce);color:#fff;}
.b3.self .bubble{border-radius:18px 18px 4px 18px;background:linear-gradient(135deg,#a855f7,#7e22ce);color:#fff;}

.b5 .bubble{border-radius:16px;background:rgba(46,125,50,.85);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.6);color:#fff;}
.b5.self .bubble{background:rgba(46,125,50,.85);color:#fff;}

.b10 .bubble{border-radius:14px;background:linear-gradient(180deg,#66bb6a,#43a047);color:#fff;box-shadow:0 2px 0 #2e7d32,0 5px 10px rgba(0,0,0,.2);}
.b10.self .bubble{background:linear-gradient(180deg,#66bb6a,#43a047);color:#fff;box-shadow:0 2px 0 #2e7d32,0 5px 10px rgba(0,0,0,.2);}
.b11 .bubble{border-radius:18px;background:linear-gradient(135deg,#f857a6,#ff5858);color:#fff;}
.b11.self .bubble{background:linear-gradient(135deg,#f857a6,#ff5858);color:#fff;}

.b15 .bubble{border-radius:16px;background:#fff;color:#333;border:3px solid transparent;background-image:linear-gradient(#fff,#fff),linear-gradient(135deg,#4facfe,#00f2fe);background-origin:border-box;background-clip:padding-box,border-box;}

.b17.self .bubble{background:linear-gradient(135deg,#2a2a2a,#1a1a1a);color:#ffd700;border:1.5px solid #ffd700;box-shadow:0 0 12px rgba(255,215,0,.55),inset 0 0 6px rgba(255,215,0,.15);}
.b18 .bubble{border-radius:20px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;}
.b18.self .bubble{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;}

.b19.self .bubble{background:linear-gradient(135deg,#e53935,#c62828);color:#fff;}
.b20 .bubble{border-radius:8px;background:#fff;color:#000;font-weight:600;border:2px solid #000;}

.b22.self .bubble{background:linear-gradient(135deg,#0ea5e9,#0284c7);color:#fff;}

/* 25-34 动态 */
@keyframes flowBorder{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.b25 .bubble{border-radius:14px;background:#111;color:#fff;position:relative;isolation:isolate;}
.b25 .bubble::before{content:'';position:absolute;inset:-2px;border-radius:16px;z-index:-1;background:linear-gradient(90deg,#ff0000,#ff7300,#fffb00,#48ff00,#00ffd5,#002bff,#7a00ff,#ff00c8,#ff0000);background-size:400% 400%;animation:flowBorder 3s linear infinite;}
@keyframes breathe{0%,100%{box-shadow:0 0 8px rgba(76,175,80,.4)}50%{box-shadow:0 0 24px rgba(76,175,80,.9)}}
.b26 .bubble{border-radius:16px;background:linear-gradient(135deg,#4caf50,#2e7d32);color:#fff;animation:breathe 2.5s ease-in-out infinite;}
.b26.self .bubble{background:linear-gradient(135deg,#4caf50,#2e7d32);color:#fff;}
@keyframes gradientFlow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.b27 .bubble{border-radius:16px;background:linear-gradient(270deg,#f093fb,#f5576c,#4facfe,#00f2fe);background-size:300% 300%;color:#fff;animation:gradientFlow 5s ease infinite;}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.b28 .bubble{border-radius:20px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.12);animation:floaty 2s ease-in-out infinite;}
.b28.self .bubble{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;}
@keyframes shine{0%{left:-100%}60%,100%{left:200%}}
.b29 .bubble{border-radius:14px;background:linear-gradient(135deg,#2e7d32,#4caf50);color:#fff;position:relative;overflow:hidden;}
.b29 .bubble::after{content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-20deg);animation:shine 3s infinite;}
@keyframes jelly{0%,100%{transform:scale(1,1)}25%{transform:scale(1.06,.94)}50%{transform:scale(.96,1.04)}75%{transform:scale(1.02,.98)}}
.b30 .bubble{border-radius:18px;background:linear-gradient(135deg,#a1c4fd,#c2e9fb);color:#1e3a8a;animation:jelly 1.5s ease-in-out infinite;}
.b30.self .bubble{background:linear-gradient(135deg,#a1c4fd,#c2e9fb);color:#1e3a8a;}
.b31 .bubble{border-radius:16px;background:linear-gradient(135deg,#1a1a2e,#16213e);color:#ffd700;position:relative;overflow:hidden;}
.b31 .bubble::before{content:'✨ ✨ ✨';position:absolute;top:2px;left:0;right:0;font-size:.6em;text-align:center;animation:twinkle 2s ease-in-out infinite;}
@keyframes twinkle{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes liquid{0%,100%{border-radius:60% 40% 50% 50%/50% 60% 40% 50%}50%{border-radius:40% 60% 60% 40%/60% 40% 60% 40%}}
.b32 .bubble{background:linear-gradient(135deg,#00c6ff,#0072ff);color:#fff;animation:liquid 4s ease-in-out infinite;}
@keyframes neonPulse{0%,100%{box-shadow:0 0 6px #0ff,0 0 12px #0ff}50%{box-shadow:0 0 16px #0ff,0 0 32px #0ff}}
.b33 .bubble{border-radius:12px;background:#0a0a0a;color:#f0f;border:2px solid #f0f;animation:neonPulse 1.8s ease-in-out infinite;}
.b33.self .bubble{color:#f0f;border-color:#f0f;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.b34 .bubble{border-radius:14px;background:#e8f5e9;color:#333;border:1px solid #ddd;}
.b34 .bubble::after{content:'▌';color:#2e7d32;animation:blink 1s step-end infinite;margin-left:2px;}
.b34.self .bubble{background:#e8f5e9;}

/* 选择器 */
.picker-overlay{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center;}
.picker-overlay.active{display:flex;}
.picker-panel{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:600px;max-height:75vh;display:flex;flex-direction:column;animation:slideUp .25s ease;padding-bottom:var(--safe-bottom);}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.picker-head{padding:16px 20px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.picker-head h3{font-size:1.05em;}
.picker-head .close{background:none;border:none;font-size:1.4em;cursor:pointer;color:var(--text-muted);line-height:1;}
.picker-grid{flex:1;overflow-y:auto;padding:16px 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;}
.picker-item{border:2px solid var(--border);border-radius:14px;padding:10px 8px;cursor:pointer;transition:all .15s;text-align:center;background:#f7f7f7;}
.picker-item:hover{border-color:var(--primary-light);transform:translateY(-2px);}
.picker-item.active{border-color:var(--primary);box-shadow:0 0 0 3px rgba(46,125,50,.25);}
.picker-item .mini-bubble{display:inline-block;padding:9px 13px;font-size:.82em;margin-bottom:8px;max-width:100%;line-height:1.45;word-break:break-word;}
.picker-item .label{font-size:.68em;color:var(--text-muted);font-weight:600;}
.picker-item.active .label{color:var(--primary);}
/* ===== 图标编辑器 ===== */
.edit-toggle{position:fixed;top:14px;right:14px;z-index:9998;background:var(--primary);color:#fff;border:none;border-radius:99px;padding:8px 16px;font-family:inherit;font-size:.8em;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(46,125,50,.4);}
.edit-toggle.on{background:#e53935;box-shadow:0 4px 14px rgba(229,57,53,.4);}
.edit-handle{position:absolute;z-index:20;cursor:move;border:1.5px dashed #ff9800;border-radius:4px;touch-action:none;}
.edit-handle::after{content:'';position:absolute;inset:-3px;border:1px solid rgba(255,152,0,.4);border-radius:6px;pointer-events:none;}
.edit-handle.dragging{border-color:#e53935;box-shadow:0 0 0 3px rgba(229,57,53,.25);}
.edit-resize{position:absolute;right:-7px;bottom:-7px;width:14px;height:14px;background:#ff9800;border:2px solid #fff;border-radius:50%;cursor:nwse-resize;box-shadow:0 1px 4px rgba(0,0,0,.3);touch-action:none;}
.edit-resize:hover{background:#e53935;}
.edit-panel{position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#1e1e1e;color:#e0e0e0;padding:12px 14px calc(12px + var(--safe-bottom));font-family:"Courier New",monospace;display:none;box-shadow:0 -4px 20px rgba(0,0,0,.3);}
.edit-panel.show{display:block;}
.edit-panel .ep-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-family:var(--font);}
.edit-panel .ep-head b{font-size:.82em;color:#ffb74d;}
.edit-panel .ep-head .ep-tip{font-size:.68em;color:#999;}
.edit-panel textarea{width:100%;height:52px;background:#2b2b2b;color:#7ee787;border:1px solid #444;border-radius:8px;padding:8px;font-family:inherit;font-size:.72em;line-height:1.4;resize:none;outline:none;}
.edit-panel .ep-actions{display:flex;gap:8px;margin-top:8px;}
.edit-panel .ep-actions button{flex:1;padding:8px;border-radius:8px;border:none;font-family:var(--font);font-size:.78em;font-weight:700;cursor:pointer;}
.edit-panel .ep-copy{background:var(--primary);color:#fff;}
.edit-panel .ep-reset{background:#444;color:#ddd;}
</style>

<body>
<div id="mainApp">
  <div class="app-header">
    <div class="brand">Seven<span>戚</span><small>· 气泡预览</small></div>

  </div>

    <div class="row other b0"><div class="avatar">小</div><div class="bubble-wrap"><div class="uname">小明</div><div class="bubble">好，那待会儿见 👋</div></div></div>
    <div class="row self b0"><div class="avatar self-av">我</div><div class="bubble-wrap"><div class="uname">我</div><div class="bubble">OK！晚点聊～</div></div></div>
    <div class="sys-recall"><svg class="rc-icon" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 5 5v0a5 5 0 0 1-5 5H9"/></svg><span class="deleted-by">小明</span> 撤回了一条消息</div>

<div class="picker-overlay" id="pickerOverlay">

<div class="edit-panel" id="editPanel">

    <b id="epLabel">图标位置</b>
    <span class="ep-tip">拖动虚框调位置</span>
  </div>
  <textarea id="epCode" readonly></textarea>
  <div class="ep-actions">
    <button class="ep-copy" id="epCopy">复制 CSS</button>
    <button class="ep-reset" id="epReset">重置</button>
  </div>
</div>
<script>
var SKINS = ["原版","经典圆角","暗夜霓虹","渐变紫","粉嫩","毛玻璃","新拟态","星空","烫金黑","手写便签","立体凸起","极光","莫兰迪","赛博绿","果冻","渐变描边","亚克力","暗金","泡泡渐变","樱桃红","黑白","微信绿","磨砂蓝","梦幻紫粉","霓虹白底","✨流光边框","✨呼吸发光","✨渐变流动","✨微微浮动","✨闪光掠过","✨果冻弹跳","✨星星闪烁","✨液态流动","✨霓虹脉冲","✨打字光标","🐱猫爪","🌸樱花","⭐星星","🐰兔耳","💗爱心","☁️云朵","🍀四叶草","🌙月亮","🎀蝴蝶结","🌈彩虹云"];

function applySkin(i){
  curSkin = i;
  document.querySelectorAll('.row.other').forEach(function(el){el.className='row other b'+i;});
  document.querySelectorAll('.row.self').forEach(function(el){el.className='row self b'+i;});
  document.querySelectorAll('.picker-item').forEach(function(el){el.classList.toggle('active',parseInt(el.dataset.id)===i);});
  if(editMode){ exitEdit(); }
}
function renderPicker(){
  var grid=document.getElementById('pickerGrid'),html='';
  SKINS.forEach(function(name,i){
    html+='<div class="picker-item b'+i+' self" data-id="'+i+'"><div class="mini-bubble bubble">你好呀～</div><div class="label">'+name+'</div></div>';
  });
  grid.innerHTML=html;
  grid.querySelectorAll('.picker-item').forEach(function(el){
    el.addEventListener('click',function(){applySkin(parseInt(this.dataset.id));document.getElementById('pickerOverlay').classList.remove('active');});
  });
}
function bindBubbleClick(){
  document.querySelectorAll('.row .bubble').forEach(function(el){
    el.addEventListener('click',function(){ if(editMode) return; document.getElementById('pickerOverlay').classList.add('active');});
  });
}
document.getElementById('pickerClose').addEventListener('click',function(){document.getElementById('pickerOverlay').classList.remove('active');});
document.getElementById('pickerOverlay').addEventListener('click',function(e){if(e.target===this)this.classList.remove('active');});
/* ===== 图标编辑器逻辑 ===== */
// 每种皮肤的图标配置：sel=伪元素, 定位锚点
var ICON_CFG = {
  35:{sel:'.b35 .bubble::before', pos:'left', base:{left:8, top:'50%'}, tr:'translateY(-50%)'},
  36:{sel:'.b36 .bubble::after',  pos:'right',base:{right:-8, top:-8}, tr:''},
  37:{sel:'.b37 .bubble::before', pos:'left', base:{left:8, top:'50%'}, tr:'translateY(-50%)'},
  38:{sel:'.b38 .bubble::before', pos:'left', base:{left:10, top:-14}, tr:''},
  39:{sel:'.b39 .bubble::after',  pos:'right',base:{right:8, top:'50%'}, tr:'translateY(-50%)'},
  40:{sel:'.b40 .bubble::before', pos:'left', base:{left:12, bottom:-10}, tr:''},
  41:{sel:'.b41 .bubble::before', pos:'left', base:{left:8, top:'50%'}, tr:'translateY(-50%)'},
  42:{sel:'.b42 .bubble::before', pos:'left', base:{left:8, top:'50%'}, tr:'translateY(-50%)'},
  43:{sel:'.b43 .bubble::after',  pos:'right',base:{right:8, top:'50%'}, tr:'translateY(-50%)'},
  44:{sel:'.b44 .bubble::after',  pos:'right',base:{right:8, top:'50%'}, tr:'translateY(-50%)'}
};
var editMode = false, curSkin = 0, curOff = {}, curSize = {}, handleEl = null, styleEl = null;

function getIconEl(skin){
  var bubble = document.querySelector('.row.self.b'+skin+' .bubble') || document.querySelector('.row.other.b'+skin+' .bubble');
  return bubble;
}
// 读取当前 skin 的实际偏移（从 curOff 或 base）
function getOffset(skin){
  if(curOff[skin]) return curOff[skin];
  var c = ICON_CFG[skin]; if(!c) return null;
  var o = {};
  if(c.pos==='left') o.left = c.base.left; else o.right = c.base.right;
  if(c.base.bottom!==undefined) o.bottom = c.base.bottom; else o.top = c.base.top;
  return o;
}
// 应用偏移到动态 style
function applyOffset(skin){
  var c = ICON_CFG[skin]; if(!c) return;
  var o = curOff[skin]; var sz = curSize[skin];
  if(!o && !sz) return;
  var decl = '';
  if(o) Object.keys(o).forEach(function(k){ decl += k+':'+o[k]+'px;'; });
  if(sz){ decl += 'width:'+sz.w+'px;height:'+sz.h+'px;'; }
  if(c.tr) decl += 'transform:'+c.tr+';';
  if(styleEl) styleEl.remove();
  styleEl = document.createElement('style');
  styleEl.textContent = c.sel + '{' + decl + '}';
  document.head.appendChild(styleEl);
}
function removeHandle(){ if(handleEl){ handleEl.remove(); handleEl=null; } }
function buildHandle(skin){
  removeHandle();
  var c = ICON_CFG[skin]; if(!c) return;
  var bubble = getIconEl(skin); if(!bubble) return;
  // 取伪元素真实尺寸与背景
  var pseudo = c.sel.indexOf('::after')>-1 ? '::after' : '::before';
  var ps = getComputedStyle(bubble, pseudo);
  var w = parseFloat(ps.width)||20, h = parseFloat(ps.height)||20;
  var sz = curSize[skin] || {w:w, h:h};
  var rawOff = curOff[skin] ? curOff[skin] : getOffset(skin);
  var pox = pxifyOffset(rawOff, bubble);
  handleEl = document.createElement('div');
  handleEl.className = 'edit-handle';
  handleEl.style.width = sz.w+'px';
  handleEl.style.height = sz.h+'px';
  handleEl.style.background = ps.backgroundImage;
  handleEl.style.backgroundSize = 'contain';
  handleEl.style.backgroundRepeat = 'no-repeat';
  handleEl.style.backgroundPosition = 'center';
  ['left','right','top','bottom'].forEach(function(k){ if(pox[k]!==undefined) handleEl.style[k]= pox[k]+'px'; });
  if(c.tr) handleEl.style.transform = c.tr;
  var rz = document.createElement('div');
  rz.className = 'edit-resize';
  handleEl.appendChild(rz);
  bubble.appendChild(handleEl);
  bindDrag(handleEl, skin);
  bindResize(rz, handleEl, skin);
  updateCode(skin);
}
function bubbleOf(handle){ return handle.parentElement; }
// 把带百分比/字符串的偏移换算成纯像素对象
function pxifyOffset(o, bubble){
  if(!o||!bubble) return o||{};
  var box = bubble.getBoundingClientRect();
  var out = {};
  ['left','right','top','bottom'].forEach(function(k){
    if(o[k]===undefined) return;
    var v = o[k];
    if(typeof v==='number'){ out[k]=v; return; }
    if(typeof v==='string' && v.indexOf('%')>-1){
      var pct = parseFloat(v)/100;
      out[k] = (k==='top'||k==='bottom') ? pct*box.height : pct*box.width;
      out[k] = Math.round(out[k]);
    } else { out[k] = parseFloat(v)||0; }
  });
  return out;
}
function bindDrag(el, skin){
  var sx, sy, start, c = ICON_CFG[skin];
  el.addEventListener('pointerdown', function(e){
    e.preventDefault(); e.stopPropagation();
    el.classList.add('dragging'); el.setPointerCapture(e.pointerId);
    sx = e.clientX; sy = e.clientY;
    start = pxifyOffset(getOffset(skin), bubbleOf(el));
    function move(ev){
      var dx = ev.clientX - sx, dy = ev.clientY - sy;
      var o = {};
      if(c.pos==='left') o.left = Math.round(start.left + dx);
      else o.right = Math.round(start.right - dx);
      if(start.bottom!==undefined) o.bottom = Math.round(start.bottom - dy);
      else o.top = Math.round(start.top + dy);
      curOff[skin] = o;
      applyOffset(skin);
      ['left','right','top','bottom'].forEach(function(k){ if(o[k]!==undefined) el.style[k]=o[k]+'px'; else el.style[k]=''; });
      updateCode(skin);
    }
    function up(){ el.classList.remove('dragging'); el.releasePointerCapture(e.pointerId); document.removeEventListener('pointermove',move); document.removeEventListener('pointerup',up); }
    document.addEventListener('pointermove',move);
    document.addEventListener('pointerup',up);
  });
}
function bindResize(rz, handle, skin){
  var sx, sy, sw, sh;
  rz.addEventListener('pointerdown', function(e){
    e.preventDefault(); e.stopPropagation();
    handle.classList.add('dragging');
    rz.setPointerCapture(e.pointerId);
    sx = e.clientX; sy = e.clientY;
    sw = handle.offsetWidth; sh = handle.offsetHeight;
    var ratio = sh/sw;
    function move(ev){
      var dx = ev.clientX - sx, dy = ev.clientY - sy;
      // 按对角方向缩放：以宽为主，保持原始宽高比
      var w = Math.max(8, Math.round(sw + dx));
      var h = Math.max(8, Math.round(w * ratio));
      handle.style.width = w+'px';
      handle.style.height = h+'px';
      curSize[skin] = {w:w, h:h};
      applyOffset(skin);
      updateCode(skin);
    }
    function up(){
      handle.classList.remove('dragging');
      rz.releasePointerCapture(e.pointerId);
      document.removeEventListener('pointermove',move);
      document.removeEventListener('pointerup',up);
    }
    document.addEventListener('pointermove',move);
    document.addEventListener('pointerup',up);
  });
}
function updateCode(skin){
  var c = ICON_CFG[skin]; if(!c) return;
  var o = curOff[skin]; var sz = curSize[skin];
  if(!o && !sz){ document.getElementById('epCode').value='（拖动/缩放后显示 CSS）'; return; }
  var parts = [];
  if(o) Object.keys(o).forEach(function(k){ parts.push(k+':'+o[k]+'px'); });
  if(sz){ parts.push('width:'+sz.w+'px'); parts.push('height:'+sz.h+'px'); }
  if(c.tr) parts.push('transform:'+c.tr);
  var full = c.sel + '{ ' + parts.join('; ') + '; }';
  document.getElementById('epCode').value = full;
  document.getElementById('epLabel').textContent = '图标位置 · b'+skin;
}
function enterEdit(skin){
  editMode = true; curSkin = skin;
  document.getElementById('editToggle').classList.add('on');
  document.getElementById('editToggle').textContent = '✓ 退出编辑';
  document.getElementById('editPanel').classList.add('show');
  buildHandle(skin);
}
function exitEdit(){
  editMode = false;
  removeHandle();
  document.getElementById('editToggle').classList.remove('on');
  document.getElementById('editToggle').textContent = '✏️ 编辑图标';
  document.getElementById('editPanel').classList.remove('show');
}
document.getElementById('editToggle').addEventListener('click', function(){
  if(editMode) { exitEdit(); return; }
  if(!ICON_CFG[curSkin]){ alert('当前气泡「'+SKINS[curSkin]+'」没有可拖动的图标'); return; }
  enterEdit(curSkin);
});
document.getElementById('epCopy').addEventListener('click', function(){
  var ta = document.getElementById('epCode');
  ta.select(); ta.setSelectionRange(0,99999);
  try{ navigator.clipboard.writeText(ta.value); }catch(e){ document.execCommand('copy'); }
  this.textContent='已复制 ✓'; var b=this; setTimeout(function(){b.textContent='复制 CSS';},1200);
});
document.getElementById('epReset').addEventListener('click', function(){
  delete curOff[curSkin];
  delete curSize[curSkin];
  if(styleEl){ styleEl.remove(); styleEl=null; }
  if(editMode) buildHandle(curSkin);
  document.getElementById('epCode').value='（拖动/缩放后显示 CSS）';
});
renderPicker();bindBubbleClick();applySkin(0);
document.addEventListener('gesturestart',function(e){e.preventDefault();});
</script>
