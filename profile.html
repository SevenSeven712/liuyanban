<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Seven戚 · 个人中心</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        :root {
            --bg: #f5faf5; --bg-card: #ffffff; --bg-input: #eaf3ea;
            --border: #c8e0c8; --text: #1e3a2e; --text-muted: #5a7a6a;
            --text-light: #8aaa9a; --primary: #2e7d32; --primary-light: #4caf50;
            --primary-glow: rgba(76, 175, 80, 0.25); --primary-bg: #e8f5e9;
            --shadow: 0 8px 32px rgba(46, 125, 50, 0.12);
            --radius: 16px; --radius-sm: 10px;
            --font: "Space Grotesk", "PingFang SC", "Segoe UI", system-ui, sans-serif;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --danger: #e57373; --danger-bg: #ffebee; --danger-text: #c62828;
            --success: #2e7d32; --success-bg: #e8f5e9;
            --warning: #ffa726; --warning-bg: #fff3e0;
        }
        html, body { height: 100%; font-family: var(--font); background: var(--bg); color: var(--text); overflow: hidden; }
        #mainApp { display: flex; flex-direction: column; height: 100vh; height: 100dvh; background: var(--bg); }

        /* ===== 头部 ===== */
        .app-header { flex-shrink: 0; padding: 12px 16px 8px 16px; background: rgba(255,255,255,0.92); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; z-index: 50; min-height: 56px; gap: 8px; }
        .app-header .header-left { display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1; }
        .app-header .back-btn { background: none; border: none; cursor: pointer; color: var(--text); padding: 4px; display: none; flex-shrink: 0; }
        .app-header .back-btn.visible { display: flex; }
        .app-header .back-btn svg { width: 22px; height: 22px; }
        .app-header .brand { font-weight: 900; font-size: 1.1em; color: var(--text); display: flex; align-items: center; gap: 0.2em; white-space: nowrap; overflow: hidden; }
        .app-header .brand span { color: var(--primary); }
        .app-header .brand small { font-weight: 400; font-size: 0.55em; color: var(--text-muted); margin-left: 0.2em; }
        .app-header .user-area { display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 4px 8px 4px 4px; border-radius: 99px; flex-shrink: 0; }
        .app-header .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--primary); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 14px; flex-shrink: 0; background-size: cover; background-position: center; }
        .app-header .user-name { font-weight: 600; font-size: 0.8em; max-width: 70px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .app-header .chevron { color: var(--text-muted); font-size: 0.6em; }

        /* ===== 底部导航 ===== */
        .app-tabs { flex-shrink: 0; display: flex; background: rgba(255,255,255,0.96); border-top: 1px solid var(--border); padding: 6px 0 calc(6px + var(--safe-bottom)); z-index: 50; }
        .tab-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; background: none; border: none; font-family: var(--font); font-size: 0.6em; font-weight: 600; color: var(--text-muted); padding: 4px 0; cursor: pointer; text-decoration: none; position: relative; }
        .tab-btn .tab-icon { font-size: 1.6em; line-height: 1.2; display: flex; align-items: center; justify-content: center; width: 1.7em; height: 1.7em; }
        .tab-btn .tab-icon svg { width: 100%; height: 100%; display: block; stroke: currentColor; fill: none; }
        .tab-btn.active { color: var(--primary); }
        .tab-btn.active::after { content: ''; position: absolute; top: -1px; left: 30%; right: 30%; height: 3px; background: var(--primary); border-radius: 0 0 4px 4px; }
        .tab-btn .badge { position: absolute; top: -2px; right: 15%; background: #e57373; color: #fff; font-size: 0.6em; font-weight: 700; padding: 1px 6px; border-radius: 99px; min-width: 16px; text-align: center; transform: translateY(-2px); }

        /* ===== 内容 ===== */
        .profile-content { flex: 1; overflow-y: auto; padding: 16px 20px 12px 20px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
        .view { width: 100%; max-width: 480px; display: none; flex-direction: column; animation: fadeSlideIn 0.35s ease; }
        .view.active { display: flex; }
        @keyframes fadeSlideIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

        /* ===== 设置卡片 ===== */
        .settings-card { background: var(--bg-card); border-radius: var(--radius); padding: 1.8em 1.5em; width: 100%; box-shadow: var(--shadow); border: 1px solid var(--border); }
        .settings-title { font-size: 0.7em; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 12px; }
        .settings-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 10px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.2s; border-radius: var(--radius-sm); margin-bottom: 4px; text-decoration: none; }
        .settings-item:last-child { border-bottom: none; margin-bottom: 0; }
        .settings-item:hover { background: var(--primary-bg); }
        .settings-item.no-click { cursor: default; }
        .settings-item.no-click:hover { background: transparent; }
        .settings-item .item-left { display: flex; align-items: center; gap: 12px; }
        .settings-item .item-icon { width: 38px; height: 38px; border-radius: 50%; background: var(--primary-bg); display: grid; place-items: center; flex-shrink: 0; color: var(--primary); }
        .settings-item .item-icon svg { width: 20px; height: 20px; }
        .settings-item .item-icon.warn { background: var(--warning-bg); color: var(--warning); }
        .settings-item .item-icon.danger { background: var(--danger-bg); color: var(--danger-text); }
        .settings-item .item-label { font-size: 0.95em; font-weight: 600; color: var(--text); }
        .settings-item .item-sublabel { font-size: 0.7em; color: var(--text-light); margin-top: 2px; font-weight: 400; }
        .settings-item .item-arrow { color: var(--text-light); display: flex; }
        .settings-item .item-arrow svg { width: 18px; height: 18px; }

        /* ===== 开关 ===== */
        .toggle-switch { display: inline-block; position: relative; width: 52px; height: 30px; flex-shrink: 0; }
        .toggle-input { display: none; }
        .toggle-label { position: absolute; top: 0; left: 0; width: 52px; height: 30px; background-color: #ccc; border-radius: 30px; cursor: pointer; transition: background-color 0.3s ease; }
        .toggle-label::before { content: ""; position: absolute; top: 2px; left: 2px; width: 26px; height: 26px; background-color: #fff; border-radius: 50%; transition: transform 0.3s ease; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15); }
        .toggle-input:checked + .toggle-label { background-color: var(--primary); }
        .toggle-input:checked + .toggle-label::before { transform: translateX(22px); }

        /* ===== 资料卡 ===== */
        .profile-card { background: var(--bg-card); border-radius: var(--radius); padding: 2em 2.2em; width: 100%; box-shadow: var(--shadow); border: 1px solid var(--border); }
        .profile-avatar { width: 80px; height: 80px; border-radius: 50%; background: var(--primary); color: #fff; display: grid; place-items: center; font-size: 32px; font-weight: 700; margin: 0 auto 12px; object-fit: cover; background-size: cover; background-position: center; }
        .avatar-upload { text-align: center; margin-top: 4px; margin-bottom: 16px; }
        .avatar-upload label { font-size: 0.8em; color: var(--primary); cursor: pointer; text-decoration: underline; }
        .avatar-upload input[type="file"] { display: none; }
        .field-group { margin-bottom: 16px; }
        .field-group label { display: block; font-size: 0.7em; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
        .field-group input, .field-group textarea, .field-group select { width: 100%; padding: 10px 12px; border-radius: var(--radius-sm); border: 2px solid var(--border); background: var(--bg-input); font-family: inherit; font-size: 0.9em; outline: none; transition: border-color 0.2s; color: var(--text); }
        .field-group textarea { resize: vertical; min-height: 100px; }
        .field-group input:focus, .field-group textarea:focus, .field-group select:focus { border-color: var(--primary); }
        .btn-primary { width: 100%; padding: 12px; border-radius: var(--radius-sm); border: none; background: var(--primary); color: #fff; font-weight: 700; font-size: 1em; cursor: pointer; transition: background 0.2s; font-family: inherit; }
        .btn-primary:hover { background: var(--primary-light); }
        .btn-primary:disabled { opacity: 0.5; pointer-events: none; }
        .btn-danger { width: 100%; padding: 10px; border-radius: var(--radius-sm); border: none; background: var(--danger-bg); color: var(--danger-text); font-weight: 700; font-size: 1em; cursor: pointer; transition: background 0.2s; font-family: inherit; margin-top: 8px; }
        .btn-danger:hover { background: #ffcdd2; }
        .btn-secondary-outline { width: 100%; padding: 8px 12px; border-radius: var(--radius-sm); border: 2px solid var(--border); background: transparent; color: var(--text-muted); font-weight: 600; font-size: 0.85em; cursor: pointer; transition: all 0.2s; font-family: inherit; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .btn-secondary-outline:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-bg); }
        .btn-secondary-outline svg { width: 16px; height: 16px; }

        /* ===== 网站选择网格 ===== */
        .site-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 8px; }
        .site-card { padding: 12px 14px; border-radius: 12px; border: 2px solid var(--border); background: var(--bg-card); cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 8px; position: relative; }
        .site-card:hover { border-color: var(--primary-light); }
        .site-card.selected { border-color: var(--primary); background: var(--primary-bg); box-shadow: 0 0 0 3px rgba(46,125,50,0.1); }
        .site-card.selected::after { content: ''; position: absolute; top: 6px; right: 6px; width: 18px; height: 18px; background: var(--primary); border-radius: 50%; }
        .site-card .site-icon { width: 32px; height: 32px; border-radius: 8px; background: var(--primary-bg); display: grid; place-items: center; flex-shrink: 0; color: var(--primary); }
        .site-card.selected .site-icon { background: #fff; }
        .site-card .site-icon svg { width: 16px; height: 16px; }
        .site-card .site-name { font-size: 0.85em; font-weight: 600; line-height: 1.3; word-break: break-word; }

        /* ===== 反馈列表 ===== */
        .fb-item { padding: 12px 14px; border-radius: 12px; background: var(--bg-card); border: 1px solid var(--border); margin-bottom: 10px; }
        .fb-item .fb-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; gap: 8px; flex-wrap: wrap; }
        .fb-item .fb-site { font-weight: 700; font-size: 0.9em; color: var(--text); }
        .fb-item .fb-status { font-size: 0.65em; padding: 2px 10px; border-radius: 99px; font-weight: 600; }
        .fb-item .fb-status.pending { background: var(--warning-bg); color: var(--warning); }
        .fb-item .fb-status.replied { background: #e3f2fd; color: #2b6cff; }
        .fb-item .fb-status.resolved { background: var(--success-bg); color: var(--success); }
        .fb-item .fb-content { font-size: 0.85em; color: var(--text); line-height: 1.5; margin-bottom: 6px; word-break: break-word; }
        .fb-item .fb-reply { background: var(--primary-bg); border-left: 3px solid var(--primary); padding: 8px 12px; border-radius: 6px; font-size: 0.8em; color: var(--text); margin-top: 6px; }
        .fb-item .fb-time { font-size: 0.7em; color: var(--text-light); }
        .fb-item .fb-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
        .fb-item .fb-actions button { padding: 5px 14px; border-radius: 99px; border: none; font-weight: 600; font-size: 0.75em; cursor: pointer; font-family: inherit; }
        .fb-item .fb-actions .btn-reply { background: var(--primary-bg); color: var(--primary); }
        .fb-item .fb-actions .btn-del { background: var(--danger-bg); color: var(--danger-text); }

        /* ===== 管理网站列表 ===== */
        .admin-site-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 6px; }
        .admin-site-item .site-name { font-size: 0.9em; font-weight: 600; }
        .admin-site-item .site-actions button { background: var(--danger-bg); color: var(--danger-text); border: none; padding: 4px 12px; border-radius: 99px; font-size: 0.75em; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; font-family: inherit; }
        .admin-site-item .site-actions button svg { width: 12px; height: 12px; }
        .admin-add-row { display: flex; gap: 8px; margin-top: 12px; }
        .admin-add-row input { flex: 1; padding: 10px 12px; border-radius: 10px; border: 2px solid var(--border); font-family: inherit; font-size: 0.9em; outline: none; }
        .admin-add-row input:focus { border-color: var(--primary); }
        .admin-add-row button { padding: 10px 18px; border-radius: 10px; border: none; background: var(--primary); color: #fff; font-weight: 700; cursor: pointer; font-family: inherit; }

        /* ===== 消息中心 ===== */
        .ntf-filter-tabs { display: flex; gap: 4px; margin-bottom: 12px; background: var(--bg-input); border-radius: 99px; padding: 3px; overflow-x: auto; }
        .ntf-tab { flex: 1; padding: 6px 0; border: none; background: transparent; border-radius: 99px; font-family: inherit; font-size: 0.7em; font-weight: 600; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 3px; white-space: nowrap; }
        .ntf-tab.active { background: var(--bg-card); color: var(--primary); box-shadow: 0 2px 8px rgba(46,125,50,0.15); }
        .ntf-tab-badge { background: var(--danger); color: #fff; font-size: 0.8em; padding: 0 5px; border-radius: 99px; min-width: 16px; text-align: center; line-height: 16px; display: none; }
        .ntf-tab-badge.visible { display: inline-block; }
        .ntf-card { display: flex; align-items: flex-start; gap: 12px; padding: 14px 12px; border-radius: 12px; margin-bottom: 8px; background: var(--bg-card); border: 1px solid var(--border); cursor: pointer; transition: all 0.25s ease; position: relative; overflow: hidden; }
        .ntf-card:hover { box-shadow: 0 4px 16px rgba(46,125,50,0.1); transform: translateY(-1px); }
        .ntf-card.unread { background: linear-gradient(135deg, #f0faf0 0%, #ffffff 100%); border-color: var(--primary); }
        .ntf-card.unread::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--primary); border-radius: 0 3px 3px 0; }
        .ntf-card.report-card { border-left: 4px solid var(--warning); }
        .ntf-card.feedback-card { border-left: 4px solid #2b6cff; }
        .ntf-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: transparent; margin-top: 6px; }
        .ntf-card.unread .ntf-dot { background: var(--primary); }
        .ntf-type-icon { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex-shrink: 0; }
        .ntf-type-icon svg { width: 20px; height: 20px; }
        .ntf-type-icon.comment { background: #e3f2fd; color: #2b6cff; }
        .ntf-type-icon.report { background: var(--warning-bg); color: var(--warning); }
        .ntf-type-icon.system { background: #f3e5f5; color: #8e24aa; }
        .ntf-type-icon.ban { background: var(--danger-bg); color: var(--danger-text); }
        .ntf-type-icon.result-ok { background: var(--success-bg); color: var(--success); }
        .ntf-type-icon.result-no { background: #f5f5f5; color: #757575; }
        .ntf-type-icon.feedback { background: #e3f2fd; color: #2b6cff; }
        .ntf-body { flex: 1; min-width: 0; }
        .ntf-title { font-size: 0.9em; font-weight: 600; color: var(--text); line-height: 1.4; margin-bottom: 2px; }
        .ntf-snippet { font-size: 0.8em; color: var(--text-muted); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 4px; }
        .ntf-meta { font-size: 0.7em; color: var(--text-light); display: flex; align-items: center; gap: 8px; }
        .ntf-meta .unread-tag { color: var(--primary); font-weight: 600; }
        .ntf-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
        .ntf-actions button { padding: 5px 12px; border-radius: 99px; border: none; font-family: inherit; font-size: 0.72em; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; transition: all 0.2s; }
        .ntf-actions button svg { width: 12px; height: 12px; }
        .ntf-actions .btn-approve { background: var(--success-bg); color: var(--success); }
        .ntf-actions .btn-approve:hover { background: #c8e6c9; }
        .ntf-actions .btn-reject { background: var(--danger-bg); color: var(--danger-text); }
        .ntf-actions .btn-reject:hover { background: #ffcdd2; }
        .ntf-actions .btn-view { background: #e3f2fd; color: #2b6cff; }
        .ntf-actions .btn-view:hover { background: #bbdefb; }
        .ntf-group-label { font-size: 0.7em; font-weight: 700; color: var(--text-light); padding: 12px 4px 6px; text-transform: uppercase; letter-spacing: 0.05em; }
        .ntf-empty { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 0.9em; }
        .ntf-empty .big { margin-bottom: 8px; opacity: 0.4; display: flex; justify-content: center; }
        .ntf-empty .big svg { width: 60px; height: 60px; }
        .ntf-loading { text-align: center; padding: 30px 0; color: var(--text-muted); font-size: 0.85em; }
        .spinner { display: inline-block; width: 24px; height: 24px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 8px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===== 关于我们 ===== */
        .about-card { text-align: center; padding: 20px 0; }
        .about-card .about-avatar-link { display: inline-block; text-decoration: none; transition: transform 0.3s ease, box-shadow 0.3s ease; border-radius: 50%; }
        .about-card .about-avatar-link:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(46, 125, 50, 0.3); }
        .about-card .about-avatar { width: 100px; height: 100px; border-radius: 50%; background: #2e7d32; color: #fff; display: grid; place-items: center; font-size: 40px; font-weight: 900; margin: 0 auto 12px; cursor: pointer; object-fit: cover; }
        .about-card h2 { font-size: 1.4em; margin-bottom: 4px; }
        .about-card .sub { color: var(--text-muted); font-size: 0.9em; margin-bottom: 16px; }
        .about-card .desc { font-size: 0.95em; line-height: 1.6; color: var(--text); max-width: 320px; margin: 0 auto 20px; }
        .shop-ad { background: linear-gradient(135deg, #2e7d32, #4caf50); border-radius: var(--radius-sm); padding: 16px; color: #fff; margin-top: 16px; cursor: pointer; transition: transform 0.2s; box-shadow: var(--shadow); display: flex; align-items: center; gap: 12px; text-align: left; }
        .shop-ad:hover { transform: scale(1.02); }
        .shop-ad svg { width: 36px; height: 36px; flex-shrink: 0; }
        .shop-ad h3 { font-size: 1.1em; margin-bottom: 4px; }
        .shop-ad p { font-size: 0.8em; opacity: 0.9; }

        /* ===== Toast ===== */
        #toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--text); color: #fff; padding: 0.7em 1.6em; border-radius: 2em; font-weight: 600; font-size: 0.85em; opacity: 0; transition: all 0.4s ease; z-index: 9999; pointer-events: none; white-space: nowrap; box-shadow: var(--shadow); }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* ===== Modal ===== */
        .custom-modal { position: fixed; inset: 0; z-index: 2000; background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; padding: 20px; }
        .custom-modal.active { display: flex; }
        .modal-box { background: var(--bg-card); border-radius: var(--radius); max-width: 420px; width: 100%; padding: 24px; box-shadow: var(--shadow); border: 1px solid var(--border); }
        .modal-title { font-size: 1.2em; font-weight: 700; margin-bottom: 8px; color: var(--text); }
        .modal-body { font-size: 0.95em; color: var(--text-muted); line-height: 1.6; margin-bottom: 16px; white-space: pre-wrap; word-break: break-word; }
        .modal-body textarea { width: 100%; padding: 10px 12px; border-radius: 10px; border: 2px solid var(--border); font-family: inherit; font-size: 0.9em; outline: none; resize: vertical; min-height: 80px; box-sizing: border-box; }
        .modal-body textarea:focus { border-color: var(--primary); }
        .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
        .modal-actions button { padding: 6px 18px; border-radius: var(--radius-sm); border: none; font-weight: 600; font-size: 0.85em; cursor: pointer; transition: background 0.2s; font-family: inherit; }
        .modal-actions .btn-danger { background: var(--danger); color: #fff; margin-top: 0; width: auto; }
        .modal-actions .btn-danger:hover { background: #c62828; }
        .modal-actions .btn-secondary { background: var(--bg-input); color: var(--text-muted); }
        .modal-actions .btn-secondary:hover { background: var(--border); }
        .modal-actions .btn-primary { background: var(--primary); color: #fff; width: auto; }
        .modal-actions .btn-primary:hover { background: var(--primary-light); }

        @media (max-width: 480px) {
            .profile-content { padding: 12px 14px; }
            .settings-card { padding: 1.2em 1em; }
            .profile-card { padding: 1.2em 1.2em; }
            .app-header { padding: 10px 12px 6px 12px; min-height: 48px; }
            .app-header .brand { font-size: 0.95em; }
            .app-header .user-name { max-width: 50px; font-size: 0.7em; }
        }
    </style>
</head>
<body>
    <div id="mainApp">
        <!-- ===== 头部 ===== -->
        <div class="app-header" id="customHeader">
            <div class="header-left">

            var t = document.getElementById('toast');
            if (!t) return;
            t.textContent = msg; t.classList.add('show');
            clearTimeout(window.toastTimer);
            window.toastTimer = setTimeout(function() { t.classList.remove('show'); }, 2800);
        }
        function escapeHtml(s) {
            if (!s) return '';
            return String(s).replace(/[&<>"']/g, function(c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }
        function showConfirm(title, body, onOk) {
            var modal = document.getElementById('confirmModal');
            document.getElementById('confirmTitle').textContent = title;
            document.getElementById('confirmBody').textContent = body;
            modal.classList.add('active');
            var c = document.getElementById('confirmCancel');
            var o = document.getElementById('confirmOk');
            var cleanup = function() { modal.classList.remove('active'); c.onclick = null; o.onclick = null; };
            c.onclick = cleanup;
            o.onclick = function() { if (onOk) onOk(); cleanup(); };
        }

        var SUPABASE_URL = "https://ulvhuqtpdafspbdvkogs.supabase.co";
        var SUPABASE_ANON_KEY = "sb_publishable_Ew8kKf2z05kmYIK2XNu00g_dzAirtIM";
        window.sb = window.sb || window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            } else {
                av.style.backgroundImage = '';
                av.textContent = (user.nickname || 'U').charAt(0).toUpperCase();
            }
            nm.textContent = user.nickname || '用户';

            var pa = document.getElementById('profileAvatar');
            if (pa) {
                if (user.avatar_url && user.avatar_url.startsWith('http')) {
                    pa.style.backgroundImage = 'url(' + user.avatar_url + ')';
                    pa.style.backgroundSize = 'cover';
                    pa.style.backgroundPosition = 'center';

        // ============ 消息中心 ============
        var allNotifications = [];

        async function loadNotifications() {
            var c = document.getElementById('notificationList');
            c.innerHTML = '<div class="ntf-loading"><span class="spinner"></span>加载中...</div>';
            try {
                var res = await window.sb.from('notifications').select('*').eq('user_id', currentUser.id).order('created_at', { ascending: false });
                if (res.error) throw res.error;
                allNotifications = res.data || [];
                renderNotifications();
                updateUnreadTabCount();
                var u = allNotifications.filter(function(n) { return !n.is_read; }).length;
                var h = document.getElementById('unreadHint');
                if (h) h.textContent = u > 0 ? '有 ' + u + ' 条未读通知' : '暂无未读通知';
                if (typeof updateNotificationBadge === 'function') updateNotificationBadge();
            } catch (err) {
                c.innerHTML = '<div class="ntf-empty">加载失败：' + escapeHtml(err.message) + '</div>';
            }

        function updateUnreadTabCount() {
            var u = allNotifications.filter(function(n) { return !n.is_read; }).length;
            var b = document.getElementById('unreadTabCount');
            if (b) { b.textContent = u > 9 ? '9+' : u; b.className = 'ntf-tab-badge' + (u > 0 ? ' visible' : ''); }
        }

        function renderNotifications() {
            var c = document.getElementById('notificationList');
            var f = allNotifications;
            if (currentNtfFilter === 'unread') f = f.filter(function(n) { return !n.is_read; });
            else if (currentNtfFilter === 'report') f = f.filter(function(n) { return n.notification_type === 'report' || n.type === 'report'; });
            else if (currentNtfFilter === 'feedback') f = f.filter(function(n) { return n.notification_type === 'feedback' || n.type === 'feedback'; });

            if (!f.length) {
                var msg = currentNtfFilter === 'unread' ? '没有未读通知' :
                          currentNtfFilter === 'report' ? '没有待处理的举报' :
                          currentNtfFilter === 'feedback' ? '暂无反馈通知' : '暂无通知';
                c.innerHTML = '<div class="ntf-empty"><div class="big"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></div>' + msg + '</div>';
                return;
            }

            var g = { today: [], yesterday: [], earlier: [] };
            var now = new Date();
            var t0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            var t1 = new Date(t0.getTime() - 86400000);
            f.forEach(function(n) {
                var d = new Date(n.created_at);
                if (d >= t0) g.today.push(n);
                else if (d >= t1) g.yesterday.push(n);
                else g.earlier.push(n);
            });

            var html = '';
            function rg(label, items) {
                if (!items.length) return '';
                var s = '<div class="ntf-group-label">' + label + '</div>';
                items.forEach(function(n) { s += renderNotificationCard(n); });
                return s;
            }
            html += rg('今天', g.today) + rg('昨天', g.yesterday) + rg('更早', g.earlier);
            c.innerHTML = html;

            c.querySelectorAll('.ntf-card').forEach(function(el) {
                el.onclick = function(e) {
                    if (e.target.closest('.ntf-actions')) return;
                    var id = this.dataset.id;
                    var pid = this.dataset.postid;
                    var cid = this.dataset.commentid;
                    var nt = this.dataset.ntftype;
                    markNotificationRead(id);
                    if (nt === 'report' || nt === 'feedback') return;
                    if (pid && cid) window.location.href = '/liuyanban/posts.html?comment=' + cid + '&post=' + pid;
                };
            });
        }

        function renderNotificationCard(n) {

            var nt = n.notification_type || n.type || 'comment';
            var t = formatRelativeTime(n.created_at);
            var icons = {

                report: { cls: 'report', svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>' },
                system: { cls: 'system', svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>' },
                ban: { cls: 'ban', svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>' },
                report_result: { cls: 'result-ok', svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>' },
                feedback: { cls: 'feedback', svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>' }
            };
            var info = icons[nt] || icons.comment;
            var title = '', snippet = '';
            if (nt === 'report') { title = '新举报待处理'; snippet = '原因：' + (n.report_reason || '未填写') + (n.extra_text ? ' · ' + n.extra_text : ''); }

            else if (nt === 'ban') { title = '你的账号已被封禁'; snippet = '解封时间：' + (n.ban_until ? new Date(n.ban_until).toLocaleString('zh-CN') : '未知'); }
            else if (nt === 'report_result') { title = '举报处理结果'; snippet = n.extra_text || '管理员已处理你的举报'; }
            else { title = '收到新评论'; snippet = n.extra_text || n.comment_content || '有人评论了你的帖子'; }

            var actions = '';
            if (nt === 'report' && n.report_id) {
                actions = '<div class="ntf-actions">' +
                    '<button class="btn-view" onclick="event.stopPropagation();viewReportDetail(\'' + n.report_id + '\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>查看</button>' +

                '" data-id="' + n.id + '" data-postid="' + (n.post_id || '') + '" data-commentid="' + (n.source_id || '') +
                '" data-ntftype="' + nt + '" data-reportid="' + (n.report_id || '') + '" data-feedbackid="' + (n.feedback_id || '') + '">' +
                '<div class="ntf-dot"></div>' +
                '<div class="ntf-type-icon ' + info.cls + '">' + info.svg + '</div>' +
                '<div class="ntf-body">' +
                    '<div class="ntf-title">' + title + '</div>' +
                    '<div class="ntf-snippet">' + escapeHtml(snippet) + '</div>' +
                    '<div class="ntf-meta"><span>' + t + '</span>' + (r ? '' : '<span class="unread-tag">未读</span>') + '</div>' +
                    actions +
                '</div>' +

        }

        function formatRelativeTime(isoStr) {
            var now = new Date(), d = new Date(isoStr), diff = (now - d) / 1000;
            if (diff < 60) return '刚刚';
            if (diff < 3600) return Math.floor(diff / 60) + '分钟前';
            if (diff < 86400) return Math.floor(diff / 3600) + '小时前';
            if (diff < 172800) return '昨天';
            if (diff < 604800) return Math.floor(diff / 86400) + '天前';
            return d.toLocaleString('zh-CN', { month: 'short', day: 'numeric' });
        }

        async function getFullSnippet(report) {
            try {
                if (report.content_type === 'post') {
                    var r = await window.sb.from('posts').select('title, content').eq('id', report.content_id).single();
                    if (r.data) {
                        var s = (r.data.title || r.data.content || '').replace(/<[^>]*>/g, '').trim();
                        return s.substring(0, 20) || '（无内容）';
                    }
                } else if (report.content_type === 'message') {
                    var r2 = await window.sb.from('messages').select('text').eq('id', report.content_id).single();
                    if (r2.data) return (r2.data.text || '').substring(0, 20) || '（无内容）';
                } else if (report.content_type === 'chat') {
                    var r3 = await window.sb.from('chats').select('content').eq('id', report.content_id).single();
                    if (r3.data) return (r3.data.content || '').substring(0, 20) || '（无内容）';
                } else if (report.content_type === 'comment') {
                    var r4 = await window.sb.from('post_comments').select('content').eq('id', report.content_id).single();
                    if (r4.data) return (r4.data.content || '').substring(0, 20) || '（无内容）';
                }
            } catch (e) {}
            var s = (report.content_snapshot || '').replace(/<[^>]*>/g, '').trim();
            return s.substring(0, 20) || '（无内容）';
        }

        async function doApproveReport(reportId, measure, banDays) {
            try {
                var rRes = await window.sb.from('reports').select('*').eq('id', reportId).single();
                if (rRes.error) throw rRes.error;
                var report = rRes.data;
                var typeText = { post: '帖子', comment: '评论', message: '留言', chat: '聊天消息' }[report.content_type] || '内容';
                var snippet = await getFullSnippet(report);

                await window.sb.from('reports').update({
                    status: 'approved',
                    reviewed_by: currentUser.id,
                    reviewed_at: new Date().toISOString(),
                    measure: measure,
                    ban_days: measure === 'ban' ? banDays : null,
                    admin_note: measure + (measure === 'ban' ? '（' + banDays + '天）' : '')
                }).eq('id', reportId);

                var measureText = '';
                if (measure === 'ban') {
                    var until = new Date(Date.now() + banDays * 86400000).toISOString();
                    await window.sb.from('users').update({
                        banned_reason: '被举报违规',
                        banned_until: until
                    }).eq('id', report.reported_user_id);
                    measureText = '禁言 ' + banDays + ' 天（至 ' + new Date(until).toLocaleString('zh-CN') + '）';
                } else if (measure === 'delete') {
                    var tableMap = { post: 'posts', comment: 'post_comments', message: 'messages', chat: 'chats' };
                    var table = tableMap[report.content_type];
                    if (table) {
                        await window.sb.from(table).delete().eq('id', report.content_id);
                    }
                    measureText = '删除违规内容';
                } else if (measure === 'warn') {
                    measureText = '警告（已发送警告通知）';
                }

                await window.pushNotification(report.reporter_id, {
                    type: 'report_result',
                    notification_type: 'report_result',
                    extra_text: '你举报的' + typeText + '「' + snippet + '」已被接受并处理，处理措施：' + measureText
                });

                await window.pushNotification(report.reported_user_id, {
                    type: 'report_result',
                    notification_type: 'report_result',
                    extra_text: '你的' + typeText + '「' + snippet + '」被举报，目前对你采取：' + measureText + '，请文明聊天'
                });

                showToast('已处理，双方已收到通知');
                loadNotifications();
            } catch (err) { showToast('处理失败：' + err.message); }
        }
        window.doApproveReport = doApproveReport;

        async function viewReportDetail(reportId) {
            try {
                var res = await window.sb.from('reports').select('*').eq('id', reportId).single();
                if (res.error) throw res.error;
                var r = res.data;
                var typeText = { post: '帖子', comment: '评论', message: '留言', chat: '聊天消息' }[r.content_type] || '内容';
                var snippet = await getFullSnippet(r);
                var statusText = { pending: '待处理', approved: '已处理', rejected: '已驳回' }[r.status] || r.status;
                var detailText =
                    '类型：' + typeText + '\n' +
                    '内容摘要：' + snippet + '\n' +
                    '举报原因：' + r.reason + '\n' +
                    '补充描述：' + (r.description || '无') + '\n' +
                    '当前状态：' + statusText;
                showConfirm('举报详情', detailText, function() {});
            } catch (err) { showToast('加载失败：' + err.message); }
        }
        window.viewReportDetail = viewReportDetail;

        function goToFeedbackDetail(fid) {
            switchView('adminFeedbackView');
            loadAdminFeedback(fid);
        }
        window.goToFeedbackDetail = goToFeedbackDetail;

        document.querySelectorAll('.ntf-tab').forEach(function(tab) {
            tab.onclick = function() {
                document.querySelectorAll('.ntf-tab').forEach(function(t) { t.classList.remove('active'); });
                this.classList.add('active');
                currentNtfFilter = this.dataset.filter;
                renderNotifications();
            };
        });
        document.getElementById('markAllReadBtn').onclick = async function() {
            await window.sb.from('notifications').update({ is_read: true }).eq('user_id', currentUser.id).eq('is_read', false);
            showToast('全部已读');
            loadNotifications();
            if (typeof updateNotificationBadge === 'function') updateNotificationBadge();
        };

        // ============ 反馈模块 ============
        var allSites = [];
        var selectedSiteId = null;
        var fbCurrentTab = 'submit';

        async function loadSites() {
            var res = await window.sb.from('feedback_sites').select('*').order('sort_order', { ascending: true });
            allSites = res.data || [];
        }

        async function initFeedbackView() {
            if (!allSites.length) await loadSites();
            renderSiteGrid();
            switchFbTab('submit');
        }

        function renderSiteGrid() {
            var g = document.getElementById('siteGrid');
            if (!allSites.length) {
                g.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:20px 0;grid-column:1/-1;font-size:0.85em;">暂无网站</div>';
                return;
            }
            g.innerHTML = allSites.map(function(s) {
                return '<div class="site-card' + (selectedSiteId === s.id ? ' selected' : '') + '" data-id="' + s.id + '">' +
                    '<div class="site-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg></div>' +
                    '<div class="site-name">' + escapeHtml(s.name) + '</div>' +
                '</div>';
            }).join('');
            g.querySelectorAll('.site-card').forEach(function(el) {
                el.onclick = function() {
                    selectedSiteId = this.dataset.id;
                    g.querySelectorAll('.site-card').forEach(function(x) { x.classList.remove('selected'); });
                    this.classList.add('selected');
                };
            });
        }

        function switchFbTab(tab) {
            fbCurrentTab = tab;
            document.getElementById('fbSubmitPanel').style.display = tab === 'submit' ? 'block' : 'none';
            document.getElementById('fbMinePanel').style.display = tab === 'mine' ? 'block' : 'none';
            document.getElementById('fbTabNew').style.color = tab === 'submit' ? 'var(--primary)' : 'var(--text-muted)';
            document.getElementById('fbTabMine').style.color = tab === 'mine' ? 'var(--primary)' : 'var(--text-muted)';
            if (tab === 'mine') loadMyFeedback();
        }
        document.getElementById('fbTabNew').onclick = function() { switchFbTab('submit'); };
        document.getElementById('fbTabMine').onclick = function() { switchFbTab('mine'); };

        document.getElementById('fbSubmitBtn').onclick = async function() {
            if (!selectedSiteId) return showToast('请先选择网站');
            var content = document.getElementById('fbContent').value.trim();
            if (!content) return showToast('请填写问题描述');
            var contact = document.getElementById('fbContact').value.trim();
            var site = allSites.find(function(s) { return s.id === selectedSiteId; });
            var btn = this;
            btn.disabled = true; btn.textContent = '提交中...';
            try {
                var ins = await window.sb.from('feedback').insert([{
                    user_id: currentUser.id,
                    user_nickname: currentUser.nickname,
                    site_id: selectedSiteId,
                    site_name: site.name,
                    content: content,
                    contact: contact
                }]).select();
                if (ins.error) throw ins.error;

                var adminRes = await window.sb.from('users').select('id').eq('phone', '17355394710').single();
                if (adminRes.data) {
                    await window.pushNotification(adminRes.data.id, {
                        type: 'feedback', notification_type: 'feedback',
                        feedback_id: ins.data[0].id,
                        extra_text: '[' + site.name + '] ' + content.substring(0, 60)
                    });
                }
                showToast('反馈已提交，感谢你的反馈！');
                document.getElementById('fbContent').value = '';
                document.getElementById('fbContact').value = '';
                selectedSiteId = null;
                renderSiteGrid();
            } catch (err) { showToast('提交失败：' + err.message); }
            btn.disabled = false; btn.textContent = '提交反馈';
        };

        async function loadMyFeedback() {
            var c = document.getElementById('myFeedbackList');
            c.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:20px 0;font-size:0.85em;">加载中...</div>';
            var res = await window.sb.from('feedback').select('*').eq('user_id', currentUser.id).order('created_at', { ascending: false });
            var data = res.data || [];
            if (!data.length) {
                c.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:20px 0;font-size:0.85em;">还没有反馈记录</div>';
                return;
            }
            var statusMap = { pending: '待处理', replied: '已回复', resolved: '已解决' };
            c.innerHTML = data.map(function(f) {
                return '<div class="fb-item">' +
                    '<div class="fb-head">' +
                        '<span class="fb-site">' + escapeHtml(f.site_name) + '</span>' +
                        '<span class="fb-status ' + f.status + '">' + (statusMap[f.status] || f.status) + '</span>' +
                    '</div>' +
                    '<div class="fb-content">' + escapeHtml(f.content) + '</div>' +
                    (f.admin_reply ? '<div class="fb-reply"><b>管理员回复：</b>' + escapeHtml(f.admin_reply) + '</div>' : '') +
                    '<div class="fb-time">' + new Date(f.created_at).toLocaleString('zh-CN') + '</div>' +
                '</div>';
            }).join('');
        }

        // ============ 管理员反馈管理 ============
        var highlightFbId = null;
        async function loadAdminFeedback(highlightId) {
            highlightFbId = highlightId || null;
            var c = document.getElementById('adminFeedbackList');
            c.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:20px 0;font-size:0.85em;">加载中...</div>';
            var res = await window.sb.from('feedback').select('*').order('created_at', { ascending: false });
            var data = res.data || [];
            if (!data.length) {
                c.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:20px 0;font-size:0.85em;">还没有反馈</div>';
                return;
            }
            var statusMap = { pending: '待处理', replied: '已回复', resolved: '已解决' };
            c.innerHTML = data.map(function(f) {
                var isHl = (highlightFbId && f.id === highlightFbId);
                return '<div class="fb-item" style="' + (isHl ? 'border:2px solid var(--primary);' : '') + '">' +
                    '<div class="fb-head">' +
                        '<span class="fb-site">[' + escapeHtml(f.site_name) + '] ' + escapeHtml(f.user_nickname || '匿名') + '</span>' +
                        '<span class="fb-status ' + f.status + '">' + (statusMap[f.status] || f.status) + '</span>' +
                    '</div>' +
                    '<div class="fb-content">' + escapeHtml(f.content) + '</div>' +
                    (f.contact ? '<div class="fb-time">联系方式：' + escapeHtml(f.contact) + '</div>' : '') +
                    (f.admin_reply ? '<div class="fb-reply"><b>已回复：</b>' + escapeHtml(f.admin_reply) + '</div>' : '') +
                    '<div class="fb-time">' + new Date(f.created_at).toLocaleString('zh-CN') + '</div>' +
                    '<div class="fb-actions">' +
                        '<button class="btn-reply" onclick="replyFeedback(\'' + f.id + '\')">' + (f.admin_reply ? '重新回复' : '回复') + '</button>' +
                        '<button class="btn-del" onclick="deleteFeedback(\'' + f.id + '\')">删除</button>' +
                    '</div>' +
                '</div>';
            }).join('');
        }

        var replyingFeedbackId = null;
        function replyFeedback(fid) {
            replyingFeedbackId = fid;
            document.getElementById('replyText').value = '';
            document.getElementById('replyModal').classList.add('active');
            document.getElementById('replyText').focus();
        }
        window.replyFeedback = replyFeedback;

        document.getElementById('replyCancel').onclick = function() {
            document.getElementById('replyModal').classList.remove('active');
            replyingFeedbackId = null;
        };
        document.getElementById('replyOk').onclick = async function() {
            var txt = document.getElementById('replyText').value.trim();
            if (!txt) return showToast('请输入回复内容');
            try {
                var res = await window.sb.from('feedback').select('*').eq('id', replyingFeedbackId).single();
                var f = res.data;
                await window.sb.from('feedback').update({ admin_reply: txt, status: 'replied' }).eq('id', replyingFeedbackId);
                if (f && f.user_id) {
                    await window.pushNotification(f.user_id, {
                        type: 'feedback', notification_type: 'feedback',
                        feedback_id: replyingFeedbackId,
                        extra_text: '管理员回复了你的反馈：' + txt.substring(0, 60)
                    });
                }
                document.getElementById('replyModal').classList.remove('active');
                replyingFeedbackId = null;
                showToast('回复已发送');
                loadAdminFeedback();
            } catch (err) { showToast('回复失败：' + err.message); }
        };

        async function deleteFeedback(fid) {
            showConfirm('删除反馈', '确定删除此条反馈吗？', async function() {
                try {
                    var r = await window.sb.from('feedback').delete().eq('id', fid);
                    if (r.error) throw r.error;
                    showToast('已删除');
                    loadAdminFeedback();
                } catch (err) { showToast('删除失败：' + err.message); }
            });
        }
        window.deleteFeedback = deleteFeedback;

        // ============ 网站管理 ============
        async function loadAdminSites() {
            await loadSites();
            renderAdminSites();
        }
        function renderAdminSites() {
            var c = document.getElementById('adminSitesList');
            if (!allSites.length) {
                c.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:20px 0;font-size:0.85em;">暂无网站，请在下方添加</div>';
                return;
            }
            c.innerHTML = allSites.map(function(s) {
                return '<div class="admin-site-item">' +
                    '<span class="site-name">' + escapeHtml(s.name) + '</span>' +
                    '<div class="site-actions">' +
                        '<button onclick="deleteSite(\'' + s.id + '\',\'' + escapeHtml(s.name).replace(/'/g, "\\'") + '\')">' +
                        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>' +
                        '删除</button>' +
                    '</div>' +
                '</div>';
            }).join('');
        }
        document.getElementById('addSiteBtn').onclick = async function() {
            var name = document.getElementById('newSiteName').value.trim();
            if (!name) return showToast('请输入网站名称');
            try {
                var maxOrder = allSites.reduce(function(m, s) { return Math.max(m, s.sort_order || 0); }, 0);
                await window.sb.from('feedback_sites').insert([{ name: name, sort_order: maxOrder + 1 }]);
                document.getElementById('newSiteName').value = '';
                showToast('已添加');
                await loadSites();
                renderAdminSites();
            } catch (err) { showToast('添加失败：' + err.message); }
        };
        async function deleteSite(sid, name) {
            showConfirm('删除网站', '确定删除「' + name + '」吗？', async function() {
                await window.sb.from('feedback_sites').delete().eq('id', sid);
                showToast('已删除');
                await loadSites();
                renderAdminSites();
            });
        }
        window.deleteSite = deleteSite;

        // ============ 初始化 ============
        (function init() {
            var urlParams = new URLSearchParams(window.location.search);
            var view = urlParams.get('view');
            if (view === 'messages') {
                switchView('messagesView');
                loadNotifications();
            } else if (view === 'avatar' || view === 'edit') {
                // 从头像提醒弹窗直达更新资料页
                switchView('profileEditView');
            } else {
                switchView('settingsView');
            }

            if (typeof updateNotificationBadge === 'function') {
                updateNotificationBadge();
            }
        })();

        document.addEventListener('gesturestart', function(e) { e.preventDefault(); });
    </script>
</body>
</html>
