<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>设置专属UID</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "PingFang SC", "Segoe UI", system-ui, sans-serif;
            background: #f5faf5; color: #1e3a2e;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; padding: 20px;
            background-image: radial-gradient(circle at 20% 10%, rgba(46, 125, 50, 0.06) 0%, transparent 45%);
        }
        .card {
            width: 100%; max-width: 400px;
            background: #fff; border-radius: 16px; padding: 30px 24px;
            box-shadow: 0 8px 32px rgba(46, 125, 50, 0.12);
            border: 1px solid #c8e0c8;
        }
        h2 { text-align: center; color: #2e7d32; margin-bottom: 8px; font-size: 22px; }
        .desc { text-align: center; color: #5a7a6a; font-size: 13px; margin-bottom: 20px; line-height: 1.5; }
        .warning-box {
            background: #fff3e0; border: 1px solid #ffcc80; color: #e65100;
            padding: 12px; border-radius: 8px; font-size: 13px; margin-bottom: 20px;
            line-height: 1.5; display: flex; gap: 8px; align-items: flex-start;
        }
        .warning-box svg { flex-shrink: 0; width: 18px; height: 18px; margin-top: 2px; stroke: #e65100; }
        .field { margin-bottom: 16px; }
        .field label { display: block; font-size: 13px; font-weight: 600; color: #5a7a6a; margin-bottom: 6px; }
        .field input {
            width: 100%; padding: 12px; border: 2px solid #c8e0c8; border-radius: 10px;
            font-size: 16px; font-weight: bold; outline: none; transition: all 0.3s;
            background: #eaf3ea; color: #1e3a2e;
        }
        .field input:focus { border-color: #2e7d32; box-shadow: 0 0 0 4px rgba(46,125,50,.25); }
        .btn {
            width: 100%; padding: 14px; border-radius: 10px; border: none;
            background: #2e7d32; color: #fff; font-size: 16px; font-weight: bold;
            cursor: pointer; transition: all 0.2s; margin-top: 10px;
        }
        .btn:hover:not(:disabled) { background: #4caf50; transform: translateY(-1px); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .error { color: #c62828; font-size: 13px; margin-top: 10px; text-align: center; min-height: 18px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>设置专属 UID</h2>
        <p class="desc">系统已完成安全升级，请将您的手机号替换为专属 UID。</p>
        
        <div class="warning-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
            <div>为了保护您的隐私，避免手机号泄露。<br><b>UID 仅能设置一次，请谨慎填写！</b></div>
        </div>

        <div class="field">
            <label>自定义 UID（5~10位数字加字母组合）</label>
            <input type="text" id="uidInput" placeholder="例如: seven888" maxlength="10" oninput="this.value=this.value.replace(/[^a-zA-Z0-9]/g,'')" />
        </div>
        <button class="btn" id="submitBtn" onclick="handleSubmit()">确认修改</button>
        <div class="error" id="errMsg"></div>
    </div>

    <script src="/liuyanban/common.js"></script>
    <script>
        var user = getSessionUser();
        if (!user || !user.id) window.location.href = '/liuyanban/index.html';
        if (user.custom_uid) window.location.href = '/liuyanban/user.html';

        async function handleSubmit() {
            var uid = document.getElementById('uidInput').value.trim();
            var errEl = document.getElementById('errMsg');
            var btn = document.getElementById('submitBtn');

            if (!/^(?=.*[a-zA-Z])(?=.*\d)[a-zA-Z0-9]{5,10}$/.test(uid)) {
                errEl.textContent = '必须为5-10位数字加字母组合，且包含两者';
                return;
            }

            btn.disabled = true;
            btn.textContent = '设置中...';
            errEl.textContent = '';

            try {
                // 1. 先修改 Supabase Auth 的登录账号（手机号@sevenqi.com -> UID@sevenqi.com）
                var authRes = await window.sb.auth.updateUser({ email: uid + '@sevenqi.com' });
                if (authRes.error) throw authRes.error;

                // 2. 再更新数据库，并把 phone 永久置空
                var res = await window.sb.rpc('set_custom_uid', { p_uid: uid });
                if (res.error) throw res.error;
                if (!res.data.ok) throw new Error(res.data.message);

                // 3. 更新本地缓存，手机号置空
                user.custom_uid = uid;
                user.phone = null;
                setSessionUser(user);
                
                showToast('设置成功！即将返回个人中心');
                setTimeout(function() { window.location.href = '/liuyanban/user.html'; }, 1500);

            } catch (e) {
                errEl.textContent = e.message || '网络异常，请重试';
                btn.disabled = false;
                btn.textContent = '确认修改';
            }
        }
    </script>
</body>
</html>
