<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#2e7d32" />
<link rel="apple-touch-icon" href="./icon.svg" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Seven戚 · 帖子广场</title>
<script src="./vendor/supabase.js"></script>
<script>window.supabase||document.write('<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"><\/script>');</script>
<script src="./vendor/purify.min.js"></script>
<script>window.DOMPurify||document.write('<script src="https://unpkg.com/dompurify@3/dist/purify.min.js"><\/script>');</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none}
:root{--bg:#f5faf5;--bg-card:#fff;--bg-input:#eaf3ea;--border:#c8e0c8;--text:#1e3a2e;--text-muted:#5a7a6a;--text-light:#8aaa9a;--primary:#2e7d32;--primary-light:#4caf50;--primary-bg:#e8f5e9;--shadow:0 8px 32px rgba(46,125,50,0.12);--radius:16px;--radius-sm:10px;--font:"Space Grotesk","PingFang SC","Segoe UI",system-ui,sans-serif;--danger:#e57373;--danger-bg:#ffebee;--danger-text:#c62828;--official-blue:#2b6cff;--success:#66bb6a;--success-bg:#e8f5e9;--warning:#ffa726;--warning-bg:#fff3e0}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);overflow:hidden}
#mainApp{display:flex;flex-direction:column;height:100vh;height:100dvh;background:var(--bg)}
.app-header{flex-shrink:0;padding:12px 20px;background:rgba(255,255,255,.92);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;z-index:50;min-height:56px}
.app-header .brand{font-weight:900;font-size:1.1em;color:var(--text);display:flex;align-items:center;gap:.4em;cursor:pointer}
.app-header .brand span{color:var(--primary)}
.app-header .brand small{font-weight:400;font-size:.55em;color:var(--text-muted);margin-left:.3em}
.app-header .user-area{display:flex;align-items:center;gap:10px;cursor:pointer;padding:4px 10px 4px 6px;border-radius:99px}
.app-header .avatar{width:32px;height:32px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;background-size:cover;background-position:center}
.app-header .user-name{font-weight:600;font-size:.85em;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.app-tabs{flex-shrink:0;display:flex;background:rgba(255,255,255,.96);border-top:1px solid var(--border);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));z-index:50}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;font-family:var(--font);font-size:.6em;font-weight:600;color:var(--text-muted);padding:4px 0;cursor:pointer;text-decoration:none;position:relative}
.tab-btn .tab-icon{font-size:1.6em;line-height:1.2;display:flex;align-items:center;justify-content:center;width:1.7em;height:1.7em}
.tab-btn .tab-icon svg{width:100%;height:100%;display:block;stroke:currentColor;fill:none}
.tab-btn.active{color:var(--primary)}
.tab-btn.active::after{content:'';position:absolute;top:-1px;left:30%;right:30%;height:3px;background:var(--primary);border-radius:0 0 4px 4px}
.banned-banner{flex-shrink:0;background:#ffebee;color:#c62828;padding:6px 16px;font-size:.8em;font-weight:600;text-align:center;border-bottom:1px solid #ffcdd2;display:none}
.banned-banner.active{display:block}
.app-content{flex:1;min-height:0;overflow-y:auto;padding:16px 20px}
.posts-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.posts-header .left{display:flex;gap:6px;align-items:center;overflow-x:auto;max-width:100%}
.category-btn{padding:4px 14px;border-radius:99px;border:1.5px solid var(--border);background:transparent;color:var(--text-muted);font-size:.7em;font-weight:600;cursor:pointer;white-space:nowrap}
.category-btn.active{background:var(--primary);border-color:var(--primary);color:#fff}
.new-post-btn{padding:6px 18px;border-radius:99px;border:none;background:var(--primary);color:#fff;font-weight:700;font-size:.75em;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.floating-post-btn{position:fixed;bottom:85px;right:20px;z-index:1000;width:56px;height:56px;border-radius:50%;background:var(--primary);color:#fff;border:none;box-shadow:0 4px 16px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none}
.floating-post-btn svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.post-card{background:var(--bg-card);border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:12px;border:1px solid var(--border);cursor:pointer;transition:box-shadow .2s}
.post-card:hover{box-shadow:var(--shadow)}
.post-card .post-author{display:flex;align-items:center;gap:10px;margin-bottom:2px;flex-wrap:wrap}
.post-card .post-author .avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;color:#fff;background:var(--primary);background-size:cover;background-position:center}
.post-card .post-author .name{font-weight:600;font-size:.9em}
.post-card .post-author .official-tag{background:var(--official-blue);color:#fff;font-size:.55em;padding:0 6px;border-radius:99px}
.post-card .post-author .category-tag{background:var(--primary-bg);color:var(--primary);font-size:.55em;font-weight:700;padding:0 8px;border-radius:99px;border:1px solid var(--border)}
.post-card .post-author .time{font-size:.7em;color:var(--text-muted);margin-left:auto}
.post-card .post-title{font-weight:700;font-size:1em;margin:4px 0 2px 0}
.post-card .post-content{font-size:.85em;color:var(--text);line-height:1.6;margin-bottom:6px;word-break:break-word}
.post-card .post-content img{max-width:100%;border-radius:8px;margin:6px 0}
.post-card .post-content.clamped{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.post-card .post-footer{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:.65em;color:var(--text-light);border-top:1px solid var(--border);padding-top:8px}
.post-card .post-footer .actions{display:flex;align-items:center;gap:8px}
.post-card .post-footer .actions button{background:none;border:none;cursor:pointer;color:inherit;font-size:inherit;display:inline-flex;align-items:center;gap:3px;padding:2px 4px;border-radius:4px}
.post-card .post-footer .actions .del-btn{color:var(--danger)}
.post-card .post-footer .actions .report-btn{color:var(--warning)}
.empty-state{text-align:center;color:var(--text-muted);padding:40px 20px}
.loading-state{text-align:center;padding:40px 20px}
.spinner{width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 24px;border-radius:99px;opacity:0;transition:.4s;z-index:9999;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(-10px)}
</style>
</head>
<body>
<div id="mainApp">
  <div id="header-container"></div>
  <div class="banned-banner" id="bannedBanner">账号已被封禁，无法发布新帖或评论。解封时间：<span id="bannedUntilDisplay"></span></div>
  <div class="app-content" id="postContent">
    <div class="posts-header">
      <div class="left" id="categoryFilter"><button class="category-btn active" data-cat="全部" onclick="setCategory('全部', this)">全部</button></div>
      <div style="display:flex;gap:6px;">
        <button class="new-post-btn" id="adminPanelBtn" style="display:none;background:var(--danger);" onclick="openAdminPanel()">管理</button>
        <a href="./new-post.html" class="new-post-btn" id="newPostBtn">发帖</a>
      </div>
    </div>
    <div id="postList"><div class="loading-state"><div class="spinner"></div>加载中...</div></div>
  </div>
  <div id="footer-container"></div>
</div>
<a href="./new-post.html" class="floating-post-btn" id="floatingPostBtn">
  <svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
</a>

<div id="toast"></div>

<script src="./common.js"></script>
<script>
// ==========================================
// 1. 基础依赖与身份验证
// ==========================================
if (!window.sb) {
  alert('Supabase 未加载，请检查 common.js');
}

function showToast(msg) {
    var t = document.getElementById('toast');
    if(!t) return;
    t.textContent = msg; t.classList.add('show');
    clearTimeout(window.toastTimer);
    window.toastTimer = setTimeout(function() { t.classList.remove('show'); }, 3000);
}
function escapeHtml(s) {
    if (!s) return '';
    return String(s).replace(/[&<>"']/g, function(c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
}
function getUserAvatar(user) {
    if (user && user.avatar_url) return user.avatar_url;
    var name = user ? user.nickname : 'U';
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="#2e7d32" rx="50"/><text x="50" y="58" font-size="40" text-anchor="middle" fill="white" font-family="sans-serif">' + name.charAt(0).toUpperCase() + '</text></svg>';
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

var currentUser = getSessionUser();
if (!currentUser || !currentUser.id) window.location.href = './index.html';
var isAdmin = (currentUser.is_admin === true);
if (isAdmin) document.getElementById('adminPanelBtn').style.display = 'inline-flex';

// 渲染头部和底部
renderHeader('帖子广场', 'posts');
renderFooter('posts');

// ==========================================
// 2. 数据拉取
// ==========================================
var categories = [];
var posts = [];
var currentCategory = '全部';
var commentCountMap = {};
var profilesMapCache = null;

async function fetchProfilesMap(force) {
    if (!force && profilesMapCache) return profilesMapCache;
    var r = await window.sb.from('public_profiles').select('id, nickname, avatar_url');
    if (r.error) return {}; // 容错
    var map = {};
    (r.data || []).forEach(function(u) { map[u.id] = u; });
    profilesMapCache = map;
    return map;
}

async function fetchCategories() {
    var res = await window.sb.from('categories').select('*').order('sort_order');
    return res.data || [];
}

async function fetchPosts() {
    var res = await window.sb.from('posts').select('*').order('created_at', { ascending: false });
    if (res.error) throw res.error;
    var data = res.data || [];
    try {
        var map = await fetchProfilesMap(true);
        data.forEach(function(r) { r.users = (r.user_id && map[r.user_id]) ? map[r.user_id] : null; });
    } catch (e) {}
    return data;
}

async function fetchAllCommentCounts() {
    var res = await window.sb.from('post_comments').select('post_id');
    if (!res.error) {
        commentCountMap = {};
        (res.data || []).forEach(function(c) { commentCountMap[c.post_id] = (commentCountMap[c.post_id] || 0) + 1; });
    }
}

// ==========================================
// 3. 渲染逻辑
// ==========================================
function renderCategoryFilter() {
    var container = document.getElementById('categoryFilter');
    var html = '<button class="category-btn active" data-cat="全部" onclick="setCategory(\'全部\', this)">全部</button>';
    categories.filter(function(x) { return x.name !== '未分类'; }).forEach(function(x) {
        html += '<button class="category-btn" data-cat="' + x.id + '" onclick="setCategory(' + x.id + ', this)">' + escapeHtml(x.name) + '</button>';
    });
    container.innerHTML = html;
}

function setCategory(cat, btn) {
    document.querySelectorAll('#categoryFilter .category-btn').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    currentCategory = cat;
    renderPosts();
}
window.setCategory = setCategory;

function renderPostContent(post) {
    var html = '';
    if (post.content && post.content.includes('<')) {
        if (window.DOMPurify) html = DOMPurify.sanitize(post.content);
        else html = '<div style="white-space:pre-wrap;">' + escapeHtml(post.content) + '</div>';
    } else {
        html = '<div style="white-space:pre-wrap;">' + escapeHtml(post.content || '') + '</div>';
    }
    if (post.image_url && !html.includes('<img')) html += '<img src="' + escapeHtml(post.image_url) + '" style="max-width:100%;border-radius:8px;margin-top:6px;" />';
    return html;
}

async function renderPosts() {
    var list = document.getElementById('postList');
    var filtered = posts.filter(function(p) {
        return currentCategory === '全部' || p.category_id === currentCategory;
    });
    if (!filtered.length) { list.innerHTML = '<div class="empty-state">暂无帖子</div>'; return; }
    
    var html = '';
    for (var i = 0; i < filtered.length; i++) {
        var p = filtered[i];
        var user = p.users || null;
        var name = user ? user.nickname : (p.author || '匿名');
        var avatar = user ? (user.avatar_url || getUserAvatar(user)) : getUserAvatar({ nickname: p.author });
        var time = new Date(p.created_at).toLocaleString('zh-CN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        var catName = '';
        if (p.category_id) {
            var _cat = categories.find(function(c) { return c.id === p.category_id; });
            if (_cat && _cat.name && _cat.name !== '未分类') catName = _cat.name;
        }
        var content = renderPostContent(p);
        var raw = p.content ? p.content.replace(/<[^>]*>/g, '') : '';
        var clamped = raw.length > 150;
        var commentCount = commentCountMap[p.id] || 0;
        var canDelete = isAdmin || (currentUser && currentUser.id === p.user_id);

        var delBtn = canDelete ? '<button class="del-btn" data-action="delete" data-id="' + p.id + '">删除</button>' : '';
        var reportBtn = '';
        if (currentUser && currentUser.id !== p.user_id && p.user_id) {
            var snapshot = ((p.title || '') + ' ' + (p.content || '').replace(/<[^>]*>/g, '')).substring(0, 200);
            reportBtn = '<button class="report-btn" data-action="report" data-id="' + p.id + '" data-uid="' + p.user_id + '" data-snapshot="' + escapeHtml(snapshot) + '">举报</button>';
        }

        html += '<div class="post-card" data-postid="' + p.id + '">';
        html += '<div class="post-author">';
        html += '<div class="avatar" style="' + (avatar && avatar.startsWith('http') ? 'background-image:url(' + avatar + ');background-size:cover;background-position:center;' : '') + '">' + (avatar && !avatar.startsWith('http') ? name.charAt(0).toUpperCase() : '') + '</div>';
        html += '<span class="name">' + escapeHtml(name) + '</span>';
        if (p.is_official) html += '<span class="official-tag">官方</span>';
        if (catName) html += '<span class="category-tag">' + escapeHtml(catName) + '</span>';
        html += '<span class="time">' + time + '</span>';
        html += '</div>';
        if (p.title) html += '<div class="post-title">' + escapeHtml(p.title) + '</div>';
        html += '<div class="post-content ' + (clamped ? 'clamped' : '') + '">' + content + '</div>';
        html += '<div class="post-footer">';
        html += '<span class="comment-count">评论 ' + commentCount + '</span>';
        html += '<div class="actions">' + reportBtn + delBtn + '</div>';
        html += '</div></div>';
    }
    list.innerHTML = html;

    list.querySelectorAll('.report-btn').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
            e.stopPropagation();
            openReportDialog(this.dataset.uid, 'post', this.dataset.id, this.dataset.snapshot);
        });
    });
    list.querySelectorAll('.del-btn').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
            e.stopPropagation();
            if(confirm('确定删除这篇帖子吗？')) {
                window.sb.from('posts').delete().eq('id', this.dataset.id).then(function(r){
                    if(r.error) showToast('删除失败');
                    else { showToast('已删除'); loadAll(); }
                });
            }
        });
    });
}

// ==========================================
// 4. 初始化
// ==========================================
async function loadAll() {
    document.getElementById('postList').innerHTML = '<div class="loading-state"><div class="spinner"></div>加载中...</div>';
    try {
        categories = await fetchCategories();
        renderCategoryFilter();
        posts = await fetchPosts();
        await fetchAllCommentCounts();
        await renderPosts();
    } catch (e) {
        document.getElementById('postList').innerHTML = '<div class="empty-state">加载失败：' + escapeHtml(e.message) + '</div>';
    }
}

// 启动
loadAll();

// 监听封号状态
window.addEventListener('sq-ban-changed', function(e){
    if(e.detail && e.detail.banned_until) {
        document.getElementById('bannedBanner').classList.add('active');
    }
});
</script>
</body>
</html>
