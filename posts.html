<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#2e7d32" />
    <link rel="apple-touch-icon" href="./icon.svg" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Seven戚 · 帖子广场</title>
<script src="./vendor/supabase.js"></script>
<script>window.supabase||document.write('<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"><\/script>');</script>
<script src="./vendor/purify.min.js"></script>
<script>window.DOMPurify||document.write('<script src="https://unpkg.com/dompurify@3/dist/purify.min.js"><\/script>');</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none}
:root{--bg:#f5faf5;--bg-card:#fff;--bg-input:#eaf3ea;--border:#c8e0c8;--text:#1e3a2e;--text-muted:#5a7a6a;--text-light:#8aaa9a;--primary:#2e7d32;--primary-light:#4caf50;--primary-bg:#e8f5e9;--shadow:0 8px 32px rgba(46,125,50,0.12);--radius:16px;--radius-sm:10px;--font:"Space Grotesk","PingFang SC","Segoe UI",system-ui,sans-serif;--danger:#e57373;--danger-bg:#ffebee;--danger-text:#c62828;--official-blue:#2b6cff;--success:#66bb6a;--success-bg:#e8f5e9;--warning:#ffa726;--warning-bg:#fff3e0}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);overflow:hidden}
#mainApp{display:flex;flex-direction:column;height:100vh;height:100dvh;background:var(--bg)}
.app-header{flex-shrink:0;padding:12px 20px;background:rgba(255,255,255,.92);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;z-index:50;min-height:56px}
.app-header .brand{font-weight:900;font-size:1.1em;color:var(--text);display:flex;align-items:center;gap:.4em}
.app-header .brand span{color:var(--primary)}
.app-header .brand small{font-weight:400;font-size:.55em;color:var(--text-muted);margin-left:.3em}
.app-header .user-area{display:flex;align-items:center;gap:10px;cursor:pointer;padding:4px 10px 4px 6px;border-radius:99px}
.app-header .avatar{width:32px;height:32px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;background-size:cover;background-position:center}
.app-header .user-name{font-weight:600;font-size:.85em;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.app-header .chevron{color:var(--text-muted);font-size:.7em}
.app-tabs{flex-shrink:0;display:flex;background:rgba(255,255,255,.96);border-top:1px solid var(--border);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));z-index:50}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;font-family:var(--font);font-size:.6em;font-weight:600;color:var(--text-muted);padding:4px 0;cursor:pointer;text-decoration:none;position:relative}
.tab-btn .tab-icon{font-size:1.6em;line-height:1.2;display:flex;align-items:center;justify-content:center;width:1.7em;height:1.7em}
.tab-btn .tab-icon svg{width:100%;height:100%;display:block;stroke:currentColor;fill:none}
.tab-btn.active{color:var(--primary)}
.tab-btn.active::after{content:'';position:absolute;top:-1px;left:30%;right:30%;height:3px;background:var(--primary);border-radius:0 0 4px 4px}
.tab-btn .badge{position:absolute;top:-2px;right:15%;background:#e57373;color:#fff;font-size:.6em;font-weight:700;padding:1px 6px;border-radius:99px;min-width:16px;text-align:center}
.banned-banner{flex-shrink:0;background:#ffebee;color:#c62828;padding:6px 16px;font-size:.8em;font-weight:600;text-align:center;border-bottom:1px solid #ffcdd2;display:none}
.banned-banner.active{display:block}
.app-content{flex:1;min-height:0;overflow-y:auto;padding:16px 20px}
.posts-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.posts-header .left{display:flex;gap:6px;align-items:center;overflow-x:auto;max-width:100%}
.category-btn{padding:4px 14px;border-radius:99px;border:1.5px solid var(--border);background:transparent;color:var(--text-muted);font-size:.7em;font-weight:600;cursor:pointer;white-space:nowrap}
.category-btn.active{background:var(--primary);border-color:var(--primary);color:#fff}
.new-post-btn{padding:6px 18px;border-radius:99px;border:none;background:var(--primary);color:#fff;font-weight:700;font-size:.75em;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.floating-post-btn{position:fixed;bottom:85px;right:20px;z-index:1000;width:56px;height:56px;border-radius:50%;background:var(--primary);color:#fff;border:none;box-shadow:0 4px 16px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none}
.floating-post-btn svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.post-card{background:var(--bg-card);border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:12px;border:1px solid var(--border);cursor:pointer;transition:box-shadow .2s}
.post-card:hover{box-shadow:var(--shadow)}
.post-card .post-author{display:flex;align-items:center;gap:10px;margin-bottom:2px;flex-wrap:wrap}
.post-card .post-author .avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;color:#fff;background:var(--primary);background-size:cover;background-position:center}
.post-card .post-author .name{font-weight:600;font-size:.9em}
.post-card .post-author .official-tag{background:var(--official-blue);color:#fff;font-size:.55em;padding:0 6px;border-radius:99px}
.post-card .post-author .role-tag{color:#fff;font-size:.55em;padding:0 6px;border-radius:99px}
.post-card .post-author .category-tag{background:var(--primary-bg);color:var(--primary);font-size:.55em;font-weight:700;padding:0 8px;border-radius:99px;border:1px solid var(--border)}
/* 迷你资料卡 */
.mini-card{position:fixed;z-index:8000;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.18);padding:14px;width:230px;display:none;animation:miniIn .16s ease}
.mini-card.show{display:block}
@keyframes miniIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.mini-card .mc-top{display:flex;gap:10px;align-items:center;cursor:pointer}
.mini-card .mc-avatar{width:44px;height:44px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px;flex-shrink:0;background-size:cover;background-position:center}
.mini-card .mc-name{font-weight:700;font-size:.95em;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mini-card .mc-no{font-size:.68em;color:var(--text-light);margin-top:2px}
.mini-card .mc-bio{font-size:.78em;color:var(--text-muted);margin-top:10px;line-height:1.5;max-height:44px;overflow:hidden}
.mini-card .mc-go{margin-top:10px;font-size:.72em;color:var(--primary);font-weight:700;text-align:center;padding-top:8px;border-top:1px solid var(--border)}
.detail-post .post-author .role-tag{color:#fff;font-size:.55em;padding:0 6px;border-radius:99px}
.detail-comments .comment-item .meta .role-tag{color:#fff;font-size:.5em;padding:0 4px;border-radius:99px}
.post-card .post-author .time{font-size:.7em;color:var(--text-muted);margin-left:auto}
.post-card .post-title{font-weight:700;font-size:1em;margin:4px 0 2px 0}
.post-card .post-content{font-size:.85em;color:var(--text);line-height:1.6;margin-bottom:6px;word-break:break-word}
.post-card .post-content img{max-width:100%;border-radius:8px;margin:6px 0}
.post-card .post-content.clamped{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.post-card .post-content .expand-link{color:var(--official-blue);font-weight:600;cursor:pointer;margin-left:4px;text-decoration:underline}
.post-card .post-footer{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:.65em;color:var(--text-light);border-top:1px solid var(--border);padding-top:8px}
.post-card .post-footer .comment-count{cursor:pointer}
.post-card .post-footer .actions{display:flex;align-items:center;gap:8px}
.post-card .post-footer .actions button{background:none;border:none;cursor:pointer;color:inherit;font-size:inherit;display:inline-flex;align-items:center;gap:3px;padding:2px 4px;border-radius:4px}
.post-card .post-footer .actions .del-btn{color:var(--danger)}
.post-card .post-footer .actions .report-btn{color:var(--warning)}
.post-card .post-footer .actions .report-btn:hover{background:var(--warning-bg)}
.post-card .post-footer .actions .del-btn:hover{background:var(--danger-bg)}
.detail-overlay,.admin-panel-overlay{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:999}
.detail-overlay.active,.admin-panel-overlay.active{display:flex}
.detail-header,.admin-panel-header{display:flex;align-items:center;padding:12px 16px;background:var(--bg-card);border-bottom:1px solid var(--border);flex-shrink:0;gap:8px}
.detail-header .back-btn,.admin-panel-header .back-btn{background:none;border:none;cursor:pointer;padding:4px;color:var(--text);display:flex}
.detail-header .back-btn svg,.admin-panel-header .back-btn svg{width:22px;height:22px}
.detail-content,.admin-panel-content{flex:1;overflow-y:auto;padding:16px 20px}
.detail-post{margin-bottom:16px;border-bottom:1px solid var(--border);padding-bottom:12px}
.detail-post .post-author{display:flex;align-items:center;gap:10px;margin-bottom:4px;flex-wrap:wrap}
.detail-post .post-author .avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;color:#fff;background:var(--primary);background-size:cover;background-position:center}
.detail-post .post-author .name{font-weight:600;font-size:.9em}
.detail-post .post-author .official-tag{background:var(--official-blue);color:#fff;font-size:.55em;padding:0 6px;border-radius:99px}
.detail-post .post-author .time{font-size:.7em;color:var(--text-muted);margin-left:auto}
.detail-post .post-author .report-btn-detail{background:none;border:none;color:var(--warning);cursor:pointer;font-size:.7em;display:inline-flex;align-items:center;gap:3px;padding:4px 8px;border-radius:99px;font-family:inherit}
.detail-post .post-author .report-btn-detail:hover{background:var(--warning-bg)}
.detail-post .post-author .report-btn-detail svg{width:14px;height:14px}
.detail-post .post-title{font-weight:700;font-size:1.1em;margin:4px 0 2px 0}
.detail-post .post-content{font-size:.95em;color:var(--text);line-height:1.6;word-break:break-word}
.detail-post .post-content img{max-width:100%;border-radius:8px;margin:6px 0}
.detail-comments{flex:1;margin-top:8px}
.detail-comments .comment-item{display:flex;gap:10px;padding:10px 4px;border-bottom:1px solid var(--border)}
.detail-comments .comment-item.highlight{background:var(--primary-bg);border:2px solid var(--primary);border-radius:8px}
.detail-comments .comment-item .avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff;background:var(--primary);background-size:cover;background-position:center}
.detail-comments .comment-item .body{flex:1}
.detail-comments .comment-item .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.detail-comments .comment-item .meta .name{font-weight:600;font-size:.85em}
.detail-comments .comment-item .meta .official-tag{background:var(--official-blue);color:#fff;font-size:.5em;padding:0 4px;border-radius:99px}
.detail-comments .comment-item .meta .time{font-size:.65em;color:var(--text-muted)}
.detail-comments .comment-item .txt{font-size:.85em;line-height:1.5;margin-top:2px}
.detail-input-area{display:flex;gap:8px;padding:12px 16px;background:var(--bg-card);border-top:1px solid var(--border);flex-shrink:0}
.detail-input-area input{flex:1;padding:10px;border-radius:99px;border:2px solid var(--border);font-family:inherit;font-size:.85em;outline:none}
.detail-input-area button{padding:10px 20px;border-radius:99px;border:none;background:var(--primary);color:#fff;font-weight:700;cursor:pointer;font-family:inherit}
.poll-container{margin:16px 0;padding:16px;background:#f8faf8;border-radius:12px;border:1px solid var(--border)}
.poll-option{margin-bottom:12px}
.poll-option-header{display:flex;justify-content:space-between;font-size:.85em}
.poll-option-bar{display:flex;align-items:center;gap:8px}
.poll-option-progress{flex:1;height:20px;background:var(--primary-bg);border-radius:10px;overflow:hidden}
.poll-option-fill{height:100%;background:var(--primary)}
.poll-option-vote-btn{padding:2px 8px;background:var(--primary);color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:.7em}
.empty-state{text-align:center;color:var(--text-muted);padding:40px 20px}
.loading-state{text-align:center;padding:40px 20px}
.spinner{width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 24px;border-radius:99px;opacity:0;transition:.4s;z-index:9999;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(-10px)}
.custom-modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:2000;padding:20px}
.custom-modal.active{display:flex}
.modal-box{background:var(--bg-card);padding:24px;border-radius:var(--radius);max-width:400px;width:100%;box-shadow:var(--shadow)}
.modal-title{font-size:1.2em;font-weight:700;margin-bottom:8px}
.modal-body{font-size:.95em;color:var(--text-muted);line-height:1.6;margin-bottom:16px;white-space:pre-wrap}
.modal-body p{margin-bottom:8px}
.modal-body input{width:100%;padding:8px 12px;border-radius:var(--radius-sm);border:2px solid var(--border);font-family:inherit;font-size:.9em;outline:none;box-sizing:border-box}
.modal-actions{display:flex;gap:8px;justify-content:flex-end}
.modal-actions button{padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-weight:600;font-family:inherit}
.btn-danger{background:var(--danger);color:#fff}
.btn-secondary{background:var(--bg-input);color:var(--text-muted)}
.btn-primary{background:var(--primary);color:#fff}
.admin-panel-content{padding:16px 20px 32px}
/* 管理面板 Tab */
.admin-tabs{display:flex;gap:6px;padding:10px 16px 0;background:var(--bg-card);border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto}
.admin-tab{padding:9px 18px;border:none;background:none;font-family:inherit;font-size:.85em;font-weight:700;color:var(--text-muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.admin-tab.active{color:var(--primary);border-bottom-color:var(--primary)}
/* 折叠块 */
.admin-collapse{margin-bottom:14px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden}
.admin-collapse-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;cursor:pointer;font-weight:700;font-size:.9em;user-select:none}
.admin-collapse-head svg{width:16px;height:16px;transition:transform .2s}
.admin-collapse.open .admin-collapse-head svg{transform:rotate(180deg)}
.admin-collapse-body{display:none;padding:0 16px 14px}
.admin-collapse.open .admin-collapse-body{display:block}
/* 用户搜索 */
.admin-search{margin-bottom:12px}
.admin-search input{width:100%;padding:10px 14px;border-radius:10px;border:2px solid var(--border);font-family:inherit;font-size:.85em;outline:none;box-sizing:border-box}
.admin-search input:focus{border-color:var(--primary)}
.admin-panel-content h3{font-size:1em;font-weight:700;margin:20px 0 12px 0}
.admin-panel-content h3:first-of-type{margin-top:0}
.admin-user-card{background:var(--bg-card);border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:10px;border:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.admin-user-card .user-main{display:flex;align-items:center;gap:14px;min-width:0;flex:1}
.admin-user-card .user-avatar{width:44px;height:44px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px;flex-shrink:0;background-size:cover;background-position:center}
.admin-user-card .user-info{min-width:0;flex:1}
.admin-user-card .user-info .name-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.admin-user-card .user-info .name-row .nickname{font-weight:700;font-size:.95em}
.admin-user-card .user-info .name-row .role-badge{font-size:.55em;padding:0 8px;border-radius:99px;color:#fff;line-height:18px;font-weight:600}
.admin-user-card .user-info .name-row .status-badge{font-size:.55em;padding:0 8px;border-radius:99px;line-height:18px;font-weight:600}
.admin-user-card .user-info .name-row .status-badge.normal{background:var(--success-bg);color:var(--success)}
.admin-user-card .user-info .name-row .status-badge.banned{background:var(--danger-bg);color:var(--danger-text)}
.admin-user-card .user-info .phone-row{font-size:.75em;color:var(--text-muted);margin-top:2px}
.admin-user-card .user-actions{display:flex;gap:6px;flex-wrap:wrap;flex-shrink:0}
.admin-user-card .user-actions button{padding:5px 14px;border-radius:99px;border:none;font-weight:600;font-size:.7em;cursor:pointer;display:inline-flex;align-items:center;gap:4px;font-family:inherit;white-space:nowrap}
.admin-user-card .user-actions .btn-ban{background:var(--danger-bg);color:var(--danger-text)}
.admin-user-card .user-actions .btn-unban{background:var(--success-bg);color:var(--success)}
.admin-user-card .user-actions .btn-login{background:var(--primary-bg);color:var(--primary)}
/* 身份批量发放 */
.role-user-list{max-height:260px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;padding:6px;margin-bottom:12px}
.role-user-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:.85em}
.role-user-item:hover{background:var(--bg-input)}
.role-user-item input{flex-shrink:0}
.role-user-item span:first-of-type{flex:1}
.role-batch-btn{width:100%;padding:11px;border:none;border-radius:10px;background:var(--primary);color:#fff;font-weight:700;font-family:inherit;font-size:.85em;cursor:pointer}
.role-ids-input{width:100%;box-sizing:border-box;min-height:70px;padding:10px;border:2px solid var(--border);border-radius:8px;font-family:inherit;font-size:.8em;outline:none;resize:vertical;margin-bottom:8px}
.btn-role{background:var(--primary-bg);color:var(--primary)}
.admin-user-card .user-actions .btn-role{background:var(--primary-bg);color:var(--primary)}
.admin-user-card .user-actions .btn-coin{background:linear-gradient(135deg,#fff7e0,#ffe9b0);color:#a67c00}
.admin-cat-item,.admin-role-item{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;margin-bottom:6px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);flex-wrap:wrap;gap:8px}
.admin-cat-item .cat-info,.admin-role-item .role-info{display:flex;align-items:center;gap:10px}
.admin-cat-item .cat-actions,.admin-role-item .role-actions{display:flex;gap:4px;flex-wrap:wrap}
.admin-cat-item .cat-actions button,.admin-role-item .role-actions button{padding:4px 12px;border-radius:99px;border:1px solid var(--border);background:var(--bg-card);color:var(--text-muted);cursor:pointer;font-size:.7em;font-weight:600;font-family:inherit}
.admin-add-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.admin-add-row input{flex:1;padding:8px 12px;border-radius:8px;border:2px solid var(--border);font-family:inherit;font-size:.85em;outline:none;min-width:100px}
.admin-add-row button{padding:8px 16px;border-radius:8px;border:none;background:var(--primary);color:#fff;font-weight:700;cursor:pointer;font-family:inherit}
@media(max-width:480px){.app-content{padding:12px 14px}.floating-post-btn{bottom:75px;right:16px;width:50px;height:50px}.admin-user-card{padding:12px 14px}.admin-user-card .user-avatar{width:36px;height:36px;font-size:14px}}
</style>
</head>
<body>
<div id="mainApp">
<div id="header-container"></div>
<div class="banned-banner" id="bannedBanner">账号已被封禁，无法发布新帖或评论。解封时间：<span id="bannedUntilDisplay"></span></div>
<div class="app-content" id="postContent">
<div class="posts-header">
<div class="left" id="categoryFilter"><button class="category-btn active" data-cat="全部" onclick="setCategory('全部', this)">全部</button></div>
<div style="display:flex;gap:6px;">
<button class="new-post-btn" id="adminPanelBtn" style="display:none;background:var(--danger);" onclick="openAdminPanel()">管理</button>
<a href="./new-post.html" class="new-post-btn" id="newPostBtn">发帖</a>
</div>
</div>
<div id="postList"><div class="loading-state"><div class="spinner"></div>加载中...</div></div>
</div>
<div id="footer-container"></div>
</div>
<a href="./new-post.html" class="floating-post-btn" id="floatingPostBtn">
<svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
</a>

<div class="detail-overlay" id="detailOverlay">

window.pushNotification = window.pushNotification || async function(userId, payload) {
    if (!window.sb || !userId) return;
    try {
        await window.sb.from('notifications').insert([Object.assign({ user_id: userId, is_read: false }, payload)]);
        if (typeof updateNotificationBadge === 'function') updateNotificationBadge();
    } catch (e) { console.warn('通知发送失败', e); }
};

window.openReportDialog = window.openReportDialog || function(reportedUserId, contentType, contentId, contentSnapshot) {
    var old = document.getElementById('reportOverlay');
    if (old) old.remove();
    var overlay = document.createElement('div');
    overlay.className = 'report-overlay';
    overlay.id = 'reportOverlay';
    var typeText = { post: '帖子', comment: '评论', message: '留言', chat: '聊天消息' }[contentType] || '内容';
    overlay.innerHTML =
        '<div class="report-panel">' +
        '<div class="report-header"><h3><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#e57373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>举报' + typeText + '</h3><button class="report-close" onclick="closeReportDialog()">✕</button></div>' +
        '<div class="report-body">' +
        '<div class="report-field"><label>举报原因（必选）</label><div class="report-reasons">' +
        '<label class="report-reason-option"><input type="radio" name="reportReason" value="色情低俗"> 色情低俗</label>' +
        '<label class="report-reason-option"><input type="radio" name="reportReason" value="骚扰辱骂"> 骚扰辱骂</label>' +
        '<label class="report-reason-option"><input type="radio" name="reportReason" value="垃圾广告"> 垃圾广告</label>' +
        '<label class="report-reason-option"><input type="radio" name="reportReason" value="虚假信息"> 虚假信息</label>' +
        '<label class="report-reason-option"><input type="radio" name="reportReason" value="政治敏感"> 政治敏感</label>' +
        '<label class="report-reason-option"><input type="radio" name="reportReason" value="其他"> 其他</label>' +
        '</div></div>' +
        '<div class="report-field"><label>补充说明（选填）</label><textarea id="reportDescription" placeholder="请描述具体情况..." maxlength="500"></textarea></div>' +
        '<div class="report-field"><label>被举报内容预览</label><div class="report-preview">' + (contentSnapshot ? escapeHtml(String(contentSnapshot)) : '(无内容)') + '</div></div>' +
        '</div>' +
        '<div class="report-footer"><button class="report-cancel" onclick="closeReportDialog()">取消</button>' +
        '<button class="report-submit" id="reportSubmitBtn">提交举报</button></div>' +
        '</div>';
    document.body.appendChild(overlay);
    document.getElementById('reportSubmitBtn').onclick = async function() {
        var r = document.querySelector('input[name="reportReason"]:checked');
        if (!r) { alert('请选择举报原因'); return; }
        var d = document.getElementById('reportDescription');
        var desc = d ? d.value.trim() : '';
        try {
            var cu = JSON.parse(localStorage.getItem('sq_user_session') || '{}');
            if (!cu.id) { alert('请先登录'); return; }
            var ins = await window.sb.from('reports').insert([{
                reporter_id: cu.id, reported_user_id: reportedUserId,
                content_type: contentType, content_id: contentId,
                content_snapshot: contentSnapshot, reason: r.value, description: desc
            }]).select();
            if (ins.error) throw ins.error;
            var adm = await window.sb.rpc('get_admin_id');
            if (adm.data) {
                await window.pushNotification(adm.data, {
                    type: 'report', notification_type: 'report',
                    report_id: ins.data[0].id, report_reason: r.value,
                    extra_text: contentSnapshot ? String(contentSnapshot).substring(0,100) : ''
                });
            }
            closeReportDialog();
            alert('举报已提交，管理员会尽快处理');
        } catch (err) { alert('举报失败：' + err.message); }
    };
    if (!document.getElementById('report-dialog-styles')) {
        var s = document.createElement('style');
        s.id = 'report-dialog-styles';
        s.textContent = '.report-overlay{position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:20px}' +
        '.report-panel{background:#fff;border-radius:16px;max-width:460px;width:100%;max-height:85vh;display:flex;flex-direction:column;overflow:hidden}' +
        '.report-header{display:flex;justify-content:space-between;align-items:center;padding:18px 20px 12px;border-bottom:1px solid #e8f0e8}' +
        '.report-header h3{font-size:1.05em;margin:0;display:flex;align-items:center;gap:8px}.report-close{background:none;border:none;font-size:1.3em;cursor:pointer;color:#8aaa9a}' +
        '.report-body{padding:16px 20px;overflow-y:auto;flex:1}.report-field{margin-bottom:14px}' +
        '.report-field label{display:block;font-size:.75em;font-weight:600;color:#5a7a6a;margin-bottom:6px}' +
        '.report-reasons{display:grid;grid-template-columns:1fr 1fr;gap:6px}' +
        '.report-reason-option{display:flex;align-items:center;gap:6px;padding:8px 10px;border:1.5px solid #c8e0c8;border-radius:8px;font-size:.85em;cursor:pointer}' +
        '.report-field textarea{width:100%;padding:10px;border:2px solid #c8e0c8;border-radius:10px;font-family:inherit;font-size:.85em;outline:none;min-height:70px;box-sizing:border-box}' +
        '.report-preview{background:#f5faf5;border:1px solid #e0e0e0;border-radius:8px;padding:10px;font-size:.8em;color:#5a7a6a;max-height:80px;overflow:hidden}' +
        '.report-footer{display:flex;gap:8px;padding:12px 20px 18px;border-top:1px solid #e8f0e8}' +
        '.report-footer button{flex:1;padding:10px;border-radius:10px;border:none;font-weight:700;font-size:.9em;cursor:pointer}' +
        '.report-cancel{background:#eaf3ea;color:#5a7a6a}.report-submit{background:#e57373;color:#fff}';
        document.head.appendChild(s);
    }
};

function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(window.toastTimer);
    window.toastTimer = setTimeout(function() { t.classList.remove('show'); }, 3000);
}
function escapeHtml(s) {
    if (!s) return '';
    return String(s).replace(/[&<>"']/g, function(c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
}
function showConfirm(title, body, onOk) {
    var m = document.getElementById('confirmModal');
    document.getElementById('confirmTitle').textContent = title;
    document.getElementById('confirmBody').textContent = body;
    m.classList.add('active');
    var cancel = document.getElementById('confirmCancel');
    var ok = document.getElementById('confirmOk');
    var cleanup = function() { m.classList.remove('active'); cancel.onclick = null; ok.onclick = null; };
    cancel.onclick = cleanup;
    ok.onclick = function() { if (onOk) onOk(); cleanup(); };
}
function showPrompt(title, msg, placeholder, onOk, inputType) {
    inputType = inputType || 'text';
    var m = document.getElementById('promptModal');
    document.getElementById('promptTitle').textContent = title;
    document.getElementById('promptMessage').textContent = msg;
    var input = document.getElementById('promptInput');
    input.type = inputType; input.value = ''; input.placeholder = placeholder || '';
    m.classList.add('active'); input.focus();
    var cancel = document.getElementById('promptCancel');
    var ok = document.getElementById('promptOk');
    var cleanup = function() { m.classList.remove('active'); cancel.onclick = null; ok.onclick = null; input.onkeydown = null; };
    cancel.onclick = cleanup;
    ok.onclick = function() { var val = input.value.trim(); if (onOk) onOk(val); cleanup(); };
    input.onkeydown = function(e) { if (e.key === 'Enter') ok.click(); };
}
function getUserAvatar(user) {
    if (user && user.avatar_url) return user.avatar_url;

    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

async function fetchCategories() {
    var res = await window.sb.from('categories').select('*').order('sort_order');
    if (res.error) throw res.error;
    return res.data || [];
}
async function addCategory(name, isPublic) {
    var maxOrder = categories.reduce(function(m, c) { return Math.max(m, c.sort_order || 0); }, 0);
    await window.sb.from('categories').insert([{ name: name, sort_order: maxOrder + 1, is_public: isPublic }]);
}
async function updateCategory(id, updates) { await window.sb.from('categories').update(updates).eq('id', id); }
async function deleteCategory(id) {
    var uncat = categories.find(function(c) { return c.name === '未分类'; });
    if (uncat) await window.sb.from('posts').update({ category_id: uncat.id }).eq('category_id', id);
    await window.sb.from('categories').delete().eq('id', id);
}
async function swapCategoryOrder(id1, id2) {
    var c1 = categories.find(function(c) { return c.id === id1; });
    var c2 = categories.find(function(c) { return c.id === id2; });
    if (!c1 || !c2) return;
    var temp = c1.sort_order;
    await window.sb.from('categories').update({ sort_order: c2.sort_order }).eq('id', id1);
    await window.sb.from('categories').update({ sort_order: temp }).eq('id', id2);
}
// 加固后 users 表只允许读自己，作者昵称头像改从 public_profiles 视图补全
var profilesMapCache = null;
async function fetchProfilesMap(force) {
    if (!force && profilesMapCache) return profilesMapCache;
    var r = await window.sb.from('public_profiles').select('id, nickname, avatar_url');
    if (r.error) throw r.error;
    var map = {};
    (r.data || []).forEach(function(u) { map[u.id] = u; });
    profilesMapCache = map;
    return map;
}
async function attachProfiles(rows, key, force) {
    key = key || 'user_id';
    if (!rows || !rows.length) return rows;
    var map = await fetchProfilesMap(!!force);
    rows.forEach(function(r) {
        r.users = (r[key] && map[r[key]]) ? map[r[key]] : null;
    });
    return rows;
}
async function fetchPosts() {
    var res = await window.sb.from('posts').select('*').order('created_at', { ascending: false });
    if (res.error) throw res.error;
    var data = res.data || [];
    try { await attachProfiles(data, 'user_id', true); } catch (e) { /* 降级：无昵称 */ }
    return data;
}
async function fetchComments(postId) {
    var res = await window.sb.from('post_comments').select('*').eq('post_id', postId).order('created_at', { ascending: true });
    if (res.error) throw res.error;
    var list = res.data || [];
    try {
        var map = await fetchProfilesMap(false);
        list.forEach(function(c){
            c.users = (c.user_id && map[c.user_id]) ? map[c.user_id] : null;
            c.reply_to = (c.reply_to_user_id && map[c.reply_to_user_id]) ? map[c.reply_to_user_id] : null;
            c.reply_to_name = c.reply_to ? c.reply_to.nickname : '';
        });
    } catch (e) {
        list.forEach(function(c){ c.reply_to_name = ''; });
    }
    return list;
}
async function fetchAllCommentCounts() {
    var res = await window.sb.from('post_comments').select('post_id');
    if (!res.error) {
        commentCountMap = {};
        (res.data || []).forEach(function(c) { commentCountMap[c.post_id] = (commentCountMap[c.post_id] || 0) + 1; });
    }
}
async function addComment(postId, author, user_id, content, parentId, replyToUserId, replyToName) {
    var row = { post_id: postId, author: author, user_id: user_id, content: content };
    if (parentId) row.parent_id = parentId;
    if (replyToUserId) row.reply_to_user_id = replyToUserId;
    const { data: commentData, error: commentError } = await window.sb.from('post_comments').insert([row]).select('id');
    if (commentError) throw commentError;
    const commentId = commentData[0].id;
    const { data: postData } = await window.sb.from('posts').select('user_id').eq('id', postId).single();
    var notified = {};
    // 通知帖子作者（顶层评论 or 回复时也通知作者，但不重复通知同一个人）
    if (postData && postData.user_id && postData.user_id !== user_id) {
        await window.sb.from('notifications').insert([{
            user_id: postData.user_id, type: 'comment', notification_type: 'comment',
            source_id: commentId, post_id: postId, comment_author_id: user_id,
            comment_content: content, extra_text: (replyToName ? '回复 @' + replyToName + '：' : '') + content, is_read: false
        }]);
        notified[postData.user_id] = true;
    }
    // 通知被回复者（若不是自己、且没在上面通知过）
    if (replyToUserId && replyToUserId !== user_id && !notified[replyToUserId]) {
        await window.sb.from('notifications').insert([{
            user_id: replyToUserId, type: 'comment', notification_type: 'comment',
            source_id: commentId, post_id: postId, comment_author_id: user_id,
            comment_content: content, extra_text: author + ' 回复了你：' + content, is_read: false
        }]);
    }
    if (typeof updateNotificationBadge === 'function') updateNotificationBadge();
    return commentData;
}

var miniCardEl = document.getElementById("miniCard");
var miniTimer = null;
var isTouch = ("ontouchstart" in window);
var miniOpenFor = null;

function showMiniCard(anchor, uid, name, avatar){
  if(!uid) return;
  miniOpenFor = uid;
  var role = globalRoleMap[uid];
  var roleHtml = role ? '<span class="role-tag" style="background:'+role.role_color+'">'+escapeHtml(role.role_name)+'</span>' : "";
  var avStyle = (avatar && avatar.indexOf("http")===0) ? 'background-image:url('+avatar+');background-size:cover;background-position:center;' : "";
  var avText = (avatar && avatar.indexOf("http")===0) ? "" : escapeHtml(String(name||"U").charAt(0).toUpperCase());
  miniCardEl.innerHTML = '<div class="mc-top" data-uid="'+uid+'">'+
    '<div class="mc-avatar" style="'+avStyle+'">'+avText+'</div>'+
    '<div><div class="mc-name">'+escapeHtml(name||"")+roleHtml+'</div><div class="mc-no">加载中…</div></div></div>'+
    '<div class="mc-bio">加载中…</div>'+
    '<div class="mc-go">点击查看主页 ›</div>';
  miniCardEl.classList.add("show");
  // 定位（头像右边一点）
  var r = anchor.getBoundingClientRect();
  var left = r.right + 10;
  var top = r.top;
  if(left + 240 > window.innerWidth) left = r.left - 240;
  if(top + 200 > window.innerHeight) top = window.innerHeight - 210;
  if(top < 8) top = 8;
  miniCardEl.style.left = left + "px";
  miniCardEl.style.top = top + "px";
  // 加载资料
  window.sb.from("public_users").select("nickname,avatar_url,bio,user_no").eq("id", uid).single().then(function(res){
    if(res.data && miniOpenFor===uid){
      var d = res.data;
      var bioEl = miniCardEl.querySelector(".mc-bio");
      var noEl = miniCardEl.querySelector(".mc-no");
      if(bioEl) bioEl.textContent = d.bio || "这个人很懒，什么都没写~";
      if(noEl) noEl.textContent = "ID: " + (d.user_no || uid.slice(0,8));
    }
  }).catch(function(){});
  // 点卡片进主页
  miniCardEl.querySelector(".mc-top").onclick = function(){ goUser(uid); hideMiniCard(); };
  miniCardEl.querySelector(".mc-go").onclick = function(){ goUser(uid); hideMiniCard(); };
}
function hideMiniCard(){ miniCardEl.classList.remove("show"); miniOpenFor = null; }
window.hideMiniCard = hideMiniCard;

// 事件委托（滚动/点击时用）
document.addEventListener("click", function(e){
  var av = e.target.closest && e.target.closest(".author-avatar");
  if(av){
    var uid = av.dataset.uid;
    if(isTouch){
      // 手机：第一次点弹卡，再点进主页
      if(miniOpenFor === uid){ goUser(uid); hideMiniCard(); }
      else { e.stopPropagation(); showMiniCard(av, uid, av.dataset.name, av.dataset.avatar); }
    } else {
      goUser(uid);
    }
    return;
  }
  if(!e.target.closest || !e.target.closest(".mini-card")) hideMiniCard();
});
document.addEventListener("mouseover", function(e){
  if(isTouch) return;
  var av = e.target.closest && e.target.closest(".author-avatar");
  if(av){ clearTimeout(miniTimer); showMiniCard(av, av.dataset.uid, av.dataset.name, av.dataset.avatar); }
});
document.addEventListener("mouseout", function(e){
  if(isTouch) return;
  var av = e.target.closest && e.target.closest(".author-avatar");
  if(av){ clearTimeout(miniTimer); miniTimer = setTimeout(hideMiniCard, 220); }
});
miniCardEl.addEventListener("mouseenter", function(){ clearTimeout(miniTimer); });
miniCardEl.addEventListener("mouseleave", function(){ if(!isTouch) miniTimer = setTimeout(hideMiniCard, 180); });
window.addEventListener("scroll", hideMiniCard, true);

}
window.reportPost = reportPost;

function renderCategoryFilter() {
    var container = document.getElementById('categoryFilter');
    var html = '<button class="category-btn active" data-cat="全部" onclick="setCategory(\'全部\', this)">全部</button>';
    categories.filter(function(x) { return x.name !== '未分类'; }).forEach(function(x) {
        html += '<button class="category-btn" data-cat="' + x.id + '" onclick="setCategory(' + x.id + ', this)">' + escapeHtml(x.name) + '</button>';
    });
    container.innerHTML = html;
}
function setCategory(cat, btn) {
    document.querySelectorAll('#categoryFilter .category-btn').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    currentCategory = cat;
    renderPosts();
}
window.setCategory = setCategory;

function renderPostContent(post) {
    var html = '';
    if (post.content && post.content.includes('<')) {
        // 富文本：白名单净化，防存储型 XSS（DOMPurify 默认禁用 script/on* 事件/javascript: 协议）
        if (window.DOMPurify) {
            html = DOMPurify.sanitize(post.content, { ADD_ATTR: ['target'] });
        } else {
            html = '<div style="white-space:pre-wrap;">' + escapeHtml(post.content || '') + '</div>';
        }
    } else {
        html = '<div style="white-space:pre-wrap;">' + escapeHtml(post.content || '') + '</div>';
    }
    if (post.image_url && !html.includes('<img')) html += '<img src="' + escapeHtml(post.image_url) + '" style="max-width:100%;border-radius:8px;margin-top:6px;" />';
    return html;
}

function renderPollUI(poll) {
    if (!poll || !poll.poll_options || !poll.poll_options.length) return '';
    var total = (poll.poll_votes || []).length;
    var voted = null;
    if (currentUser) {
        var found = (poll.poll_votes || []).find(function(v) { return v.user_id === currentUser.id; });
        if (found) voted = found.option_id;
    }
    var h = '<div class="poll-container"><b>' + escapeHtml(poll.title) + '</b>';
    if (poll.description) h += '<div style="font-size:.8em;color:var(--text-muted)">' + escapeHtml(poll.description) + '</div>';
    h += '<div style="font-size:.7em;margin:6px 0">总票数：' + total + '</div>';
    poll.poll_options.forEach(function(opt) {
        var votes = (poll.poll_votes || []).filter(function(v) { return v.option_id === opt.id; }).length;
        var pct = total ? Math.round(votes / total * 100) : 0;
        var isVoted = (voted === opt.id);
        h += '<div class="poll-option"><div class="poll-option-header"><span>' + escapeHtml(opt.option_text) + '</span><span>' + votes + '票 (' + pct + '%)</span></div>';
        h += '<div class="poll-option-bar"><div class="poll-option-progress"><div class="poll-option-fill" style="width:' + pct + '%"></div></div>';
        h += '<button class="poll-option-vote-btn" onclick="votePoll(\'' + opt.id + '\')">' + (isVoted ? '已投' : '投票') + '</button></div></div>';
    });
    h += '</div>';
    return h;
}

async function renderPosts() {
    var list = document.getElementById('postList');
    list.innerHTML = '<div class="loading-state"><div class="spinner"></div>加载中...</div>';
    var filtered = posts.filter(function(p) {
        return currentCategory === '全部' || p.category_id === currentCategory;
    });
    if (!filtered.length) { list.innerHTML = '<div class="empty-state">暂无帖子</div>'; return; }
    var html = '';
    for (var i = 0; i < filtered.length; i++) {
        var p = filtered[i];
        var user = p.users || null;
        var name = user ? user.nickname : p.author;
        var avatar = user ? (user.avatar_url || getUserAvatar(user)) : getUserAvatar({ nickname: p.author });
        var time = new Date(p.created_at).toLocaleString('zh-CN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        var catName = '';
        if (p.category_id) {
            var _cat = categories.find(function(c) { return c.id === p.category_id; });
            if (_cat && _cat.name && _cat.name !== '未分类') catName = _cat.name;
        }
        var content = renderPostContent(p);
        var raw = p.content ? p.content.replace(/<[^>]*>/g, '') : '';
        var clamped = raw.length > 150 || (p.content && p.content.split('\n').length > 5);
        var expand = clamped ? '<span class="expand-link">展开</span>' : '';
        var commentCount = commentCountMap[p.id] || 0;
        var canDelete = isAdmin || (currentUser && currentUser.id === p.user_id);

        var delBtn = canDelete ? '<button class="del-btn" data-action="delete" data-id="' + p.id + '"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>删除</button>' : '';

        var reportBtn = '';
        if (currentUser && currentUser.id !== p.user_id && p.user_id) {
            var snapshot = ((p.title || '') + ' ' + (p.content || '').replace(/<[^>]*>/g, '')).substring(0, 200);
            reportBtn = '<button class="report-btn" data-action="report" data-id="' + p.id + '" data-uid="' + p.user_id + '" data-snapshot="' + escapeHtml(snapshot) + '"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>举报</button>';
        }

        html += '<div class="post-card" data-postid="' + p.id + '">';
        html += '<div class="post-author">';
        html += '<div class="avatar author-avatar" data-uid="' + p.user_id + '" data-name="' + escapeHtml(name) + '" data-avatar="' + escapeHtml(avatar||'') + '" style="cursor:pointer;' + (avatar && avatar.startsWith('http') ? 'background-image:url(' + avatar + ');background-size:cover;background-position:center;' : '') + '">' + (avatar && !avatar.startsWith('http') ? name.charAt(0).toUpperCase() : '') + '</div>';
        html += '<span class="name" style="cursor:pointer;" onclick="goUser(\'' + p.user_id + '\')">' + escapeHtml(name) + '</span>';
        if (p.is_official) html += '<span class="official-tag">官方</span>';
        html += roleTagHTML(p.user_id);
        if (catName) html += '<span class="category-tag">' + escapeHtml(catName) + '</span>';
        html += '<span class="time">' + time + '</span>';
        html += '</div>';
        if (p.title) html += '<div class="post-title">' + escapeHtml(p.title) + '</div>';
        html += '<div class="post-content ' + (clamped ? 'clamped' : '') + '">' + content + expand + '</div>';
        html += '<div class="post-footer">';
        html += '<span class="comment-count">评论 ' + commentCount + '</span>';
        html += '<div class="actions">' + reportBtn + delBtn + '</div>';
        html += '</div></div>';
    }
    list.innerHTML = html;

    list.querySelectorAll('.post-card').forEach(function(card) {
        card.addEventListener('click', function(e) {
            if (e.target.closest('button') || e.target.closest('.comment-count') || e.target.closest('.expand-link')) return;
            openPostDetail(this.dataset.postid);
        });
    });

    list.querySelectorAll('.report-btn').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
            e.stopPropagation(); e.preventDefault();
            reportPost(this.dataset.id, this.dataset.uid, this.dataset.snapshot);
        });
    });

    list.querySelectorAll('.del-btn').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
            e.stopPropagation(); e.preventDefault();
            deletePostById(this.dataset.id);
        });
    });

    list.querySelectorAll('.comment-count, .expand-link').forEach(function(el) {
        el.addEventListener('click', function(e) {
            e.stopPropagation(); e.preventDefault();
            var card = this.closest('.post-card');
            if (card) openPostDetail(card.dataset.postid);
        });
    });

    // 头像 → 迷你名片
    list.querySelectorAll('.author-avatar').forEach(function(av) {
        av.addEventListener('click', function(e) {
            e.stopPropagation();
            showMiniCard(this, this.dataset.uid, this.dataset.name, this.dataset.avatar);
        });
    });

    if (window.hidePageLoading) window.hidePageLoading();
}

// ============================================================
// 删除帖子（带确认）
// ============================================================
async function deletePostById(postId) {
    if (!postId) return;
    showConfirm('删除帖子', '删除后不可恢复，确定要删除吗？', async function() {
        try {
            await deletePost(postId);
            posts = posts.filter(function(p) { return p.id !== postId; });
            renderPosts();
            showToast('已删除');
        } catch (e) {
            showToast('删除失败：' + (e.message || '未知错误'));
        }
    });
}

// ============================================================
// 帖子详情
// ============================================================
var currentDetailPost = null;

async function openPostDetail(postId) {
    var overlay = document.getElementById('detailOverlay');
    var box = document.getElementById('detailContent');
    if (!overlay || !box) return;
    overlay.classList.add('active');
    box.innerHTML = '<div class="loading-state"><div class="spinner"></div>加载中...</div>';

    var p = posts.find(function(x) { return x.id === postId; });
    if (!p) {
        var r = await window.sb.from('posts').select('*').eq('id', postId).single();
        p = r.data;
        if (p) { try { await attachProfiles([p], 'user_id', false); } catch (e) { /* 降级 */ } }
    }
    if (!p) { box.innerHTML = '<div class="empty-state">帖子不存在或已删除</div>'; return; }
    currentDetailPost = p;

    var user = p.users || null;
    var name = user ? user.nickname : (p.author || '匿名');
    var avatar = user ? (user.avatar_url || getUserAvatar(user)) : getUserAvatar({ nickname: name });
    var time = new Date(p.created_at).toLocaleString('zh-CN');

    var h = '<div class="post-card" style="margin:0;">';
    h += '<div class="post-author">';
    h += '<div class="avatar author-avatar" style="cursor:pointer;' + (avatar && avatar.startsWith('http') ? 'background-image:url(' + avatar + ');background-size:cover;background-position:center;' : '') + '">' + (avatar && !avatar.startsWith('http') ? name.charAt(0).toUpperCase() : '') + '</div>';
    h += '<span class="name" style="cursor:pointer;" onclick="goUser(\'' + p.user_id + '\')">' + escapeHtml(name) + '</span>';
    if (p.is_official) h += '<span class="official-tag">官方</span>';
    h += roleTagHTML(p.user_id);
    h += '<span class="time">' + time + '</span>';
    h += '</div>';
    if (p.title) h += '<div class="post-title">' + escapeHtml(p.title) + '</div>';
    h += '<div class="post-content">' + renderPostContent(p) + '</div>';
    h += '</div>';

    h += '<div style="margin:18px 0 8px;font-weight:700;font-size:.9em;">评论</div>';
    h += '<div id="detailCommentList"><div class="loading-state"><div class="spinner"></div>加载评论...</div></div>';

    box.innerHTML = h;

    try {
        var comments = await fetchComments(postId);
        var cl = document.getElementById('detailCommentList');
        if (!cl) return;
        if (!comments || !comments.length) {
            cl.innerHTML = '<div class="empty-state">还没有评论，来说两句</div>';
        } else {
            var ch = '';
            comments.forEach(function(c) {
                var cu = c.users || null;
                var cn = cu ? cu.nickname : (c.author || '匿名');
                ch += '<div style="padding:10px 0;border-bottom:1px solid var(--border);">';
                ch += '<div style="display:flex;justify-content:space-between;font-size:.78em;color:var(--text-muted);">';
                ch += '<b>' + escapeHtml(cn) + '</b>';
                ch += '<span>' + new Date(c.created_at).toLocaleString('zh-CN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) + '</span>';
                ch += '</div>';
                ch += '<div style="font-size:.88em;margin-top:4px;line-height:1.5;">' + escapeHtml(c.content) + '</div>';
                ch += '</div>';
            });
            cl.innerHTML = ch;
        }
    } catch (e) {
        var cl2 = document.getElementById('detailCommentList');
        if (cl2) cl2.innerHTML = '<div class="empty-state">评论加载失败</div>';
    }
}

// ============================================================
// 管理面板
// 注意：面板只是入口，真正的权限判定在数据库（RLS + RPC）。
// 前端这里做第一道拦截，避免普通用户误入。
// ============================================================
function openAdminPanel() {
    if (!isAdminUser()) { showToast('无管理员权限'); return; }
    document.getElementById('adminPanelOverlay').classList.add('active');
    switchAdminTab('cat');
}

function switchAdminTab(tab) {
    if (!isAdminUser()) { showToast('无管理员权限'); return; }

    document.querySelectorAll('.admin-tab').forEach(function(b) {
        b.classList.toggle('active', b.dataset.tab === tab);
    });
    var box = document.getElementById('adminPanelContent');
    if (!box) return;
    if (tab === 'cat') renderCatTab(box);
    else if (tab === 'user') renderUserTab(box);
    else if (tab === 'role') renderRoleTab(box);
}

function renderCatTab(box) {
    var h = '<div style="display:flex;gap:8px;margin-bottom:12px;">';
    h += '<button class="new-post-btn" id="addCatBtn" style="flex:1;">+ 新建分类</button>';
    h += '</div><div id="catList">';
    if (!categories.length) h += '<div class="empty-state">暂无分类</div>';
    categories.forEach(function(c, i) {
        h += '<div class="admin-cat-item">';
        h += '<div class="cat-info"><b>' + escapeHtml(c.name) + '</b>';
        if (c.is_public === false) h += '<span style="font-size:.65em;color:var(--danger);">不公开</span>';
        h += '</div>';
        h += '<div class="cat-actions">';
        h += '<button data-act="up" data-id="' + c.id + '" data-i="' + i + '">↑</button>';
        h += '<button data-act="down" data-id="' + c.id + '" data-i="' + i + '">↓</button>';
        h += '<button data-act="rename" data-id="' + c.id + '" data-name="' + escapeHtml(c.name) + '">改名</button>';
        h += '<button data-act="toggle" data-id="' + c.id + '" data-public="' + (c.is_public !== false) + '">' + (c.is_public !== false ? '设为隐藏' : '设为公开') + '</button>';
        h += '<button data-act="del" data-id="' + c.id + '">删除</button>';
        h += '</div></div>';
    });
    h += '</div>';
    box.innerHTML = h;

    document.getElementById('addCatBtn').onclick = function() {
        showPrompt('新建分类', '输入分类名称', '例如：闲聊', async function(name) {
            if (!name) return;
            try {
                await addCategory(name, true);
                categories = await fetchCategories();
                renderCategoryFilter();
                switchAdminTab('cat');
                showToast('已创建');
            } catch (e) { showToast('创建失败：' + e.message); }
        });
    };

    box.querySelectorAll('.cat-actions button').forEach(function(btn) {
        btn.onclick = async function() {
            if (!isAdminUser()) { showToast('无管理员权限'); return; }
            var act = this.dataset.act, id = this.dataset.id;
            try {
                if (act === 'up' || act === 'down') {
                    var i = parseInt(this.dataset.i, 10);
                    var j = act === 'up' ? i - 1 : i + 1;
                    if (j < 0 || j >= categories.length) return;
                    await swapCategoryOrder(categories[i].id, categories[j].id);
                    categories = await fetchCategories();
                } else if (act === 'rename') {
                    var old = this.dataset.name;
                    var self = this;
                    showPrompt('重命名分类', '输入新名称', old, async function(nv) {
                        if (!nv) return;
                        await updateCategory(self.dataset.id, { name: nv });
                        categories = await fetchCategories();
                        renderCategoryFilter();
                        switchAdminTab('cat');
                    });
                    return;
                } else if (act === 'toggle') {
                    var nowPublic = this.dataset.public === 'true';
                    await updateCategory(id, { is_public: !nowPublic });
                    categories = await fetchCategories();
                } else if (act === 'del') {
                    var cid = id;
                    showConfirm('删除分类', '该分类下的帖子会变成「未分类」，确定删除？', async function() {
                        await deleteCategory(cid);
                        categories = await fetchCategories();
                        renderCategoryFilter();
                        switchAdminTab('cat');
                    });
                    return;
                }
                renderCategoryFilter();
                switchAdminTab('cat');
            } catch (e) { showToast('操作失败：' + (e.message || '')); }
        };
    });
}

async function renderUserTab(box) {
    box.innerHTML = '<div class="loading-state"><div class="spinner"></div>加载用户...</div>';
    var users = [];
    try { users = await fetchAllUsers(); } catch (e) {}
    var h = '';
    if (!users.length) h = '<div class="empty-state">暂无用户（或 admin_list_users 函数未配置）</div>';
    users.forEach(function(u) {
        var nick = u.nickname || '未命名';
        var isBanned = u.banned_until && new Date(u.banned_until) > new Date();
        h += '<div class="admin-user-card">';
        h += '<div class="user-avatar">' + escapeHtml(nick.charAt(0).toUpperCase()) + '</div>';
        h += '<div class="user-info"><div class="name-row"><span>' + escapeHtml(nick) + '</span>';
        h += '<span class="role-badge" style="background:' + (u.is_admin ? '#e57373' : '#8aaa9a') + '">' + (u.is_admin ? '管理员' : '用户') + '</span>';
        if (isBanned) h += '<span class="role-badge" style="background:#c62828">已封禁</span>';
        h += '</div><div style="font-size:.7em;color:var(--text-muted)">' + escapeHtml(u.custom_uid || u.phone || u.id || '') + '</div></div>';
        h += '<div class="user-actions">';
        if (isBanned) h += '<button class="btn-role" data-act="unban" data-id="' + u.id + '">解封</button>';
        else h += '<button class="btn-role" data-act="ban" data-id="' + u.id + '">封禁</button>';
        h += '</div></div>';
    });
    box.innerHTML = h;

    box.querySelectorAll('button[data-act]').forEach(function(btn) {
        btn.onclick = function() {
            if (!isAdminUser()) { showToast('无管理员权限'); return; }
            var id = this.dataset.id;
            if (this.dataset.act === 'ban') {
                showPrompt('封禁用户', '请输入封禁天数（如 7）', '7', async function(days) {
                    var n = parseInt(days, 10);
                    if (!n || n <= 0) { showToast('天数无效'); return; }
                    try {
                        var until = new Date(Date.now() + n * 86400000).toISOString();
                        await banUser(id, '违反社区规范', until);
                        showToast('已封禁 ' + n + ' 天');
                        switchAdminTab('user');
                    } catch (e) { showToast('封禁失败：' + (e.message || '')); }
                }, 'number');
            } else {
                (async function() {
                    try {
                        await unbanUser(id);
                        showToast('已解封');
                        switchAdminTab('user');
                    } catch (e) { showToast('操作失败：' + (e.message || '')); }
                })();
            }
        };
    });
}

async function renderRoleTab(box) {
    box.innerHTML = '<div class="loading-state"><div class="spinner"></div>加载身份...</div>';
    var roles = [];
    try { await loadGlobalRoles(); roles = await fetchUserRoles(); } catch (e) {}
    var h = '<div style="font-size:.75em;color:var(--text-muted);margin-bottom:10px;">为用户设置展示身份（如「元老」「活跃达人」）</div>';
    if (!roles.length) h += '<div class="empty-state">暂无身份数据</div>';
    roles.forEach(function(r) {
        h += '<div class="admin-role-item">';
        h += '<div class="role-info"><span style="width:10px;height:10px;border-radius:50%;background:' + (r.role_color || '#8aaa9a') + ';display:inline-block;"></span>';
        h += '<b>' + escapeHtml(r.role_name || '') + '</b>';
        h += '<span style="font-size:.7em;color:var(--text-muted)">' + escapeHtml(r.user_id || '') + '</span></div>';
        h += '<div class="role-actions"><button data-act="remove" data-uid="' + r.user_id + '">移除</button></div>';
        h += '</div>';
    });
    box.innerHTML = h;

    box.querySelectorAll('button[data-act="remove"]').forEach(function(btn) {
        btn.onclick = async function() {
            if (!isAdminUser()) { showToast('无管理员权限'); return; }
            try {
                await window.sb.rpc('admin_remove_role', { p_user_id: this.dataset.uid });
                showToast('已移除');
                switchAdminTab('role');
            } catch (e) { showToast('操作失败：' + (e.message || '')); }
        };
    });
}

// ============================================================
// 初始化
// ============================================================
(async function init() {
    renderHeader('帖子广场', 'posts');
    renderFooter('posts');

    try {
        categories = await fetchCategories();
    } catch (e) {
        categories = [];
    }
    renderCategoryFilter();

    try {
        posts = await fetchPosts();
    } catch (e) {
        posts = [];
        document.getElementById('postList').innerHTML = '<div class="empty-state">加载失败：' + escapeHtml(e.message || '网络异常') + '</div>';
        return;
    }

    try { commentCountMap = await fetchAllCommentCounts() || {}; } catch (e) { commentCountMap = {}; }
    try { await loadGlobalRoles(); } catch (e) {}

    await renderPosts();

    // ★ 身份以服务端为准：确认后再决定是否显示管理入口
    var trusted = await whenUserReady();
    if (trusted && trusted.id) {
        currentUser = trusted;
        isAdmin = trusted.is_admin === true;
    } else if (!trusted) {
        isAdmin = false;
    }
    var adminBtn = document.getElementById('adminPanelBtn');
    if (adminBtn) adminBtn.style.display = isAdmin ? 'inline-flex' : 'none';
    if (isAdmin) await renderPosts();

    // 详情面板关闭
    var closeDetail = document.getElementById('closeDetail');
    if (closeDetail) closeDetail.onclick = function() {
        document.getElementById('detailOverlay').classList.remove('active');
    };
    var closeAdmin = document.getElementById('closeAdminPanel');
    if (closeAdmin) closeAdmin.onclick = function() {
        document.getElementById('adminPanelOverlay').classList.remove('active');
    };

    // 发表评论
    var sendBtn = document.getElementById('detailSendCommentBtn');
    if (sendBtn) {
        sendBtn.onclick = async function() {
            var input = document.getElementById('detailCommentInput');
            var text = input.value.trim();
            if (!text) return;
            if (!currentUser || !currentUser.id) { showToast('请先登录'); return; }
            if (currentUser.banned_until && new Date(currentUser.banned_until) > new Date()) {
                showToast('账号已被封禁，无法评论');
                return;
            }
            sendBtn.disabled = true;
            try {
                await addComment(currentDetailPost.id, currentUser.nickname || '用户', currentUser.id, text);
                input.value = '';
                showToast('评论成功');
                commentCountMap[currentDetailPost.id] = (commentCountMap[currentDetailPost.id] || 0) + 1;
                await renderPosts();
                openPostDetail(currentDetailPost.id);
            } catch (e) {
                showToast('评论失败：' + (e.message || ''));
            } finally {
                sendBtn.disabled = false;
            }
        };
    }
})();
</script>
