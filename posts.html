<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Seven戚 · 帖子广场</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    <style>
        /* ============================================================
               基础样式（与原有保持一致，并增强管理面板UI）
               ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        :root {
            --bg: #f5faf5;
            --bg-card: #ffffff;
            --bg-input: #eaf3ea;
            --border: #c8e0c8;
            --text: #1e3a2e;
            --text-muted: #5a7a6a;
            --text-light: #8aaa9a;
            --primary: #2e7d32;
            --primary-light: #4caf50;
            --primary-bg: #e8f5e9;
            --shadow: 0 8px 32px rgba(46, 125, 50, 0.12);
            --radius: 16px;
            --radius-sm: 10px;
            --font: "Space Grotesk", "PingFang SC", "Segoe UI", system-ui, sans-serif;
            --danger: #e57373;
            --danger-bg: #ffebee;
            --danger-text: #c62828;
            --official-blue: #2b6cff;
            --success: #66bb6a;
            --success-bg: #e8f5e9;
            --warning: #ffa726;
            --warning-bg: #fff3e0;
        }
        html,
        body {
            height: 100%;
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
        }
        #mainApp {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            background: var(--bg);
        }

        /* ----- 头部 & 底部（由 
 生成，此处保留样式占位） ----- */
        .app-header {
            flex-shrink: 0;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.92);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 50;
            min-height: 56px;
        }
        .app-header .brand {
            font-weight: 900;
            font-size: 1.1em;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 0.4em;
            cursor: default;
        }
        .app-header .brand span {
            color: var(--primary);
        }
        .app-header .brand small {
            font-weight: 400;
            font-size: 0.55em;
            color: var(--text-muted);
            margin-left: 0.3em;
        }
        .app-header .user-area {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            padding: 4px 10px 4px 6px;
            border-radius: 99px;
        }
        .app-header .user-area:hover {
            background: var(--primary-bg);
        }
        .app-header .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            display: grid;
            place-items: center;
            font-weight: 700;
            font-size: 14px;
            background-size: cover;
            background-position: center;
        }
        .app-header .user-name {
            font-weight: 600;
            font-size: 0.85em;
            max-width: 80px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .app-tabs {
            flex-shrink: 0;
            display: flex;
            background: rgba(255, 255, 255, 0.96);
            border-top: 1px solid var(--border);
            padding: 6px 0 calc(6px + env(safe-area-inset-bottom, 0px));
            z-index: 50;
        }
        .tab-btn {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            background: none;
            border: none;
            font-family: var(--font);
            font-size: 0.6em;
            font-weight: 600;
            color: var(--text-muted);
            padding: 4px 0;
            cursor: pointer;
            text-decoration: none;
            position: relative;
        }
        .tab-btn .tab-icon {
            font-size: 1.6em;
            line-height: 1.2;
        }
        .tab-btn.active {
            color: var(--primary);
        }
        .tab-btn.active::after {
            content: '';
            position: absolute;
            top: -1px;
            left: 30%;
            right: 30%;
            height: 3px;
            background: var(--primary);
            border-radius: 0 0 4px 4px;
        }

        /* ----- 封禁横幅 ----- */
        .banned-banner {
            flex-shrink: 0;
            background: #ffebee;
            color: #c62828;
            padding: 6px 16px;
            font-size: 0.8em;
            font-weight: 600;
            text-align: center;
            border-bottom: 1px solid #ffcdd2;
            display: none;
        }
        .banned-banner.active {
            display: block;
        }

        /* ----- 主内容 ----- */
        .app-content {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 16px 20px;
        }
        .posts-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .posts-header .left {
            display: flex;
            gap: 6px;
            align-items: center;
            overflow-x: auto;
            max-width: 100%;
        }
        .category-btn {
            padding: 4px 14px;
            border-radius: 99px;
            border: 1.5px solid var(--border);
            background: transparent;
            color: var(--text-muted);
            font-size: 0.7em;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .category-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
        }
        .new-post-btn {
            padding: 6px 18px;
            border-radius: 99px;
            border: none;
            background: var(--primary);
            color: #fff;
            font-weight: 700;
            font-size: 0.75em;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .new-post-btn:hover {
            background: var(--primary-light);
        }
        .floating-post-btn {
            position: fixed;
            bottom: 85px;
            right: 20px;
            z-index: 1000;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            border: none;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-decoration: none;
        }
        .floating-post-btn svg {
            width: 28px;
            height: 28px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ----- 帖子卡片 ----- */
        .post-card {
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            padding: 14px 16px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: box-shadow 0.2s;
        }
        .post-card:hover {
            box-shadow: var(--shadow);
        }
        .post-card .post-author {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 2px;
            flex-wrap: wrap;
        }
        .post-card .post-author .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-weight: 700;
            font-size: 14px;
            color: #fff;
            background: var(--primary);
            background-size: cover;
            background-position: center;
        }
        .post-card .post-author .name {
            font-weight: 600;
            font-size: 0.9em;
        }
        .post-card .post-author .official-tag {
            background: var(--official-blue);
            color: #fff;
            font-size: 0.55em;
            padding: 0 6px;
            border-radius: 99px;
        }
        .post-card .post-author .time {
            font-size: 0.7em;
            color: var(--text-muted);
            margin-left: auto;
        }
        .post-card .post-title {
            font-weight: 700;
            font-size: 1em;
            margin: 4px 0 2px 0;
        }
        .post-card .post-content {
            font-size: 0.85em;
            color: var(--text);
            line-height: 1.6;
            margin-bottom: 6px;
            word-break: break-word;
        }
        .post-card .post-content img {
            max-width: 100%;
            border-radius: 8px;
            margin: 6px 0;
        }
        .post-card .post-content.clamped {
            display: -webkit-box;
            -webkit-line-clamp: 5;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .post-card .post-content .expand-link {
            color: var(--official-blue);
            font-weight: 600;
            cursor: pointer;
            margin-left: 4px;
            text-decoration: underline;
        }
        .post-card .post-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            font-size: 0.65em;
            color: var(--text-light);
            border-top: 1px solid var(--border);
            padding-top: 8px;
        }
        .post-card .post-footer .comment-count {
            cursor: pointer;
        }
        .post-card .post-footer .actions button {
            background: none;
            border: none;
            cursor: pointer;
            color: inherit;
            font-size: inherit;
        }
        .post-card .post-footer .actions .del-btn {
            color: var(--danger);
        }

        /* ----- 详情弹窗 ----- */
        .detail-overlay,
        .admin-panel-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: none;
            flex-direction: column;
            z-index: 999;
        }
        .detail-overlay.active,
        .admin-panel-overlay.active {
            display: flex;
        }
        .detail-header,
        .admin-panel-header {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .detail-header .back-btn,
        .admin-panel-header .back-btn {
            background: none;
            border: none;
            font-size: 1.5em;
            cursor: pointer;
            padding: 0 8px 0 0;
        }
        .detail-content,
        .admin-panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
        }
        .detail-post {
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
        }
        .detail-post .post-author {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 4px;
            flex-wrap: wrap;
        }
        .detail-post .post-author .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-weight: 700;
            font-size: 14px;
            color: #fff;
            background: var(--primary);
            background-size: cover;
            background-position: center;
        }
        .detail-post .post-author .name {
            font-weight: 600;
            font-size: 0.9em;
        }
        .detail-post .post-author .official-tag {
            background: var(--official-blue);
            color: #fff;
            font-size: 0.55em;
            padding: 0 6px;
            border-radius: 99px;
        }
        .detail-post .post-author .time {
            font-size: 0.7em;
            color: var(--text-muted);
            margin-left: auto;
        }
        .detail-post .post-title {
            font-weight: 700;
            font-size: 1.1em;
            margin: 4px 0 2px 0;
        }
        .detail-post .post-content {
            font-size: 0.95em;
            color: var(--text);
            line-height: 1.6;
            word-break: break-word;
        }
        .detail-post .post-content img {
            max-width: 100%;
            border-radius: 8px;
            margin: 6px 0;
        }
        .detail-comments {
            flex: 1;
            margin-top: 8px;
        }
        .detail-comments .comment-item {
            display: flex;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }
        .detail-comments .comment-item .avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-weight: 700;
            font-size: 12px;
            color: #fff;
            background: var(--primary);
            background-size: cover;
            background-position: center;
        }
        .detail-comments .comment-item .body {
            flex: 1;
        }
        .detail-comments .comment-item .meta {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .detail-comments .comment-item .meta .name {
            font-weight: 600;
            font-size: 0.85em;
        }
        .detail-comments .comment-item .meta .official-tag {
            background: var(--official-blue);
            color: #fff;
            font-size: 0.5em;
            padding: 0 4px;
            border-radius: 99px;
        }
        .detail-comments .comment-item .meta .time {
            font-size: 0.65em;
            color: var(--text-muted);
        }
        .detail-comments .comment-item .txt {
            font-size: 0.85em;
            line-height: 1.5;
            margin-top: 2px;
        }
        .detail-input-area {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            background: var(--bg-card);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }
        .detail-input-area input {
            flex: 1;
            padding: 10px;
            border-radius: 99px;
            border: 2px solid var(--border);
            font-family: inherit;
            font-size: 0.85em;
            outline: none;
        }
        .detail-input-area input:focus {
            border-color: var(--primary);
        }
        .detail-input-area button {
            padding: 10px 20px;
            border-radius: 99px;
            border: none;
            background: var(--primary);
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
        }

        /* ----- 投票样式 ----- */
        .poll-container {
            margin: 16px 0;
            padding: 16px;
            background: #f8faf8;
            border-radius: 12px;
            border: 1px solid var(--border);
        }
        .poll-option {
            margin-bottom: 12px;
        }
        .poll-option-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.85em;
        }
        .poll-option-bar {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .poll-option-progress {
            flex: 1;
            height: 20px;
            background: var(--primary-bg);
            border-radius: 10px;
            overflow: hidden;
        }
        .poll-option-fill {
            height: 100%;
            background: var(--primary);
        }
        .poll-option-vote-btn {
            padding: 2px 8px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.7em;
        }

        /* ----- 通用状态 ----- */
        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 40px 20px;
        }
        .loading-state {
            text-align: center;
            padding: 40px 20px;
        }
        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ----- Toast ----- */
        #toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--text);
            color: #fff;
            padding: 10px 24px;
            border-radius: 99px;
            opacity: 0;
            transition: 0.4s;
            z-index: 9999;
            pointer-events: none;
        }
        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(-10px);
        }

        /* ----- 自定义弹窗（确认 / 提示） ----- */
        .custom-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 20px;
        }
        .custom-modal.active {
            display: flex;
        }
        .modal-box {
            background: var(--bg-card);
            padding: 24px;
            border-radius: var(--radius);
            max-width: 400px;
            width: 100%;
            box-shadow: var(--shadow);
        }
        .modal-title {
            font-size: 1.2em;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .modal-body {
            font-size: 0.95em;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 16px;
        }
        .modal-body p {
            margin-bottom: 8px;
        }
        .modal-body input {
            width: 100%;
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            border: 2px solid var(--border);
            font-family: inherit;
            font-size: 0.9em;
            outline: none;
        }
        .modal-body input:focus {
            border-color: var(--primary);
        }
        .modal-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }
        .modal-actions button {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-family: inherit;
        }
        .btn-danger {
            background: var(--danger);
            color: #fff;
        }
        .btn-danger:hover {
            background: #c62828;
        }
        .btn-secondary {
            background: var(--bg-input);
            color: var(--text-muted);
        }
        .btn-secondary:hover {
            background: var(--border);
        }
        .btn-primary {
            background: var(--primary);
            color: #fff;
        }
        .btn-primary:hover {
            background: var(--primary-light);
        }
        .btn-success {
            background: var(--success);
            color: #fff;
        }
        .btn-success:hover {
            background: #43a047;
        }

        /* ============================================================
               管理面板 —— 全新美化 UI
               ============================================================ */
        .admin-panel-content {
            padding: 16px 20px 32px;
        }
        .admin-panel-content h3 {
            font-size: 1em;
            font-weight: 700;
            margin: 20px 0 12px 0;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .admin-panel-content h3:first-of-type {
            margin-top: 0;
        }

        /* --- 用户卡片（全新设计） --- */
        .admin-user-card {
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            padding: 14px 16px;
            margin-bottom: 10px;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            transition: box-shadow 0.2s, border-color 0.2s;
        }
        .admin-user-card:hover {
            box-shadow: var(--shadow-sm);
            border-color: var(--primary-light);
        }
        .admin-user-card .user-main {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
            flex: 1;
        }
        .admin-user-card .user-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            display: grid;
            place-items: center;
            font-weight: 700;
            font-size: 18px;
            flex-shrink: 0;
            background-size: cover;
            background-position: center;
        }
        .admin-user-card .user-info {
            min-width: 0;
            flex: 1;
        }
        .admin-user-card .user-info .name-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .admin-user-card .user-info .name-row .nickname {
            font-weight: 700;
            font-size: 0.95em;
            color: var(--text);
        }
        .admin-user-card .user-info .name-row .role-badge {
            font-size: 0.55em;
            padding: 0 8px;
            border-radius: 99px;
            color: #fff;
            line-height: 18px;
            font-weight: 600;
        }
        .admin-user-card .user-info .name-row .status-badge {
            font-size: 0.55em;
            padding: 0 8px;
            border-radius: 99px;
            line-height: 18px;
            font-weight: 600;
        }
        .admin-user-card .user-info .name-row .status-badge.normal {
            background: var(--success-bg);
            color: var(--success);
        }
        .admin-user-card .user-info .name-row .status-badge.banned {
            background: var(--danger-bg);
            color: var(--danger-text);
        }
        .admin-user-card .user-info .phone-row {
            font-size: 0.75em;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .admin-user-card .user-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        .admin-user-card .user-actions button {
            padding: 5px 14px;
            border-radius: 99px;
            border: none;
            font-weight: 600;
            font-size: 0.7em;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-family: inherit;
            white-space: nowrap;
        }
        .admin-user-card .user-actions .btn-ban {
            background: var(--danger-bg);
            color: var(--danger-text);
        }
        .admin-user-card .user-actions .btn-ban:hover {
            background: #ffcdd2;
            transform: scale(1.02);
        }
        .admin-user-card .user-actions .btn-unban {
            background: var(--success-bg);
            color: var(--success);
        }
        .admin-user-card .user-actions .btn-unban:hover {
            background: #c8e6c9;
            transform: scale(1.02);
        }
        .admin-user-card .user-actions .btn-login {
            background: var(--primary-bg);
            color: var(--primary);
        }
        .admin-user-card .user-actions .btn-login:hover {
            background: #c8e6c9;
            transform: scale(1.02);
        }
        .admin-user-card .user-actions .btn-login svg {
            width: 14px;
            height: 14px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* --- 分类管理 & 角色管理（保持整洁） --- */
        .admin-cat-item,
        .admin-role-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            margin-bottom: 6px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            flex-wrap: wrap;
            gap: 8px;
        }
        .admin-cat-item .cat-info,
        .admin-role-item .role-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .admin-cat-item .cat-actions,
        .admin-role-item .role-actions {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }
        .admin-cat-item .cat-actions button,
        .admin-role-item .role-actions button {
            padding: 4px 12px;
            border-radius: 99px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.7em;
            font-weight: 600;
            transition: all 0.2s;
            font-family: inherit;
        }
        .admin-cat-item .cat-actions button:hover,
        .admin-role-item .role-actions button:hover {
            background: var(--primary-bg);
            color: var(--primary);
            border-color: var(--primary);
        }

        .admin-add-row {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .admin-add-row input {
            flex: 1;
            padding: 8px 12px;
            border-radius: 8px;
            border: 2px solid var(--border);
            font-family: inherit;
            font-size: 0.85em;
            outline: none;
            min-width: 100px;
        }
        .admin-add-row input:focus {
            border-color: var(--primary);
        }
        .admin-add-row button {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            background: var(--primary);
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
        }
        .admin-add-row button:hover {
            background: var(--primary-light);
        }

        /* ----- 响应式 ----- */
        @media (max-width: 480px) {
            .app-content {
                padding: 12px 14px;
            }
            .floating-post-btn {
                bottom: 75px;
                right: 16px;
                width: 50px;
                height: 50px;
            }
            .admin-user-card {
                padding: 12px 14px;
            }
            .admin-user-card .user-main {
                gap: 10px;
            }
            .admin-user-card .user-avatar {
                width: 36px;
                height: 36px;
                font-size: 14px;
            }
            .admin-user-card .user-actions button {
                font-size: 0.65em;
                padding: 4px 10px;
            }
            .admin-panel-content {
                padding: 12px 14px 24px;
            }
            .detail-content {
                padding: 12px 14px;
            }
        }
    </style>
</head>
<body>
    <div id="mainApp">
        <!-- 顶部由 common.js 渲染 -->
        <div id="header-container"></div>

        <!-- 封禁横幅 -->
        <div class="banned-banner" id="bannedBanner">
            ⚠️ 账号已被封禁，无法发布新帖或评论。解封时间：<span id="bannedUntilDisplay"></span>
        </div>

        <!-- 帖子列表 -->
        <div class="app-content" id="postContent">
            <div class="posts-header">
                <div class="left" id="categoryFilter">
                    <button class="category-btn active" data-cat="全部" onclick="setCategory('全部', this)">全部</button>
                </div>
                <div style="display:flex; gap:6px;">
                    <button class="new-post-btn" id="adminPanelBtn" style="display:none; background:var(--danger);" onclick="openAdminPanel()">⚙️ 管理</button>
                    <a href="new-post.html" class="new-post-btn" id="newPostBtn">📝 发帖</a>
                </div>
            </div>
            <div id="postList"></div>
        </div>

        <!-- 底部由 common.js 渲染 -->
        <div id="footer-container"></div>
    </div>

    <!-- 悬浮发帖按钮 -->
    <a href="new-post.html" class="floating-post-btn" id="floatingPostBtn">
        <svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </a>

    <!-- 帖子详情弹窗 -->
    <div class="detail-overlay" id="detailOverlay">
        <div class="detail-panel" style="display:flex;flex-direction:column;height:100%;">
            <div class="detail-header">
                <button class="back-btn" id="closeDetail">←</button>
                <span class="detail-title" style="font-weight:700;font-size:1em;">帖子详情</span>
            </div>
            <div class="detail-content" id="detailContent"></div>
            <div class="detail-input-area">
                <input type="text" id="detailCommentInput" placeholder="写评论…" maxlength="200" />
                <button id="detailSendCommentBtn">发送</button>
            </div>
        </div>
    </div>

    <!-- 管理面板弹窗 -->
    <div class="admin-panel-overlay" id="adminPanelOverlay">
        <div class="admin-panel-header">
            <button class="back-btn" id="closeAdminPanel">←</button>
            <span style="font-weight:700;font-size:1em;">⚙️ 数据管理</span>
        </div>
        <div class="admin-panel-content" id="adminPanelContent"></div>
    </div>

    <!-- 确认弹窗 -->
    <div class="custom-modal" id="confirmModal">
        <div class="modal-box">
            <div class="modal-title" id="confirmTitle"></div>
            <div class="modal-body" id="confirmBody"></div>
            <div class="modal-actions">
                <button class="btn-secondary" id="confirmCancel">取消</button>
                <button class="btn-danger" id="confirmOk">确定</button>
            </div>
        </div>
    </div>

    <!-- 提示输入弹窗 -->
    <div class="custom-modal" id="promptModal">
        <div class="modal-box">
            <div class="modal-title" id="promptTitle"></div>
            <div class="modal-body">
                <p id="promptMessage"></p>
                <input type="text" id="promptInput" />
            </div>
            <div class="modal-actions">
                <button class="btn-secondary" id="promptCancel">取消</button>
                <button class="btn-primary" id="promptOk">确定</button>
            </div>
        </div>
    </div>

    <div id="toast"></div>

    <script src="/liuyanban/common.js">
    </script>
    <script>
        // ============================================================
        // 渲染头部 & 底部
        // ============================================================
        renderHeader('帖子广场', 'posts');
        renderFooter('posts');

        // ============================================================
        // Supabase 客户端
        // ============================================================
        var SUPABASE_URL = "https://ulvhuqtpdafspbdvkogs.supabase.co";
        var SUPABASE_ANON_KEY = "sb_publishable_Ew8kKf2z05kmYIK2XNu00g_dzAirtIM";
        window.sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ============================================================
        // 工具函数
        // ============================================================
        function showToast(msg) {
            var t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(window.toastTimer);
            window.toastTimer = setTimeout(function() { t.classList.remove('show'); }, 3000);
        }

        function escapeHtml(s) {
            if (!s) return '';
            return String(s).replace(/[&<>"']/g, function(c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' } [c];
            });
        }

        function showConfirm(title, body, onOk) {
            var m = document.getElementById('confirmModal');
            document.getElementById('confirmTitle').textContent = title;
            document.getElementById('confirmBody').textContent = body;
            m.classList.add('active');
            var cancel = document.getElementById('confirmCancel');
            var ok = document.getElementById('confirmOk');
            var cleanup = function() {
                m.classList.remove('active');
                cancel.onclick = null;
                ok.onclick = null;
            };
            cancel.onclick = cleanup;
            ok.onclick = function() {
                if (onOk) onOk();
                cleanup();
            };
        }

        function showPrompt(title, msg, placeholder, onOk, inputType) {
            inputType = inputType || 'text';
            var m = document.getElementById('promptModal');
            document.getElementById('promptTitle').textContent = title;
            document.getElementById('promptMessage').textContent = msg;
            var input = document.getElementById('promptInput');
            input.type = inputType;
            input.value = '';
            input.placeholder = placeholder || '';
            m.classList.add('active');
            input.focus();
            var cancel = document.getElementById('promptCancel');
            var ok = document.getElementById('promptOk');
            var cleanup = function() {
                m.classList.remove('active');
                cancel.onclick = null;
                ok.onclick = null;
                input.onkeydown = null;
            };
            cancel.onclick = cleanup;
            ok.onclick = function() {
                var val = input.value.trim();
                if (onOk) onOk(val);
                cleanup();
            };
            input.onkeydown = function(e) {
                if (e.key === 'Enter') ok.click();
            };
        }

        function getUserAvatar(user) {
            if (user && user.avatar_url) return user.avatar_url;
            var name = user ? user.nickname : 'U';
            var color = '#2e7d32';
            var initial = name.charAt(0).toUpperCase();
            var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="' +
                color + '" rx="50"/><text x="50" y="58" font-size="40" text-anchor="middle" fill="white" font-family="sans-serif">' +
                initial + '</text></svg>';
            return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
        }

        // ============================================================
        // 会话 & 权限
        // ============================================================
        var currentUser = getSessionUser();
        if (!currentUser || !currentUser.id) window.location.href = 'index.html';
        var isAdmin = (currentUser.phone === '17355394710');
        if (isAdmin) document.getElementById('adminPanelBtn').style.display = 'inline-flex';

        // ============================================================
        // 数据状态
        // ============================================================
        var categories = [];
        var posts = [];
        var currentCategory = '全部';
        var commentCountMap = {};

        // ============================================================
        // 数据库操作
        // ============================================================
        async function fetchCategories() {
            var res = await window.sb.from('categories').select('*').order('sort_order');
            if (res.error) throw res.error;
            return res.data || [];
        }

        async function addCategory(name, isPublic) {
            var maxOrder = categories.reduce(function(m, c) { return Math.max(m, c.sort_order || 0); }, 0);
            await window.sb.from('categories').insert([{ name: name, sort_order: maxOrder + 1, is_public: isPublic }]);
        }

        async function updateCategory(id, updates) {
            await window.sb.from('categories').update(updates).eq('id', id);
        }

        async function deleteCategory(id) {
            var uncat = categories.find(function(c) { return c.name === '未分类'; });
            if (uncat) await window.sb.from('posts').update({ category_id: uncat.id }).eq('category_id', id);
            await window.sb.from('categories').delete().eq('id', id);
        }

        async function swapCategoryOrder(id1, id2) {
            var c1 = categories.find(function(c) { return c.id === id1; });
            var c2 = categories.find(function(c) { return c.id === id2; });
            if (!c1 || !c2) return;
            var temp = c1.sort_order;
            await window.sb.from('categories').update({ sort_order: c2.sort_order }).eq('id', id1);
            await window.sb.from('categories').update({ sort_order: temp }).eq('id', id2);
        }

        async function fetchPosts() {
            var res = await window.sb
                .from('posts')
                .select('*, users!posts_user_id_fkey (id, nickname, avatar_url)')
                .order('created_at', { ascending: false });
            if (res.error) throw res.error;
            return res.data || [];
        }

        async function fetchComments(postId) {
            var res = await window.sb
                .from('post_comments')
                .select('*, users!post_comments_user_id_fkey (id, nickname, avatar_url)')
                .eq('post_id', postId)
                .order('created_at', { ascending: true });
            if (res.error) throw res.error;
            return res.data || [];
        }

        async function fetchAllCommentCounts() {
            var res = await window.sb.from('post_comments').select('post_id');
            if (!res.error) {
                commentCountMap = {};
                (res.data || []).forEach(function(c) {
                    commentCountMap[c.post_id] = (commentCountMap[c.post_id] || 0) + 1;
                });
            }
        }

        async function addComment(postId, author, user_id, content) {
            await window.sb.from('post_comments').insert([{ post_id: postId, author: author, user_id: user_id,
                content: content }]);
        }

        async function deletePost(id) {
            await window.sb.from('posts').delete().eq('id', id);
        }

        // 用户管理
        async function fetchAllUsers() {
            var res = await window.sb.from('users').select('*');
            return res.data || [];
        }

        async function fetchUserRoles() {
            var res = await window.sb.from('user_roles').select('*');
            return res.data || [];
        }

        async function banUser(userId, reason, until) {
            await window.sb.from('users').update({ banned_reason: reason, banned_until: until }).eq('id', userId);
        }

        async function unbanUser(userId) {
            await window.sb.from('users').update({ banned_until: null }).eq('id', userId);
        }

        async function assignRoleToUser(userId, roleName, roleColor) {
            await window.sb.from('user_roles').delete().eq('user_id', userId);
            await window.sb.from('user_roles').insert([{ user_id: userId, role_name: roleName, role_color: roleColor }]);
        }

        async function removeRoleFromAll(roleName) {
            var roles = await fetchUserRoles();
            for (var i = 0; i < roles.length; i++) {
                if (roles[i].role_name === roleName) {
                    await window.sb.from('user_roles').delete().eq('id', roles[i].id);
                }
            }
        }

        // 投票
        async function loadPollData(postId) {
            var res = await window.sb
                .from('post_polls')
                .select('*, poll_options(*), poll_votes(option_id, user_id)')
                .eq('post_id', postId)
                .single();
            return res.data || null;
        }

        async function votePoll(optionId) {
            if (!currentUser) return showToast('请先登录');
            await window.sb.from('poll_votes').upsert([{ option_id: optionId, user_id: currentUser.id }], {
                onConflict: 'option_id,user_id'
            });
            showToast('✅ 投票成功');
            if (currentDetailPostId) renderDetail(currentDetailPostId);
        }

        // ============================================================
        // 分类渲染
        // ============================================================
        function renderCategoryFilter() {
            var container = document.getElementById('categoryFilter');
            var html = '<button class="category-btn active" data-cat="全部" onclick="setCategory(\'全部\', this)">全部</button>';
            categories.filter(function(x) { return x.name !== '未分类'; }).forEach(function(x) {
                html += '<button class="category-btn" data-cat="' + x.id + '" onclick="setCategory(' + x.id +
                    ', this)">' + escapeHtml(x.name) + '</button>';
            });
            container.innerHTML = html;
        }

        function setCategory(cat, btn) {
            document.querySelectorAll('#categoryFilter .category-btn').forEach(function(b) { b.classList.remove(
                    'active'); });
            btn.classList.add('active');
            currentCategory = cat;
            renderPosts();
        }

        // ============================================================
        // 帖子渲染
        // ============================================================
        function renderPostContent(post) {
            var html = '';
            if (post.content && post.content.includes('<')) {
                html = post.content;
            } else {
                html = '<div style="white-space:pre-wrap;">' + escapeHtml(post.content || '') + '</div>';
            }
            if (post.image_url && !html.includes('<img')) {
                html += '<img src="' + escapeHtml(post.image_url) + '" style="max-width:100%;border-radius:8px;margin-top:6px;" />';
            }
            return html;
        }

        function renderPollUI(poll) {
            if (!poll || !poll.poll_options || !poll.poll_options.length) return '';
            var total = (poll.poll_votes || []).length;
            var voted = null;
            if (currentUser) {
                var found = (poll.poll_votes || []).find(function(v) { return v.user_id === currentUser.id; });
                if (found) voted = found.option_id;
            }
            var h = '<div class="poll-container"><b>📊 ' + escapeHtml(poll.title) + '</b>';
            if (poll.description) h += '<div style="font-size:0.8em;color:var(--text-muted)">' + escapeHtml(poll
                .description) + '</div>';
            h += '<div style="font-size:0.7em;margin:6px 0">总票数：' + total + '</div>';
            poll.poll_options.forEach(function(opt) {
                var votes = (poll.poll_votes || []).filter(function(v) { return v.option_id === opt.id; }).length;
                var pct = total ? Math.round(votes / total * 100) : 0;
                var isVoted = (voted === opt.id);
                h += '<div class="poll-option"><div class="poll-option-header"><span>' + escapeHtml(opt
                    .option_text) + '</span><span>' + votes + '票 (' + pct + '%)</span></div>';
                h += '<div class="poll-option-bar"><div class="poll-option-progress"><div class="poll-option-fill" style="width:' +
                    pct + '%"></div></div>';
                h += '<button class="poll-option-vote-btn" onclick="votePoll(\'' + opt.id + '\')">' + (isVoted ?
                    '已投' : '投票') + '</button></div></div>';
            });
            h += '</div>';
            return h;
        }

        async function renderPosts() {
            var list = document.getElementById('postList');
            list.innerHTML = '<div class="loading-state"><div class="spinner"></div>加载中...</div>';
            var filtered = posts.filter(function(p) {
                return currentCategory === '全部' || p.category_id === currentCategory;
            });
            if (!filtered.length) {
                list.innerHTML = '<div class="empty-state">📭 暂无帖子</div>';
                return;
            }
            var html = '';
            for (var i = 0; i < filtered.length; i++) {
                var p = filtered[i];
                var user = p.users || null;
                var name = user ? user.nickname : p.author;
                var avatar = user ? (user.avatar_url || getUserAvatar(user)) : getUserAvatar({ nickname: p.author });
                var time = new Date(p.created_at).toLocaleString('zh-CN', { month: 'short', day: 'numeric',
                    hour: '2-digit', minute: '2-digit' });
                var content = renderPostContent(p);
                var raw = p.content ? p.content.replace(/<[^>]*>/g, '') : '';
                var clamped = raw.length > 150 || (p.content && p.content.split('\n').length > 5);
                var expand = clamped ? '<span class="expand-link" onclick="event.stopPropagation(); openPostDetail(\'' +
                    p.id + '\')">展开</span>' : '';
                var commentCount = commentCountMap[p.id] || 0;
                var canDelete = isAdmin || (currentUser && currentUser.id === p.user_id);
                var delBtn = canDelete ? '<button class="del-btn" onclick="event.stopPropagation(); deletePostById(\'' +
                    p.id + '\')">🗑️</button>' : '';
                html += '<div class="post-card" onclick="openPostDetail(\'' + p.id + '\')">';
                html += '<div class="post-author">';
                html += '<div class="avatar" style="' + (avatar && avatar.startsWith('http') ?
                    'background-image:url(' + avatar + ');background-size:cover;background-position:center;' : '') +
                    '">' + (avatar && !avatar.startsWith('http') ? name.charAt(0).toUpperCase() : '') + '</div>';
                html += '<span class="name">' + escapeHtml(name) + '</span>';
                if (p.is_official) html += '<span class="official-tag">官方</span>';
                html += '<span class="time">' + time + '</span>';
                html += '</div>';
                if (p.title) html += '<div class="post-title">' + escapeHtml(p.title) + '</div>';
                html += '<div class="post-content ' + (clamped ? 'clamped' : '') + '">' + content + expand + '</div>';
                html += '<div class="post-footer">';
                html += '<span class="comment-count" onclick="event.stopPropagation(); openPostDetail(\'' + p.id +
                    '\')">💬 ' + commentCount + ' 评论</span>';
                html += '<div class="actions">' + delBtn + '</div>';
                html += '</div></div>';
            }
            list.innerHTML = html;
        }

        async function deletePostById(id) {
            showConfirm('删除帖子', '确定要删除此帖子吗？', async function() {
                await deletePost(id);
                posts = posts.filter(function(p) { return p.id !== id; });
                await fetchAllCommentCounts();
                await renderPosts();
                showToast('🗑️ 帖子已删除');
            });
        }

        // ============================================================
        // 帖子详情（修复：立即清空旧内容）
        // ============================================================
        var detailOverlay = document.getElementById('detailOverlay');
        var detailContent = document.getElementById('detailContent');
        var detailCommentInput = document.getElementById('detailCommentInput');
        var detailSendCommentBtn = document.getElementById('detailSendCommentBtn');
        var currentDetailPostId = null;

        async function openPostDetail(id) {
            currentDetailPostId = id;
            // ★ 先清空内容，避免显示上一次的帖子
            detailContent.innerHTML = '<div class="loading-state"><div class="spinner"></div>加载中...</div>';
            detailOverlay.classList.add('active');
            await renderDetail(id);
        }

        document.getElementById('closeDetail').onclick = function() {
            detailOverlay.classList.remove('active');
            currentDetailPostId = null;
        };

        async function renderDetail(id) {
            // ★★★ 关键修复：立即清空并显示加载状态，避免旧内容残留 ★★★
            detailContent.innerHTML = '<div class="loading-state"><div class="spinner"></div>加载中...</div>';

            var post = posts.find(function(p) { return p.id === id; });
            if (!post) {
                detailContent.innerHTML = '<div class="empty-state">帖子不存在或已被删除</div>';
                return;
            }

            var comments = await fetchComments(id);
            var poll = await loadPollData(id);
            var content = renderPostContent(post);
            var user = post.users || null;
            var name = user ? user.nickname : post.author;
            var avatar = user ? (user.avatar_url || getUserAvatar(user)) : getUserAvatar({ nickname: post.author });
            var time = new Date(post.created_at).toLocaleString('zh-CN', { month: 'short', day: 'numeric',
                hour: '2-digit', minute: '2-digit' });

            var commentsHtml = comments.length ?
                comments.map(function(c) {
                    var cu = c.users || null;
                    var cn = cu ? cu.nickname : c.author;
                    var ca = cu ? (cu.avatar_url || getUserAvatar(cu)) : getUserAvatar({ nickname: c.author });
                    return '<div class="comment-item">' +
                        '<div class="avatar" style="' + (ca && ca.startsWith('http') ?
                            'background-image:url(' + ca + ');background-size:cover;background-position:center;' :
                            '') + '">' + (ca && !ca.startsWith('http') ? cn.charAt(0).toUpperCase() : '') +
                        '</div>' +
                        '<div class="body">' +
                        '<div class="meta"><span class="name">' + escapeHtml(cn) + '</span>' +
                        (c.is_official ? '<span class="official-tag">官方</span>' : '') +
                        '<span class="time">' + new Date(c.created_at).toLocaleString('zh-CN', { hour: '2-digit',
                            minute: '2-digit' }) + '</span></div>' +
                        '<div class="txt">' + escapeHtml(c.content) + '</div>' +
                        '</div></div>';
                }).join('') :
                '<div style="color:var(--text-muted);padding:12px 0;">暂无评论</div>';

            detailContent.innerHTML =
                '<div class="detail-post">' +
                '<div class="post-author">' +
                '<div class="avatar" style="' + (avatar && avatar.startsWith('http') ?
                    'background-image:url(' + avatar + ');background-size:cover;background-position:center;' : '') +
                '">' + (avatar && !avatar.startsWith('http') ? name.charAt(0).toUpperCase() : '') + '</div>' +
                '<span class="name">' + escapeHtml(name) + '</span>' +
                (post.is_official ? '<span class="official-tag">官方</span>' : '') +
                '<span class="time">' + time + '</span>' +
                '</div>' +
                (post.title ? '<div class="post-title">' + escapeHtml(post.title) + '</div>' : '') +
                '<div class="post-content">' + content + '</div>' +
                renderPollUI(poll) +
                '</div>' +
                '<div class="detail-comments"><b>💬 评论 (' + comments.length + ')</b>' + commentsHtml + '</div>';
        }

        detailSendCommentBtn.onclick = async function() {
            if (!currentUser) return showToast('请先登录');
            var content = detailCommentInput.value.trim();
            if (!content) return showToast('请输入评论');
            await addComment(currentDetailPostId, currentUser.nickname, currentUser.id, content);
            detailCommentInput.value = '';
            await fetchAllCommentCounts();
            await renderDetail(currentDetailPostId);
            showToast('💬 评论已发送');
        };

        // ============================================================
        // 管理面板（全新美化 UI + 分类序号连续）
        // ============================================================
        var adminPanelOverlay = document.getElementById('adminPanelOverlay');
        var adminPanelContent = document.getElementById('adminPanelContent');

        function openAdminPanel() {
            if (!isAdmin) return;
            adminPanelOverlay.classList.add('active');
            renderAdminPanel();
        }

        document.getElementById('closeAdminPanel').onclick = function() {
            adminPanelOverlay.classList.remove('active');
        };

        // 管理面板渲染
        async function renderAdminPanel() {
            var users = await fetchAllUsers();
            var roles = await fetchUserRoles();
            var roleMap = {};
            roles.forEach(function(r) { roleMap[r.user_id] = r; });

            // ---- 分类管理（使用连续序号 #1, #2, ...） ----
            var catsHtml = '<h3>📂 分类管理</h3>';
            var displayIndex = 1;
            categories.forEach(function(c, idx) {
                if (c.name === '未分类') return;
                var isPublic = c.is_public !== false;
                catsHtml += '<div class="admin-cat-item">' +
                    '<div class="cat-info"><b>' + escapeHtml(c.name) + '</b> <span style="font-size:0.7em;color:var(--text-muted)">#' +
                    displayIndex + '（顺序）</span></div>' +
                    '<div class="cat-actions">' +
                    '<button onclick="toggleCategoryPublic(\'' + c.id + '\',' + isPublic + ')">' + (isPublic ?
                        '🔓公开' : '🔒私密') + '</button>' +
                    (idx > 0 ? '<button onclick="moveCategoryUp(\'' + c.id + '\')">↑</button>' : '') +
                    (idx < categories.length - 1 ? '<button onclick="moveCategoryDown(\'' + c.id + '\')">↓</button>' :
                        '') +
                    '<button onclick="deleteCategoryById(\'' + c.id + '\')">🗑️</button>' +
                    '</div></div>';
                displayIndex++;
            });
            catsHtml += '<div class="admin-add-row">' +
                '<input id="newCatName" placeholder="新分类名称" />' +
                '<button onclick="addNewCategory()">添加</button>' +
                '</div>';

            // ---- 用户管理（全新卡片式） ----
            var usersHtml = '<h3>👥 用户管理</h3>';
            users.forEach(function(u) {
                var isBanned = u.banned_until && new Date(u.banned_until) > new Date();
                var role = roleMap[u.id];
                var avatar = u.avatar_url || '';

                usersHtml += '<div class="admin-user-card">';
                usersHtml += '<div class="user-main">';
                usersHtml += '<div class="user-avatar" style="' + (avatar ?
                    'background-image:url(' + avatar + ');background-size:cover;background-position:center;' :
                    '') + '">' + (!avatar ? u.nickname.charAt(0).toUpperCase() : '') + '</div>';
                usersHtml += '<div class="user-info">';
                usersHtml += '<div class="name-row">';
                usersHtml += '<span class="nickname">' + escapeHtml(u.nickname) + '</span>';
                if (role) {
                    usersHtml += '<span class="role-badge" style="background:' + role.role_color + '">' + escapeHtml(
                        role.role_name) + '</span>';
                }
                usersHtml += '<span class="status-badge ' + (isBanned ? 'banned' : 'normal') + '">' + (isBanned ?
                    '已封禁' : '正常') + '</span>';
                usersHtml += '</div>';
                usersHtml += '<div class="phone-row">' + escapeHtml(u.phone) + '</div>';
                usersHtml += '</div></div>';

                usersHtml += '<div class="user-actions">';
                if (isBanned) {
                    usersHtml += '<button class="btn-unban" onclick="unbanUserById(\'' + u.id + '\')">🔓 解封</button>';
                } else {
                    usersHtml += '<button class="btn-ban" onclick="banUserPrompt(\'' + u.id + '\',\'' + escapeHtml(u
                        .nickname) + '\')">🚫 封号</button>';
                }
                usersHtml += '<button class="btn-login" onclick="loginAsUser(\'' + u.id + '\')">' +
                    '<svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>' +
                    ' 一键登录</button>';
                usersHtml += '</div></div>';
            });

            // ---- 角色管理 ----
            var uniqueRoles = {};
            roles.forEach(function(r) {
                var key = r.role_name + '|' + r.role_color;
                if (!uniqueRoles[key]) uniqueRoles[key] = { name: r.role_name, color: r.role_color, count: 0 };
                uniqueRoles[key].count++;
            });
            var rolesHtml = '<h3>🏷️ 身份管理</h3>';
            for (var key in uniqueRoles) {
                var r = uniqueRoles[key];
                rolesHtml += '<div class="admin-role-item">' +
                    '<div class="role-info"><div class="color-preview" style="width:28px;height:28px;border-radius:50%;background:' +
                    r.color + ';flex-shrink:0;"></div>' +
                    '<b>' + escapeHtml(r.name) + '</b> <span style="font-size:0.7em;color:var(--text-muted)">(' + r
                    .count + '人)</span></div>' +
                    '<div class="role-actions"><button onclick="removeRoleFromAll(\'' + escapeHtml(r.name) +
                    '\')">🗑️ 删除此身份</button></div></div>';
            }
            rolesHtml += '<div class="admin-add-row">' +
                '<input id="newRoleName" placeholder="新身份名称" />' +
                '<input type="color" id="newRoleColor" value="#2e7d32" style="width:48px;height:38px;padding:2px;border:2px solid var(--border);border-radius:8px;cursor:pointer;" />' +
                '<button onclick="createRole()">创建</button>' +
                '</div>';

            adminPanelContent.innerHTML = catsHtml + usersHtml + rolesHtml;
        }

        // ---- 管理面板全局函数 ----
        window.toggleCategoryPublic = async function(id, current) {
            await updateCategory(id, { is_public: !current });
            await loadCategories();
            renderAdminPanel();
        };

        window.moveCategoryUp = async function(id) {
            var idx = categories.findIndex(function(c) { return c.id === id; });
            if (idx > 0) {
                await swapCategoryOrder(id, categories[idx - 1].id);
                await loadCategories();
                renderAdminPanel();
            }
        };

        window.moveCategoryDown = async function(id) {
            var idx = categories.findIndex(function(c) { return c.id === id; });
            if (idx < categories.length - 1) {
                await swapCategoryOrder(id, categories[idx + 1].id);
                await loadCategories();
                renderAdminPanel();
            }
        };

        window.deleteCategoryById = async function(id) {
            showConfirm('删除分类', '确定删除此分类？其下帖子将移入「未分类」', async function() {
                await deleteCategory(id);
                await loadCategories();
                renderAdminPanel();
            });
        };

        window.addNewCategory = async function() {
            var name = document.getElementById('newCatName').value.trim();
            if (!name) return showToast('请输入分类名');
            await addCategory(name, true);
            document.getElementById('newCatName').value = '';
            await loadCategories();
            renderAdminPanel();
        };

        window.banUserPrompt = function(userId, nickname) {
            showPrompt('🚫 封号设置', '为用户 “' + nickname + '” 设置解封时间', '选择解封时间', async function(until) {
                if (!until) return showToast('请选择解封时间');
                await banUser(userId, '违规行为', new Date(until).toISOString());
                showToast('✅ 已封号');
                renderAdminPanel();
            }, 'datetime-local');
        };

        window.unbanUserById = async function(userId) {
            showConfirm('🔓 解封用户', '确定解封该用户吗？', async function() {
                await unbanUser(userId);
                showToast('✅ 已解封');
                renderAdminPanel();
            });
        };

        window.loginAsUser = async function(userId) {
            try {
                var res = await window.sb.from('users').select('*').eq('id', userId).single();
                if (res.error) throw res.error;
                if (!res.data) return showToast('用户不存在');
                var user = res.data;
                setSessionUser(user);
                currentUser = user;
                isAdmin = (user.phone === '17355394710');
                renderHeader('帖子广场', 'posts');
                renderFooter('posts');
                await loadCategories();
                await loadAllData();
                adminPanelOverlay.classList.remove('active');
                if (isAdmin) document.getElementById('adminPanelBtn').style.display = 'inline-flex';
                else document.getElementById('adminPanelBtn').style.display = 'none';
                showToast('✅ 已切换到 ' + user.nickname);
            } catch (err) {
                showToast('一键登录失败：' + err.message);
            }
        };

        window.removeRoleFromAll = function(roleName) {
            showConfirm('删除身份', '确定删除身份 "' + roleName + '"？所有拥有该身份的用户将失去身份', async function() {
                await removeRoleFromAll(roleName);
                showToast('🗑️ 身份已删除');
                renderAdminPanel();
            });
        };

        window.createRole = function() {
            var name = document.getElementById('newRoleName').value.trim();
            var color = document.getElementById('newRoleColor').value;
            if (!name) return showToast('请输入身份名称');
            showPrompt('👤 分配身份', '请输入要分配该身份的用户ID（可从用户管理复制）', '用户UUID', async function(userId) {
                if (!userId) return showToast('请输入用户ID');
                await assignRoleToUser(userId, name, color);
                showToast('✅ 身份创建并分配');
                renderAdminPanel();
            });
        };

        // ============================================================
        // 数据加载
        // ============================================================
        async function loadCategories() {
            categories = await fetchCategories();
            renderCategoryFilter();
        }

        async function loadAllData() {
            posts = await fetchPosts();
            await fetchAllCommentCounts();
            await renderPosts();
        }

        // ============================================================
        // 初始化
        // ============================================================
        (function init() {
            if (!currentUser || !currentUser.id) window.location.href = 'index.html';

            loadCategories().then(loadAllData);

            // 实时订阅
            window.sb.channel('public-posts')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'posts' }, function() { loadAllData
                        (); })
                .on('postgres_changes', { event: '*', schema: 'public', table: 'post_comments' }, function() {
                    fetchAllCommentCounts();
                    if (currentDetailPostId) renderDetail(currentDetailPostId);
                })
                .on('postgres_changes', { event: '*', schema: 'public', table: 'poll_votes' }, function() {
                    if (currentDetailPostId) renderDetail(currentDetailPostId);
                })
                .subscribe();

            // 窗口聚焦时同步用户
            function syncUser() {
                var session = getSessionUser();
                if (session && session.id) {
                    if (!currentUser || currentUser.id !== session.id ||
                        currentUser.avatar_url !== session.avatar_url ||
                        currentUser.nickname !== session.nickname) {
                        currentUser = session;
                        isAdmin = (currentUser.phone === '17355394710');
                        renderHeader('帖子广场', 'posts');
                        renderFooter('posts');
                        if (isAdmin) document.getElementById('adminPanelBtn').style.display = 'inline-flex';
                        else document.getElementById('adminPanelBtn').style.display = 'none';
                        loadAllData();
                    }
                }
            }
            window.addEventListener('focus', syncUser);
            document.addEventListener('visibilitychange', function() {
                if (!document.hidden) syncUser();
            });
        })();

        // 禁用手势缩放
        document.addEventListener('gesturestart', function(e) { e.preventDefault(); });
    </script>
</body>
</html>
