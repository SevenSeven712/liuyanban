<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Seven戚 · 帖子广场</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    <style>
        /* ===== 全局样式 ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        :root {
            --bg: #f5faf5;
            --bg-card: #ffffff;
            --bg-input: #eaf3ea;
            --border: #c8e0c8;
            --text: #1e3a2e;
            --text-muted: #5a7a6a;
            --text-light: #8aaa9a;
            --primary: #2e7d32;
            --primary-light: #4caf50;
            --primary-glow: rgba(76, 175, 80, 0.25);
            --primary-bg: #e8f5e9;
            --shadow: 0 8px 32px rgba(46, 125, 50, 0.12);
            --radius: 16px;
            --radius-sm: 10px;
            --font: "Space Grotesk", "PingFang SC", "Segoe UI", system-ui, sans-serif;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --danger: #e57373;
            --danger-bg: #ffebee;
            --official-blue: #2b6cff;
        }
        html, body { height: 100%; font-family: var(--font); background: var(--bg); color: var(--text); overflow: hidden; }
        #mainApp { display: flex; flex-direction: column; height: 100vh; height: 100dvh; background: var(--bg); }

        /* ===== 公共头部样式（由 common.js 生成，但保留定义） ===== */
        .app-header {
            flex-shrink: 0; padding: 12px 20px 8px 20px;
            background: var(--bg-card); border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            z-index: 50; backdrop-filter: blur(12px);
            background: rgba(255, 255, 255, 0.92);
            min-height: 56px;
        }
        .app-header .brand {
            font-weight: 900; font-size: 1.1em; color: var(--text);
            display: flex; align-items: center; gap: 0.4em;
            cursor: default; user-select: none;
        }
        .app-header .brand span { color: var(--primary); }
        .app-header .brand small { font-weight: 400; font-size: 0.55em; color: var(--text-muted); margin-left: 0.3em; }
        .app-header .user-area {
            display: flex; align-items: center; gap: 10px;
            cursor: pointer; padding: 4px 10px 4px 6px;
            border-radius: 99px; transition: background 0.2s;
        }
        .app-header .user-area:hover { background: var(--primary-bg); }
        .app-header .avatar {
            width: 32px; height: 32px; border-radius: 50%;
            display: grid; place-items: center;
            font-weight: 700; font-size: 14px;
            color: #fff;
            background: var(--primary);
            flex-shrink: 0;
            background-size: cover;
            background-position: center;
            text-align: center;
        }
        .app-header .user-name {
            font-weight: 600; font-size: 0.85em;
            max-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .app-header .chevron { color: var(--text-muted); font-size: 0.7em; transition: transform 0.3s; }
        .app-header .chevron.open { transform: rotate(180deg); }

        /* ===== 公共底部样式 ===== */
        .app-tabs {
            flex-shrink: 0;
            display: flex;
            background: var(--bg-card);
            border-top: 1px solid var(--border);
            padding: 6px 0 calc(6px + var(--safe-bottom));
            z-index: 50;
            backdrop-filter: blur(12px);
            background: rgba(255, 255, 255, 0.96);
        }
        .tab-btn {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            background: none;
            border: none;
            font-family: var(--font);
            font-size: 0.6em;
            font-weight: 600;
            color: var(--text-muted);
            padding: 4px 0;
            cursor: pointer;
            transition: color 0.2s;
            position: relative;
            text-decoration: none;
        }
        .tab-btn .tab-icon { font-size: 1.6em; line-height: 1.2; }
        .tab-btn.active { color: var(--primary); }
        .tab-btn.active::after {
            content: ''; position: absolute; top: -1px;
            left: 30%; right: 30%; height: 3px;
            background: var(--primary); border-radius: 0 0 4px 4px;
        }
        .tab-btn .badge {
            position: absolute; top: 0; right: 20%;
            background: var(--primary); color: #fff;
            font-size: 0.6em; font-weight: 700;
            padding: 1px 6px; border-radius: 99px;
            min-width: 16px; text-align: center;
            transform: translateY(-4px);
        }

        /* ===== 封禁横幅 ===== */
        .banned-banner {
            flex-shrink: 0;
            background: #ffebee;
            color: #c62828;
            padding: 6px 16px;
            font-size: 0.8em;
            font-weight: 600;
            text-align: center;
            border-bottom: 1px solid #ffcdd2;
            display: none;
        }
        .banned-banner.active { display: block; }

        /* ===== 帖子页面内容 ===== */
        .app-content {
            flex: 1;
            min-height: 0;
            position: relative;
            overflow-y: auto;
            padding: 16px 20px 16px 20px;
            -webkit-overflow-scrolling: touch;
        }
        .posts-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .posts-header .left {
            display: flex;
            gap: 6px;
            flex-wrap: nowrap;
            align-items: center;
            overflow-x: auto;
            overflow-y: hidden;
            padding-bottom: 4px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            max-width: 100%;
        }
        .posts-header .left::-webkit-scrollbar { height: 4px; }
        .posts-header .left::-webkit-scrollbar-track { background: transparent; }
        .posts-header .left::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
        .category-btn {
            padding: 4px 14px;
            border-radius: 99px;
            border: 1.5px solid var(--border);
            background: transparent;
            color: var(--text-muted);
            font-size: 0.7em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .category-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; }
        .category-btn:hover:not(.active) { background: var(--primary-bg); }
        .new-post-btn {
            padding: 6px 18px;
            border-radius: 99px;
            border: none;
            background: var(--primary);
            color: #fff;
            font-weight: 700;
            font-size: 0.75em;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }
        .new-post-btn:hover { background: var(--primary-light); transform: scale(1.02); }
        .new-post-btn:disabled { opacity: 0.5; pointer-events: none; }

        .post-card {
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            padding: 14px 16px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
            transition: box-shadow 0.2s;
            cursor: pointer;
        }
        .post-card:hover { box-shadow: var(--shadow); }
        .post-card .post-author {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 2px;
            flex-wrap: wrap;
        }
        .post-card .post-author .avatar {
            width: 32px; height: 32px; border-radius: 50%;
            display: grid;
            place-items: center;
            font-weight: 700; font-size: 14px; color: #fff;
            background: var(--primary); flex-shrink: 0;
            background-size: cover;
            background-position: center;
            text-align: center;
        }
        .post-card .post-author .name { font-weight: 600; font-size: 0.9em; }
        .post-card .post-author .official-tag {
            background: #2b6cff; color: #fff;
            font-size: 0.55em; padding: 0 6px; border-radius: 99px; line-height: 16px;
        }
        .post-card .post-author .role-tag {
            color: #fff; font-size: 0.55em; padding: 0 6px; border-radius: 99px; line-height: 16px;
            background: var(--primary);
        }
        .post-card .post-author .time {
            font-size: 0.7em; color: var(--text-muted); margin-left: auto;
        }
        .post-card .post-category {
            font-size: 0.6em; color: var(--primary); background: var(--primary-bg);
            padding: 0 8px; border-radius: 99px; display: inline-block; margin-bottom: 4px;
        }
        .post-card .post-title { font-weight: 700; font-size: 1em; margin: 4px 0 2px 0; }
        .post-card .post-image {
            max-width: 100%; max-height: 200px; border-radius: var(--radius-sm);
            margin: 6px 0; object-fit: cover;
        }
        .post-card .post-content {
            font-size: 0.85em; color: var(--text); line-height: 1.6;
            margin-bottom: 6px; word-break: break-word; white-space: pre-wrap;
        }
        .post-card .post-content.clamped {
            display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden;
        }
        .post-card .post-content .expand-link {
            color: var(--primary); font-weight: 600; cursor: pointer; display: inline-block; margin-left: 4px;
        }
        .post-card .post-footer {
            display: flex; justify-content: space-between; align-items: center;
            margin-top: 8px; font-size: 0.65em; color: var(--text-light);
            border-top: 1px solid var(--border); padding-top: 8px;
        }
        .post-card .post-footer .actions {
            display: flex; gap: 12px;
        }
        .post-card .post-footer .actions span {
            cursor: pointer; transition: color 0.2s;
            display: flex; align-items: center; gap: 4px;
        }
        .post-card .post-footer .actions span:hover { color: var(--primary); }
        .post-card .post-footer .actions .del { color: #e57373; }
        .post-card .post-footer .actions .del:hover { color: #c62828; }
        .post-card .post-footer .actions .edit { color: var(--primary); }
        .post-card .post-footer .comment-icon {
            display: flex; align-items: center; gap: 4px;
        }
        .post-card .post-footer .comment-icon.official {
            color: var(--official-blue);
        }

        .icon-svg { width: 1.2em; height: 1.2em; fill: currentColor; flex-shrink: 0; }
        .icon-btn {
            background: none; border: none; cursor: pointer;
            padding: 4px; color: var(--text-muted); transition: .2s;
            display: flex; align-items: center; gap: 4px;
            font-family: inherit; font-size: inherit;
        }
        .icon-btn:hover { color: var(--text); }
        .icon-btn.danger { color: #e57373; }
        .icon-btn.danger:hover { color: #c62828; }
        .btn-text { margin-left: 2px; }

        .empty-state { text-align: center; color: var(--text-muted); padding: 40px 20px; font-size: 0.85em; }
        .empty-state .big { font-size: 2.8em; margin-bottom: 8px; opacity: 0.5; }
        .loading-state { text-align: center; color: var(--text-muted); padding: 40px 20px; font-size: 0.9em; }
        .loading-state .spinner {
            display: inline-block; width: 30px; height: 30px;
            border: 3px solid var(--border); border-top-color: var(--primary);
            border-radius: 50%; animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        #toast {
            position: fixed; bottom: 80px; left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--text); color: #fff;
            padding: 0.7em 1.6em; border-radius: 2em;
            font-weight: 600; font-size: 0.85em;
            opacity: 0; transition: all 0.4s ease;
            z-index: 9999 !important; pointer-events: none;
            white-space: nowrap; box-shadow: var(--shadow);
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        @media (max-width: 480px) {
            .app-header { padding: 10px 14px 6px 14px; min-height: 48px; }
            .app-header .brand { font-size: 0.95em; }
            .app-header .user-name { max-width: 60px; font-size: 0.75em; }
            .app-content { padding: 12px 14px 12px 14px; }
            .posts-header .left { gap: 4px; }
            .category-btn { padding: 3px 10px; font-size: 0.6em; }
            .new-post-btn { font-size: 0.65em; padding: 4px 12px; }
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.3s ease; }

        /* ===== 帖子详情 ===== */
        .detail-overlay {
            position: fixed; inset: 0; z-index: 999;
            background: var(--bg-card); display: none;
            flex-direction: column; animation: fadeIn 0.25s ease;
        }
        .detail-overlay.active { display: flex; }
        .detail-panel {
            display: flex; flex-direction: column; height: 100%; width: 100%;
            background: var(--bg);
        }
        .detail-header {
            display: flex; align-items: center; padding: 12px 16px;
            flex-shrink: 0; background: var(--bg-card);
            border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10;
        }
        .detail-header .back-btn {
            background: none; border: none; font-size: 1.5em; cursor: pointer;
            color: var(--text); display: flex; align-items: center;
            padding: 4px 8px 4px 0; margin-right: 8px;
        }
        .detail-header .back-btn:hover { color: var(--primary); }
        .detail-header .detail-title {
            flex: 1; text-align: center; font-weight: 600; font-size: 1em;
            color: var(--text); margin-right: 2.5em;
        }
        .detail-content {
            flex: 1; overflow-y: auto; padding: 16px 20px 12px 20px;
            -webkit-overflow-scrolling: touch;
        }
        .detail-post { margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
        .detail-post .post-author {
            display: flex; align-items: center; gap: 10px; margin-bottom: 4px; flex-wrap: wrap;
        }
        .detail-post .post-author .avatar {
            width: 32px; height: 32px; border-radius: 50%;
            display: grid; place-items: center; font-weight: 700; font-size: 14px;
            color: #fff; background: var(--primary); flex-shrink: 0;
            background-size: cover; background-position: center; text-align: center;
        }
        .detail-post .post-author .name { font-weight: 600; font-size: 0.9em; }
        .detail-post .post-author .official-tag {
            background: #2b6cff; color: #fff; font-size: 0.55em;
            padding: 0 6px; border-radius: 99px; line-height: 16px;
        }
        .detail-post .post-author .role-tag {
            color: #fff; font-size: 0.55em; padding: 0 6px; border-radius: 99px; line-height: 16px;
            background: var(--primary);
        }
        .detail-post .post-author .time {
            font-size: 0.7em; color: var(--text-muted); margin-left: auto;
        }
        .detail-post .post-title { font-weight: 700; font-size: 1.1em; margin: 4px 0 2px 0; }
        .detail-post .post-image {
            max-width: 100%; max-height: 300px; border-radius: var(--radius-sm);
            margin: 6px 0; object-fit: cover;
        }
        .detail-post .post-content {
            font-size: 0.95em; color: var(--text); line-height: 1.6;
            word-break: break-word; white-space: pre-wrap;
        }
        .detail-comments { flex: 1; margin-top: 8px; }
        .detail-comments .comment-item {
            display: flex;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
            position: relative;
        }
        .detail-comments .comment-item:last-child { border-bottom: none; }
        .detail-comments .comment-item .avatar {
            width: 30px; height: 30px; border-radius: 50%;
            display: grid; place-items: center; font-weight: 700; font-size: 12px;
            color: #fff; background: var(--primary); flex-shrink: 0;
            background-size: cover; background-position: center; text-align: center;
        }
        .detail-comments .comment-item .body { flex: 1; min-width: 0; }
        .detail-comments .comment-item .meta {
            display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
        }
        .detail-comments .comment-item .meta .name { font-weight: 600; font-size: 0.85em; }
        .detail-comments .comment-item .meta .official-tag {
            background: #2b6cff; color: #fff; font-size: 0.5em;
            padding: 0 4px; border-radius: 99px; line-height: 14px;
        }
        .detail-comments .comment-item .meta .role-tag {
            color: #fff; font-size: 0.5em; padding: 0 4px; border-radius: 99px; line-height: 14px;
            background: var(--primary);
        }
        .detail-comments .comment-item .meta .time {
            font-size: 0.65em; color: var(--text-muted);
        }
        .detail-comments .comment-item .meta .more-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0 4px;
            font-size: 1.1em;
            line-height: 1;
            transition: color 0.2s;
        }
        .detail-comments .comment-item .meta .more-btn:hover {
            color: var(--text);
        }
        .comment-menu {
            position: absolute;
            right: 0;
            top: 100%;
            margin-top: 4px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow);
            z-index: 100;
            min-width: 120px;
            padding: 4px 0;
            display: none;
        }
        .comment-menu button {
            display: block;
            width: 100%;
            padding: 6px 14px;
            background: none;
            border: none;
            cursor: pointer;
            font-family: inherit;
            text-align: left;
            font-size: 0.8em;
            color: var(--text);
            transition: background 0.2s;
        }
        .comment-menu button:hover {
            background: var(--bg-input);
        }
        .comment-menu button.danger {
            color: #e57373;
        }
        .comment-menu button.danger:hover {
            background: #ffebee;
        }
        .detail-comments .comment-item .txt {
            font-size: 0.85em; line-height: 1.5; margin-top: 2px;
            color: var(--text); white-space: pre-wrap; word-break: break-word;
        }
        .detail-comments .comment-empty { text-align: center; color: var(--text-muted); padding: 20px 0; font-size: 0.85em; }
        .detail-input-area {
            display: flex; gap: 8px;
            border-top: 1px solid var(--border);
            padding: 12px 16px calc(12px + var(--safe-bottom));
            flex-shrink: 0; background: var(--bg-card);
        }
        .detail-input-area input {
            flex: 1; padding: 8px 14px; border-radius: 99px;
            border: 2px solid var(--border); background: var(--bg-input);
            font-family: inherit; font-size: 0.85em; outline: none;
            transition: border-color 0.2s; color: var(--text);
        }
        .detail-input-area input:focus { border-color: var(--primary); }
        .detail-input-area input:disabled { opacity: 0.5; }
        .detail-input-area button {
            padding: 8px 18px; border-radius: 99px; border: none;
            background: var(--primary); color: #fff;
            font-weight: 700; font-size: 0.85em; cursor: pointer;
            transition: background 0.2s; font-family: inherit;
            white-space: nowrap; display: flex; align-items: center; gap: 6px;
        }
        .detail-input-area button:hover { background: var(--primary-light); }
        .detail-input-area button:disabled { opacity: 0.5; pointer-events: none; }

        /* ===== 分类管理弹窗 ===== */
        .category-manager-overlay {
            position: fixed; inset: 0; z-index: 1000;
            background: var(--bg-card); display: none;
            flex-direction: column; animation: fadeIn 0.25s ease;
        }
        .category-manager-overlay.active { display: flex; }
        .category-manager-panel {
            display: flex; flex-direction: column; height: 100%; width: 100%;
            background: var(--bg);
        }
        .category-manager-header {
            display: flex; align-items: center; padding: 12px 16px;
            flex-shrink: 0; background: var(--bg-card);
            border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10;
        }
        .category-manager-header .back-btn {
            background: none; border: none; font-size: 1.5em; cursor: pointer;
            color: var(--text); display: flex; align-items: center;
            padding: 4px 8px 4px 0; margin-right: 8px;
        }
        .category-manager-header .back-btn:hover { color: var(--primary); }
        .category-manager-header .title {
            flex: 1; text-align: center; font-weight: 600; font-size: 1em;
            color: var(--text); margin-right: 2.5em;
        }
        .category-manager-content { flex: 1; overflow-y: auto; padding: 16px 20px; }
        .category-manager-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 12px; margin-bottom: 6px;
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius-sm);
        }
        .category-manager-item .cat-name { font-weight: 600; font-size: 0.9em; }
        .category-manager-item .cat-actions {
            display: flex; gap: 4px; align-items: center;
        }
        .category-manager-item .cat-actions button {
            background: none; border: none; cursor: pointer;
            padding: 0 6px; font-size: 1em; transition: color 0.2s;
            color: var(--text-muted); font-family: inherit;
        }
        .category-manager-item .cat-actions button:hover { color: var(--text); }
        .category-manager-item .cat-actions .danger:hover { color: #e57373; }
        .category-manager-item .cat-actions .move-btn { font-size: 0.9em; padding: 0 4px; }
        .category-manager-item .cat-toggle {
            display: flex; align-items: center; gap: 6px;
            font-size: 0.7em;
        }
        .category-manager-item .cat-toggle input[type="checkbox"] {
            width: 16px; height: 16px; cursor: pointer;
        }
        .category-manager-add {
            display: flex; gap: 8px; margin-top: 12px;
            padding-top: 12px; border-top: 1px solid var(--border);
        }
        .category-manager-add input {
            flex: 1; padding: 8px 12px; border-radius: var(--radius-sm);
            border: 2px solid var(--border); background: var(--bg-input);
            font-family: inherit; font-size: 0.85em; outline: none;
            transition: border-color 0.2s; color: var(--text);
        }
        .category-manager-add input:focus { border-color: var(--primary); }
        .category-manager-add button {
            padding: 8px 18px; border-radius: var(--radius-sm); border: none;
            background: var(--primary); color: #fff;
            font-weight: 700; font-size: 0.85em; cursor: pointer;

    <script>
        // ============================================================
        // 渲染公共头部和底部（在页面加载后调用）
        // ============================================================
        renderHeader('帖子广场', 'posts');
        renderFooter('posts');

        // ============================================================
        // Supabase 配置
        // ============================================================
        var SUPABASE_URL = "https://ulvhuqtpdafspbdvkogs.supabase.co";
        var SUPABASE_ANON_KEY = "sb_publishable_Ew8kKf2z05kmYIK2XNu00g_dzAirtIM";
        window.sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ============================================================
        // 工具函数
        // ============================================================
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(window.toastTimer);
            window.toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function escapeHtml(s) {
            if (!s) return '';
            return String(s).replace(/[&<>"']/g, function(c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' } [c];
            });
        }

        var COLORS = ["#6ee7b7", "#fbbf24", "#f87171", "#a78bfa", "#f472b6", "#38bdf8"];

        function pickColor(hex) {
            if (hex && /^#[0-9a-f]{6}$/i.test(hex) && hex.toLowerCase() !== "#000000") return hex;
            return COLORS[Math.floor(Math.random() * COLORS.length)];
        }

        function getUserAvatar(user) {
            if (user && user.avatar_url) return user.avatar_url;
            const name = user ? user.nickname : 'U';
            const color = pickColor(null);
            const initial = name.charAt(0).toUpperCase();
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100">
                <rect width="100" height="100" fill="${color}" rx="50"/>
                <text x="50" y="58" font-size="40" text-anchor="middle" fill="white" font-family="sans-serif">${initial}</text>
            </svg>`;
            return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
        }

        // 头像上传（保留用于其他页面，但帖子页不再使用，因为头像功能已移至 profile.html）
        async function uploadAvatar(file, userId) {
            const fileExt = file.name.split('.').pop();
            const fileName = `avatars/${userId}/profile.${fileExt}`;
            const { data, error } = await window.sb.storage
                .from('avatars')
                .upload(fileName, file, { upsert: true });
            if (error) throw error;
            const { data: urlData } = window.sb.storage
                .from('avatars')
                .getPublicUrl(fileName);
            return urlData.publicUrl;
        }

        // 自定义弹窗
        function showConfirm(title, body, onOk, onCancel) {
            const modal = document.getElementById('confirmModal');
            document.getElementById('confirmTitle').textContent = title;
            document.getElementById('confirmBody').innerHTML = body;
            modal.classList.add('active');
            const cancelBtn = document.getElementById('confirmCancel');
            const okBtn = document.getElementById('confirmOk');
            const cleanup = () => {
                modal.classList.remove('active');
                cancelBtn.removeEventListener('click', cancelHandler);
                okBtn.removeEventListener('click', okHandler);
            };
            const cancelHandler = () => { if (onCancel) onCancel(); cleanup(); };
            const okHandler = () => { if (onOk) onOk(); cleanup(); };
            cancelBtn.addEventListener('click', cancelHandler);
            okBtn.addEventListener('click', okHandler);
            modal.addEventListener('click', function bgClick(e) {
                if (e.target === modal) { if (onCancel) onCancel(); cleanup(); modal.removeEventListener('click', bgClick); }
            });
        }

        function showPrompt(title, message, placeholder, onOk, onCancel) {
            const modal = document.getElementById('promptModal');
            document.getElementById('promptTitle').textContent = title;
            document.getElementById('promptMessage').textContent = message;
            const input = document.getElementById('promptInput');
            input.value = '';
            input.placeholder = placeholder || '请输入...';
            modal.classList.add('active');
            input.focus();
            const cancelBtn = document.getElementById('promptCancel');
            const okBtn = document.getElementById('promptOk');
            const cleanup = () => {
                modal.classList.remove('active');
                cancelBtn.removeEventListener('click', cancelHandler);
                okBtn.removeEventListener('click', okHandler);
                input.removeEventListener('keydown', keyHandler);
            };
            const cancelHandler = () => { if (onCancel) onCancel(); cleanup(); };
            const okHandler = () => { if (onOk) onOk(input.value.trim()); cleanup(); };
            const keyHandler = (e) => { if (e.key === 'Enter') okHandler(); };
            cancelBtn.addEventListener('click', cancelHandler);
            okBtn.addEventListener('click', okHandler);
            input.addEventListener('keydown', keyHandler);
            modal.addEventListener('click', function bgClick(e) {
                if (e.target === modal) { if (onCancel) onCancel(); cleanup(); modal.removeEventListener('click', bgClick); }
            });
        }

                .update({ sort_order: cat2.sort_order })

        async function moveCategoryUp(id) {
            if (!isAdmin) return;
            const idx = categories.findIndex(c => c.id === id);
            if (idx <= 0) return;
            const prev = categories[idx - 1];
            if (prev.name === '未分类') return;
            await swapCategoryOrder(id, prev.id);
            await loadCategories();
            renderPosts();
            showToast('✅ 分类顺序已更新');
        }

        async function moveCategoryDown(id) {
            if (!isAdmin) return;
            const idx = categories.findIndex(c => c.id === id);
            if (idx === -1 || idx >= categories.length - 1) return;
            const next = categories[idx + 1];
            if (next.name === '未分类') return;
            await swapCategoryOrder(id, next.id);
            await loadCategories();
            renderPosts();
            showToast('✅ 分类顺序已更新');
        }

        function renderCategoryManager() {
            const list = categories.filter(c => c.name !== '未分类');

                categoryManagerList.innerHTML = `<div class="empty-state">暂无分类，添加一个吧</div>`;
                return;
            }
            let html = '';
            list.forEach((c, index) => {
                const canUp = index > 0 && list[index - 1].name !== '未分类';
                const canDown = index < list.length - 1 && list[index + 1].name !== '未分类';
                const isPublic = c.is_public !== false;
                html += `
                    <div class="category-manager-item" data-id="${c.id}">
                        <span class="cat-name">${escapeHtml(c.name)}</span>
                        <div class="cat-actions">
                            <span class="cat-toggle">

                            </span>
                            ${canUp ? `<button class="move-btn" onclick="moveCategoryUp(${c.id})" title="上移">↑</button>` : ''}
                            ${canDown ? `<button class="move-btn" onclick="moveCategoryDown(${c.id})" title="下移">↓</button>` : ''}
                            <button onclick="deleteCategoryById(${c.id})" class="danger" title="删除分类">🗑️</button>

        // ============================================================

        async function renderPosts() {
            const container = document.getElementById('postList');
            container.innerHTML = `
                <div class="loading-state">
                    <div class="spinner"></div>
                    <div>正在加载帖子...</div>
                </div>
            `;

            let filtered = posts;
            if (currentCategory !== '全部') {
                filtered = posts.filter(p => p.category_id === currentCategory);
            }
            filtered.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            if (!filtered.length) {
                container.innerHTML = `<div class="empty-state"><div class="big">📭</div>还没有帖子，来发第一篇吧！</div>`;
                return;
            }

            const postIds = filtered.map(p => p.id);
            const { data: commentsData, error: commentsError } = await window.sb
                .from('post_comments')
                .select('post_id, is_official')
                .in('post_id', postIds);
            if (commentsError) throw commentsError;

            const commentInfo = {};
            postIds.forEach(id => {
                const related = commentsData.filter(c => c.post_id === id);
                commentInfo[id] = {
                    count: related.length,
                    hasOfficial: related.some(c => c.is_official === true)
                };
            });

            let html = '';
            for (const p of filtered) {
                const count = commentInfo[p.id]?.count || 0;
                const hasOfficial = commentInfo[p.id]?.hasOfficial || false;
                const isOfficial = p.is_official === true;
                const timeStr = new Date(p.created_at).toLocaleString('zh-CN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                const userInfo = p.users || null;
                const avatar = userInfo ? (userInfo.avatar_url || getUserAvatar(userInfo)) : getUserAvatar({ nickname: p.author });
                const displayName = userInfo ? userInfo.nickname : p.author;
                const userId = userInfo ? userInfo.id : null;
                const role = userId ? getUserRole(userId) : null;

                const officialTag = isOfficial ? `<span class="official-tag">官方</span>` : '';
                const roleTag = role ? `<span class="role-tag" style="background:${escapeHtml(role.color)}">${escapeHtml(role.name)}</span>` : '';

                let delBtn = '';
                let editBtn = '';
                if (isAdmin || (currentUser && currentUser.id === p.user_id)) {
                    delBtn = `<span class="del" onclick="event.stopPropagation(); deletePostById('${p.id}')">
                        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        删除
                    </span>`;
                    if (currentUser && currentUser.id === p.user_id) {
                        editBtn = `<span class="edit" onclick="event.stopPropagation(); openEditPost('${p.id}')">
                            <svg class="icon-svg" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            编辑
                        </span>`;
                    }
                }

                let categoryHtml = '';
                if (p.category_id) {
                    const cat = categories.find(c => c.id === p.category_id);
                    if (cat && cat.name !== '未分类') {
                        categoryHtml = `<div class="post-category">${escapeHtml(cat.name)}</div>`;
                    }
                }
                const imageHtml = p.image_url ? `<img src="${escapeHtml(p.image_url)}" class="post-image" loading="lazy" onerror="this.style.display='none'" />` : '';
                const contentDisplay = p.content || '<span style="color:var(--text-muted);font-style:italic;">（无正文内容）</span>';
                const lines = (p.content || '').split('\n').length;
                const showExpand = lines > 5;
                const contentClass = showExpand ? 'clamped' : '';
                const expandLink = showExpand ? `<span class="expand-link" onclick="event.stopPropagation(); openPostDetail('${p.id}')">详情</span>` : '';

                const commentIconClass = hasOfficial ? 'comment-icon official' : 'comment-icon';

                html += `

        async function renderDetail(postId) {
            const post = posts.find(p => p.id === postId);
            if (!post) {
                detailContent.innerHTML = '<div class="empty-state">帖子不存在</div>';
                return;
            }
            let comments = [];
            try {
                comments = await fetchComments(postId);
                comments.sort((a, b) => {
                    if (a.is_pinned && !b.is_pinned) return -1;
                    if (!a.is_pinned && b.is_pinned) return 1;
                    return new Date(a.created_at) - new Date(b.created_at);
                });
            } catch (e) { console.error('加载评论失败:', e); }

            const isOfficial = post.is_official === true;
            const timeStr = new Date(post.created_at).toLocaleString('zh-CN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
            const userInfo = post.users || null;
            const avatar = userInfo ? (userInfo.avatar_url || getUserAvatar(userInfo)) : getUserAvatar({ nickname: post.author });
            const displayName = userInfo ? userInfo.nickname : post.author;
            const userId = userInfo ? userInfo.id : null;
            const role = userId ? getUserRole(userId) : null;
            const officialTag = isOfficial ? `<span class="official-tag">官方</span>` : '';
            const roleTag = role ? `<span class="role-tag" style="background:${escapeHtml(role.color)}">${escapeHtml(role.name)}</span>` : '';
            const imageHtml = post.image_url ? `<img src="${escapeHtml(post.image_url)}" class="post-image" loading="lazy" onerror="this.style.display='none'" />` : '';
            const titleHtml = post.title ? `<div class="post-title">${escapeHtml(post.title)}</div>` : '';

            let commentsHtml = '';
            if (comments.length === 0) {
                commentsHtml = '<div class="comment-empty">还没有评论，来抢沙发吧</div>';
            } else {
                commentsHtml = comments.map(c => {
                    const cUser = c.users || null;
                    const cAvatar = cUser ? (cUser.avatar_url || getUserAvatar(cUser)) : getUserAvatar({ nickname: c.author });
                    const cName = cUser ? cUser.nickname : c.author;
                    const cUserId = cUser ? cUser.id : null;
                    const cRole = cUserId ? getUserRole(cUserId) : null;
                    const cOfficial = c.is_official ? `<span class="official-tag">官方</span>` : '';
                    const cRoleTag = cRole ? `<span class="role-tag" style="background:${escapeHtml(cRole.color)}">${escapeHtml(cRole.name)}</span>` : '';
                    const cTime = new Date(c.created_at).toLocaleString('zh-CN', { hour: '2-digit', minute: '2-digit' });
                    const canDelete = isAdmin || (currentUser && currentUser.id === c.user_id);
                    const canPin = isAdmin;
                    let menuHtml = '';
                    if (canDelete || canPin) {
                        menuHtml = `
                            <button class="more-btn" onclick="event.stopPropagation(); toggleCommentMenu('${c.id}')">
                                ⋮
                            </button>
                            <div class="comment-menu" id="commentMenu_${c.id}">
                                ${canPin ? `<button onclick="pinComment('${c.id}', true)">📌 置顶</button>` : ''}
                                ${canPin ? `<button onclick="pinComment('${c.id}', false)">↗️ 取消置顶</button>` : ''}
                                ${canDelete ? `<button class="danger" onclick="deleteCommentById('${c.id}')">🗑️ 删除</button>` : ''}
                            </div>
                        `;
                    }
                    const pinnedBadge = c.is_pinned ? '📌 ' : '';
                    return `
                        <div class="comment-item" data-id="${c.id}">
                            <div class="avatar" style="${cAvatar && cAvatar.startsWith('http') ? `background-image:url(${cAvatar});background-size:cover;background-position:center;` : ''}">${cAvatar && !cAvatar.startsWith('http') ? cName.charAt(0).toUpperCase() : ''}</div>
                            <div class="body">
                                <div class="meta">
                                    <span class="name">${escapeHtml(cName)}</span>
                                    ${cOfficial}
                                    ${cRoleTag}
                                    <span class="time">${cTime}</span>
                                    ${menuHtml}
                                </div>
                                <div class="txt">${pinnedBadge}${escapeHtml(c.content)}</div>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            detailContent.innerHTML = `
                <div class="detail-post">
                    <div class="post-author">
                        <div class="avatar" style="${avatar && avatar.startsWith('http') ? `background-image:url(${avatar});background-size:cover;background-position:center;` : ''}">${avatar && !avatar.startsWith('http') ? displayName.charAt(0).toUpperCase() : ''}</div>
                        <span class="name">${escapeHtml(displayName)}</span>
                        ${officialTag}
                        ${roleTag}
                        <span class="time">${timeStr}</span>
                    </div>
                    ${titleHtml}
                    ${imageHtml}
                    <div class="post-content">${escapeHtml(post.content)}</div>
                </div>
                <div class="detail-comments">
                    <div style="font-weight:600;font-size:0.85em;margin-bottom:8px;">💬 评论 (${comments.length})</div>
                    ${commentsHtml}
                </div>
            `;
        }

        var activeMenuId = null;

        function toggleCommentMenu(commentId) {
            const menu = document.getElementById(`commentMenu_${commentId}`);
            if (!menu) return;
            if (activeMenuId && activeMenuId !== commentId) {
                const old = document.getElementById(`commentMenu_${activeMenuId}`);
                if (old) old.style.display = 'none';
            }
            if (menu.style.display === 'block') {
                menu.style.display = 'none';
                activeMenuId = null;
            } else {
                document.querySelectorAll('.comment-menu').forEach(m => m.style.display = 'none');
                menu.style.display = 'block';
                activeMenuId = commentId;
                document.addEventListener('click', function closeMenu(e) {
                    if (!e.target.closest('.comment-item')) {
                        document.querySelectorAll('.comment-menu').forEach(m => m.style.display = 'none');
                        activeMenuId = null;
                        document.removeEventListener('click', closeMenu);
                    }
                });
            }
        }

            banModal.classList.add('active');
        }

        function closeBanModal() {
            banModal.classList.remove('active');
            banTargetId = null;
        }
        banCancel.addEventListener('click', closeBanModal);
        banModal.addEventListener('click', function(e) {
            if (e.target === banModal) closeBanModal();
        });

        banConfirm.addEventListener('click', async function() {
            if (!banTargetId || !isAdmin) return;
            const reason = banReasonInput.value.trim() || '由于您最近的不当言论，我们已经对你进行封号处理';
            const until = banUntilInput.value;
            if (!until) { showToast('请选择解封时间'); return; }
            try {
                await banUser(banTargetId, reason, new Date(until).toISOString());
                closeBanModal();
                await renderAdminPanel();
                showToast('✅ 封号成功');
            } catch (err) {
                showToast('封号失败：' + err.message);
            }
        });

        async function unbanUserById(userId) {
            if (!isAdmin) return;
            showConfirm('解封用户', '确定要解封该用户吗？', async () => {
                try {
                    await unbanUser(userId);
                    await renderAdminPanel();
                    showToast('✅ 已解封');
                } catch (err) {
                    showToast('解封失败：' + err.message);
                }
            });
        }

        // ============================================================
        // 加载所有数据
        // ============================================================
        async function loadAllData() {
            try {
                const postsData = await fetchPosts();
                posts = postsData;
                await renderPosts();
                if (isAdmin) {
                    document.getElementById('adminPanelBtn').style.display = 'inline-flex';
                } else {
                    document.getElementById('adminPanelBtn').style.display = 'none';
                }
            } catch (err) {
                console.error('加载帖子失败:', err);
                showToast('帖子加载失败');
            }
        }

        // ============================================================
        // 初始化
        // ============================================================
        (function init() {
            const session = getSessionUser();
            if (!session || !session.id) {
                window.location.href = 'index.html';
                return;
            }
            currentUser = session;
            isAdmin = (currentUser.phone === '17355394710');
            updateBannedBanner();
            if (isUserBanned()) document.getElementById('newPostBtn').disabled = true;
            loadUserRoles()
                .then(() => {
                    loadCategories()
                        .then(() => loadAllData());
                });

            window.sb.channel('public')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'posts' }, () => loadAllData())
                .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'posts' }, () => loadAllData())
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'posts' }, () => loadAllData())
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'post_comments' }, () => {
                    if (currentDetailPostId) renderDetail(currentDetailPostId);
                    loadAllData();
                })
                .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'post_comments' }, () => {
                    if (currentDetailPostId) renderDetail(currentDetailPostId);
                    loadAllData();
                })
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'post_comments' }, () => {
                    if (currentDetailPostId) renderDetail(currentDetailPostId);
                    loadAllData();
                })
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'user_roles' }, () => {
                    loadUserRoles();
                    if (adminPanelOverlay.classList.contains('active')) renderAdminPanel();
                    loadAllData();
                })
                .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'user_roles' }, () => {
                    loadUserRoles();
                    if (adminPanelOverlay.classList.contains('active')) renderAdminPanel();
                    loadAllData();
                })
                .subscribe();

            function syncUser() {
                const session = getSessionUser();
                if (session && session.id) {
                    if (!currentUser || currentUser.id !== session.id ||
                        currentUser.avatar_url !== session.avatar_url ||
                        currentUser.nickname !== session.nickname) {
                        currentUser = session;
                        isAdmin = (currentUser.phone === '17355394710');
                        renderHeader('帖子广场', 'posts');
                        renderFooter('posts');
                        updateBannedBanner();
                        if (isUserBanned()) document.getElementById('newPostBtn').disabled = true;
                        loadUserRoles()
                            .then(() => {
                                loadCategories()
                                    .then(() => loadAllData());
                            });
                    }
                }
            }
            window.addEventListener('focus', syncUser);
            document.addEventListener('visibilitychange', function() {
                if (!document.hidden) syncUser();
            });
        })();

        document.addEventListener('gesturestart', function(e) { e.preventDefault(); });
    </script>
</body>
</html>
